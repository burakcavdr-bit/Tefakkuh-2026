var KDD=[{"id":"abdest-vudu","term":"Vudû' (Abdest)","termAr":"الْوُضُوءُ","category":"taharet","categoryLabel":"Tahâret (Temizlik)","rootAr":"و - ض - أ","shortDef":"Belli uzuvları usulüne göre su ile yıkamak ve meshetmekten ibaret hükmî temizlik.","longDef":"Sözlükte temizlik ve güzellik anlamına gelir. Fıkıhta ise namaz ve tavaf gibi ibadetlerin sıhhati için yüzü, elleri dirseklerle beraber yıkamak, başın dörtte birini meshetmek ve ayakları topuklarla beraber yıkamaktan ibarettir.","references":["el-Kudûrî, Kitâbü't-Tahâre","el-Hidâye, 1/13","Bedâi'u's-Sanâi', 1/3"],"fiqhRuling":"Namaz, tilavet secdesi ve Kur'an-ı Kerim'e dokunmak için farzdır.","relatedTerms":["Gasl","Mesh","Nevâkıd","Hades"]},{"id":"gasl","term":"Gasl (Yıkamak)","termAr":"الْغَسْلُ","category":"taharet","categoryLabel":"Tahâret (Temizlik)","rootAr":"غ - س - ل","shortDef":"Suyun yıkanan uzuv üzerinden en az iki damla damlayacak derecede akıtılması.","longDef":"Hanefi fıkhında bir yerin yıkanmış sayılması için sadece ıslatılması kafi değildir; suyun o uzuv üzerinden akıp gitmesi (seyelân) şarttır. Sadece ıslak elle dokunulursa bu mesh sayılır, yıkama sayılmaz.","references":["el-Kudûrî, Babü'l-Vudû'","Reddü'l-Muhtâr, 1/95"],"fiqhRuling":"Yüz, kollar ve ayaklarda farz olan fiildir.","relatedTerms":["Vudû'","Mesh","Gusül"]},{"id":"mesh","term":"Mesh (Meshetmek)","termAr":"الْمَسْحُ","category":"taharet","categoryLabel":"Tahâret (Temizlik)","rootAr":"م - س - ح","shortDef":"Islak eli veya ıslaklığı bir uzva veya mest üzerine sürmek.","longDef":"Suyun akıtılmaksızın eldeki ıslaklığın uzva isabet ettirilmesidir. Abdestte başın en az dörtte birine, mest üzerine veya sargı (cebire) üzerine uygulanır.","references":["el-Kudûrî, Babü'l-Vudû'","Mülteka'l-Ebhur"],"fiqhRuling":"Abdestte başın dörtte birine mesh farz, tamamını kaplamak sünnettir.","relatedTerms":["Huf","Cebîre","Nâsiye"]},{"id":"hades","term":"Hades (Hükmî Kirlilik)","termAr":"الْحَدَثُ","category":"taharet","categoryLabel":"Tahâret (Temizlik)","rootAr":"ح - د - ث","shortDef":"Kişiyi ibadetten meneden, gözle görülmeyen hükmî kirlilik hali.","longDef":"İkiye ayrılır: Hades-i asgar (küçük hades) abdesti bozan hallerle oluşur ve abdest ile giderilir. Hades-i ekber (büyük hades) cünüplük, hayız ve nifas halleridir ve gusül abdesti ile giderilir.","references":["el-Kudûrî, Kitâbü't-Tahâre","el-İhtiyâr, 1/11"],"fiqhRuling":"Hades hali namaz kılmaya ve Mushaf'a el sürmeye manidir.","relatedTerms":["Necâset","Tahâret","Gusül"]},{"id":"teyemmum","term":"Teyemmüm","termAr":"التَّيَمُّمُ","category":"taharet","categoryLabel":"Tahâret (Temizlik)","rootAr":"ي - م - م","shortDef":"Su bulunmadığında veya kullanılamadığında temiz toprak cinsiyle yapılan hükmî temizlik.","longDef":"Sözlükte kasıt ve yönelme anlamına gelir. Şeriatta ise suyun bulunmaması veya hastalığa sebep olması durumunda niyet ederek elleri temiz toprak cinsine iki vuruşla vurup yüzü ve kolları meshetmektir.","references":["el-Kudûrî, Babü't-Teyemmüm","el-Hidâye, 1/28"],"fiqhRuling":"Suya ulaşılamayan hallerde su ile yapılan taharetin tam bedelidir.","relatedTerms":["Sa'îd-i Tâhir","Niyet","Hades"]},{"id":"necis-galize-hafife","term":"Necâset-i Galîza ve Hafîfe","termAr":"النَّجَاسَةُ الْغَلِيظَةُ وَالْخَفِيفَةُ","category":"taharet","categoryLabel":"Tahâret (Temizlik)","rootAr":"ن - ج - س","shortDef":"Kesin veya ihtilaflı delile dayanmasına göre ağır ve hafif sayılan maddî pislikler.","longDef":"Necâset-i galîza (ağır pislik): Haramlığı ve necis oluşu kesin nassla sabit pisliklerdir (insan idrarı, dışkısı, şarap, kan). Katı ise bir dirhem (yaklaşık 3 gr), sıvı ise el ayası kadarından fazlası namaza engeldir. Necâset-i hafîfe: Necis oluşunda ihtilaf olan pisliklerdir (eti yenen hayvanların idrarı gibi). Bir uzvun veya elbisenin dörtte birinden azı af kapsamında kabul edilir.","references":["el-Kudûrî, Babü'n-Necâsât","Reddü'l-Muhtâr, 1/315"],"fiqhRuling":"Galize necasetin dirhem miktarından fazlasını temizlemek farzdır.","relatedTerms":["Hades","Dirhem","Tathîr"]},{"id":"tahrime","term":"İftitah Tekbiri (Tahrîme)","termAr":"تَكْبِيرَةُ الْإِحْرَامِ / التَّحْرِيمَةُ","category":"namaz","categoryLabel":"Salât (Namaz)","rootAr":"ح - ر - م","shortDef":"Namaza başlarken \"Allahu Ekber\" diyerek dünyevi işleri haram kılan ilk tekbir.","longDef":"Namazın haricinde gibi görünse de Hanefilerde namazın içine bitişik olduğundan rükün kabul edilen kurucu tekbirdir. Bu tekbirle namaz kılan kimseye yeme, içme ve konuşma gibi fiiller haram hale gelir.","references":["el-Kudûrî, Babü Sıfati's-Salât","Bedâi'u's-Sanâi', 1/130"],"fiqhRuling":"Namazın farz rükünlerindendir.","relatedTerms":["Kıyâm","Kıraat","Rükû'"]},{"id":"kade-i-ahire","term":"Ka'de-i Ahîre (Son Oturuş)","termAr":"الْقَعْدَةُ الْأَخِيرَةُ","category":"namaz","categoryLabel":"Salât (Namaz)","rootAr":"ق - ع - د","shortDef":"Namazın sonunda teşehhüt miktarı (Tahiyyat okuyacak kadar) oturmak.","longDef":"Namazın rekatları bittikten sonra \"Ettehiyyâtü\" duasını okuyacak kadar oturmaktır. Bu oturuş namazın rüknü olup, terk edilmesi durumunda namaz batıl olur. İlk oturuş (ka'de-i ûlâ) ise Hanefilere göre vaciptir.","references":["el-Kudûrî, Babü Sıfati's-Salât","el-İhtiyâr, 1/51"],"fiqhRuling":"Ka'de-i ahire farz, ka'de-i ûlâ ise vaciptir.","relatedTerms":["Teşehhüd","Ka'de-i Ûlâ","Sücûd-i Sehv"]},{"id":"secde-i-sehv","term":"Secde-i Sehv (Sehiv Secdesi)","termAr":"سُجُودُ السَّهْوِ","category":"namaz","categoryLabel":"Salât (Namaz)","rootAr":"س - ه - و","shortDef":"Namazdaki yanılma, vacibin geciktirilmesi veya terki sebebiyle namaz sonunda yapılan iki secde.","longDef":"Namazda sehven (unutarak) bir vacibin terk edilmesi yahut bir farz veya vacibin vaktinden tehir edilmesi durumunda, namazdaki eksikliği telafi etmek için son oturuşta sağa selam verildikten sonra yapılan iki secdedir.","references":["el-Kudûrî, Babü Sücûdi's-Sehv","el-Hidâye, 1/74"],"fiqhRuling":"Hanefi mezhebinde vücubiyeti vaciptir.","relatedTerms":["Vâcip","Selâm","Teşehhüd"]},{"id":"isfer-ibrad","term":"İsfâr ve İbrâd","termAr":"الْإِسْفَارُ وَالْإِبْرَادُ","category":"namaz","categoryLabel":"Salât (Namaz)","rootAr":"س - ف - ر / ب - ر - د","shortDef":"Sabah namazını aydınlıkta kılmak (isfâr) ve yazın öğleyi sıcağın kırılmasına bırakmak (ibrâd).","longDef":"Hanefi mezhebine göre sabah namazının vaktinde cemaatin çoğalması ve kıraatin uzatılabilmesi için ufuk aydınlanıncaya kadar ertelenmesi (isfâr) müstehaptır. Yaz aylarında ise şiddetli sıcakta öğle namazını havanın serinlemesine kadar geciktirmek (ibrâd) sünnettir.","references":["el-Kudûrî, Babü Mevâkîti's-Salât","Mebsût, 1/144"],"fiqhRuling":"İsfâr ve ibrâd Hanefilerde müstehaptır.","relatedTerms":["Mevâkît","Ta'cîl","Fecr-i Sâdık"]},{"id":"nisab","term":"Nisâb","termAr":"النِّصَابُ","category":"zekat","categoryLabel":"Zekât & Sadaka","rootAr":"ن - ص - ب","shortDef":"Zekât, kurban ve hac gibi ibadetlerin farz/vacip olması için şeriatın belirlediği zenginlik alt sınırı.","longDef":"Aslî ihtiyaçlardan ve borçlardan arta kalan malın belirli bir miktara ulaşmasıdır. Altında 20 miskal (yaklaşık 80-85 gr), gümüşte 200 dirhem (yaklaşık 560-595 gr), sığırda 30, koyun ve keçide 40 adettir.","references":["el-Kudûrî, Babü Zekâti'z-Zeheb","el-Hidâye, 1/97"],"fiqhRuling":"Nisap zekâtın vücubunun temel şartıdır.","relatedTerms":["Havl-i Havelân","Havâic-i Asliyye","Nâmî Mâl"]},{"id":"havl-i-havelan","term":"Havl-i Havelân (Yıl Geçmesi)","termAr":"حَوَلَانُ الْحَوْلِ","category":"zekat","categoryLabel":"Zekât & Sadaka","rootAr":"ح - و - ل","shortDef":"Nisap miktarı malın üzerinden tam bir kamerî yılın (354 gün) geçmesi.","longDef":"Zekâtın farz olabilmesi için malın yılın başında ve sonunda nisap miktarında bulunması şarttır. Hanefilere göre yıl içerisinde nisabın altına düşüp yıl sonunda tekrar tamamlanması zekât yükümlülüğünü düşürmez.","references":["el-Kudûrî, Babü Şurûti'z-Zekât","Reddü'l-Muhtâr, 2/294"],"fiqhRuling":"Zekâtın farziyetinin zaman şartıdır.","relatedTerms":["Nisâb","Kamerî Yıl","Temlîk"]},{"id":"havaic-i-asliyye","term":"Havâic-i Asliyye (Temel İhtiyaçlar)","termAr":"الْحَوَائِجُ الْأَصْلِيَّةُ","category":"zekat","categoryLabel":"Zekât & Sadaka","rootAr":"ح - و - ج","shortDef":"Kişinin ve bakmakla yükümlü olduğu aile fertlerinin hayatını sürdürmesi için zorunlu temel maddeler.","longDef":"Oturulan ev, ev eşyaları, giyecek elbiseler, binek/ulaşım vasıtası, meslek icra edilen alet ve edevat ile bir aylık veya yıllık temel gıda maddeleridir. Bu mallar ne kadar değerli olursa olsun zekâta tabi değildir.","references":["el-Kudûrî, Kitâbü'z-Zekât","el-İhtiyâr, 1/100"],"fiqhRuling":"Zekât nisabı hesaplanırken havâic-i asliyye hesaba katılmaz.","relatedTerms":["Nisâb","Nâmî Mâl","Zekât"]},{"id":"usur","term":"'Uşür (Toprak Mahsulleri Zekâtı)","termAr":"الْعُشْرُ","category":"zekat","categoryLabel":"Zekât & Sadaka","rootAr":"ع - ش - ر","shortDef":"Toprak ürünlerinden alınan onda bir veya yirmide bir oranındaki zekât.","longDef":"Yağmur, nehir ve akarsu suları ile masrafsız sulanan arazilerden onda bir (1/10); dolap, kuyu veya masraflı sulama tesisatıyla sulanan arazilerden ise yirmide bir (1/20) oranında alınan toprak zekâtıdır. Ebû Hanîfe'ye göre az olsun çok olsun topraktan çıkan her mahsulde öşür gerekir, nisap ve havl şart değildir.","references":["el-Kudûrî, Babü'l-Uşr","Bedâi'u's-Sanâi', 2/54"],"fiqhRuling":"Hasat vaktinde farzdır.","relatedTerms":["Zekât","Nisâb","Havl-i Havelân"]},{"id":"imsak","term":"İmsâk","termAr":"الْإِمْسَاكُ","category":"oruc","categoryLabel":"Savm (Oruç)","rootAr":"م - س - ك","shortDef":"Fecr-i sâdıktan akşam güneş batışına kadar yemek, içmek ve cinsî münasebetten kendini tutmak.","longDef":"Orucun hakikati ve rüknüdür. Fecrin doğuşuyla başlar ve iftar vaktine kadar devam eder. Sözlükte nefsini tutmak, geri durmak anlamına gelir.","references":["el-Kudûrî, Babü's-Savm","el-Hidâye, 1/116"],"fiqhRuling":"Orucun rüknüdür.","relatedTerms":["Fecr-i Sâdık","İftâr","Savm"]},{"id":"oruc-keffareti","term":"Savm Keffâreti","termAr":"كَفَّارَةُ الصَّوْمِ","category":"oruc","categoryLabel":"Savm (Oruç)","rootAr":"ك - ف - ر","shortDef":"Ramazan orucunu bilerek ve mazeretsiz kasten bozan kimsenin tutması gereken iki kameri ay aralıksız oruç.","longDef":"Ramazan'ın hürmetini kasten çiğnemenin cezasıdır. Sırasıyla: Bir köle azat etmek (günümüzde mevzubahis değil), güç yetiremezse aralıksız 60 gün oruç tutmak, buna da sıhhi bakımdan gücü yetmezse 60 fakiri sabah-akşam doyurmaktır.","references":["el-Kudûrî, Babü'l-Keffâre","Reddü'l-Muhtâr, 2/408"],"fiqhRuling":"Kasten Ramazan orucunu bozana farzdır.","relatedTerms":["Kazâ","Fidyah","İmsâk"]},{"id":"itikaf","term":"İ'tikâf","termAr":"الِاعْتِكَافُ","category":"oruc","categoryLabel":"Savm (Oruç)","rootAr":"ع - ك - ف","shortDef":"İbadet niyetiyle cemaatle namaz kılınan bir mescitte dünyevi işleri terk ederek ikamet etmek.","longDef":"Ramazan'ın son on gününde yapılması sünnet-i müekkede-i ale'l-kifâyedir (bir mahallede bir kişi yaparsa diğerlerinden sorumluluk düşer). Adak yapılırsa vacip, Ramazan haricinde yapılırsa nafile olur. Mescitten şer'i ve zaruri bir hacet (abdest, gusül, cuma namazı) olmaksızın çıkmak itikafı bozar.","references":["el-Kudûrî, Babü'l-İ'tikâf","el-Hidâye, 1/130"],"fiqhRuling":"Ramazan'ın son on gününde sünnet-i kifâyedir.","relatedTerms":["Savm","Mescid","Nezr"]},{"id":"ihram","term":"İhrâm","termAr":"الْإِحْرَامُ","category":"hac","categoryLabel":"Hac & Umre","rootAr":"ح - ر - م","shortDef":"Hac veya umre yapacak kişinin niyet edip telbiye getirerek bazı helal fiilleri kendisine haram kılması.","longDef":"Haccın şartıdır. Hanefi mezhebine göre ihram sadece niyetle gerçekleşmez; niyetin yanında mutlaka telbiye veya Allah'ı tazim eden bir zikrin söylenmesi şarttır. Dikişli elbise giymek, koku sürünmek, saç-sakal tıraşı olmak ihramlıya yasaklanır.","references":["el-Kudûrî, Babü'l-İhrâm","Bedâi'u's-Sanâi', 2/160"],"fiqhRuling":"Hac ve umrenin sıhhat şartıdır.","relatedTerms":["Mîkāt","Telbiye","Tavâf","Mahzûrât-ı İhrâm"]},{"id":"arafat-vakfesi","term":"Arafat Vakfesi","termAr":"الْوُقُوفُ بِعَرَفَةَ","category":"hac","categoryLabel":"Hac & Umre","rootAr":"و - ق - ف","shortDef":"Zilhiccenin 9. günü (Arefe) zeval vaktinden bayram sabahına kadar bir an Arafat sınırları içinde bulunmak.","longDef":"Haccın en mühim iki rüknünden biridir. Peygamber Efendimiz ﷺ \"Hac Arafat'tır\" buyurmuştur. Arefe günü öğle vaktinden bayram sabahı fecr-i sâdık vaktine kadar çok kısa bir an dahi olsa Arafat bölgesinde bulunan kimse haccın bu rüknünü yerine getirmiş olur.","references":["el-Kudûrî, Babü Sıfati'l-Hacc","el-İhtiyâr, 1/148"],"fiqhRuling":"Haccın en büyük farz rüknüdür.","relatedTerms":["Tavâf-ı Ziyâret","Müzdelife","Arefe"]},{"id":"tavaf-cesitleri","term":"Tavâf (Kudûm, Ziyâret, Vedâ)","termAr":"الطَّوَافُ","category":"hac","categoryLabel":"Hac & Umre","rootAr":"ط - و - ف","shortDef":"Kâbe-i Muazzama etrafında Hacer-i Esved'den başlayarak sol taraftan saat yönünün tersine 7 tur dönmek.","longDef":"Tavâf-ı Kudûm: Âfâkî (Mekke dışından gelen) hacıların şehre vardıklarında yaptıkları ilk sünnet tavaftır. Tavâf-ı Ziyâret (İfâda): Kurban bayramı günlerinde yapılan haccın farz rüknüdür. Tavâf-ı Sadır (Vedâ): Hacıların memleketlerine dönmeden önce yaptıkları vacip tavaftır.","references":["el-Kudûrî, Babü't-Tavâf","el-Hidâye, 1/141"],"fiqhRuling":"Ziyaret tavafı farz, veda tavafı vacip, kudum tavafı sünnettir.","relatedTerms":["Şavt","Remel","İstisbâb","Hacer-i Esved"]},{"id":"icab-ve-kabul","term":"İcâb ve Kabûl","termAr":"الْإِيجَابُ وَالْقَبُولُ","category":"muamelat","categoryLabel":"Muâmelât (Ticaret/Borç)","rootAr":"و - ج - ب / ق - ب - ل","shortDef":"Akdin kurulmasını sağlayan iki tarafın karşılıklı irade beyanı.","longDef":"Sözleşme yapmak isteyen ilk tarafın irade açıklamasına icap, ikinci tarafın buna uygun muvafakat açıklamasına kabul denir. Hanefi mezhebinde akitlerin mazi sîgasıyla (sattım - aldım) yapılması akde kesinlik kazandırdığı için esastır.","references":["el-Kudûrî, Babü İ'nikâdi'l-Bey'","Mecelle md. 101-104"],"fiqhRuling":"Bütün rızâî akitlerin kurucu rüknüdür.","relatedTerms":["İttihâd-ı Meclis","Teâtî","Bey'"]},{"id":"riba","term":"Ribâ (Faiz)","termAr":"الرِّبَا","category":"muamelat","categoryLabel":"Muâmelât (Ticaret/Borç)","rootAr":"ر - ب - و","shortDef":"Ölçü veya tartı ile satılan malların kendi cinsiyle mübadele edilirken karşılıksız şart koşulan fazlalık veya vade farkı.","longDef":"Hanefi usulüne göre faizin illeti \"Kadr ve Cins\"tir. Kadr: Malın hacim ölçüsü (keyl) veya ağırlık ölçüsü (vezn) ile alınıp satılmasıdır. Cins ise malın tür birliğidir. Bu iki vasıf birleşirse (örneğin buğdayın buğdayla takası), hem fazlalık hem vade haramdır. Cins ayrılırsa (altın ile gümüş gibi) fazlalık caiz fakat vadeli satış yine haramdır.","references":["el-Kudûrî, Babü'r-Ribâ","el-Mebsût, 12/109","Bedâi'u's-Sanâi', 5/183"],"fiqhRuling":"Kesin nassla haram kılınmıştır.","relatedTerms":["Ribâ'l-Fadl","Ribâ'n-Nesîe","Mekîl","Mevzûn","Sarf"]},{"id":"khiyar-cesitleri","term":"Hıyârât (Muhayyerlik Hakları)","termAr":"الْخِيَارَاتُ فِي الْبَيْعِ","category":"muamelat","categoryLabel":"Muâmelât (Ticaret/Borç)","rootAr":"خ - ي - ر","shortDef":"Akit taraflarına sözleşmeyi feshetme veya onaylama serbestisi tanıyan şer'i haklar.","longDef":"Başlıcaları: Hıyârü'ş-şart (üç güne kadar akdi bozma hakkını şart koşmak), Hıyârü'l-ayb (malda gizli kusur çıkması durumunda iade hakkı), Hıyârü'r-ru'yet (görmeden alınan malı gördükten sonra beğenmeyip geri verme hakkı) ve Hıyârü't-ta'yîn'dir.","references":["el-Kudûrî, Babü'l-Hıyârât","Mecelle md. 300-355"],"fiqhRuling":"Akitlerin adalet ve rıza üzerine tesisini temin eden haklardır.","relatedTerms":["Hıyârü'ş-Şart","Hıyârü'l-Ayb","Fesih","Bey'"]},{"id":"selem","term":"Selem Akdi (Ön Ödemeli Satış)","termAr":"بَيْعُ السَّلَمِ","category":"muamelat","categoryLabel":"Muâmelât (Ticaret/Borç)","rootAr":"س - ل - م","shortDef":"Bedeli peşin ödenerek, nitelikleri tam belirlenmiş bir malı ileri bir vadede teslim alma akdi.","longDef":"Normalde mevcut olmayan malın satışı yasakken (nehiy ani'l-ma'dum), selem akdi nasla istisna kılınmıştır. Şartları: Sermayenin (semen) akit meclisinde peşin teslimi, teslim vadesinin ve yerinin net belirlenmesi, malın cins, nevi ve vasıflarının ihtilafa meydan vermeyecek şekilde tayin edilmesidir.","references":["el-Kudûrî, Babü's-Selem","el-Hidâye, 3/73"],"fiqhRuling":"Şartlarına riayet edildiğinde caiz ve meşrudur.","relatedTerms":["Re'sü'l-mâl","Müsellemün fîh","İsticrâr"]},{"id":"kefaet","term":"Kefâet (Denklik)","termAr":"الْكَفَاءَةُ فِي النِّكَاحِ","category":"munakahat","categoryLabel":"Münâkahât (Aile/Nikâh)","rootAr":"ك - ف - أ","shortDef":"Evlilikte erkeğin din, dindarlık, hürriyet, nesep ve ekonomik güç açısından kadına denk olması.","longDef":"Hanefilerde kadının velisiz evlenebilme hakkı olduğu için, velilerin aile haysiyetini korumak adına itiraz hakkı kefâet şartına bağlanmıştır. Erkek kadına denk olmalıdır; kadının erkeğe denk olması aranmaz.","references":["el-Kudûrî, Babü'l-Kefâeh","Reddü'l-Muhtâr, 3/84"],"fiqhRuling":"Nikâhın lüzum şartıdır (akdin sıhhati için değil, bağlayıcılığı içindir).","relatedTerms":["Nikâh","Velî","Mehr-i Misl"]},{"id":"mehir","term":"Mehir (Mehr-i Müsemmâ & Misl)","termAr":"الْمَهْرُ / الصَّدَاقُ","category":"munakahat","categoryLabel":"Münâkahât (Aile/Nikâh)","rootAr":"م - ه - ر","shortDef":"Erkeğin evlenirken kadına vermeyi taahhüt ettiği mal veya nakit.","longDef":"Mehr-i Müsemmâ: Akit anında miktarında anlaşılan mehirdir. Mehr-i Misl: Akitte belirlenmemişse kadının baba tarafından akrabası olan emsal kadınların mehrine denk takdir edilen mehirdir. Hanefi fıkhına göre mehrin asgari tutarı 10 gümüş dirhemdir.","references":["el-Kudûrî, Babü'l-Mehr","el-İhtiyâr, 3/102"],"fiqhRuling":"Evlilik akdi neticesinde kadının şahsi mülkiyetine geçen şer'i hakkıdır.","relatedTerms":["Mehr-i Müsemmâ","Mehr-i Misl","Müt'a","Halvet-i Sahîha"]},{"id":"talak-ahsan-hasan-bidi","term":"Talâk (Ahsen, Hasen, Bid'î)","termAr":"أَقْسَامُ الطَّلَاقِ","category":"munakahat","categoryLabel":"Münâkahât (Aile/Nikâh)","rootAr":"ط - ل - ق","shortDef":"Evlilik bağının koca tarafından meşru lafızlarla çözülmesi ve çeşitleri.","longDef":"Talâk-ı Ahsen: Kadının temizlik (tuhr) döneminde cinsi münasebet olmaksızın bir talakla boşanması ve iddeti bitene kadar beklenmesidir. Talâk-ı Hasen: Her temizlik döneminde birer talak vermek suretiyle üç temizlikte boşamak. Talâk-ı Bid'î: Kadını hayızlıyken boşamak veya aynı anda üç talakı birden vermektir; günah olmakla birlikte Hanefilere göre hukuken üç talak vaki olur.","references":["el-Kudûrî, Babü't-Talâk","el-Hidâye, 2/4"],"fiqhRuling":"Sünnete uygun olan Ahsen ve Hasen olanıdır.","relatedTerms":["Talâk-ı Ric'î","Talâk-ı Bâin","İddet","Hul'"]},{"id":"zahirur-rivaye","term":"Zâhirü'r-Rivâye (Mesâil-i Usûl)","termAr":"ظَاهِرُ الرِّوَايَةِ","category":"istilah","categoryLabel":"Hanefî Istılahları","rootAr":"ظ - ه - ر","shortDef":"İmam Ebû Hanîfe ve talebelerinden İmam Muhammed aracılığıyla tevatür/şöhret yoluyla nakledilen altı temel kitap.","longDef":"İmam Muhammed b. Hasan eş-Şeybânî'nin telif ettiği el-Asl (el-Mebsût), el-Câmiu's-Sağîr, el-Câmiu'l-Kebîr, ez-Ziyâdât, es-Siyeru's-Sağîr ve es-Siyeru'l-Kebîr adlı altı eserdir. Hanefi mezhebinde fetvada ilk başvurulan en muteber ve en sağlam rivayet tabakasıdır.","references":["İbn Âbidîn, Risâle fî Resmi'l-Müftî","Keşfü'l-Esrâr"],"fiqhRuling":"Hanefi fetvasında birinci derece bağlayıcı kaynaktır.","relatedTerms":["Nevâdir","Vâkıât","İmâmeyn"]},{"id":"imameyn","term":"el-İmâmeyn (İki İmam)","termAr":"الْإِمَامَانِ","category":"istilah","categoryLabel":"Hanefî Istılahları","rootAr":"أ - م - م","shortDef":"Hanefi mezhebinde İmam Ebû Yûsuf ile İmam Muhammed b. el-Hasan eş-Şeybânî.","longDef":"İmam-ı Azam Ebû Hanîfe'nin en seçkin iki talebesidir. Fıkıh metinlerinde \"Ve kâlâ\" (ve o ikisi dediler ki) ifadesi geçtiğinde kastedilen Ebû Yûsuf ve İmam Muhammed'dir. Bazı meselelerde İmam-ı Azam tek kalıp İmâmeyn ittifak ettiğinde, örf ve ihtiyac var GLR=null,GLS=null;
function glIdx(){GLR={};GL.forEach(function(g,i){var ns=[g[0]].concat((g[5]&&g[5].a)||[]);ns.forEach(function(n){var k=fold(n),k2=fold(String(n).replace(/\(.*?\)/g,""));if(k&&GLR[k]==null)GLR[k]=i;if(k2&&GLR[k2]==null)GLR[k2]=i})})}
function glFind(name){
  if(!GLR)glIdx();var c=fold(name),c2=fold(String(name).replace(/\(.*?\)/g,""));
  if(GLR[c]!=null)return GLR[c];if(c2&&GLR[c2]!=null)return GLR[c2];
  var best=-1,bl=0;Object.keys(GLR).forEach(function(k){if(k.length>=3&&k.length>bl&&(c.indexOf(k)>=0||k.indexOf(c)>=0)){best=GLR[k];bl=k.length}});
  return best;
}

  return GLS[gi]||[];
}

var KVR=[{"id":"rule-1","articleNumber":1,"arabicTextWithHarakat":"الْفِقْهُ: عِلْمٌ بِالْمَسَائِلِ الشَّرْعِيَّةِ الْعَمَلِيَّةِ الْمُكْتَسَبَةِ مِنْ أَدِلَّتِهَا التَّفْصِيلِيَّةِ","turkishTitle":"el-Fıkhu İlmün bi'l-Mesâili'ş-Şer'iyyeti'l-Ameliyye","literalTranslation":"İlm-i fıkıh, amelî şer'î meseleleri bilmektir.","detailedExplanation":"Mecelle'nin ilk maddesidir ve fıkhın tarifini verir. Fıkıh, ibadet ve muamele gibi davranışa yönelik şer'î hükümleri, tafsilî delillerinden çıkarılmış olarak bilmektir. Bu madde bir küllî kaide değil, Mecelle'nin mukaddimesidir; ardından gelen 99 küllî kaideye (md. 2–100) giriş yapar. Mecelle, fıkıh meselelerini âhiret işleri (ibadât) ve dünya işleri olarak ikiye ayırır; dünya işlerini de münâkehât (evlilik), muâmelât (mali ilişkiler) ve ukûbât (cezalar) şeklinde sınıflandırır.","practicalExamples":["İbadetler âhiret işlerine, alım-satım, icâre, kefâlet gibi işlemler muâmelâta, nikâh ve talâk münâkehâta, cezalar ukûbâta girer.","Mecelle, bu bölümlerden mahkemelerde en sık karşılaşılan muâmelât meselelerini kanun hâline getirmiştir."],"category":"Mukaddime"},{"id":"rule-2","articleNumber":2,"arabicTextWithHarakat":"الْأُمُورُ بِمَقَاصِدِهَا","turkishTitle":"el-Umûru bi-Makâsıdihâ","literalTranslation":"Bir işten maksat ne ise hüküm ona göredir.","detailedExplanation":"Mecelle'nin 2. maddesi ve fıkhın 5 büyük küllî kaidesinden ilkidir. İnsanların fiilleri, sözleri ve tasarrufları arkasındaki niyet ve kastlarına göre hüküm kazanır. İbadetlerin makbuliyeti niyetle olduğu gibi, akitlerde ve muamelelerde de asıl gaye gözetilir.","practicalExamples":["Bir kimsenin av köpeğini av kastıyla salması halinde tuttuğu av helal olur; sadece gezdirmek maksadıyla salarsa öldürdüğü av yenmez.","Akitlerde lafızların zahirine değil, tarafların gerçek maksat ve iradelerine itibar edilir (Mecelle md. 3).","Silah satışı haram olmamakla birlikte, fitne ve iç karışıklık zamanında isyancılara silah satmak haramdır."],"category":"Küllî Kaide"},{"id":"rule-3","articleNumber":3,"arabicTextWithHarakat":"الْعِبْرَةُ فِي الْعُقُودِ لِلْمَقَاصِدِ وَالْمَعَانِي لَا لِلْأَلْفَاظِ وَالْمَبَانِي","turkishTitle":"el-İbretü fi'l-Ukûdi lil-Makâsıdi ve'l-Meânî","literalTranslation":"Akitlerde itibar lafızlara ve kalıplara değil, maksat ve mânâyadır.","detailedExplanation":"Akit yapılırken kullanılan sözün şekli değil, tarafların gerçek amacı hükmü belirler.","practicalExamples":["Karz kastıyla \"hibe ettim\" denip karşılığı beklenirse bu işlem karz hükmündedir.","\"Sattım\" yerine \"kiraya verdim\" denip mülkiyet devri kastedilmişse satış sayılır."],"category":"Küllî Kaide"},{"id":"rule-4","articleNumber":4,"arabicTextWithHarakat":"الْيَقِينُ لَا يَزُولُ بِالشَّكِّ","turkishTitle":"el-Yakînu Lâ Yezûlü bi'ş-Şekk","literalTranslation":"Şüphe ile kesin bilgi zâil olmaz.","detailedExplanation":"Kesin olarak bilinen ve sabit olan bir durum, sonradan ortaya çıkan tereddüt ve şüphe ile ortadan kalkmaz. Asıl olan önceki kesin durumun devam etmesidir.","practicalExamples":["Abdest aldığından kesin emin olan bir kimse, sonradan abdestinin bozulup bozulmadığında tereddüt etse abdestli sayılır.","Abdestinin bozulduğundan kesin emin olan fakat abdest alıp almadığında şüphe eden kimse abdestsiz sayılır.","Borcun ödendiğine dair delil bulunmadıkça, zimmetin borçlu olduğu asıldır."],"category":"Küllî Kaide"},{"id":"rule-5","articleNumber":5,"arabicTextWithHarakat":"الْأَصْلُ بَقَاءُ مَا كَانَ عَلَى مَا كَانَ","turkishTitle":"el-Aslü Bekâü Mâ Kâne alâ Mâ Kâne","literalTranslation":"Asıl olan, bir şeyin bulunduğu hâl üzere kalmasıdır.","detailedExplanation":"Aksine delil çıkmadıkça önceki durum devam ediyor kabul edilir (istishâb).","practicalExamples":["Kaybolan kişi, ölümüne delil yoksa hayatta kabul edilir.","Kiracı olan kimse, aksi ispatlanmadıkça kiracı sayılır."],"category":"Küllî Kaide"},{"id":"rule-6","articleNumber":6,"arabicTextWithHarakat":"الْقَدِيمُ يُتْرَكُ عَلَى قَدَمِهِ","turkishTitle":"el-Kadîmü Yütraku alâ Kıdemihî","literalTranslation":"Eski olan, eski hâliyle bırakılır.","detailedExplanation":"Zararı ispatlanmayan, eskiden beri süregelen bir uygulama sırf eski olduğu için değiştirilmez.","practicalExamples":["Komşunun arazisinden eskiden beri geçen su yolu aynen bırakılır.","Eskiden beri açık olan pencere, zararı ispatlanmadıkça kapattırılmaz."],"category":"Küllî Kaide"},{"id":"rule-7","articleNumber":7,"arabicTextWithHarakat":"الضَّرَرُ لَا يَكُونُ قَدِيمًا","turkishTitle":"ed-Dararu Lâ Yekûnü Kadîmen","literalTranslation":"Zarar, eski olmakla meşrulaşmaz.","detailedExplanation":"Başkasına zarar veren uygulama ne kadar eskiyse de kaldırılır.","practicalExamples":["Komşuya ağır zarar veren eski bir mecra ıslah edilir.","Eskiden beri süren bir haksız tecavüz, zaman aşımıyla meşru olmaz."],"category":"Küllî Kaide"},{"id":"rule-8","articleNumber":8,"arabicTextWithHarakat":"الْأَصْلُ بَرَاءَةُ الذِّمَّةِ","turkishTitle":"el-Aslü Berâetü'z-Zimme","literalTranslation":"Asıl olan, zimmetin borçtan uzak (beri) olmasıdır.","detailedExplanation":"Kimse aksi ispatlanmadıkça borçlu sayılmaz; ispat yükü davacıdadır.","practicalExamples":["Borç iddia eden kimse delil getirmedikçe, davalı borçsuz kabul edilir.","Tazminat iddiasında zararın miktarı ispatlanmalıdır."],"category":"Küllî Kaide"},{"id":"rule-9","articleNumber":9,"arabicTextWithHarakat":"الْأَصْلُ فِي الْأُمُورِ الْعَارِضَةِ الْعَدَمُ","turkishTitle":"el-Aslü fi'l-Umûri'l-Âride'l-Adem","literalTranslation":"Sonradan ortaya çıkan hâllerde asıl olan yokluktur.","detailedExplanation":"Bir şeyin sonradan eklenen niteliği iddia ediliyorsa, ispat edilmedikçe yok sayılır.","practicalExamples":["Satılan malda sonradan ayıp çıktığını iddia eden, bunu ispatlamalıdır."],"category":"Küllî Kaide"},{"id":"rule-10","articleNumber":10,"arabicTextWithHarakat":"مَا ثَبَتَ بِزَمَانٍ يُحْكَمُ بِبَقَائِهِ مَا لَمْ يُوجَدْ دَلِيلٌ عَلَى خِلَافِهِ","turkishTitle":"Mâ Sebete bi-Zemânin Yuhkemu bi-Bekâihî Mâ Lem Yûced Delîlün alâ Hilâfihî","literalTranslation":"Bir zamanda sabit olan, aksine delil çıkmadıkça devam eder kabul edilir.","detailedExplanation":"Bir durum bir kez sabit olunca, değiştiğine dair delil gelene kadar sürer.","practicalExamples":["Bir kimsenin borcu sabit olmuşsa, ödendiği ispat edilene kadar devam eder."],"category":"Küllî Kaide"},{"id":"rule-11","articleNumber":11,"arabicTextWithHarakat":"الْأَصْلُ إِضَافَةُ الْحَادِثِ إِلَى أَقْرَبِ أَوْقَاتِهِ","turkishTitle":"el-Aslü İdâfetü'l-Hâdisi ilâ Akrabi Evkâtihî","literalTranslation":"Asıl olan, olan bir olayı kendisine en yakın zamana nispet etmektir.","detailedExplanation":"Olayın zamanı belirsizse en yakın zamanda gerçekleşmiş sayılır.","practicalExamples":["Elbisedeki kan lekesinin, en son giyilen zamanda oluştuğu kabul edilir."],"category":"Küllî Kaide"},{"id":"rule-12","articleNumber":12,"arabicTextWithHarakat":"الْأَصْلُ فِي الْكَلَامِ الْحَقِيقَةُ","turkishTitle":"el-Aslü fi'l-Kelâmi'l-Hakîka","literalTranslation":"Sözde asıl olan hakiki anlamdır.","detailedExplanation":"İfade, karine olmadıkça gerçek anlamında anlaşılır; mecaz ancak engel varsa devreye girer.","practicalExamples":["\"Bu evi sattım\" diyen, evin kendisini satmış sayılır.","\"Oğlum\" diyenin sözü, evlatlık değil öz çocuk olarak anlaşılır."],"category":"Küllî Kaide"},{"id":"rule-13","articleNumber":13,"arabicTextWithHarakat":"لَا عِبْرَةَ لِلدَّلَالَةِ فِي مُقَابَلَةِ التَّصْرِيحِ","turkishTitle":"Lâ İbrete li'd-Delâleti fî Mukâbeleti't-Tasrîh","literalTranslation":"Açık ifade karşısında dolaylı delâletin değeri yoktur.","detailedExplanation":"Açık söz varken ima ve karineye göre hüküm verilmez.","practicalExamples":["Açıkça \"ödünç verdim\" diyen, davranışına bakılarak bağışçı sayılmaz."],"category":"Küllî Kaide"},{"id":"rule-14","articleNumber":14,"arabicTextWithHarakat":"لَا مَسَاغَ لِلِاجْتِهَادِ فِي مَوْرِدِ النَّصِّ","turkishTitle":"Lâ Mesâga li'l-İctihâd fî Mevridi'n-Nass","literalTranslation":"Nassın bulunduğu yerde içtihada yer yoktur.","detailedExplanation":"Kesin nass bulunan meselede kıyas ve içtihatla farklı hüküm verilemez.","practicalExamples":["Faizin haram oluşu nassla sabit olduğundan \"yararlı\" diye helâl sayılamaz.","Namazın rekât sayısı gibi nassla belirlenmiş hükümler içtihatla değiştirilemez."],"category":"Küllî Kaide"},{"id":"rule-15","articleNumber":15,"arabicTextWithHarakat":"مَا ثَبَتَ عَلَى خِلَافِ الْقِيَاسِ فَغَيْرُهُ لَا يُقَاسُ عَلَيْهِ","turkishTitle":"Mâ Sebete alâ Hilâfi'l-Kıyâsi Feğayruhû Lâ Yukâsü Aleyhi","literalTranslation":"Kıyasa aykırı sabit olan hüküm, başkasına kıyas edilmez.","detailedExplanation":"İstisnâ olarak konan hükümler dar yorumlanır, benzerlerine yayılmaz.","practicalExamples":["Selem akdinin cevazı, mevcut olmayan her malın satışına kıyas edilemez."],"category":"Küllî Kaide"},{"id":"rule-16","articleNumber":16,"arabicTextWithHarakat":"الِاجْتِهَادُ لَا يُنْقَضُ بِمِثْلِهِ","turkishTitle":"el-İctihâdü Lâ Yünkaḍu bi-Mislihî","literalTranslation":"İçtihat, benzeri bir içtihatla bozulmaz.","detailedExplanation":"Bir içtihada dayanan hüküm, sonradan aynı seviyede başka içtihat çıktı diye geri alınmaz; istikrar korunur.","practicalExamples":["Kâdının içtihadıyla verdiği hüküm, başka müçtehit farklı düşündü diye iptal edilmez.","Kıbleyi araştırarak namaz kılan, sonradan başka yön tercih edilse de kıldığını iade etmez."],"category":"Küllî Kaide"},{"id":"rule-17","articleNumber":17,"arabicTextWithHarakat":"الْمَشَقَّةُ تَجْلِبُ التَّيْسِيرَ","turkishTitle":"el-Meşakkatu Teclibü't-Teysîr","literalTranslation":"Meşakkat kolaylaştırmayı celbeder.","detailedExplanation":"Mükelleflerin katlanmakta zorlanacağı olağanüstü meşakkat, darlık ve sıkıntılar ortaya çıktığında, şeriat bu güçlüğü giderecek ruhsatlar ve kolaylıklar vazeder.","practicalExamples":["Su bulunmadığında veya hastalık durumunda abdest ve gusül yerine teyemmümün meşru kılınması.","Yolculukta dört rekatlı farz namazların iki rekat olarak kısaltılması (kasr-ı salât) ve Ramazan orucunun ertelenebilmesi.","Ayakta duramayacak kadar hasta olanın oturarak veya ima ile namaz kılabilmesi."],"category":"Zaruret"},{"id":"rule-18","articleNumber":18,"arabicTextWithHarakat":"الْأَمْرُ إِذَا ضَاقَ اتَّسَعَ","turkishTitle":"el-Emru İzâ Dâka İttesea","literalTranslation":"İş daraldığında genişler.","detailedExplanation":"Zorluk arttığında şeriat ruhsat ve kolaylık getirir.","practicalExamples":["Hastalık sebebiyle abdest alamayan kimse teyemmüm eder.","Yolculukta namazların kısaltılması."],"category":"Zaruret"},{"id":"rule-19","articleNumber":19,"arabicTextWithHarakat":"لَا ضَرَرَ وَلَا ضِرَارَ","turkishTitle":"Lâ Darara ve Lâ Dırâr","literalTranslation":"Zarar vermek de karşılıklı zarar vermek de yoktur.","detailedExplanation":"Hadis kaynaklı bu kaide, zararın hem başlangıçta önlenmesini hem karşılık olarak zarar verilmemesini ister.","practicalExamples":["Başkasının evini rahatsız edecek işletme açmak engellenir.","Zarara uğrayan, intikam kastıyla fazlasını veremez."],"category":"Zaruret"},{"id":"rule-20","articleNumber":20,"arabicTextWithHarakat":"الضَّرَرُ يُزَالُ","turkishTitle":"ed-Dazaru Yüzâl","literalTranslation":"Zarar izale olunur (ortadan kaldırılır).","detailedExplanation":"İslam hukukunda haksız bir zarara uğramak meşru olmadığı gibi, başkasına haksız zarar vermek de yasaktır (\"Lâ darara ve lâ dırâr\"). Oluşmuş zararın tazmini ve önlenmesi esastır.","practicalExamples":["Komşunun mülküne zarar veren bir yapının veya gürültünün önlenmesi ve kısıtlanması.","Kusurlu çıkan malın ayıbından dolayı müşteriye iade veya tazminat hakkı tanınması (Hıyârü'l-ayb).","İflas eden borçlunun kalan mallarına alacaklıların zarar görmemesi için haciz konulması."],"category":"Küllî Kaide"},{"id":"rule-21","articleNumber":21,"arabicTextWithHarakat":"الضَّرُورَاتُ تُبِيحُ الْمَحْظُورَاتِ","turkishTitle":"ed-Darûrâtü Tübîhu'l-Mahzûrât","literalTranslation":"Zaruretler yasakları mubah kılar.","detailedExplanation":"Hayatı tehdit eden zorunluluk hâlinde haram olan şey geçici olarak mubah olur.","practicalExamples":["Açlıktan ölmek üzere olan kimse leş yiyebilir.","Boğazına lokma takılan, başka içecek yoksa şarapla yutabilir."],"category":"Zaruret"},{"id":"rule-22","articleNumber":22,"arabicTextWithHarakat":"مَا أُبِيحَ لِلضَّرُورَةِ يُقَدَّرُ بِقَدَرِهَا","turkishTitle":"Mâ Ubîha li'd-Darûreti Yükaddaru bi-Kadarihâ","literalTranslation":"Zaruret sebebiyle mubah olan, zaruret miktarıyla sınırlıdır.","detailedExplanation":"Zorunluluk geçince veya karşılandığında ruhsat sona erer.","practicalExamples":["Açlıkta haramdan hayatı kurtaracak kadar yenir, doyuncaya kadar yenmez.","Doktor gerekli gördüğü kadar ilaç/uygulama için avret mahalli açılabilir."],"category":"Zaruret"},{"id":"rule-23","articleNumber":23,"arabicTextWithHarakat":"مَا جَازَ لِعُذْرٍ بَطَلَ بِزَوَالِهِ","turkishTitle":"Mâ Câze li-Uzrin Batale bi-Zevâlihî","literalTranslation":"Özür sebebiyle caiz olan şey, özür kalkınca batıl olur.","detailedExplanation":"Ruhsat, sebebi devam ettiği sürece geçerlidir.","practicalExamples":["Su bulunca teyemmüm bozulur ve abdest alınır.","Hasta iyileşince oturarak kıldığı namaz hükmü sona erer."],"category":"Zaruret"},{"id":"rule-24","articleNumber":24,"arabicTextWithHarakat":"إِذَا زَالَ الْمَانِعُ عَادَ الْمَمْنُوعُ","turkishTitle":"İzâ Zâle'l-Mâni' Âde'l-Memnû'","literalTranslation":"Engel ortadan kalkınca, engellenmiş olan şey geri döner.","detailedExplanation":"Bir şeyin yapılmasına engel olan sebep kalktığında, o engel yüzünden yapılamayan şey eski hâline, yani yapılabilir duruma döner.","practicalExamples":["İhram sebebiyle yasak olan avlanma, ihramdan çıkılınca yeniden mubah olur.","Akıl hastalığı veya küçüklük sebebiyle tasarruf yetkisi kısıtlanan kimse, bu sebep ortadan kalkınca tasarruf yetkisine yeniden kavuşur."],"category":"Zaruret"},{"id":"rule-25","articleNumber":25,"arabicTextWithHarakat":"الضَّرَرُ لَا يُزَالُ بِمِثْلِهِ","turkishTitle":"ed-Dararu Lâ Yüzâlü bi-Mislihî","literalTranslation":"Zarar, kendisi gibi bir zararla giderilmez.","detailedExplanation":"Bir zararı gidermek için aynı ağırlıkta başka zarar verilemez.","practicalExamples":["Aç kalan, başkasının açlıktan ölecek olan malını zorla alamaz."],"category":"Zaruret"},{"id":"rule-26","articleNumber":26,"arabicTextWithHarakat":"يُتَحَمَّلُ الضَّرَرُ الْخَاصُّ لِدَفْعِ ضَرَرٍ عَامٍّ","turkishTitle":"Yütehammelü'd-Dararü'l-Hâss li-Def'i Dararin Âmm","literalTranslation":"Genel bir zararı önlemek için özel zarara katlanılır.","detailedExplanation":"Toplumu ilgilendiren zarar, kişiye ait küçük zarara tercihen önlenir.","practicalExamples":["Cahil tabibin ve muflis müftünün işlerinden men edilmesi.","Yol için yapılan istimlakte malikin zarar görmesi."],"category":"Zaruret"},{"id":"rule-27","articleNumber":27,"arabicTextWithHarakat":"الضَّرَرُ الْأَشَدُّ يُزَالُ بِالضَّرَرِ الْأَخَفِّ","turkishTitle":"ed-Dararü'l-Eşeddü Yüzâlü bi'd-Dararı'l-Ehaff","literalTranslation":"Daha ağır zarar, daha hafif zararla giderilir.","detailedExplanation":"İki zarar çatıştığında büyüğü küçüğüyle bertaraf edilir.","practicalExamples":["Kurtulmak için gemideki yükün bir kısmı denize atılabilir.","Bulaşıcı hastayı ayırmak, onun hareket serbestisini kısıtlasa da yapılır."],"category":"Zaruret"},{"id":"rule-28","articleNumber":28,"arabicTextWithHarakat":"إِذَا تَعَارَضَ مَفْسَدَتَانِ رُوعِيَ أَعْظَمُهُمَا ضَرَرًا بِارْتِكَابِ أَخَفِّهِمَا","turkishTitle":"İzâ Teâraza Mefsedetâni Rûiye A'zamühümâ Dararan bi-İrtikâbi Ehaffihimâ","literalTranslation":"İki mefsedet çatışırsa, ağır olan, hafif olanı işleyerek gözetilir.","detailedExplanation":"Büyük zarardan kaçınmak için küçüğü göze alınır.","practicalExamples":["Boğulmaya engel olmak için kişinin elbisesi yırtılabilir."],"category":"Zaruret"},{"id":"rule-29","articleNumber":29,"arabicTextWithHarakat":"يُخْتَارُ أَهْوَنُ الشَّرَّيْنِ","turkishTitle":"Yuhtâru Ehvenü'ş-Şerreyn","literalTranslation":"İki şerden hafif olanı seçilir.","detailedExplanation":"Her iki seçeneğin de zararlı olduğu durumda daha az zararlı olan tercih edilir.","practicalExamples":["Namazda bir farz ile bir vâcibin çatışmasında farz öne alınır.","Hem harama hem mekruha düşme ihtimalinde mekruh seçilir."],"category":"Zaruret"},{"id":"rule-30","articleNumber":30,"arabicTextWithHarakat":"دَرْءُ الْمَفَاسِدِ أَوْلَى مِنْ جَلْبِ الْمَنَافِعِ","turkishTitle":"Derü'l-Mefâsid Evlâ min Celbi'l-Menâfi'","literalTranslation":"Mefsedetleri defetmek, menfaatleri celbetmekten önceliklidir.","detailedExplanation":"Zarar ve fayda çatıştığında zararı önlemek öne alınır.","practicalExamples":["Komşuya zarar verecek yapı, kendi yararı için bile olsa engellenir.","Haram karışma şüphesi olan kazanç, getireceği faydaya rağmen terk edilir."],"category":"Zaruret"},{"id":"rule-31","articleNumber":31,"arabicTextWithHarakat":"الضَّرَرُ يُدْفَعُ بِقَدْرِ الْإِمْكَانِ","turkishTitle":"ed-Dararu Yüdfeu bi-Kadri'l-İmkân","literalTranslation":"Zarar, imkân ölçüsünde defedilir.","detailedExplanation":"Zarar meydana gelmeden önlemek veya gücü yettiği kadar azaltmak gerekir.","practicalExamples":["Savaşta İslam topraklarını korumak için gerekli hazırlıkların yapılması."],"category":"Zaruret"},{"id":"rule-32","articleNumber":32,"arabicTextWithHarakat":"الْحَاجَةُ تَنْزِلُ مَنْزِلَةَ الضَّرُورَةِ عَامَّةً كَانَتْ أَوْ خَاصَّةً","turkishTitle":"el-Hâcetü Tenzilü Menzilete'd-Darûre","literalTranslation":"İhtiyaç, genel de olsa özel de olsa zaruret yerine geçer.","detailedExplanation":"Zorunluluk derecesine ulaşmayan ama ciddi güçlük doğuran ihtiyaçlar da bazı ruhsatları gerektirir.","practicalExamples":["Selem akdi ihtiyaç sebebiyle caiz kılınmıştır.","İcâre akdi, ihtiyaç nedeniyle kıyasa aykırı olsa da meşrudur."],"category":"Zaruret"},{"id":"rule-33","articleNumber":33,"arabicTextWithHarakat":"الِاضْطِرَارُ لَا يُبْطِلُ حَقَّ الْغَيْرِ","turkishTitle":"el-İdtırâru Lâ Yübtılü Hakka'l-Ğayr","literalTranslation":"Zaruret, başkasının hakkını geçersiz kılmaz.","detailedExplanation":"Mecbur kalan kişi ihtiyacı kadar kullansa da bedelini ödemekle yükümlüdür.","practicalExamples":["Açlıktan ölecek olan, başkasının yiyeceğini yerse bedelini öder."],"category":"Zaruret"},{"id":"rule-34","articleNumber":34,"arabicTextWithHarakat":"مَا حَرُمَ أَخْذُهُ حَرُمَ إِعْطَاؤُهُ","turkishTitle":"Mâ Harume Ahzühû Harume İ'tâuhû","literalTranslation":"Alınması haram olan şeyin verilmesi de haramdır.","detailedExplanation":"Haram bir kazanca yardım eden de sorumludur.","practicalExamples":["Rüşvet almak haram olduğu gibi vermek de haramdır.","Faiz yiyen kadar faiz veren de günahkârdır."],"category":"Küllî Kaide"},{"id":"rule-35","articleNumber":35,"arabicTextWithHarakat":"مَا حَرُمَ فِعْلُهُ حَرُمَ طَلَبُهُ","turkishTitle":"Mâ Harume Fi'lühû Harume Talebühû","literalTranslation":"Yapılması haram olan şeyin istenmesi de haramdır.","detailedExplanation":"Haram fiili talep etmek de aynı hükme tâbidir.","practicalExamples":["Hırsızlık yapmasını başkasından istemek haramdır.","Haram bir işi yaptırmak için ücret vermek caiz değildir."],"category":"Küllî Kaide"},{"id":"rule-36","articleNumber":36,"arabicTextWithHarakat":"الْعَادَةُ مُحَكَّمَةٌ","turkishTitle":"el-Âdetü Muhakkemetün","literalTranslation":"Âdet hakem kılınır (Örf hukuki hüküm doğurur).","detailedExplanation":"Nasslara aykırı olmayan sahih örf ve teamüller, kanunun ve sözleşmenin açık hüküm içermediği ihtilaflı durumlarda bağlayıcı kural kabul edilir.","practicalExamples":["Bir beldede alışveriş bedellerinin ödenme vadesi ve teslim biçiminde o beldenin ticari teamülü esas alınır.","Örfte şart olan şey, sözleşmede açıkça şart koşulmuş gibidir (\"el-Ma'rûfu 'urfen ke'l-meşrûti şarten\").","Hamam ve lokanta gibi yerlerde tüketilen miktar önceden tartılmasa dahi örfe binaen akit caiz görülmüştür."],"category":"Örf"},{"id":"rule-37","articleNumber":37,"arabicTextWithHarakat":"اسْتِعْمَالُ النَّاسِ حُجَّةٌ يَجِبُ الْعَمَلُ بِهَا","turkishTitle":"İsti'mâlü'n-Nâsi Huccetün Yecibü'l-Amelü Bihâ","literalTranslation":"İnsanların kullanımı, amel edilmesi gereken bir delildir.","detailedExplanation":"Toplumda yerleşik uygulama, nass ile çelişmedikçe hüküm kaynağı olur.","practicalExamples":["Mübayaada kullanılan yaygın ölçü birimi esas alınır.","İstisnâ akdi, halkın uygulaması sebebiyle caiz görülmüştür."],"category":"Örf"},{"id":"rule-38","articleNumber":38,"arabicTextWithHarakat":"الْمُمْتَنِعُ عَادَةً كَالْمُمْتَنِعِ حَقِيقَةً","turkishTitle":"el-Mümtenîü Âdeten ke'l-Mümtenii Hakîkaten","literalTranslation":"Âdeten imkânsız olan, hakikaten imkânsız gibidir.","detailedExplanation":"Mümkün olsa da gerçekleşmesi âdeten düşünülemeyen durum, imkânsız sayılır.","practicalExamples":["Küçük çocuğun, yaşı itibariyle onun soyundan olduğunu iddia etmesi dinlenmez."],"category":"Örf"},{"id":"rule-39","articleNumber":39,"arabicTextWithHarakat":"لَا يُنْكَرُ تَغَيُّرُ الْأَحْكَامِ بِتَغَيُّرِ الْأَزْمَانِ","turkishTitle":"Lâ Yünkeru Teğayyürü'l-Ahkâmi bi-Teğayyüri'l-Ezmân","literalTranslation":"Zamanın değişmesiyle örfe ve maslahata dayalı hükümlerin değişmesi inkâr olunamaz.","detailedExplanation":"Dinin temel inanç ve ibadet esasları değişmez; ancak toplumun örfüne, maslahatına ve suiistimalleri önleme gayesine dayanan ictihadî hükümler zamanın ve şartların farklılaşmasıyla müçtehitler tarafından güncellenebilir.","practicalExamples":["Klasik dönemde Kur'an ve fıkıh öğretimi için ücret alınması caiz görülmezken, sonraki Hanefi fukahasının din hizmetlerinin aksamaması için ücrete cevaz vermesi.","Şahitlerin adalet araştırmasında ilk dönemde zahiri müslümanlık kafi görülürken, zamanla ahlakın zayıflaması sebebiyle gizli tezkiye şartının getirilmesi."],"category":"Örf"},{"id":"rule-40","articleNumber":40,"arabicTextWithHarakat":"الْحَقِيقَةُ تُتْرَكُ بِدَلَالَةِ الْعَادَةِ","turkishTitle":"el-Hakîketü Tütreku bi-Delâleti'l-Âde","literalTranslation":"Hakiki anlam, âdetin delâletiyle terk edilir.","detailedExplanation":"Örfte yerleşmiş anlam, sözün sözlük anlamının önüne geçer.","practicalExamples":["\"Et yemem\" diyenin, balık yemekle yemini bozmuş sayılmaması."],"category":"Örf"},{"id":"rule-41","articleNumber":41,"arabicTextWithHarakat":"إِنَّمَا تُعْتَبَرُ الْعَادَةُ إِذَا اطَّرَدَتْ أَوْ غَلَبَتْ","turkishTitle":"İnnemâ Tu'teberü'l-Âdetü İzâ't-Tarradet ev Galebet","literalTranslation":"Âdet ancak sürekli veya yaygın olduğunda itibar edilir.","detailedExplanation":"Ara sıra görülen bir davranış örf sayılmaz; yerleşik ve yaygın olması gerekir.","practicalExamples":["Bir yörede sürekli kullanılan para birimi akitlerde esas alınır.","Nadir görülen bir uygulama örf kabul edilmez."],"category":"Örf"},{"id":"rule-42","articleNumber":42,"arabicTextWithHarakat":"اَلْعِبْرَةُ لِلْغَالِبِ الشَّائِعِ لَا لِلنَّادِرِ","turkishTitle":"el-İbretü lil-Gâlibi'ş-Şâyi' Lâ lin-Nâdir","literalTranslation":"İtibar, yaygın ve galip olanadır; nâdir (seyrek) olana değildir.","detailedExplanation":"Hüküm verirken çoğunlukla görülen ve yaygın olan durum esas alınır, ender görülen istisnaî ihtimaller hükmün dayanağı yapılmaz. Bu kaide, âdet ve örf kaideleriyle (md. 36–45) birlikte çalışır.","practicalExamples":["Bir yerde yaygın olan uygulama ve ölçü esas alınır; ender görülen farklı bir uygulamaya göre hüküm kurulmaz.","Suyun genellikle temiz olması galiptir; nadiren kirlenmiş olabileceği ihtimaliyle temiz su terk edilmez."],"category":"Örf"},{"id":"rule-43","articleNumber":43,"arabicTextWithHarakat":"الْمَعْرُوفُ عُرْفًا كَالْمَشْرُوطِ شَرْطًا","turkishTitle":"el-Ma'rûfü Urfen ke'l-Meşrûti Şartan","literalTranslation":"Örfen bilinen şey, şart koşulmuş gibidir.","detailedExplanation":"Taraflar açıkça belirtmese de örfün gereği şart hükmündedir.","practicalExamples":["Kiralanan dükkânın bakımı örfe göre belirlenir.","Ücretli iş yaptıran, örfî ücreti ödemekle yükümlüdür."],"category":"Örf"},{"id":"rule-44","articleNumber":44,"arabicTextWithHarakat":"الْمَعْرُوفُ بَيْنَ التُّجَّارِ كَالْمَشْرُوطِ بَيْنَهُمْ","turkishTitle":"el-Ma'rûfü Beyne't-Tüccâr ke'l-Meşrûti Beynehüm","literalTranslation":"Tüccar arasında bilinen şey, aralarında şart koşulmuş gibidir.","detailedExplanation":"Ticaret erbabının yerleşik teamülü akitlerde açıkça yazılmasa da bağlayıcıdır.","practicalExamples":["Taşıma masrafının satıcıya ait olduğu yerleşik bir ticaret âdetidir."],"category":"Örf"},{"id":"rule-45","articleNumber":45,"arabicTextWithHarakat":"التَّعْيِينُ بِالْعُرْفِ كَالتَّعْيِينِ بِالنَّصِّ","turkishTitle":"et-Ta'yînü bi'l-Urfi ke't-Ta'yîni bi'n-Nass","literalTranslation":"Örfle belirleme, nassla belirleme gibidir.","detailedExplanation":"Nass ile çelişmeyen örf, nasa dayalı hüküm gibi bağlayıcıdır.","practicalExamples":["Müşterinin eve getirme masrafını satıcı yüklenmesi örfe bağlı hükümdür.","İstısnâ akdinde belirli sanatkâr işlerinin yaptırılması."],"category":"Örf"},{"id":"rule-46","articleNumber":46,"arabicTextWithHarakat":"إِذَا تَعَارَضَ الْمَانِعُ وَالْمُقْتَضِي يُقَدَّمُ الْمَانِعُ","turkishTitle":"İzâ Teârada'l-Mâni' ve'l-Muktezî Yükaddemü'l-Mâni'","literalTranslation":"Engel ile gerektiren sebep çatışırsa engel öne alınır.","detailedExplanation":"Hükmü gerektiren sebep varken onu engelleyen bir durum da bulunursa engel esas alınır.","practicalExamples":["Alacaklının hakkı olsa da borçlunun zaruret hâlinde ödemesi ertelenebilir."],"category":"Zaruret"},{"id":"rule-47","articleNumber":47,"arabicTextWithHarakat":"التَّابِعُ تَابِعٌ","turkishTitle":"et-Tâbi' Tâbi'","literalTranslation":"Tâbi olan şey tâbidir.","detailedExplanation":"Asıl şeyin hükmü, ona bağlı olanı da kapsar.","practicalExamples":["Satılan emzikli hayvanın yavrusu da satışa dâhildir.","Binanın satışı, ona bağlı kapı ve pencereleri de kapsar."],"category":"Küllî Kaide"},{"id":"rule-48","articleNumber":48,"arabicTextWithHarakat":"التَّابِعُ لَا يُفْرَدُ بِالْحُكْمِ","turkishTitle":"et-Tâbi' Lâ Yüfredü bi'l-Hükm","literalTranslation":"Tâbi olan şey tek başına hüküm almaz.","detailedExplanation":"Bağlı olan şey, aslından ayrı olarak ayrı bir hükme konu edilmez.","practicalExamples":["Hamile hayvanın karnındaki yavru ayrıca satılamaz."],"category":"Küllî Kaide"},{"id":"rule-49","articleNumber":49,"arabicTextWithHarakat":"مَنْ مَلَكَ شَيْئًا مَلَكَ مَا هُوَ مِنْ ضَرُورَاتِهِ","turkishTitle":"Men Meleke Şey'en Meleke Mâ Hüve min Darûrâtihî","literalTranslation":"Bir şeye malik olan, onun zorunlu gereklerine de malik olur.","detailedExplanation":"Mülkiyet, o şeyden yararlanmak için lâzım olan şeyleri de kapsar.","practicalExamples":["Evi satın alanın, eve giriş yolundan geçme hakkı da vardır."],"category":"Küllî Kaide"},{"id":"rule-50","articleNumber":50,"arabicTextWithHarakat":"إِذَا سَقَطَ الْأَصْلُ سَقَطَ الْفَرْعُ","turkishTitle":"İzâ Sakata'l-Aslü Sakata'l-Fer'","literalTranslation":"Asıl düşünce fer' de düşer.","detailedExplanation":"Asıl hak sona erdiğinde ona bağlı fer'î haklar da kalkar.","practicalExamples":["Asıl borç bağışlanırsa, kefilin sorumluluğu da kalkar."],"category":"Küllî Kaide"},{"id":"rule-51","articleNumber":51,"arabicTextWithHarakat":"السَّاقِطُ لَا يَعُودُ","turkishTitle":"es-Sâkıtü Lâ Yeûdü","literalTranslation":"Düşen hak geri dönmez.","detailedExplanation":"Sakıt olan bir hak, sonradan yeniden canlanmaz.","practicalExamples":["Alacağından vazgeçen alacaklı, sonra yeniden talep edemez."],"category":"Küllî Kaide"},{"id":"rule-52","articleNumber":52,"arabicTextWithHarakat":"إِذَا بَطَلَ الشَّيْءُ بَطَلَ مَا فِي ضِمْنِهِ","turkishTitle":"İzâ Batale'ş-Şey'ü Batale Mâ fî Dımnihî","literalTranslation":"Bir şey batıl olunca onun içinde bulunan da batıl olur.","detailedExplanation":"Esas akit geçersiz sayılınca, ona dâhil olan hükümler de geçersizleşir.","practicalExamples":["Satış akdi batıl olursa, içindeki ek şartlar da hükümsüzdür."],"category":"Küllî Kaide"},{"id":"rule-53","articleNumber":53,"arabicTextWithHarakat":"إِذَا بَطَلَ الْأَصْلُ يُصَارُ إِلَى الْبَدَلِ","turkishTitle":"İzâ Batale'l-Aslü Yusâru ile'l-Bedel","literalTranslation":"Asıl batıl olunca bedele geçilir.","detailedExplanation":"Asıl yerine getirilemiyorsa yerine geçen karşılığa başvurulur.","practicalExamples":["Su bulunamazsa abdest yerine teyemmüm yapılır.","Mal telef olursa bedeli tazmin edilir."],"category":"Küllî Kaide"},{"id":"rule-54","articleNumber":54,"arabicTextWithHarakat":"يُغْتَفَرُ فِي التَّوَابِعِ مَا لَا يُغْتَفَرُ فِي غَيْرِهَا","turkishTitle":"Yuğteferu fi't-Tevâbi' Mâ Lâ Yuğteferu fî Ğayrihâ","literalTranslation":"Tâbilerde, başkalarında bağışlanmayan şey bağışlanır.","detailedExplanation":"Asıl için aranan şartlar, ona bağlı olanlar için gevşetilebilir.","practicalExamples":["Hamile hayvanın yavrusundaki belirsizlik, asıl satışta göz ardı edilir."],"category":"Küllî Kaide"},{"id":"rule-55","articleNumber":55,"arabicTextWithHarakat":"يُغْتَفَرُ فِي الْبَقَاءِ مَا لَا يُغْتَفَرُ فِي الِابْتِدَاءِ","turkishTitle":"Yuğteferu fi'l-Bekâ'i Mâ Lâ Yuğteferu fi'l-İbtidâ'","literalTranslation":"Devam hâlinde, başlangıçta bağışlanmayan şey bağışlanır.","detailedExplanation":"Bir hukukî durumun kurulabilmesi için aranan şartlar, o durumun devamı için aynı sıkılıkta aranmaz. Başlangıçta engel olacak bir eksiklik, işlem kurulduktan sonra ortaya çıkarsa devam eden işlemi bozmayabilir.","practicalExamples":["Ortak bir malın payını ortak olmayan birine kiralamak sahih değildir (md. 429); ancak icâreden sonra ortaya çıkan ortaklık akdi bozmaz. Evini kiraya veren kimsenin evinin yarısına bir hak sahibi çıksa, icâre kalan yarı için devam eder (md. 430)."],"category":"Küllî Kaide"},{"id":"rule-56","articleNumber":56,"arabicTextWithHarakat":"اَلْبَقَاءُ أَسْهَلُ مِنَ الِابْتِدَاءِ","turkishTitle":"el-Bekâü Eshelü mine'l-İbtidâ'","literalTranslation":"Devam etmek, başlamaktan daha kolaydır.","detailedExplanation":"Bir hâlin devamı için gereken şartlar, o hâlin başlaması için gereken şartlardan daha hafiftir. Bu kaide md. 55 ile aynı mantığa dayanır.","practicalExamples":["Nikâh akdinde şahitlerin akit sırasında hazır bulunması şarttır; sonradan şahitlerin ölmesi veya kaybolması evliliğin devamına zarar vermez.","Mest, tam abdestli iken giyilmelidir; ancak giyildikten sonra abdest bozulsa da mesh süresi boyunca meshe devam edilebilir."],"category":"Küllî Kaide"},{"id":"rule-57","articleNumber":57,"arabicTextWithHarakat":"لَا يَتِمُّ التَّبَرُّعُ إِلَّا بِالْقَبْضِ","turkishTitle":"Lâ Yetimmü't-Teberrû'u İllâ bi'l-Kabz","literalTranslation":"Bağış, teslim alma ile tamamlanır.","detailedExplanation":"Karşılıksız tasarruf, mülkiyetin geçmesi için kabzı şart koşar.","practicalExamples":["Hibe edilen mal, teslim alınmadıkça mülkiyet geçmez."],"category":"Küllî Kaide"},{"id":"rule-58","articleNumber":58,"arabicTextWithHarakat":"تَصَرُّفُ الْإِمَامِ عَلَى الرَّعِيَّةِ مَنُوطٌ بِالْمَصْلَحَةِ","turkishTitle":"Tasarrufü'l-İmâm alâ'r-Raiyyeti Menûtun bi'l-Maslaha","literalTranslation":"Yöneticinin halk üzerindeki tasarrufu maslahata bağlıdır.","detailedExplanation":"Devlet başkanı ve yöneticiler kamu yararına aykırı karar veremez.","practicalExamples":["Beytülmalin gelirleri keyfî değil, maslahat gözetilerek harcanır."],"category":"Küllî Kaide"},{"id":"rule-59","articleNumber":59,"arabicTextWithHarakat":"الْوِلَايَةُ الْخَاصَّةُ أَقْوَى مِنَ الْوِلَايَةِ الْعَامَّةِ","turkishTitle":"el-Velâyetü'l-Hâssa Akvâ mine'l-Velâyeti'l-Âmme","literalTranslation":"Özel velâyet, genel velâyetten güçlüdür.","detailedExplanation":"Belirli kişiye tanınan yetki, genel yetkiyi geri plana iter.","practicalExamples":["Küçüğün malında babanın yetkisi, kadının yetkisinden önce gelir."],"category":"Küllî Kaide"},{"id":"rule-60","articleNumber":60,"arabicTextWithHarakat":"إِعْمَالُ الْكَلَامِ أَوْلَى مِنْ إِهْمَالِهِ","turkishTitle":"İ'mâlü'l-Kelâm Evlâ min İhmâlihî","literalTranslation":"Sözü uygulamak, onu hükümsüz bırakmaktan evlâdır.","detailedExplanation":"Bir ifadeye mümkünse bir mânâ verilmeli; boşa çıkarılmamalı.","practicalExamples":["Vakıf şartlarında belirsiz ifadeye mümkün olan anlam verilir.","Belirsiz bir vasiyet ibaresi, geçerli kılacak şekilde yorumlanır."],"category":"Küllî Kaide"},{"id":"rule-61","articleNumber":61,"arabicTextWithHarakat":"إِذَا تَعَذَّرَتِ الْحَقِيقَةُ يُصَارُ إِلَى الْمَجَازِ","turkishTitle":"İzâ Teazzeret'il-Hakîketü Yusâru ile'l-Mecâz","literalTranslation":"Hakiki anlam imkânsız olunca mecaza gidilir.","detailedExplanation":"Sözün gerçek anlamı mümkün değilse, anlamlı en yakın mecazî mânâ esas alınır.","practicalExamples":["\"Bu buğdayı yemem\" diyen, ondan yapılan ekmeği yerse yemini bozar."],"category":"Küllî Kaide"},{"id":"rule-62","articleNumber":62,"arabicTextWithHarakat":"إِذَا تَعَذَّرَ إِعْمَالُ الْكَلَامِ يُهْمَلُ","turkishTitle":"İzâ Teazzera İ'mâlü'l-Kelâmi Yühmel","literalTranslation":"Sözü uygulamak imkânsızsa hükümsüz bırakılır.","detailedExplanation":"Hiçbir anlam verilemeyen ifade hukuki sonuç doğurmaz.","practicalExamples":["Anlamsız ve çelişkili bir ikrar hükümsüzdür."],"category":"Küllî Kaide"},{"id":"rule-63","articleNumber":63,"arabicTextWithHarakat":"ذِكْرُ بَعْضِ مَا لَا يَتَجَزَّأُ كَذِكْرِ كُلِّهِ","turkishTitle":"Zikrü Ba'dı Mâ Lâ Yetecezzeü ke-Zikrihî Küllihî","literalTranslation":"Bölünmeyen şeyin bir kısmını anmak, tamamını anmak gibidir.","detailedExplanation":"Parçalanması mümkün olmayan konuda kısmî beyan bütünü kapsar.","practicalExamples":["Boşamada \"yarım talâk\" demek tam talâk sayılır."],"category":"Küllî Kaide"},{"id":"rule-64","articleNumber":64,"arabicTextWithHarakat":"الْمُطْلَقُ يَجْرِي عَلَى إِطْلَاقِهِ مَا لَمْ يَقُمْ دَلِيلُ التَّقْيِيدِ نَصًّا أَوْ دَلَالَةً","turkishTitle":"el-Mutlaku Yecrî alâ İtlâkıhî Mâ Lem Yekum Delîlü't-Takyîd","literalTranslation":"Mutlak olan, kayıt delili gelmedikçe mutlak olarak uygulanır.","detailedExplanation":"Kayıtsız ifade, kayıt koyan delil bulunmadıkça genel anlamda anlaşılır.","practicalExamples":["Vekâlette sınır konmamışsa vekil, olağan şartlarda dilediği gibi satış yapabilir."],"category":"Küllî Kaide"},{"id":"rule-65","articleNumber":65,"arabicTextWithHarakat":"اَلْوَصْفُ فِي الْحَاضِرِ لَغْوٌ وَفِي الْغَائِبِ مُعْتَبَرٌ","turkishTitle":"el-Vasfü fi'l-Hâzır Lağvun ve fi'l-Gâibi Mu'teber","literalTranslation":"Hazır olan şeyde vasıf lağvdır (hükümsüzdür), gâib olanda ise muteberdir.","detailedExplanation":"Gözün önündeki, işaretle gösterilen şey işaretle belirlendiği için onun hakkında söylenen vasıf, malın tayininde hüküm doğurmaz. Gâib (mevcut olmayan veya görülmeyen) şey ise ancak vasıflarıyla tanındığından, vasıf muteber sayılır. Cinsi değiştiren vasıf farklıdır: işaret edilen şey belirtilen cinsten çıkmazsa akit bâtıl olur.","practicalExamples":["Hazır bir malı göstererek satan kimsenin o mal hakkında söylediği vasıf, akdin konusunu belirlemede hükümsüzdür; muhayyerlik hükümleri saklıdır.","Gâib bir mal ise belirtilen cins ve vasıflarıyla satılır; vasfa uymazsa alıcı muhayyer olur (md. 310).","Elmas diye cam satılırsa cins değiştiğinden satış bâtıldır (md. 208)."],"category":"Küllî Kaide"},{"id":"rule-66","articleNumber":66,"arabicTextWithHarakat":"السُّؤَالُ مُعَادٌ فِي الْجَوَابِ","turkishTitle":"es-Sü'âlü Muâdün fi'l-Cevâb","literalTranslation":"Soru, cevabın içinde tekrarlanmış sayılır.","detailedExplanation":"Cevap, sorunun anlamını içerdiğinden soruyla birlikte okunur.","practicalExamples":["\"Borcun var mı?\" sorusuna \"evet\" diyen, borcunu ikrar etmiş olur."],"category":"Küllî Kaide"},{"id":"rule-67","articleNumber":67,"arabicTextWithHarakat":"لَا يُنْسَبُ إِلَى سَاكِتٍ قَوْلٌ لَكِنَّ السُّكُوتَ فِي مَعْرِضِ الْحَاجَةِ بَيَانٌ","turkishTitle":"Lâ Yünsebü ilâ Sâkitin Kavlün Lâkinne's-Sükûte fî Ma'ridi'l-Hâceti Beyân","literalTranslation":"Sükût edene söz isnat edilmez; ama konuşmanın gerektiği yerde sükût beyandır.","detailedExplanation":"Kural olarak susmak rıza/ret sayılmaz; fakat konuşulması gereken durumda susmak onay sayılır.","practicalExamples":["Bakire kızın nikâh teklifinde susması rıza sayılır.","Mal satılırken sahibi susarak seyrediyorsa itiraz hakkını kaybeder."],"category":"Küllî Kaide"},{"id":"rule-68","articleNumber":68,"arabicTextWithHarakat":"دَلِيلُ الشَّيْءِ فِي الْأُمُورِ الْبَاطِنَةِ يَقُومُ مَقَامَهُ","turkishTitle":"Delîlü'ş-Şey'i fi'l-Umûri'l-Bâtıneti Yekûmü Makâmehû","literalTranslation":"Gizli (iç) işlerde, şeyin delili onun yerine geçer.","detailedExplanation":"Kalbî olup doğrudan bilinemeyen hususlarda, o şeyi gösteren açık alamet hükümde onun yerine kabul edilir.","practicalExamples":["Satışın aslı tarafların rızasıdır. Rıza kalbî bir iş olduğundan icâb ve kabul onun yerine geçer (md. 175'te bu maddeye atıf yapılır).","Meşakkat gizli bir durumdur; sefer, meşakkatin yerine geçtiği için yolcu fiilen zorluk çekmese de ruhsatlardan yararlanır."],"category":"Deliller"},{"id":"rule-69","articleNumber":69,"arabicTextWithHarakat":"الْكِتَابُ كَالْخِطَابِ","turkishTitle":"el-Kitâbü ke'l-Hıtâb","literalTranslation":"Yazı, konuşma gibidir.","detailedExplanation":"Gönderilen mektup ve yazılı beyan, sözlü beyan hükmündedir.","practicalExamples":["Mektupla gönderilen icâb, kabul edilirse akit kurulur."],"category":"Küllî Kaide"},{"id":"rule-70","articleNumber":70,"arabicTextWithHarakat":"الْإِشَارَاتُ الْمَعْهُودَةُ لِلْأَخْرَسِ كَالْبَيَانِ بِاللِّسَانِ","turkishTitle":"el-İşârâtü'l-Ma'hûde li'l-Ahres ke'l-Beyâni bi'l-Lisân","literalTranslation":"Dilsizin bilinen işaretleri, dille beyan gibidir.","detailedExplanation":"Konuşamayan kişinin alışılmış işaretleri sözlü açıklama hükmündedir.","practicalExamples":["Dilsizin işaretle yaptığı satış ve nikâh geçerlidir."],"category":"Örf"},{"id":"rule-71","articleNumber":71,"arabicTextWithHarakat":"يُقْبَلُ قَوْلُ الْمُتَرْجِمِ مُطْلَقًا","turkishTitle":"Yukbelü Kavlü'l-Mütercimi Mutlakan","literalTranslation":"Tercümanın sözü mutlak olarak kabul edilir.","detailedExplanation":"Bir kimsenin sözünü diğer tarafa aktaran tercümanın beyanı, şahitlikte aranan şartlar aranmaksızın kabul edilir. Çünkü tercüman olmadan farklı dil konuşan taraflar anlaşamaz. Doğruluğundan açıkça şüphe edilen tercümanın sözü esas alınmaz.","practicalExamples":["Mahkemede Türkçe bilmeyen bir kimsenin ikrarı, tercümanın aktarımıyla hâkime ulaşır ve ikrar sabit olur.","Farklı dil konuşan iki tarafın icâb ve kabulü tercüman aracılığıyla bildirilirse, tercümanın aktardığı söz esas alınır."],"category":"Deliller"},{"id":"rule-72","articleNumber":72,"arabicTextWithHarakat":"لَا عِبْرَةَ بِالظَّنِّ الْبَيِّنِ خَطَؤُهُ","turkishTitle":"Lâ İbrete bi'z-Zanni'l-Beyyini Hata'ühû","literalTranslation":"Hatâsı açıkça anlaşılan zanna itibar edilmez.","detailedExplanation":"Bir kimsenin sahip olduğu zan, sonradan yanlış olduğu açıkça ortaya çıkarsa hukukî sonuç doğurmaz. Yanlış zanna dayanan işlemin sonucu geri alınır.","practicalExamples":["Borcu olduğunu zanneden bir kimse ödeme yapar, sonra borcunun olmadığı anlaşılırsa ödediğini geri alır.","Mirasçı olduğunu zannederek bir mala sahip gibi davranan kişi, mirasçı olmadığı anlaşılınca bu zanna dayanarak hak ileri süremez."],"category":"Deliller"},{"id":"rule-73","articleNumber":73,"arabicTextWithHarakat":"لَا حُجَّةَ مَعَ الِاحْتِمَالِ النَّاشِئِ عَنْ دَلِيلٍ","turkishTitle":"Lâ Huccete me'a'l-İhtimâli'n-Nâşi' an Delîl","literalTranslation":"Delilden doğan ihtimal varken kesin hüküm olmaz.","detailedExplanation":"Dayanaklı bir ihtimal bulunduğunda tek yönlü kesin delil sayılmaz.","practicalExamples":["Şahitlerin ifadesi çelişiyorsa o ifadeye göre hüküm verilmez."],"category":"Deliller"},{"id":"rule-74","articleNumber":74,"arabicTextWithHarakat":"لَا عِبْرَةَ لِلتَّوَهُّمِ","turkishTitle":"Lâ İbrete li't-Tevehhüm","literalTranslation":"Vehme itibar edilmez.","detailedExplanation":"Kuvvetli delile dayanmayan zayıf ihtimale göre hüküm verilmez.","practicalExamples":["Suyun necis olabileceği vehmiyle temiz su terk edilmez."],"category":"Küllî Kaide"},{"id":"rule-75","articleNumber":75,"arabicTextWithHarakat":"الثَّابِتُ بِالْبُرْهَانِ كَالثَّابِتِ بِالْعِيَانِ","turkishTitle":"es-Sâbitü bi'l-Burhân ke's-Sâbiti bi'l-İyân","literalTranslation":"Delille sabit olan, gözle görülen gibidir.","detailedExplanation":"Mahkemede delille ispat edilen hâl, bizzat görülmüş gibi hüküm doğurur.","practicalExamples":["İspatla sabit olan borç, kâdının huzurunda itiraf edilmiş gibidir."],"category":"Deliller"},{"id":"rule-76","articleNumber":76,"arabicTextWithHarakat":"الْبَيِّنَةُ عَلَى الْمُدَّعِي وَالْيَمِينُ عَلَى مَنْ أَنْكَرَ","turkishTitle":"el-Beyyinetü ale'l-Müddeî ve'l-Yemînü alâ Men Enkera","literalTranslation":"Delil getirmek iddia edene, yemin etmek inkâr edene düşer.","detailedExplanation":"Kazâ hukukunun temel ilkesi: iddia eden ispat eder, aksi hâlde davalı yemin eder.","practicalExamples":["Borç iddiasında davacı şahit getiremezse davalıdan yemin istenir.","Taşınmaz mülkiyeti iddiasında davacı delil sunmakla yükümlüdür."],"category":"Deliller"},{"id":"rule-77","articleNumber":77,"arabicTextWithHarakat":"الْبَيِّنَةُ لِإِثْبَاتِ خِلَافِ الظَّاهِرِ وَالْيَمِينُ لِإِبْقَاءِ الْأَصْلِ","turkishTitle":"el-Beyyinetü li-İsbâti Hilâfi'z-Zâhir ve'l-Yemînü li-İbkâi'l-Asl","literalTranslation":"Delil zâhirin aksini ispat için, yemin asıl durumu korumak içindir.","detailedExplanation":"Zâhire aykırı iddia eden delil getirir; asıl durumu savunan yemin eder.","practicalExamples":["Muhtaç kişinin zengin olduğunu iddia eden, bunu ispatlamalıdır."],"category":"Deliller"},{"id":"rule-78","articleNumber":78,"arabicTextWithHarakat":"الْإِقْرَارُ حُجَّةٌ قَاصِرَةٌ","turkishTitle":"el-İkrâru Huccetün Kâsıra","literalTranslation":"İkrar, kısıtlı bir delildir.","detailedExplanation":"İkrar yalnızca ikrar edenin aleyhine geçerlidir; başkasını bağlamaz.","practicalExamples":["Ortağın borç ikrarı, diğer ortağın payını bağlamaz."],"category":"Deliller"},{"id":"rule-79","articleNumber":79,"arabicTextWithHarakat":"الْمَرْءُ مُؤَاخَذٌ بِإِقْرَارِهِ","turkishTitle":"el-Mer'ü Müâhazun bi-İkrârihî","literalTranslation":"İnsan, ikrarından sorumludur.","detailedExplanation":"Kişi kendi aleyhine yaptığı açık beyanla bağlanır.","practicalExamples":["Borcunu kabul eden, sonradan dönse de bundan sorumlu tutulur."],"category":"Deliller"},{"id":"rule-80","articleNumber":80,"arabicTextWithHarakat":"لَا حُجَّةَ مَعَ التَّنَاقُضِ لَكِنْ لَا يَخْتَلُّ مَعَهُ حُكْمُ الْحَاكِمِ","turkishTitle":"Lâ Hüccete me'a't-Tenâkuz Lâkin Lâ Yahtellü Meahû Hükmü'l-Hâkim","literalTranslation":"Çelişki varken delil olmaz; ancak (sonradan ortaya çıkan) çelişki hâkimin hükmünü bozmaz.","detailedExplanation":"Bir davada kişinin sözleri birbiriyle çelişirse o söz hüccet olmaz ve iddiası dinlenmez. Ancak hâkim hükmünü verdikten sonra çelişki ortaya çıksa bile verilmiş hüküm bozulmaz; hukukî istikrar korunur.","practicalExamples":["Bir malın başkasına ait olduğunu söyleyen kimse, sonra aynı malı kendi mülkü diye dava ederse, sözleri çeliştiği için davası dinlenmez.","Hâkim hükmünü verdikten sonra davacının önceki sözleriyle çeliştiği anlaşılsa da verilmiş hüküm bozulmaz."],"category":"Deliller"},{"id":"rule-81","articleNumber":81,"arabicTextWithHarakat":"قَدْ يَثْبُتُ الْفَرْعُ مَعَ عَدَمِ ثُبُوتِ الْأَصْلِ","turkishTitle":"Kad Yesbütü'l-Fer'u me'a Adem-i Sübûti'l-Asl","literalTranslation":"Bazen asıl sabit olmadığı hâlde fer' sabit olur.","detailedExplanation":"Genel kural, aslın fer'ine ön şart olmasıdır. Ancak bazı hâllerde fer', kendi sebebiyle sabit olur ve asıl ispatlanamasa da hüküm doğurur. Bu madde md. 49–54'teki tabiiyet kaidelerine bir istisna niteliğindedir.","practicalExamples":["Bir kimse, falanın falanda alacağı olduğunu söyleyip ona kefil olduğunu ikrar etse; asıl borç ispatlanamasa bile kefil, kendi ikrarı sebebiyle kefâletten sorumlu tutulur."],"category":"Küllî Kaide"},{"id":"rule-82","articleNumber":82,"arabicTextWithHarakat":"الْمُعَلَّقُ بِالشَّرْطِ يَجِبُ ثُبُوتُهُ عِنْدَ ثُبُوتِ الشَّرْطِ","turkishTitle":"el-Muallaku bi'ş-Şart Yecibü Sübûtühû İnde Sübûti'ş-Şart","literalTranslation":"Şarta bağlanan şey, şart gerçekleşince sabit olur.","detailedExplanation":"Bağlı olduğu şart olmadan hüküm doğmaz; şart gerçekleşince doğar.","practicalExamples":["\"Eve girersen boş ol\" denmişse boşama girişte vâki olur."],"category":"Küllî Kaide"},{"id":"rule-83","articleNumber":83,"arabicTextWithHarakat":"يَلْزَمُ مُرَاعَاةُ الشَّرْطِ بِقَدْرِ الْإِمْكَانِ","turkishTitle":"Yelzemü Murâatü'ş-Şarti bi-Kadri'l-İmkân","literalTranslation":"Şarta imkân ölçüsünde riayet etmek gerekir.","detailedExplanation":"Akit ve tasarruflarda konulan şartlara, şeriata ve akdin gereğine aykırı olmadıkça, yerine getirilebildiği ölçüde uyulması gerekir. Taraflar, şartlara riayet edeceklerine güvenerek anlaşmışlardır.","practicalExamples":["Vefâen satılan bağın gelirinin satıcı ile alıcı arasında yarı yarıya paylaşılması şartı geçerlidir ve buna uyulur (md. 398).","Giysiyi \"bugün bitirmek şartıyla\" terziye veren kimsede, terzi şarta uyarsa belirlenen ücreti hak eder; uymazsa belirlenen ücreti aşmamak üzere emsal ücreti hak eder (md. 505)."],"category":"Küllî Kaide"},{"id":"rule-84","articleNumber":84,"arabicTextWithHarakat":"اَلْمَوَاعِيدُ بِصُوَرِ التَّعَالِيقِ تَكُونُ لَازِمَةً","turkishTitle":"el-Mevâ'îdü bi-Suveri't-Teâlîki Tekûnü Lâzime","literalTranslation":"Vaadler, ta'lîk (şarta bağlama) sûretinde yapılırsa bağlayıcı olur.","detailedExplanation":"Mücerred bir vaad kural olarak bağlayıcı değildir. Ancak vaad bir şarta bağlanarak yapılırsa, içinde taahhüt ve ilzam anlamı ortaya çıktığı için bağlayıcı hâle gelir.","practicalExamples":["\"Falan sana borcunu vermezse ben veririm\" diyen kimsenin sözü kefâlet olur; borçlu ödemezse alacaklı kefilden isteyebilir (md. 623).","\"Falan malını çalarsa ben öderim\" sözü geçerli bir kefâlettir; hırsızlık sabit olunca kefil sorumlu olur (md. 636)."],"category":"Küllî Kaide"},{"id":"rule-85","articleNumber":85,"arabicTextWithHarakat":"الْخَرَاجُ بِالضَّمَانِ","turkishTitle":"el-Harâcu bi'd-Damân","literalTranslation":"Gelir, tazmin yükünün karşılığıdır.","detailedExplanation":"Bir malın hasar riskini taşıyan, onun gelirinden de yararlanır.","practicalExamples":["Satın alınan hayvanın sütü, ayıp sebebiyle iade edilse bile alıcıya aittir."],"category":"Küllî Kaide"},{"id":"rule-86","articleNumber":86,"arabicTextWithHarakat":"الْأَجْرُ وَالضَّمَانُ لَا يَجْتَمِعَانِ","turkishTitle":"el-Ecrü ve'd-Damânü Lâ Yectemiâni","literalTranslation":"Ücret ile tazmin bir araya gelmez.","detailedExplanation":"Ücret alınarak kullanılan malda, emanet olmadığından ayrıca tazmin gerekmez.","practicalExamples":["Kiralık eşyada kusursuz telef olursa kiracı tazmin etmez."],"category":"Küllî Kaide"},{"id":"rule-87","articleNumber":87,"arabicTextWithHarakat":"الْغُرْمُ بِالْغُنْمِ","turkishTitle":"el-Gurmü bi'l-Ğunm","literalTranslation":"Kâr, zarara katlanmanın karşılığıdır.","detailedExplanation":"Bir şeyin faydasından yararlanan, külfetine de katlanır.","practicalExamples":["Ortak mülkün bakım masrafı, gelirden yararlanan ortaklara ait olur."],"category":"Küllî Kaide"},{"id":"rule-88","articleNumber":88,"arabicTextWithHarakat":"النِّعْمَةُ بِقَدْرِ النِّقْمَةِ وَالنِّقْمَةُ بِقَدْرِ النِّعْمَةِ","turkishTitle":"en-Ni'metü bi-Kadri'n-Nik'ma ve'n-Nik'metü bi-Kadri'n-Ni'ma","literalTranslation":"Nimet külfet kadardır, külfet de nimet kadardır.","detailedExplanation":"Bir şeyden yararlanma miktarıyla ona katlanma miktarı denge içindedir.","practicalExamples":["Kiracı, kullandığı dükkânın günlük bakım masraflarını öder."],"category":"Küllî Kaide"},{"id":"rule-89","articleNumber":89,"arabicTextWithHarakat":"يُضَافُ الْفِعْلُ إِلَى الْفَاعِلِ لَا الْآمِرِ مَا لَمْ يَكُنْ مُجْبِرًا","turkishTitle":"Yudâfu'l-Fi'lü ile'l-Fâili Lâ'l-Âmir Mâ Lem Yekün Mücbiren","literalTranslation":"Fiil, zorlayıcı olmadıkça emredene değil işleyene nispet edilir.","detailedExplanation":"Zararı veren, emir almış olsa da sorumlu olur; emreden ise zorlamışsa sorumlu tutulur.","practicalExamples":["Birinin emriyle başkasının malını telef eden, zararı öder."],"category":"Küllî Kaide"},{"id":"rule-90","articleNumber":90,"arabicTextWithHarakat":"إِذَا اجْتَمَعَ الْمُبَاشِرُ وَالْمُتَسَبِّبُ أُضِيفَ الْحُكْمُ إِلَى الْمُبَاشِرِ","turkishTitle":"İzâ İctemea'l-Mübâşir ve'l-Mütesebbib Udîfe'l-Hükmü ile'l-Mübâşir","literalTranslation":"Doğrudan işleyen ile sebep olan birleşirse hüküm doğrudan işleyene yüklenir.","detailedExplanation":"Zararı doğrudan veren, dolaylı sebep olandan önce sorumlu tutulur.","practicalExamples":["Kuyuyu kazanla itip düşüren birinde sorumluluk iteceğe aittir."],"category":"Küllî Kaide"},{"id":"rule-91","articleNumber":91,"arabicTextWithHarakat":"الْجَوَازُ الشَّرْعِيُّ يُنَافِي الضَّمَانَ","turkishTitle":"el-Cevâzü'ş-Şer'î Yünâfi'd-Damân","literalTranslation":"Şer'an caiz olan fiil, tazmini gerektirmez.","detailedExplanation":"Hakkını kullanan kimse, bunun sonucunda doğan zarardan sorumlu tutulmaz.","practicalExamples":["Kendi arazisinde kazdığı kuyuya düşen hayvan için mal sahibi sorumlu olmaz.","Meşru müdafaada saldırganı yaralayan tazminat ödemez."],"category":"Küllî Kaide"},{"id":"rule-92","articleNumber":92,"arabicTextWithHarakat":"الْمُبَاشِرُ ضَامِنٌ وَإِنْ لَمْ يَتَعَمَّدْ","turkishTitle":"el-Mübâşir Dâmin ve İn Lem Yeteammed","literalTranslation":"Fiili bizzat işleyen, kastetmese de tazminle yükümlüdür.","detailedExplanation":"Zararı doğrudan veren kişi kusuru olmasa da tazmin eder; sebep olan ise kusurluysa.","practicalExamples":["Yanlışlıkla başkasının bardağını kıran, bedelini öder.","Dikkatsizce araç kullanıp zarar veren, zararı tazmin eder."],"category":"Küllî Kaide"},{"id":"rule-93","articleNumber":93,"arabicTextWithHarakat":"الْمُتَسَبِّبُ لَا يَضْمَنُ إِلَّا بِالتَّعَدِّي","turkishTitle":"el-Mütesebbibü Lâ Yadmenü İllâ bi't-Teaddî","literalTranslation":"Sebep olan, ancak haddi aşarsa tazmin eder.","detailedExplanation":"Dolaylı zarar vericinin sorumluluğu kusur veya tecavüz şartına bağlıdır.","practicalExamples":["Yola kuyu kazan kimse, hakkı olmayan yerde kazdıysa düşen hayvanı tazmin eder."],"category":"Küllî Kaide"},{"id":"rule-94","articleNumber":94,"arabicTextWithHarakat":"جِنَايَةُ الْعَجْمَاءِ جُبَارٌ","turkishTitle":"Cinâyetü'l-Acmâi Cübâr","literalTranslation":"Hayvanın verdiği zarar hederdir.","detailedExplanation":"Sahibi kusursuz iken hayvanın verdiği zarar tazmin gerektirmez.","practicalExamples":["Kendi hâlinde duran hayvanın tekmesiyle olan zarar tazminsizdir."],"category":"Küllî Kaide"},{"id":"rule-95","articleNumber":95,"arabicTextWithHarakat":"الْأَمْرُ بِالتَّصَرُّفِ فِي مِلْكِ الْغَيْرِ بَاطِلٌ","turkishTitle":"el-Emru bi't-Tesarrufi fî Mülki'l-Ğayri Bâtıl","literalTranslation":"Başkasının malında tasarrufu emretmek geçersizdir.","detailedExplanation":"Mülkü sahibinin dışında kimse tasarruf konusunda yetki veremez.","practicalExamples":["Başkasının evini yıkmasını emreden, emriyle sorumluluktan kurtulamaz."],"category":"Küllî Kaide"},{"id":"rule-96","articleNumber":96,"arabicTextWithHarakat":"لَا يَجُوزُ لِأَحَدٍ أَنْ يَتَصَرَّفَ فِي مِلْكِ الْغَيْرِ بِلَا إِذْنِهِ","turkishTitle":"Lâ Yecûzü li-Ehadin en Yetesarrafe fî Mülki'l-Ğayri bilâ İznihî","literalTranslation":"Hiç kimse, başkasının malında izni olmaksızın tasarruf edemez.","detailedExplanation":"Mülkiyet hakkı korunur; izinsiz kullanma ve devir yasaktır.","practicalExamples":["Başkasının arabasını izinsiz kullanmak caiz değildir.","İzinsiz yapılan satış, malikin icâzetine bağlıdır."],"category":"Küllî Kaide"},{"id":"rule-97","articleNumber":97,"arabicTextWithHarakat":"لَا يَجُوزُ لِأَحَدٍ أَنْ يَأْخُذَ مَالَ أَحَدٍ بِلَا سَبَبٍ شَرْعِيٍّ","turkishTitle":"Lâ Yecûzü li-Ehadin en Ye'huze Mâle Ehadin bilâ Sebebin Şer'î","literalTranslation":"Hiç kimse, şer'î sebep olmadan başkasının malını alamaz.","detailedExplanation":"Mülkiyetin geçmesi için meşru bir sebep şarttır.","practicalExamples":["Hile ile alınan mal, sahibine geri verilir."],"category":"Küllî Kaide"},{"id":"rule-98","articleNumber":98,"arabicTextWithHarakat":"تَبَدُّلُ سَبَبِ الْمِلْكِ قَائِمٌ مَقَامَ تَبَدُّلِ الذَّاتِ","turkishTitle":"Tebeddülü Sebebi'l-Mülki Kâimün Makâme Tebeddüli'z-Zât","literalTranslation":"Mülkiyet sebebinin değişmesi, malın kendisinin değişmesi yerine geçer.","detailedExplanation":"Aynı mal, mülkiyetin kazanılma sebebi değişince hükmen başka bir mal gibi kabul edilir. Önceki mülkiyetin hükmü, yeni sebeple edinilen mülkiyete taşınmaz.","practicalExamples":["Hz. Peygamber ﷺ, Berîre'ye sadaka olarak verilen etin kendisine hediye edilmesi üzerine, \"O ona sadakadır, bize ise hediyedir\" buyurmuştur (Buhârî, Müslim).","Zekât olarak fakire verilen mal, fakirin mülkü olduktan sonra onu zengine satması veya hediye etmesi hâlinde zengine helâl olur."],"category":"Küllî Kaide"},{"id":"rule-99","articleNumber":99,"arabicTextWithHarakat":"مَنِ اسْتَعْجَلَ الشَّيْءَ قَبْلَ أَوَانِهِ عُوقِبَ بِحِرْمَانِهِ","turkishTitle":"Men İsteceale'ş-Şey'e Kable Evânihî Ûkıbe bi-Hırmânihî","literalTranslation":"Bir şeyi vaktinden önce isteyen, mahrum bırakılarak cezalandırılır.","detailedExplanation":"Hakkı vadesi gelmeden zorla almaya çalışan, o haktan yoksun bırakılabilir.","practicalExamples":["Mirasçının murisini öldürmesi hâlinde mirastan mahrum olması."],"category":"Küllî Kaide"},{"id":"rule-100","articleNumber":100,"arabicTextWithHarakat":"مَنْ سَعَى فِي نَقْضِ مَا تَمَّ مِنْ جِهَتِهِ فَسَعْيُهُ مَرْدُودٌ عَلَيْهِ","turkishTitle":"Men Seâ fî Nakdi Mâ Temme min Cihetihî Fesa'yühû Merdûdün Aleyhi","literalTranslation":"Kendi tarafından tamamlanan işi bozmaya çalışanın çabası boşunadır.","detailedExplanation":"Bir işi bizzat tamamlayan kimse, sonradan aksini iddia edemez.","practicalExamples":["Bir malı satan kimse, sonradan \"satmadım\" diyemez.","Borcu ikrar eden, sonradan inkâr edemez."],"category":"Küllî Kaide"}];
var kvOn=false,kvCat="all";
function kvTerms(r){
  var T=" "+fold(r.turkishTitle+" "+r.literalTranslation+" "+r.detailedExplanation+" "+r.practicalExamples.join(" "))+" ",out=[];
  GL.forEach(function(g,i){var n=fold(String(g[0]).replace(/\(.*?\)/g,""));if(n.length>=5&&out.length<8&&T.indexOf(" "+n)>=0)out.push(i)});
  return out;
}
function kvCard(r){
  var tm=kvTerms(r);
  return'<article class="kd-art kv-c"><div class="kv-top"><span class="kv-tg">'+esc(r.category)+'</span>'+(r.articleNumber?'<span class="kv-no">Mecelle md. '+r.articleNumber+'</span>':'')+'</div><div class="kv-ar" dir="rtl">'+esc(r.arabicTextWithHarakat)+'</div><h3>'+esc(r.turkishTitle)+'</h3><p class="kv-lit">'+esc(r.literalTranslation)+'</p><p>'+esc(r.detailedExplanation)+'</p><h4>Örnekler</h4><ul>'+r.practicalExamples.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>'+(tm.length?'<h4>Sözlükte ilgili terimler</h4><div class="kv-tl">'+tm.map(function(i){return'<button data-a="glt" data-i="'+i+'">'+esc(GL[i][0])+' →</button>'}).join('')+'</div>':'')+'</article>';
}
function kvView(){
  var cs=["all"];KVR.forEach(function(r){if(cs.indexOf(r.category)<0)cs.push(r.category)});
  var f=KVR.filter(function(r){return kvCat==="all"||r.category===kvCat});
  var h='<div class="kd"><button class="kd-back" data-kv="close">← Geri dön</button><div class="kd-art kv-c"><h2 style="margin:0;font-family:var(--serif)">Kavâid-i Fıkhiyye</h2><div class="kv-ar" dir="rtl">القواعد الفقهية</div><p class="kv-lit">Mecelle-i Ahkâm-ı Adliyye · '+KVR.length+' kaide</p></div>';

قال الله تعالى: ﴿يا أيها الذين آمنوا إذا قمتم إلى الصلاة فاغسلوا وجوهكم وأيديكم إلى المرافق وامسحوا برؤوسكم وأرجلكم إلى الكعبين﴾
ففرض الطهارة:
غسل الأعضاء الثلاثة ومسح الرأس والمرفقان والكعبان يدخلان في الغسل والمفروض في مسح الرأس مقدار الناصية لما روى المغيرة بن شعبة [أن النبي صلى الله عليه وآله وسلم أتى سباطة قوم فبال وتوضأ ومسح على ناصيته وخفيه]
وسنن الطهارة:
وغسل اليدين قبل إدخالها إذا استيقظ المتوضئ من نومه وتسمية الله تعالى في ابتداء الوضوء
والسواك والمضمضة والأستنشاق ومسح الأذنين وتخليل اللحية والأصابع وتكرار الغسل إلى الثلاث
ويستحب للمتوضئ أن ينوي الطهارة ويستوعب رأسه بالمسح ويرتب الوضوء فيبدأ بما بدأ الله تعالى بذكره وبالميامن
والمعاني الناقضة للوضوء:
كل ما خرج من السبيلين والدم والقيح والصديد إذا خرج من البدن فتجاوز إلى موضع يلحقه حكم التطهير والقيء إذا كان ملء الفم والنوم مضطجعا أو متكئا أو مستندا إلى شيء لو أزيل عنه لسقط والغلبة على العقل بالإغماء
والجنون والقهقهة في كل صلاة ذات ركوع وسجود
وفرض الغسل: المضمضة والاستنشاق وغسل سائر البدن
وسنة الغسل:
أن يبدأ المغتسل يديه وفرجه ويزيل النجاسة إن كانت على بدنه ثم يتوضأ وضوءه للصلاة إلا رجليه ثم يفيض الماء على رأسه وسائر جسده ثلاثا ثم يتنحى عن ذلك المكان فيغتسل رجليه
وليس على المرأة أن تنقض ضفائرها في الغسل إذا بلغ الماء أصول الشعر
والمعاني الموجبة للغسل:
إنزال المني
على وجه الدفق والشهوة من الرجل والمرأة والتقاء الختانين من غير إنزال والحيض والنفاس
وسن رسول الله صلى الله عليه وآله وسلم الغسل للجمعة والعيدين والإحرام
وليس في المذي والودي غسل وفيهما الوضوء
والطهارة من الأحداث جائزة بماء السماء والأودية والعيون والآبار وماء البحار ولا تجوز بما اعتصر من الشجر والثمر ولا بماء غلب عليه غيره وأخرجه عن طبع الماء
كالأشربة والخل وماء الورد وماء الباقلاء والمرق وماء الزردج
وتجوز الطهارة بماء خالطة شيء طاهر فغير أحد أوصافه كماء المد والماء الذي يختلط به الأشنان والصابون والزعفران
وكل ماء وقعت فيه نجاسة لم يجز اوضوء به قليلا أو كثيرا [لأن النبي عليه الصلاة والسلام أمر بحفظ الماء من النجاسة فقال لا يبولن
أحدكم في الماء الدائم ولا يغتسلن فيه من الجنابة] و[قال عليه الصلاة والسلام: إذا استيقظ أحدكم من منامه فلا يغمسن يده في الإناء حتى يغسلها ثلاثا فإنه لا يدري أين باتت يده]
وأما الماء الجاري
إذا وقعت فيه نجاسة جاز الوضوء منه إذا لم ير لها أثر لا تستقر مع جريان الماء والغدير العظيم الذي لا يتحرك أحد طرفيه بتحريك الطرف الآخر
إذا وقعت نجاسة في أحد جانبيه جاز الوضوء من الجانب الآخر لأن الظاهر أن النجاسة لا تصل إليه
وموت ما ليس له نفس سائلة في الماء لا ينجسه كالبق والذباب والزنابير والعقارب وموت ما يعيش في الماء فيه لا يفسده كالسمك والضفدع والسرطان
والماء المستعمل لا يجوز استعماله في طهارة الأحداث
والمستعمل: كل ماء أزيل به حدث أو استعمل في البدن على وجه القربة
وكل إهاب دبغ فقد ظهر وجازت الصلاة فيه والوضوء منه إلا جلد الخنزير والآدمي
وشعر الميتة
وعظمها
وعصبها وحافرها وقرنها طاهر
وإذا وقعت في البئر نجاسة نزحت وكان نزح ما فيها من الماء طهارة لها
فإن ماتت فيها فأرة أو عصفورة أو صعوة أو سوادنية أو سام أبرص نزح منها ما بين عشرين دلوا إلى ثلاثين دلوا
بحسب كبر الحيوان وصغره
وإن ماتت فيها حمامة أو دجاجة أو سنور نزح منها ما بين أربعين دلوا إلى ستين
وإن مات فيها كلب أو شاة أو آدمي نزح جميع ما فيها من الماء
وإن انتفخ الحيوان فيها أو تفسخ نزح جميع ما فيها من الماء صغر الحيوان أو كبر
وعدد الدلاء يعتبر بالدلو الوسط المستعمل للآبار في البلدان فإن نزح منها بدلو عظيم قدر ما يسع عشرين دلوا من الدلو الوسط احتسب به
وإن كانت البئر معينا لا تنزح ما فيها من الماء أخرجوا مقدار ما كان فيها من الماء وقد روي عن محمد بن الحسن رحمه الله عليه أنه قال: ينزح منها مائتا دلو إلى ثلاثمائة دلو
وإذا وجد في البئر أو غيرها ولا يدرون متى وقعت ولم تنتفخ ولم تتفسخ أعادوا صلاة يوم وليلة إذا كانوا توضئوا منها وغسلوا كل شيء أصابه ماءها
وإن كانت انتفخت أو تفسخت أعادوا صلاة ثلاثة أيام ولياليها في قول أبي حنيفة رحمه الله وقال أبو يوسف ومحمد رحمهما الله: ليس عليهم إعادة شيء حتى يتحققوا متى وقعت
وسؤر الآدمي وما يؤكل لحمه طاهر وسؤر الكلب والخنزير وسباع البهائم نجس وسؤر الهرة والدجاجة المخلاة وسباع الطير وما يسكن في البيوت مثل الحية والفأرة مكروه
وسؤر الحمار والبغل مشكوك فيهما فإن لم يجد غيرهما توضأ بهما وتيمم بأيهما بدأ جاز
## باب التيمم
ومن لم يجد الماء وهو مسافر أو خارج المصر بينه وبين المصر نحو الميل أو أكثر
أو كان يجد الماء إلا أنه مريض فخاف إن استعمل الماء اشتد مرضه أو خاف الجنب إن غسل بالماء أن يقتله البرد أو يمرضه فإنه يتيمم بالصعيد
والتيمم ضربتان:
يمسح بإحداهما وجهه وبالأخرى يديه إلى المرفقين والتيمم من الجنابة والحدث سواء
ويجوز التيمم عند أبي حنيفة ومحمد بكل ما كان من جنس الأرض كالتراب والرمل والحجر والجص والنورة والكحل والزرنيخ
وقال أبو يوسف رحمه الله: لا يجوز إلا بالتراب والرمل خاصة
والنية فرض في التيمم مستحبة في الوضوء
