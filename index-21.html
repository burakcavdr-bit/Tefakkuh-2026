ومن زنى في دار الحرب أو دار البغي ثم خرج إلينا لم نقم عليه الحد
## باب حد الشرب
ومن شرب الخمر فأخذ وريحها موجود فشهد الشهود بذلك عليه أو أقل فعليه الحد وإن أقر بعد ذهاب رائحتها لم يحد
ومن سكر من النبيذ حد
ولا حد على من وجد منه رائحة الخمر أو تقيأها ولا يحد السكران حتى يعلم أنه سكر من النبيذ وشربه طوعا ولا يحد حتى يزول عنه السكر
وحد الخمر والسكر في الحد ثمانون سوطا يفرق على بدنه كما ذكرنا في الزنا وإن كان عبدا فحده أربعون سوطا
ومن أقرب بشرب الخمر أو السكر ثم رجع لم يحد
ويثبت الشرب بشهادة شاهدين وبإقراره مرة واحدة ولا تقبل فيه شهادة النساء مع الرجال
## باب حد القذف
إذا قذف رجل رجلا محصنا أو امرأة محصنة بصريح الزنا وطالب المقذوف بالحد حده الحاكم ثمانين سوطا إن كان حرا يفرق على أعضائه ولا يجرد عن ثيابه غير أنه ينزع عنه الفرو والحشو وإن كان عبدا جلده أربعين
والإحصان: أن يكون المقذوف حرا عاقلا بالغا مسلما عفيفا عن فعل الزنا
ومن نفى نسب غيره فقال: لست لأبيك أو: يا ابن الزانية وأمه ميتة محصنة وطالب الابن بالحد حد القاذف ولا يطالب بحد القذف للميت إلا من يقع القدح في نسبه بقذفه
وإن كان المقذوف محصنا جاز لابنه الكافر والعبد أن يطالب بالحد وليس للعبد أن يطالب مولاه بقذف أمه الحرة
وإن أقر بالقذف ثم رجع لم يقبل رجوعه
ومن قال لعربي: يا نبطئ لم يحد ومن قال لرجل: يا ابن ماء السماء فليس
بقاذف وإذا نسبه إلى عمه أو خاله أو زوج أمه فليس بقاذف
ومن وطئ وطئا حراما في غير ملكه لم يحد قاذفه والملاعنة بولد لا يحد قاذفها
ومن قذف عبدا أو أمة أو كافرا بالزنا أو قذف مسلما
بغير الزنا فقال: يا فاسق أو يا كافر أو يا خبيث عزر وإن قال: يا حمار أو يا خنزير لم يعزر
والتعزير: أكثره تسعة وثلاثون سوطا وأقله ثلاث جلدات وقال أبو يوسف: يبلغ بالتعزير خمسة وسبعين سوطا فإن رأى الإمام أن يضم إلى الضرب في التعزير الحبس فعل
وأشد الضرب التعزير ثم حد الزنا ثم حد الشرب ثم حد القذف
ومن حده الإمام أو عزره فمات فدمه هدر
وإذا حد المسلم في القذف سقطت شهادته وإن تاب وإن حد الكافر في القذف ثم أسلم قبلت شهادته والله أعلم
# كتاب السرقة
إذا سرق العاقل البالغ عشرة دارهم أو ما قيمته عشرة دراهم مضروبة أو غير مضروبة من حرز لا شبهة فيه وجب عليه القطع
والعبد والحر في القطع سواء
ويجب القطع بإقراره مرة واحدة أو بشهادة شاهدين
وإذا اشترك جماعة في سرقة فأصاب كل واحد منهم عشرة دراهم قطع وإن أصابه أقل من ذلك لم يقطع
ولا يقطع فيما يوجد تافها مباحا في دار الإسلام كالخشب والقصب والحشيس والسمك والطير والصيد وكذلك فيما يسرع إليه الفساد كالفواكه الرطبة واللبن واللحم والبطيخ والفاكهة على الشجر والزرع الذي لم يحص
ولا قطع في الأشربة المطربة
ولا في الطيور ولا في السرقة المصحف وإن كان عليه حلية ولا في الصليب الذهب ولا في الشطرنج ولا النرد ولا قطع على سارق الصبي الحر وإن كان عليه حلي ولا قطع في سرقة العبد الكبير ويقطع في سرقة العبد الصغير ولا قطع في الدفاتر كلها إلا في دفاتر الحساب ولا قطع في سرقة الكلب ولا فهد ولا دف ولا طبل ولا مزمار ويقطع في الساج والقنا والآبنوس والصندل وإذا اتخذ من الخشب أوان أو أبواب قطع فيها ولا قطع على خائن ولا خائنة ولا نباش
ولا منتهب ولا مختلس
ولا يقطع السارق من بيت المال ولا من مال للسارق فيه شركة ومن
سرق من أبويه أو ولده أو ذي رحم محرم منه لم يقطع وكذلك إذا سرق أحد الزوجين من الآخر أو العبد من سيده أو من امرأة سيده أو زوج سيدته والمولى من مكاتبه والسارق من المغنم
والحرز على ضربين: حرز لمعنى فيه
كالبيوت والدور وحرز بالحافظ فمن سرق شيئا من حرز أو غير حرز وصاحبه عنده يحفظه وجب عليه القطع ولا قطع على من سرق من حمام أو من بيت أذن للناس في دخوله
ومن سرق من المسجد متاعا وصاحبه عنده قطع ولا قطع على الضيف إذا سرق ممن أضافه وإذا نقب اللص البيت فدخل فأخذ المال وناوله آخر خارج البيت فلا قطع عليهما وإن ألقاه في الطريق ثم خرج فأخذه قطع
وكذلك إن حمله على حمار فساقه فأخرجه وإذا دخل الحرز جماعة فتولى بعضهم الأخذ قطعوا جميعا
ومن نقب البيت وأدخل يده فيه فأخذ شيئا لم يقطع وإذا أدخل يده في صندوق الصيرفي أو في كم غيره فأخذ المال قطع
وتقطع يمين السارق من الزند وتحسم فإن سرق ثانيا قطعت رجله اليسرى فإن سرق ثالثا لم يقطع وخلد في السجن حتى يتوب
وإذا كان السارق أشل اليد اليسرى أو أقطع أو مقطوع الرجل
اليمنى لم يقطع
ولا يقطع السارق إلا أن يحضر المسروق منه فيطالب بالسرقة فإن وهبها من السارق أو باعها إياه أو نقصت قيمتها من النصاب لم يقطع
ومن سرق عنيا فقطع فيها وردها ثم عاد فسرقها وهي بحالها لم يقطع فإن تغيرت عن حالها مثل أن كان غزلا فسرقة فقطع فيه فرده ثم نسج فعاد فسرقة قطع وإذا قطع السارق والعين قائمة في يده ردها وإن كانت هالكة لم يضمن وإذا ادعى السارق أن العين المسروقة ملكه سقط القطع عنه وإن لم يقم بنية
وإذا خرج جماعة ممتنعين أو واحد يقدر على الامتناع فقصدوا قطع الطريق فأخذوا قبل أن يأخذوا مالا ولا قتلوا نفسا حبسهم الإمام حتى يحدثوا توبة وإن أخذوا مال مسلم أو ذمي والمأخوذ إذا قسم على
جماعتهم أصاب كل واحد منهم عشرة دراهم فصاعدا أو ما قيمته ذلك قطع الإمام أيديهم وأرجلهم من خلاف
وإن قتلوا ولم يأخذوا مالا قتلهم الإمام حدا فإن عفا الأولياء عنهم لم يلتفت إلى عفوهم وإن قتلوا وأخذوا المال فالإمام بالخيار: إن
شاء قطع أيديهم وأرجلهم من خلاف وقتلهم وصلبهم وإن شاء قتلهم وإن شاء صلبهم: يصلب حيا ويبعج بطنه بالرمح إلى أن يموت ولا يصلب أكثر من ثلاثة أيام
فإن كان فيهم صبي أو مجنون أو ذو رحم محرم من المقطوع عليه سقط الحد عن الباقين وصار القتل إلى الأولياء: إن شاؤوا قتلوا وإن شاؤا عفوا
وإن باشر الفعل واحد أجري الحد على جماعتهم
# كتاب الأشربة
الأشربة المحرمة أربعة: الخمر وهي: عصير العنب إذا إلى واشتد وقذف بالزبد والعصير إذا طبخ حتى ذهب أقل من ثلثيه ونقيع التمر والزبيب إذا اشتد ونبيذ التمر والزبيب إذا طبخ كل واحد منهما أدنى طبخ حلال وإن اشتد إذا شرب منه ما يغلب في ظنه أنه لا يسكره من غير لهو ولا طرب ولا بأس بالخليطين ونبيذ العسل والتين والحنطة والشعير والذرة حلال وإن لم يطبخ
وعصير العنب إذا طبخ حتى ذهب منه ثلثاه وبقي ثلثه حلال وإن اشتد ولا بأس بالانتباذ في الدباء والحنتم والمزفت والنقير
وإذا تخللت الخمر حلت سواء صارت خلا بنفسها أو بشيء طرح فيها ولا يكره تخليلها
# كتاب الصيد والذبائح
يجوز الاصطياد بالكلب المعلم والفهد والبازي وسائر الجوارح المعلمة
وتعليم الكلب: أن يترك الأكل ثلاث مرات
وتعليم البازي: أن يرجع إذا دعوته
فإذا أرسل كلبه العلم أو بازيه أوصقره وذكر اسم الله تعالى عليه عند إرساله فأخذ الصيد وجرحه فمات حل أكله وإن أكل منه الكلب لم يؤكل وأن أكل منه البازي أكل وإذا أدرك المرسل الصيد حيا وجب عليه أن يذكيه فإن ترك تذكيته حتى مات لم يؤكل وإن خنقه الكلب ولم يجرحه لم يؤكل
وإن شاركه كلب غير معلم أو كلب مجوسي أو كلب لم يذكر اسم الله تعالى عليه لم يؤكل
وإذا رمى الرجل سهما إلى صيد فسمى عند الرمي أكل ما أصاب إذا جرحه السهم فمات وإن أدركه حيا ذكاه وإن ترك تذكيته حتى مات لم يؤكل وإن وقع السهم فتحامل حتى غاب عنه ولم يزل في طلبه حتى أصابه ميتا أكل وإن قعد عن طلبه ثم أصابه ميتا لم يؤكل وإذا رمة صيدا فوقع في الماء فمات لم يؤكل
وكذلك إن وقع على سطح أو جبل ثم تردى منه إلى الأرض لم يؤكل وإن وقع على الأرض ابتداء أكل
وما أصاب المعراض بعرضه لم يؤكل وإن جرحه أكل ولا يؤكل ما أصابته النبدقة إذا مات منها
وإذا رمى إلى صيد فقطع عضوا منه أكل ولا يؤكل العضو وإن قطعه أثلاثا والأكثر مما يلي العجز
أكل وإن كان الأكثر مما يلي الرأس أكل الأكثر ولا يؤكل الأقل ولا يؤكل صيد المجوسي والمرتد والوثني
ومن رمى صيدا فأصابه ولم يثخنه ولم يخرجه من حيز الإمتناع فرماه آخر فقتله فهو للثاني ويؤكل
وإن كان الأول أثخنه فرماه الثاني فقتله لم يؤكل والثاني ضامن بقيمته للأول غير ما نقصته جراحته
ويجوز اصطياد ما يؤكل لحمه من الحيوان
وما لا يؤكل
وذبيحة المسلم والكتابي حلال ولا تؤكل ذبيحة المجوسي والمرتد والوثني والمحرم وإن ترك الذابح التسمية عمدا فالذبيحة ميتة لا تؤكل وإن تركها ناسيا أكلت
والذبح في الحلق واللبة
والعروق التي تقطع في الذكاة أربعة: الحلقوم والمريء والودجان فإذا قطعها حل الأكل وإن قطع أكثرها فكذلك عند أبي حنيفة وقال أبو يوسف ومحمد: لا بد من قطع الحلقوم والمريء وأحد الودجين
ويجوز الذبح بالليطة
والمروة وبكل شيء أنهر الدم إلا السن القائم والظفر القائم
ويستحب أن يحد الذابح شفرته ومن بلغ بالسكين النخاع أو قطع الرأس كره له ذلك وتؤكل ذبيحته وإن ذبح الشاة من قفاها فإن بقيت حية قطع العروق جاز ويكره وإن ماتت قبل قطع العروق لم تؤكل
وما استأنس من الصيد فذكاته الذبح وما توحش من النعم فذكاته العقر والجرح
والمستحب في الإبل النحر
فإن ذبحها جاز ويكره
والمستحب في البقر والغنم الذبح فإن نحرهما جاز ويكره
ومن نحر ناقة أو ذبح بقرة أو شاة فوجد في بطنها جنينا ميتا لم يؤكل أشعر أو لم يشعر
ولا يجوز أكل كل ذي ناب من السباع وكل ذي مخلب من الطير ول ابأس بغراب الزرع ولا يؤكل الأبقع الذي يأكل الجيف
ويكره أكل الضبع والضب والحشرات كلها
ولا يجوز أكل لحم الحمر الأهلية والبغال ويكره لحم الفرس عند أبي حنيفة ولا بأس
بأكل الأرنب وإذا ذبح ما لا يؤكل لحمه طهر لحمه وجلده
إلا الآدمي والخنزير فإن الذكاة لا تعمل فيهما
ولا يؤكل من حيوان الماء إلا السمك ويكره أكل الطافي منه ولا بأس بأكل الجريث والمارماهي
ويجوز أكل الجراد ولا ذكاة له
# كتاب الأضحية
الأضحية واجبة على كل حر مسلم مقيم موسر في يوم الأضحى عن نفسه وولده الصغار يذبح عن
كل واحد منهم شاة أو يذبح بدنة أو بقرة عن سبعة وليس على الفقير والمسافر أضحية ووقت الأضحية يدخل بطلوع الفجر من يوم النحر إلا أنه لا يجوز لأهل الأمصار الذبح حتى يصلي الإمام صلاة العيد فأما أهل السواد فيذبحون بعد الفجر
وهي جائزة في ثلاثة أيام: يوم النحر ويومان بعده
ولا يضحي بالعمياء والعوراء والعرجاء التي لا تمشي إلى المنسك ولا العجفاء ولا تجزئ مقطوعة الأذن والذنب ولا التي ذهب أكثر أذنها فإن بقي الأكثر من الأذن والذنب جاز
ويجوز أن يضحى بالجماء والخصي والجرباء والثولاء
والأضحية من الإبل والبقر والغنم يجزئ من ذلك كله الثني فصاعدا إلا الضمان فإن الجذع منه يجزئ
ويأكل من لحم الأضحية ويطعم الأغنياء والفقراء ويدخر
ويستحب أن لا ينقص الصدقة من الثلث ويتصدق بجلدها أو يعمل منه آلة تستعمل في البيت
والأفضل أن يذبح أضحيته بيده إن كان يحسن الذبح
ويكره أن يذبحها الكتابي
وإذا غلط رجلان فذبح كل واحد منهما أضحية الآخر أجزأ عنهما ولا ضمان عليهما
# كتاب الأيمان
الأيمان على ثلاثة أضرب: يمين غموس ويمين منعقدة ويمين لغو فاليمين الغموس هي: الحلف على أمر ماض يتعمد الكذب فيه
فهذه اليمين يأثم بها صاحبها ولا كفارة فيها إلا الاستغفار
واليمين المنعقدة: هي الحلف على الأمر المستقبل أن يفعله أو لا يفعله فإذا حنث في ذلك لزمته الكفارةز
واليمين اللغو: أن يحلف على أمر ماض وهو يظن أنه كمال قال والأمر بخلافه فهذه نرجو أن لا يؤاخذ الله بها صاحبها
والقاصد في اليمين والمكره والناسي سواء
ومن فعل المحلوف عليه مكرها أو ناسيا سواء
واليمين بالله تعالى أو باسم من أسمائه كالرحمن والرحيم
أو بصفة من صفات ذاته كعزة الله وجلالته وكبريائه إلا قوله: وعلم الله فإنه لا يكون يمينا وإن حلف بصفة من صفات الفعل كغضب الله وسخطه لم يكن حالفا
ومن حلف بغير الله لم يكن حالفا كالنبي والقرآن والكعبة
والحلف بحروف القسم وحروف القسم: الواو كقوله: والله والباء كقوله: بالله والتاء كقوله: تالله وقد تضمر الحروف فيكون حالفا كقوله: الله لا أفعل كذا وقال أبو حنيفة: إذا قال: وحق الله فليس بحالف
وإذا قال: أقسم أو أقسم بالله أو أحلف بالله أو أشهد أو أشهد بالله فهو حالف وكذلك قوله: وعهد الله وميثاقه وعلي نذر أو نذر الله وإن فعلت كذا فأنا يهودي أو نصراني أو كافر فهو يمين
وإن قال: علي غضب الله أو سخطه أو أنا زان أو شارب خمر أو آكل ربا فليس بحالف
وكفارة اليمين: عتق رقبة يجزئ فيها ما يجزئ في الطهار
وإن شاء كسا عشرة مساكين كل واحد ثوبا فما زاد وأذناه ما تجزئ فيه الصلاة وإن شاء أطعم عشرة مساكين كالإطعام في كفارة الظهار فإن لم يقدر على أحد الأشياء الثلاثة صام ثلاثة أيام متتابعات فإن قدم الكفارة على الحنث لم يجزه
ومن حلف على معصية مثل أن لا يصلي أو لا يكلم أباه أو ليقتلن فلانا فينبغي أن يحنث ويكفر عن يمينه
وإذا حلف الكافر ثم حنث في حال الكفر أو بعد إسلامه فلا حنث عليه
ومن حرم على نفسه شيئا مما يملكه لم يصر محرما لعينه وعليه أن استباحه كفارة يمين فإن قال: كل حلال علي حرام فهو على الطعام والشراب إلا أن ينوي غير ذلك
ومن نذر نذرا مطلقا فعليه الوفاء به
وإن علق نذره بشرط فوجد الشرط فعليه الوفاء بنفس النذر وروي أن أبا حنيفة رجع عن ذلك وقال: إذا قال: إن
فعلت كذا فعلي حجة أو صوم سنة أو صدقة ما أملكه أجزأه من ذلك كفارة يمين وهو قول محمد
ومن خلف لا يدخل بيتا فدخل الكعبة أو المسجد أو البيعة أو الكنيسة لم يحنث
ومن حلف لا يتكلم فقرأ في الصلاة لم يحنث
ومن حلف لا يلبس ثوبا وهو لابسه فنزعه في الحال لم
يحنث وكذا إذا حلف لا يركب هذه الدابة وهو راكبها فنزل في الحال وإن لبث ساعة حنث وإن حلف لا يدخل هذه الدار وهو فيها لم يحنث بالقعود حتى يخرج ثم يدخل
ومن حلف لا يدخل دارا فدخل دارا خرابا لم يحنث
ومن حلف لا يدخل هذه الدار فدخلها بعد ما انهدمت وصارت صحراء حنث ولو حلف لا يدخل هذا البيت فدخله بعد ما انهدم لم يحنث
ومن حلف لا يكلم زوجة فلان فطلقها فلان ثم كلمها حنث
ولو حلف لا يكلم عبد فلان أو لا يدخل دار فلان فباع عبده وداره ثم كلم العبد ودخل الدار لم يحنث وإن حلف لا يكلم صاحب هذا الطيلسان فباعه ثم كلمه حنث وكذلك إن حلف لا يكلم هذا الشاب فكلمه بعد ما صار شيخا حنث أو لا يأكل لحم هذا الحمل فصار كبشا فأكله حنث وإن حلف لا يأكل من هذه النخلة فهو على ثمرها وإن حلف لا يأكل من هذا البسر فصار رطبا فأكله لم يحنث وإن حلف لا يأكل بسرا فأكل رطبا لم يحنث
ومن حلف لا يأكل رطبا فأكل بسرا مذنبا حنث عند أبي حنيفة
ومن حلف لا يأكل لحما فأكل السمك لم يحنث
ومن حلف لا يشرب من دجله فشرب منها بإناء لم يحنث حتى يكرع منها كرعا في قول أبي حنيفة ومن حلف لا يشرب من ماء دجلة فشرب منها بإناء حنث
ومن حلف لا يأكل من هذه الحنطة فأكل من خبزها لم يحنث
ولو حلف لا يأكل من هذا الدقيق بأكل من خبزه حنث ولو استفه كما هو لم يحنث ولو حلف لا يكلم فلانا فكلمه وهو بحيث يسمع إلا أنه نائم حنث وإن حلف لا يكلمه إلا بإذنه فأذن له ولم يعلم بالأذن حتى كلمه حنث
وإذا استحلف الوالي رجلا ليعلمه بكل داعر دخل البلد فهذا على حال ولايته خاصة
ومن حلف لا يركب دابة فلان فركب دابة عبده لم يحنث
ومن حلف لا يدخل هذه الدار فوقف على سطحها أو دخل دهليزها حنث
وإن وقف في طاق الباب يحيث إذا أغلق الباب كان خارجا لم يحنث
ومن حلف لا يأكل الشواء فهو على اللحم دون الباذنجان والجزر
ومن حلف لا يأكل الطبيخ فهو على ما يطبخ من اللحم
ومن حلف لا يأكل الرؤوس فيمتنه على ما يكبس في التنانير ويباع في المصر
ومن حلف لا يأكل الخبز فيمتنه على ما يعتاد أهل البلد أكله خبزا فإن أكل خبز القطائف أو خبز الأرز بالعراق لم يحنث
ومن حلف لا يبيع أو لا يشتري أولا يؤاجر فوكل بذلك لم يحنث
ومن حلف لا يتزوج أو لا يطلق أو لا يعلق لوكل بذلك حنث
ومن حلف لا يجلس على الأرض فجلس على بساط أو حصير لم يحنث
ومن حلف لا يجلس على سرير فجلس على سرير فوقه بساط حنث وإن جعل
فوقه سريرا فجلس عليه لم يحنث
وإن حلف لا ينام على فراش فنام عليه وفوقه قوام حنث وإن جعل فوقه فراشا آخر لم يحنث
ومن حلف بيمين وقال: إن شاء الله متصلا بيمينه فلا حنث عليه وإن حلف ليأتينه إن استطاع فهذا على استطاعة الصحة دون القدرة
وإن حلف لا يكلم فلانا حينا أو زمانا أو الحين أو الزمان فهو على ستة أشهر وكذلك الدهر عند أبي يوسف ومحمد
ولو حلف لا يكلمه أياما على ثلاثة أيام ولو حلف لا يكلمه الأيام فهو على عشرة أيام عند أبي حنيفة وقال أبو يوسف ومحمد: على أيام الأسبوع ولو حلف لا يكلمه الشهور فهو على عشرة أشهر عند أبي حنيفة وقال أبو يوسف ومحمد: على اثني عشر شهرا
وإذا حلف لا يفعل كذا تركه أبدا وإن حلف ليفعلن كذا ففعله مرة واحدة بر في يمينه
ومن حلف لا تخرج امرأته إلا بإذنه فأذن لها مرة
فخرجت ثم خرجت مرة أخرى بغير إذنه حنث ولا بد من إذن في كل خروج وإن قال: إلا أن آذن لك فأذن لها مرة ثم خرجت بعدها بغير إذنه لم يحنث
وإذا حلف لا يتغدى فالغداء الأكل من طلوع الفجر إلى الظهر والعشاء من صلاة الظهر إلى نصف الليل والسحور من نصف الليل إلى طلوع الفجر
وإن حلف ليقضين دينه إلى قريب فهو ما دون الشهر وإن قال: إلى بعيد فهو أكثر من الشهر
ومن حلف لا يسكن هذه الدار فخرج منها نفسه وترك فيها
أهله ومتاعه حنث
ومن حلف ليصعد السماء أوليقلبن هذا الحجر ذهبا انعقدت يمينه وحنث عقيبها
ومن حلف ليقضين فلانا دينه اليوم فقضاه ثم وجد فلان بعضه زيوفا أو نبهرجة أو مستحقة لم يحنث وإن وجدها رصاصا أو ستوقة حنث
ومن حلف لا يقبض دينه درهما دون درهم فقبض بعضه لم يحنث
حتى يقبض متفرقا وإن قبض دينه في وزنتين لم يتشاغل بينهما إلا بعمل الوزن لم يحنث وليس ذلك بتفريق
ومن حلف ليأتين البصرة فلم يأتها حتى مات حنث في آخر جزء من أجزاء حياته
# كتاب الدعوى
المدعي: من لا يجبر على الخصومة إذا تركها
والمدعى عليه: من يجبر على الخصومة
ولا تقبل الدعوى حتى يذكر شيئا معلوما في جنسه وقدره فإن كان عينا في يد المدعى عليه كلف إحضارها ليشير إليها بالدعوى وإن لم تكن حاضرة ذكر قيمتها وإن ادعى عقارا حدده وذكر أنه في يد المدعى عليه وأنه يطالبه به وإن كان حقا في الذمة ذكر أنه يطالبه به
فإذا صحت الدعوى سأل القاضي المدعى عليه عنها فإن اعترف قضى عليه بها
وإن أنكر سأل المدعى البينة فإن أحضرها قضى بها وإن عجز عن ذلك وطلب يمين خصمه استحلف عليها
فإن قال: لي بينة وطلب اليمين لم يستحلف عند أبي حنيفة
ولا ترد اليمين على المدعي
ولا تقبل بينه صاحب اليد في الملك المطلق
وإذا نكل المدعى عليه عن اليمين قضي عليه بالنكول ولزمه ما ادعى عليه
وينبغي للقاضي أن يقول له: إني أعرض اليمين عليك ثلاثا فإن حلفت وإلا قضيت عليك بما ادعاه فإذا كرر العرض ثلاث مرات قضى عليه بالنكول
وإن كانت الدعوى نكاحا لم يستحلف المنكر عند أبي حنيفة
ولا يستحلف في النكاح والرجعة
والفيء في الإيلاء والرق والاستيلاد والنسب والولاء والحدود
وقال أبو يوسف ومحمد: يستحلف في ذلك كله إلا في الحدود والقصاص
وإذا ادعى اثنان عينا في يد آخر كل واحد منهما يزعم أنها له وأقاما البينة قضي بها بينهما
وإن ادعى كل واحد منهما نكاح امرأة وأقاما البينة لم يقض بواحدة من البينتين ويرجع إلى تصديق المرأة لأحدهما
وإن ادعى اثنان كل واحد منهما أنه اشترى منه هذا العبد وأقاما البينة فكل واحد منهما بالخيار: إن شاء أخذ نصف العبد بنصف الثمن وإن شاء ترك فإن قضى القاضي بينهما به فقال أحدهما: لا أختار لم يكن للآخر أن يأخذ جميعه وإن ذكر واحد منهما تاريخا فهو للأول منهما وإن لم يذكرا ومع أحدهما قبض فهو أولى به
وإن ادعى أحدهما شراء والآخر هبة وقبضا وأقاما
البينة ولا تاريخ معهما فالشراء أولى
وإن ادعى أحدهما الشراء وادعت امرأة أنه تزوجها عليه فهما سواء
وإن ادعى أحدهما رهنا وقبضا والآخر هبة وقبضا فالرهن أولى وإن أقام الخارجان البينة على الملك والتاريخ فصاحب التاريخ الأبعد أولى وإن ادعيا الشراء من واحد وأقاما البينة على التاريخين فالأول أولى وإن أقام كل واحد منهما بينة على الشراء من آخر وذكرا تاريخا فهما سواء وإن أقام الخارج البينة على ملك مؤرخ وأقام صاحب اليد البينة على ملك أقدم تاريخا كان أولى
وإن أقام الخارج وصاحب اليد كل واحد منهما بينة بالنتاج فصاحب اليد أولى وكذلك النسج في الثياب التي لا تنسج إلا مرة واحدة وكل سبب في الملك لا يتكرر فهو كذلك وإن أقام الخارج البينة على الملك وصاحب اليد بينة على الشراء منه كان أولى وإن أقام كل واحد منهما البينة على الشراء من الآخر ولا تاريخ معهما تهاترت البينتان
وإن أقام أحد المدعيين شاهدين والآخر أربعة فهما سواء
ومن ادعى قصاصا على غيره فجحد
استحلف فإن نكل عن اليمين فيما دون النفس لزمه القصاص وإن نكل في النفس حبس حتى يقر أو يحلف وقال أبو يوسف ومحمد: يلزمه الأرض فيهما
وإذا قال المدعي: لي بينة حاضرة قيل لخصمه: أعطه كفيلا بنفسك ثلاثة أيام فإن فعل وإلا أمر بملازمته إلا أن يكون غريبا على الطريق فيلازمه مقدار مجلس القاضي
وإن قال المدعى عليه: هذا الشيء أودعنيه فلان الغائب أو رهنه عندي أو غصبته منه وأقام بينة على ذلك فلا خصومة بينه وبين المدعي
وإن قال: ابتعته من الغائب فهو خصم
وإن قال المدعي: سرق مني وأقام البينة وقال صاحب اليد: أودعينه فلان وأقام البينة لم تندفع الخصومة
وإن قال المدعي: ابتعته من فلان وقال صاحب اليد: أودعنيه فلان ذلك سقطت الخصومة بغير بينة
واليمين بالله تعالى دون غيره ويؤكد بذكر أوصافه ولا يستحلف بالطلاق ولا بالعتاق ويستحلف اليهوديث بالله الذي أنزل التوراة على موسى والنصراي بالله الذي أنزل الإنجيلع على عيسى والمجوسي بالله الذي حلق النار
ولا يحلفون في بيوت عباداتهم
ولا يجب تغليظ اليمين على المسلم بزمان ولا بمكان
ومن ادعى أنه ابتاع من هذا عبده بألف فجحد يستحلف بالله ما بينكما بيع قائم فيه ولا يستحلف بالله ما بعت ويستحلف في الغضب بالله ما يستحق عليك رده ولا يحلف بالله ما غصبت وفي النكاح بالله ما بينكما نكاح قائم
في الحال وفي دعوى الطلاق بالله ما هي بائن منك الساعة بما ذكرت ولا يستحلف بالله ما طلقتها
وإذا كانت دار في يد رجل ادعاها أحدهما جميعها والآخر نصفها وأقاما البينة فللصاحب الجميع ثلاثة أرباعها ولصاحب النصف ربعها عند أبي حنيفة وقال أبو يوسف ومحمد: هي بينهما أثلاثا ولو كانت في أيديهما سلمت لصاحب الجميع: نصفها على وجه القضاء ونصفها لا على وجه القضاء
وإذا تنازعا في دابة وأقام كل واحد منهما بينة أنها نتجت عنده وذكرا تاريخا وسن الدابة يوافق أحد التاريخين فهو أولى وإن أشكل ذلك كانت بينهما
وإذا تنازعا دابة أحدهما راكبها والآخر متعلق بلجامها فالراكب أولى وكذلك إذا تنازعا بعيرا وعليه حمل لأحدهما الحمل أولى وكذلك إذا تنازعا قميصا أحدهما لابسه والآخر متعلق بكمه فاللابس أولى
وإذا اختلف المتبايعان في البيع فادعى أحدهما ثمنا وادعى البائع أكثر منه أو اعترف البائع بقدر من المبيع وادعى المشتري أكثر منه وأقام أحدهما البينة قضي له بها
وإن أقام كل واحد منهما البينة كانت البينة المثبتة للزيادة أولى وإن لم تكن لكل واحد بينة قيل للمشتري:
إما أن ترضى بالثمن الذي ادعاه البائع وإلا فسخنا البيع وقيل للبائع: إما أن تسلم ما ادعاه المشتري من المبيع وإلا فسخنا البيع فإن لم يتراضيا استحلف الحاكم كل واحد منهما على دعوى الآخر يبتدئ بيمين المشتري فإذا حلفا فسخ القاضي البيع بينهما وإن نكل أحدهما عن اليمين لزمه دعوى الآخر
وإن اختلفا في الأجل أو في شرط الخيار أو في استيفاء بعض الثمن فلا تحالف بينهما والقول قول من ينكر الخيار والأجل مع يمينه
وإن هلك المبيع ثم اختلفا لم يتحالفا عند أبي حنيفة وأبي يوسف وجعل القول قول المشتري وقال محمد: يتحالفان ويفسخ البيع على قيمة الهالك
وإن هلك أحد العبدين ثم اختلفا في الثمن لم يتحالفا عند أبي حنيفة إلا أن يرضى البائع أن يترك حصة الهالك وقال أبو يوسف:
يتحالفان ويفسخ العقد في الحي وقال محمد رحمه الله يتحالفان عليهما ويفسخ العقد ويرد الحي وقيمة الهالك
وإذا اختلف الزوجان في المهر فادعى الزوج أنه تزوجها بألف وقالت: تزوجتني بألفين فأيهما أقام البينة قبلت بينة
وإن أقاما البينة فالبينة بينة المرأة وإن لم تكن لهما بينة تحالفا عند أبي حنيفة ولم يفسخ النكاح ولكن يحكم مهر المثل
فإن كان مثل ما اعترف به الزوج أو أقل قضي بما قال الزوج وإن كان مثل ما ادعته المرأة أو أكثر قضي بما ادعته المرأة وإن كان مهر المثل أكثر مما اعترف به الزوج وأقل مما ادعته المرأة قضي لها بمهر المثل
وإذا اختلفا في الإجازة قبل استيفاء المعقود عله تحالفا وترادا وإن اختلفا بعد الاستيفاء لم يتحالفا وكان القول قول المستأجر
وإن اختلفا بعد استيفاء بعض العقود عليه تحالفا وفسخ العقد فيما بقي وكان القول في الماضي قول المستأجر
وإذا اختلف المولى والمكاتب في مال الكتابة لم يتحالفا عند أبي حنيفة وقال أبو يوسف ومحمد: يتحالفان وتفسخ الكتابة
وإذا اختلف الزوجان في متاع البيت فما يصلح للرجال فهو للرجل وما يصلح للنساء فهو للمرأة وما يصلح لهما فهو للرجل
وإذا مات أحدهما واختلف ورثته مع
الآخر فما يصلح للرجال والنساء فهو للباقي منهما وقال أبو يوسف: يدفع إلى المرأة ما يجهز به مثلها والباقي للزوج
وإذا باع الرجل الجارية فجاءت لولد فادعاه البائع فإن جاءت به لأقل من ستة أشهر من يوم البيع فهو ابن البائع وأمة أم ولد له فيفسخ البيع فيه ويرد الثمن وإن ادعاه المشتري مع دعوى البائع أو بعده فدعوى البائع أولى وإن جاءت به لأكثر من ستة أشهر لم تقبل دعوى البائع فيه إلا أن يصدقه المشتري
وإن مات الولد فادعاه البائع وقد جاءت به لأقل من ستة أشهر لم يثبت الاستيلاد في الأم وإن ماتت الأم فادعى البائع الابن وقد جاءت به لأقل من ستة أشهر يثبت النسب منه في الولد وأخذه البائع ويرد الثمن كله في قول أبي حنيفة وقال أبو يوسف ومحمد: يرد حصة الولد ولا يرد حصة الأم
ومن ادعى نسب أحد التوأمين ثبت نسبهما منه والله أعلم
# كتاب الشهادات
الشهادة: فرض يلزم الشهود اداؤها ولا يسعهم كتمانها إذا طالبهم المدعي
والشهادة في الحدود يخير فيها الشاهد بين
الستر والإظهار والستر أفضل إلا أنه يجب أن يشهد بالمال في السرقة فيقول: أخذ ولا يقول: سرق
والشهادة على مراتب: منها الشهادة في الزنا يعتبر فيها أربعة من الرجال ولا تقبل فيها شهادة النساء ومنها الشهادة ببقية الحدود والقصاص تقبل فيها شهادة رجلين ولا تقبل فيها شهادة النساء
وما سوى ذلك من الحقوق تقبل فيها شهادة رجلين
أو رجلين وامرأتين سواء كان الحق مالا أو غير مال مثل النكاح مثل النكاح والطلاق والوكالة والوصية
وتقبل في الولادة والبكارة والعيوب بالنساء في موضع لا يطلع عليه الرجال شهادة امرأة واحدة
ولا بد في ذلك كله من العدالة
ولفظ الشهادة فإن لم يذكر الشاهد لفظ الشهادة وقال: أعلم أو أتيقن لم تقبل شهادته
وقال أبو حنيفة: يقتصر الحاكم على ظاهر عدالة المسلم إلا في الحدود والقصاص فإنه يسأل عن الشهود وإن طعن الخصم فيهم سأل عنهم وقال أبو يوسف
ومحمد: لا بد أن يسأل عنهم في السر والعلانية
وما يتحمله الشاهد على ضربين:
أحدهما: ما يثبت حكمه بنفسه مثل البيع والإقرار والغصب والقتل وحكم الحاكم فإذا سمع ذلك الشاهد أو رآه وسعه أن يشهد به وإن لم يشهد عليه ويقول: أشهد أنه باع ولا يقول: أشهدني
ومنه ما لا يثبت حكمه بنفسه مثل الشهادة على الشهادة فإن سمع شاهدا يشهد بشيء لم يجز أن يشهد على شهادته
إلا أن يشهده وكذلك لو سمعه يشهد الشاهد على شهادته لم يسع السامع أن يشهد
ولا يحل للشاهد إذا رأى خطه أن يشهد إلا أن يذكر الشهادة
ولا تقبل شهادة الأعمى ولا المملوك ولا المحدود في قذف وإن تاب ولا شهادة الوالد لولده وولد ولده ولا شهادة الولد لأبويه وأجداده
ولا تقبل شهادة أحد الزوجين للآخر
ولا شهادة المولى لعبده ولا لمكاتبه ولا شهادة الشريك لشريكه فيما هو من شركتهما
وتقبل شهادة الرجل لأخيه وعمه
ولا تقبل شهادة مخنث ولا نائحة ولا مغنية ولا مدمن الشرب على اللهو ولا من يلعب بالطيور ولا من يغني للناس
ولا من يأتي بابا من الكبائر التي يتعلق بها الحد ولا من يدخل الحمام بغير إزار أو يأكل الربا ولا المقامر بالنرد والشطرنج ولا من يفعل الأفعال المستخفة كالبول على الطريق والأكل على الطريق
ولا تقبل شهادة من يظهر سب السلف وتقبل شهادة أهل الأهواء إلا الخطابية
وتقبل شهادة أهل الذمة بعضهم على بعض وإن اختلفت مللهم ولا تقبل شهادة الحربي على الذمي
وإن كانت الحسنات أغلب من السيئات والرجل ممن يجتنب الكبائر قبلت شهادته وإن أمل بمعصية
وتقبل شهادة الأقلف
والخصي وولد الزنا وشهادة الخنثى جائزة
وإذا وافقت الشهادة
الدعوى قبلت وإن خالفتها لم تقبل ويعتبر اتفاق الشاهدين في اللفظ والمعنى عند أبي حنيفة
فإن شهد أحدهما بألف والآخر بألفين لم تقبل الشهادة وإن شهد أحدهما بألف والآخر بألف وخمسمائة والمدعي يدعي ألفا وخمسمائة قبلت شهادتهما بألف
وإذا شهد أحدهما لأفل وقال: قضاه منها خمسمائة قبلت شهادته بألف ولم يسمع قوله: إنه قضاه إلا أن يشهد معه آخر وينبغي للشاهد إذا علم ذلك أن لا يشهد بألف حتى يقر المدعي أنه قبض خمسمائة
وإذا شهد شاهدان أن زيدا قتل يوم النحر بمكة وشهد آخران أنه قتل يوم النحر بالكوفة واجتمعوا عند الحاكم لم يقبل الشهادتين فإن سبقت إحداهما فقضى بها ثم حضرت الأخرى لم تقبل ولا يسمع القاضي الشهادة على جرح ولا يحكم بذلك
ولا يجوز للشاهد أن يشهد بشيء لم يعاينه إلا النسب والموت والنكاح والدخول وولاية القاضي فإنه يسعه أن يشهد بهذه الأشياء إذا اخبره بها من يثق به
والشهادة على الشهادة جائزة في كل حق لا يسقط بالشبهة ولا تقبل في الحدود والقصاص
وتجوز شهادة شاهدين على شهادة شاهدين ولا تقبل شهادة واحد على شهادة واحد
وصفة الإشهاد أن يقول شاهد لشاهد الفرع: اشهد على شهادتين أني أشهد أن فلان ابن فلان أقر عندي بكذا وأشهدني على نفسه وإن لم يقل: أشهدني على نفسه جاز ويقول شاهد الفرع عند الأداء: أشهد أن فلان ابن فلان أشهدني على شهادته أنه يشهد أن فلانا أقر عنده بكذا وقال لي: اشهد على شهادتي بذلك
ولا تقبل شهادة شهود الفرع إلا أن يموت شهود الأصل أو يغيبوا مسيرة ثلاثة أيام فصاعدا أو يمرضوا مرضا لا يستطيعون معه حضور مجلس الحاكم
وإن عدل شهود
الأصل شهود الفرع جاز
فإن سكتوا عن تعديلهم جاز وينظر القاضي في حالهم وإن أنكر شهود الأصل الشهادة لم تقبل شهادة شهود الفرع
وقال أبو حنيفة في شاهد الزور: أشهر في السوق ولا أعزره وقال أبو يوسف ومحمد: نوجعه ضربا ونحبسه
## باب الرجوع عن الشهادة
إذا رجع الشهود عن شهادتهم قبل الحكم بها سقطت وإن حكم بشهادتهم ثم رجعوا لم يفسخ الحكم ووجب عليهم ضمان ما أتلفوه بشهادتهم ولا يصح الرجوع إلا بحضرة الحاكم
وإذا شهد شاهدان بمال فحكم الحاكم به ثم رجعا ضمنا المال المشهود عليه وإن رجع أحدهما ضمن النصف وإن شهد بالمال ثلاثة فرجع أحدهم فلا ضمان عليه فإن رجع آخر ضمن الراجعان نصف المال
وإن شهد رجل وامرأتان فرجعت امرأة ضمنت ربع الحق وإن رجعنا ضمنتا نصف الحق
وإن شهد رجل وعشر نسوة ثم رجع ثمان منهن فلا ضمان عليهن وإن رجعت آخرى كان على النسوة ربع الحق فإن رجع الرجل والنساء فعلى الرجل سدس الحق وعلى النسوة خمسة أسداس الحق عند أبي حنيفة وقال أبو يوسف ومحمد: على الرجل النصف وعلى النسوة النصف
وإن شهد شاهدان على امرأة بالنكاح بمقدار مهر مثلها ثم رجعا فلا ضمان عليهما وكذلك إن شهدا على رجل بتزوج امرأة بمقدار مهر مثلها وإن شهدا بأكثر من مهر المثل ثم رجعا ضمنا الزيادة
وإن شهدا ببيع بمثل القيمة أو أكثر ثم رجعا لم يضمنا وإن كان بأقل من القيمة ضمنا النقصان
وإن شهدا على رجل أنه طلق امرأته قبل الدخول ثم رجعا ضمنا نصف
المهر فإن كان الدخول لم يضمنا وإن شهدا أنه أعتق عبده ثم رجعا ضمنا قيمته
وإن شهدا بقصاص ثم رجعا بعد القتل ضمنا الدية ولا يقتص منهما
وإذا رجع شهود الفرع ضنوا وإن رجع شهود الأصل وقالوا: لم نشهد شهود الفرع على شهادتنا فلا ضمان عليهم وإن قالوا: أشهدناهم وغلطنا ضمنوا
وإن قال شهود الفرع: كذب شهود الأصل أو غلطوا في شهادتهم ثم يلتفت إلى ذلك
وإذا شهدوا أربعة بالزنا وشاهدان بالإحصان فرجع شهود الإحصان لم يضمنوا وإذا رجع المزكون عن التزكية ضمنوا
وإذا شهد شاهدان باليمين وشاهدان بوجود الشرط ثم رجعوا فالضمان على شهود اليمين خاصة
# كتاب أدب القاضي
لا تصح ولاية القاضي حتى يجتمع في المولى شرائط الشهادة
ويكون من أهل الاجتهاد ولا بأس بالدخول في القضاء لمن يثق أنه يؤدي فرضه ويكره الدخول فيه لمن يخاف العجز عنه ولا يأمن على نفسه الحيف فيه ولا ينبغي أن يطلب الولاية ولا يسألها
ومن قلد القضاء يسلم إليه ديوان القاضي الذي قبله وينظر في حال المحبوسين فمن اعترف بحق ألزمه إياه ومن أنك لم يقبل قول المعزول عليه إلا بينة وإن لم تقم بينة لم يعجل بتخليته حتى ينادي عليه ويستظهر في أمره
وينظر في الودائع وارتفاع الوقوف فيعمل على ما تقوم به البينة أو يعترف به من هو في يده
ولا يقبل قول المعزول إلا أن يعترف الذي هو في يده أن
المعزول سلمها إليه فيقبل قوله فيها
ويجلس للحكم جلوسا ظاهرا في المسجد
ولا يقبل هدية إلا من ذي رحم محرم أو ممن جرت عادته قبل القضاء بمهاداته
ولا يحضر دعوة إلا أن تكون عامة ويشهد الجنازة ويعود المريض
ولا يضيف أحد الخصمين دون خصمه وإذا حضرا سوى بينهما في المجلوس والإقبال: ولا يسار أحدهما ولا يشير إليه ولا يلقنه حجة
فإذا ثبت الحق عند وطلب صاحب الحق حبس
غريمه لم يعجل بحبسه وأمره بدفع ما عليه فإن امتنع حبسه
في كل دين لزمه بدلا عن مال حصل في يده كثمن المبيع وبدل القرض أو التزمه بعقد كالمهر والكفالة
ولا يحبسه فيما سوى ذلك إذا قال: إني فقير إلا أن يثبت غريمه أن له مالا ويحبسه شهرين أو ثلاثة ثم يسأل عنه فإن لم يظهر له مال خلى سبيله
ولا يحول بينه وبين غرمائه
ويحبس الرجل في نفقة زوجته ولا يحبس والد في دين ولده إلا إذا امتنع من الإنفاق عليه
ويجوز قضاء المرأة في كل شيء إلا في الحدود والقصاص
ويقبل كتاب القاضي إلى القاضي في الحقوق إذا شهد به عنده فإن شهدوا على خصم حكم بالشهادة وكتب بحكمه وإن شهدوا بغير حضرة خصم لم يحكم وكتب بالشهادة ليحكم بها المكتوب إليه
ولا يقبل الكتاب إلا بشهادة رجلين أو رجل وامرأتين ويجب أن يقرأ الكتاب عليهم ليعوفوا ما فيه ثم يختمه بحضرتهم ويسلمه إليهم فإذا وصل إلى القاضي لم يقبله إلا بحضرة الخصم فإن شهدوا أنه كتاب فلان القاضي سلمه إلينا في مجلس حكمه وقرأه علينا وختمه فضه القاضي وقرأه على الخصم وألزمه ما فيه
ولا يقبل كتاب القاضي إلى القاضي في الحدود والقصاص وليس للقاضي أن يستخلف على القضاء إلا أن يفوض ذلك إليه
وإذا رفع القاضي حكم حاكم أمضاه
إلا أن يخالف الكتاب أو السنة أو الإجماع أو يكون قولا لا دليل عليه
ولا يقضي القاضي على غائب إلا أن يحضر من يقوم مقامه
وإذا حكم رجلان رجلا ليحكم بينهما ورضيا بحكمه جاز إذا كان
بصفة الحاكم
ولا يجوز تحكيم الكافر والعبد والذمي والمحدود في القذف والفاسق والصبي
ولكل واحد من المحكمين أن يرجع ما لم يحكم عليهما فإذا حكم لزمهما وإذا رفع حكمه إلى القاضي فوافق مذهبه أمضاه وإن خالفه أبطله
ولا يجوز التحكيم في الحدود والقصاص
وإن حكما في دم خطإ فقضى الحاكم على العاقلة بالدية لم ينفذ حكمه
ويجوز أن يسمع البينة ويقضي بالنكول
وحكم الحاكم لأبويه وولده وزوجته باطل
# كتاب القسمة
ينبغي للإمام أن ينصب قاسما يرقه من بيت المال ليقسم بين الناس بغير أجرة
فإن لم يفعل نصب قاسما بالأجرة
ويجب أن يكون عدلا مأمونا عالما بالقسمة
ولا يجبر القاضي الناس على قاسم واحد ولا يترك القسام يشتركون
وأجر القسمة على عدد الرؤوس عند أبي حنيفة وقال أبو يوسف ومحمد: على قدر الأنصاء
وإذا حضر الشركاء وفي أيديهم دار أو ضيعة ادعوا أنهم رثوها عن فلان لم يقسمها عند أبي حنيفة
حتى يقيموا البيئة على موته وعدد ورثته
وقال أبو يوسف ومحمد: يقسمها باعترافهم ويذكر في كتاب القسمة أنه قسمها بقولهم وإذا كان المال المشترك ما سوى العقار وادعوا أنه ميراث قسمه في قولهم جميعا وإن ادعوا في العقار اشتروه قسمه بينهم وإن ادعوا الملك ولم يذكروا كيف انتقل قسمه بينهم
وإذا كان كل واحد من الشركاء ينتفع بنصيبه قسم بطلب أحدهم
وإن كان أحدهم ينتفع والآخر يستضر لقلة نصيبه فإن طلب صاحب الكثير قسم وإن طلب صاحب القليل لم يقسم وإن كان كل واحد يستضر لم يقسمها إلا بتراضيها
ويقسم العروض إذا كانت من صنف واحد ولا يقسم الجنسان بعضهما في بعض
وقال أبو حنيفة: لا يقسم الرقيق ولا الجوهر لتفاوته وقال أبو يوسف ومحمد: يقسم الرقيق
ولا يقسم حمام ولا بئر ولا رحى إلا أن يتراضى الشركاء
وإذا حضر وارثان وأقاما البينة على الوفاة وعدد الورثة والدار في أيديهم ومعهم وارث غائب قسمها القاضي بطلب الحاضرين وينصب للغائب وكيلا يقبض نصيبه
وإن كانوا مشترين لم يقسم مع غيبة أحدهم
وإن كان العقار في يد الوارث الغائب لم يقسم وإن حضر وارث واحد لم يقسم
وإذا كانت دور مشتركة في مصر واحد قسمت كل دار على
حدتها في قول أبي حنيفة رحمه الله
وقالا: إن كان الأصلح لهم قسمة بعضها في بعض قسمها
وإن كانت دار وضيعة أو دار وحانوت قسم كل واحد على حدته
وينبغي للقاسم: أن يصور ما يقسمه ويعدله ويذرعه ويقوم البناء ويفرز كل نصيب عن الباقي بطريقة وشربه حتى لا يكون لنصيب بعضهم بنصيب الآخر تعلق ثم يلقب نصيبا بالأول
والذي يليه بالثاني والثالث وعلى هذا ثم يخرج القرعة فمن خرج اسمه أولا فله السهم الأول ومن خرج ثانيا فله السهم الثاني
ولا يدخل في القسمة الدراهم والدنانير إلا بتراضيهم
وإن قسم بينهم ولأحدهم مسيل ي مل الآخر أو طريق لم يشترط في القسمة: فإن أمكن صرف الطريق والمسيل عنه فليس له أن يستطرق ويسيل في نصيب الآخر وإن لم يمكن فسخت القسمة
وإن كان سفل لا علو له وعلو لا سفل له وسفل له علو قوم كل واحد على حدته وقسم بالقيمة ولا معتبر بغير ذلك
وإذا اختلف المتقاسمون فشهد القاسمان قبلت شهادتهما
فإن ادعى أحدهما الغلط وزعم أن مما أصابه شيئا في يد صاحبه وقد أشهد على نفسه بالاستيفاء لم يصدق على ذلك إلا ببينة
وإن قال: استوفيت حقي ثم قال: أخذت بعضه فالقول قول خصمه مع يمينه
وإن قال: أصابني إلى موضع كذا فلم تسلمه إلىولم يشهد على نفسه بالاستيفاء وكذبه شريكه تحالفا وفسخت القسمة
وإن استحق بعض نصيب أحدهما بعينه لم تفسخ القسمة عند أبي حنيفة ورجع بحصة ذلك من نصب شريكه وقال أبو يوسف: تفسخ القسمة
# كتاب الإكراه
الإكراه يثبت حكمه إذا حصل ممن يقدر على إيقاع ما توعد به سلطانا كان أو لصا
وإذا أكره الرجل على بيع ماله أو على شراء سلعة أو على أن يقر لرجل بألف أو يؤاجر داره - وأكره على ذلك بالقتل أو بالضرب الشديد أو بالحبس المديد - فباع أو اشترى فهو بالخيار: إن شاء أمضى البيع وإن شاء فسخه
وإن كان قبض الثمن طوعا فقد أجاز البيع وإن كان قبضه مكرها فليس بإجازة وعليه رده إن كان قائما في يده وإن هلك المبيع في يد المشتري وهو غير مكره ضمن قيمته
وللمكره أن يضمن المكره إن شاء
ومن أكره على أن يأكل الميتة أو يشرب الخمر - وأكره على ذلك بحبس أو ضرب أو يد لم يحل له إلا أن يكره بما يخاف منه على نفسه أو على عضو من أعضائه فإذا خاف ذلك وسعه أن يقدم على ما أكره عليه ولا يسعه أن يصبر على ما توعد به فإن صبر حتى أوقعوا به ولم يأكل فهو آثم
وإن أكره على الكفر بالله عز وجل أو سب النبي عليه الصلاة والسلام: بقيد أو حبس أو ضرب لم
يكن ذلك إكراها حتى يكره بأمر يخاف منه على نفسه أو على عضو من أعضائه
فإذا خاف ذلك وسعه أن يظهر ما أمروه به ويوري فإذا أظهر ذلك وقلبه مطمئن بالإيمان فلا إثم عليه وإن صبر حتى قتل ولم
يظهر الكفر ذلك كان مأجورا
وإن أكره على إتلاف مال مسلم لأمر يخاف منه على نفسه أو على عضو من أعضائه وسعه أن يفعل ذلك ولصاحب المال أن يضمن المكره
وإن أكره بقتل على قتل لم يسعه أن يقدم عليه ويصبر حتى يقتل فإن قتله كان آثما والقصاص على الذي أكرهه إن كان القتل عمدا
وإن أكرهه على طلاق امرأته أو أعتق عبده ففعل وقع ما أكره عليه ويرجع على الذي أكرهه بقيمة العبد وبنصف مهر المرأة إن كان الطلاق قبل الدخول
وإن أكرهه على الزنا وجب عليه الحد عند أبي حنيفة إلا أن يكرهه السلطان وقال أبو يوسف ومحمد: لا يلزمه الحد
وإذا أكره على الردة لم تبن امرأته منه
# كتاب السير
الجهاد فرض على الكفاية إذا قام به فريق من الناس سقط عن الباقين وإن لم يقم به أحد أثم جميع الناس بتركه
وقتال الكفار واجب وإن لم يبدؤونا ولا يجب الجهاد على صبي ولا عبد ولا امرأة ولا أعمى ولا مقعد ولا أقطع
وإن هجم العدو على بلد وجب على جميع المسلمين الدفع تخرج المرأة بغير إذن زوجها والعبد بغير إذن المولى
وإذا دخل المسلمون دار الحرب فحاصروا مدينة أو حصنا دعوهم إلى الإسلام فإن أجابوهم كفوا عن قتالهم وإن امتنعوا دعوهم إلى أداء الجزية فإن بذلوها فلهم ما للمسلمين وعليهم ما عليهم
ولا يجوز أن يقاتل من لم تبلغه دعوة الإسلام إلا بعد أن يدعوهم ويستحب أن يدعو من بلغته الدعوة ولا يجب ذلك وإن أبوا استعانوا بالله تعالى عليهم وحاربوهم ونصبوا عليهم المجانيق وحرقوهم وأرسلوا عليهم الماء وقطعوا أشجارهم وأفسدوا زروعهم ولا بأس برميهم وإن كان فيهم مسلم أسير أو تاجر وإن تترسوا بصبيان المسلمين أو بالأسارى لم يكفوا
عن رميهم ويقصدون بالرمي الكفار
ولا بأس بإخراج النساء والمصاحف مع المسلمين إذا كان عسكرا عظيما يؤمن عليه ويكره إخراج ذلك في سرية لا يؤمن عليها
ولا تقاتل المرأة إلا بإذن زوجها ولا العبد إلا بإذن سيده إلا أن يهجم العدو
وينبغي للمسلمين أن لا يغدروا ولا يغلوا ولا
يمثلوا ولا يقتلوا امرأة أو شيخا فانيا ولا صبيا ولا أعمى ولا مقعدا إلا أن يكون هؤلاء ممن له رأي في الحرب أو تكون المرأة ملكة ولا يقتلوا مجنونا
وإذا رأى الأمام أن يصالح أهل الحرب أو فريقا منهم وكان في ذلك مصلحة للمسلمين فلا بأس به وإن صالحهم مدة ثم رأى أن نقض الصلح أنفع نبذ إليهم وقاتلهم
وإن بدؤوا بخيانة قاتلهم ولم ينبذ إليهم إذا كان ذلك باتفاقهم
وإذا خرج عبيدهم إلى عسكر المسلمين فهم أحرار
ولا بأس بأن يعلق العسكر في دار الحرب ويأكلوا ما وجدوه من الطعام
ويستعملون الحطب ويدهنون بالدهن ويقاتلون بما يجدونه من السلاح بغير قسمه ذلك ولا يجوز أن يبيعوا من ذلك شيئا لوا يتمولوه
ومن أسلم منهم أحرز بإسلامه نفسه وأولاد الصغار وكل مال هو في يده أو وديعة في يد مسلم أو ذمي فإن ظهرنا على الدار فعقاره فيء وزوجته فيء وحملها فيء وأولاده فيء
ولا ينبغي أن يباع السلاح من أهل الحرب ولا يجهز إليهم ولا يفدون بالأسارى عند أبي حنيفة وقال أبو يوسف ومحمد: يفادى بهم أسارى المسلمين ولا يجوز المن عليهم
وإذا فتح الإمام بلدا عنوة فهو بالخيار: إن شاء قسمه بين الغانمين وإن شاء أقر أهله عليه ووضع عليهم الخراج وهو في الأسارى بالخيار: إن شاء قتلهم وإن شاء استرقهم وإن شاء تركهم أحرارا ذمة للمسلمين
ولا يجوز أن يردهم إلى دار الحرب
وإذا أراد العود معهم مواش فلم يقدروا على نقلها إلى دار الإسلام ذبحوها وحرقوها ولا يعقرونها ولا يتركونها
ولا يقسم غنيمة في دار الحرب حتى يخرجها إلى دار الإسلام والردء والمقاتل في العسكر سواء
وإذا لحقهم المدد في دار الحرب قبل أن يخرجوا الغنيمة إلى دار الإسلام شاركوهم فيها ولا حق لأهل سوق العسكر في الغنيمة إلا أن يقاتلوا
وإذا أمن رجل حر أو امرأة كافرا أو جماعة أو أهل حصن أو مدينة صح أمانهم ولم يجز لأحد من المسلمين قتلهم إلا أن يكون في ذلك مفسدة فينبذ إليهم الإمام
ولا يجوز أمان ذمي ولا أسير ولا تاجر يدخل عليهم
ولا يجوز أمان العبد عند أبي حنيفة إلا أن يأذن له مولاه في القتال وقال أبو يوسف ومحمد: يصح أمانة
وإذا غلب الترك على الروم فسبوهم وأخذوا أموالهم ملكوها فإن غلبنا على الترك حل لنا من ذلك وإذا غلبوا على أموالنا فأحرزوها بدارهم ملكوها فإن ظهر عليها المسلمون فوجدوها قبل القسمة فهي لهم بغير شيء وإن وجدوها بعد القسمة أخذوها
بالقيمة إ أحبوا
وإن دخل دار الحرب تاجر فاشترى ذلك وأخرجه إلى دار الإسلام فمالكه بالخيار: إن شاء أخذه بالثمن الذي اشتراه به التاجر وإن شاء ترك
ولا يملك علينا أهل الحرب بالغلبة مدبرينا ومكاتبنا وأمهات أولادنا وأحرارنا ونملك عليهم جميع ذلك وإذا أبق عبد لمسلم فدخل إليهم فأخذوه لم يملكوه عند أبي حنيفة
وإن ند تعير إليهم فأخذوه ملكوه
وإذا لم يكن للإمام حمولة يحمل عليها
الغنائم قسمها بين الغانمين قسمة إيداع ليحملوها إلى دار الإسلام ثم يرتجعها فيقسمها
ولا يجوز بيع الغنائم قبل القسمة
ومن مات من الغانمين في دار الحرب فلا حق له في الغنيمة ومن مات منهم بعد إخراجها إلى دار الإسلام فنصيبه لورثته
ولا بأس أن ينقل الإمام في حال القتال ويحرض بالنفل على القتال فيقول: من قتل قتيلا فله سلبه أو يقول لسرية: قد جعلت لكم الربع بعد الخمس
ولا ينقبل بعد إحراز الغنيمة إلا من الخمس وإذا لم يجعل السلب للقاتل فهو من جملة الغنيمة والقاتل وغيره فيه سواء
والسلب: ما على المقتول من ثيابه وسلاحه ومركبه
وإذا خرج المسلمون من دار الحرب لم يجز أن يعلفوا من الغنيمة ولا يأكلوا منها
ومن فضل معه علف أو طعام إلى الغنية
ويقسم الإمام الغنيمة:
فيخرج خمسها ويقسم أربعة أخماسها بين الغانمين: للفارس سهما وللراجل سهم عند أبي حنيفة وقالا: للفارس ثلاثة أسهم ولا يسهم إلا لفرس واحد والبراذين والعتاق سواء ولا يسهم لراحلة ولا بغل
ومن دخل دار الحرب فارسا فنفق فرسه استحق سهم فارس ومن دخل راجلا فاشترى فرسا استحق سهم راجل
ولا يسهم لمملوك ولا امرأة ولا ذمي ولا صبي ولكن يرضخ لهم على حسب ما يراه الإمام
وأما الخمس فيقسم على ثلاثة أسهم: سهم لليتامى وسهم للمساكين
وسهم
لأبناء السبيل يدخل فقراء ذوي القربى فيهم ويقدمون ولا يدفع إلى أغنيائهم شيء
وما ذكر الله تعالى في الخمس فإنما هو لافتتاح الكلام تبركا باسمه وسهم النبي صلى الله عليه وآله وسلم سقط بموته كما سقط الصفي وسهم ذوي القربى كانوا يستحقونه في زمن النبي صلى الله عليه وآله وسلم بالنصرة وبعده بالفقر
وإذا دخل الواحد أو الاثنان إلى دار الحرب مغيرين بغير إذن الإمام فأخذوا شيئا لم يخمس
وإن دخل جماعة لها منعة وأخذوا شيئا خمس وإن لم يأذن لهم الإمام
وإذا دخل المسلم دار الحرب تاجرا فلا يحل له أن يتعرض لشيء من أموالهم ولا من دمائهم
وإن غدر بهم وأخذ شيئا وخرج به ملكه ملكا محظورا ويؤمر أن يتصدق به
وإذا دخل الحربي إلينا مستأمنا لم يمكن أن يقيم في دارنا سنة ويقول له الإمام: إن أقمت تمام السنة وضعت عليك الجزية فإن أقام أخذ منه الجزية وصار ذميا ولم يترك أن يرجع إلى دار الحرب وإن عاد إلى دار الحرب وترك وديعة عند مسلم أو ذمي أو دينا في ذمتهم فقد صار ذمه مباحا بالعود وما في دار الإسلام من ماله على خطر فإن أسر أو قتل سقطت ديونه وصارت الوديعة فيئا
وما أوجف عليه المسلمون من أموال أهل الحرب بغير قتال يصرف مصالح المسلمين كما يصرف الخراج
وأرض العرب كلها أرض عسير وهي: ما بين العذيب إلى أقصى حجر
باليمن بمهرة إلى حد
الشام، والسواد كلها أرض خراج وهي: ما بين العذيب إلى عقبة حلوان ومن العلث إلى عبادان
وأرض السواد مملوكه لأهلها: يجوز بيعهم لها وتصرفهم فيها
وكل أرض أسلم أهلها عليها أو فتحت عنوة وقسمت بين الغانمين فهي أرض عشر
وكل أرض فتحت عنوة وأقر عليها فهي أرض خراج
إحياء الموات
ومن أحيا أرضا مواتا فهي عند أبي يوسف معتبرة بحيزها: فإن كانت من حيز أرض الخارج فهي خراجية وإن كانت من حيز أرض العشر فهي عشرية والبصرة عنده عشرية بإجماع الصحابة رضي الله عنهم
وقال محمد: إن أحياها ببئر حفرها أو عين استخرجها أو ماء دجله أو الفرات أو الأنهار العظام التي لا يملكها أحد
فهي عشرية وإن أحياها بماء الأنهار التي احتفرها الأعاجم مثل نهر الملك ونهر يزدجرد فهي خراجية
والخراج الذي وضعه عمر رضي الله عنه على أهل السواد من كل جريب يبلغه الماء قفيز هاشمي وهو الصاع ودرهم ومن جريب الرطبة خمسة دارهم ومن جريب الكرم المتصل والنخل المتصل عشرة دارهم
وما سوى ذلك من الأصناف يوضع عليها بحسب الطاقة فإن لم تطق ما وضع عليها نقصهم الإمام
وإن غلب الماء على أرض الخراج أو انقطع عنها أو اصطلم الزرع آفة فلا خراج عليهم وإن عطلها صاحبها فعليه الخراج
ومن أسلم من أهل الخراج أخذ منه الخراج على حاله
ويجوز أن يشتري المسلم أرض الخراج من الذمي ويؤخذ منه الخراج ولا عشر في الخارج من أرض الخراج
والجزية على ضربين:
جزية توضع بالتراضي والصلح فتقدر بحسب ما يقع عليه الاتفاق وجزية يبتدئ الإمام وضعها إذا غلب الكفار وأقرهم على أملاكهم فيضع على الغني الظاهر الغني في كل سنة ثمانية وأربعين درهما يأخذ منه في كل شهر أربعة دراهم
وعلى المتوسط الحال أربعة وعشرين درهما في كل شهر درهمين وعلى الفقير المعتمل اثني عشر درهما في كل شهر درهما
وتوضع الجزية على أهل الكتاب والمجوس وعبدة الأوثان من العجم ولا توضع على عبدة الأوثان من العرب ولا على المرتدين
ولا جزية على امرأة ولا صبي ولا زمن ولا أعمى ولا فقير غير معتمل ولا الرهبان الذين لا
يخالطون الناس
ومن أسلم وعليه جزية سقطت عنه وإن اجتمع حولان تداخلت الجزية
ولا يجوز إحداث بيعة ولا كنيسة في دار الإسلام وإذا انهدمت الكنائس البيع القديمة أعادوها
ويؤخذ أهل الذمة بالتميز عن المسلمين في زيهم ومراكبهم وسروجهم وقلانسهم ولا يركبون الخيل ولا يحملون السلاح
ومن امتنع من أداء الجزية أو قتل مسلما أو سب النبي عليه الصلاة والسلام أو زنى بمسلمة لم ينقض عهده ولا ينتقض العهد إلا بأن يلحق بدار الحرب أو يغلبوا على موضع فيحاربونا
وإذا ارتد المسلم عن الإسلام عرض عليه السلام فإن كانت له شبهة كشفت له ويحبسن ثلاثة أيام فإن أسلم
وإلا قتل فإن قتله قاتل قبل عرض الإسلام عليه كره له ذلك ولا شيء على القاتل
فأما المرأة إذا ارتدت فلا تقتل ولكن تحبس حتى تسلم
ويزول ملك المرتد عن أمواله بردته زوالا مراعى فإن أسلم عادت على حالها وإن مات أو قتل على ردته انتقل ما كان اكتسبه في حال الإسلام إلى ورثته المسلمين
وكان ما اكتسبه في حال ردته فيئا
فإن لحق بدرا الحرب مرتدا وحكم الحاكم بلحاقه عتق مدبروه وأمهات أولاده وحلت الديون التي عليه ونقل ما اكتسبه في حال الإسلام إلى ورثته المسلمين وتقضى الديون التي لزمته في حال الإسلام مما اكتسبه في حال الإسلام وما لزمه من الديون في حال ردته مما اكتسبه في حال ردته
وما باعه أو اشتراه أو تصرف فيه من أمواله في حال ردته
موقوف: فإن أسلم صحت عقوده وإن مات أو قتل أو لحق بدار الحرب بطلت
وإن عاد المرتد بعد الحكم بلحاقه إلى دار الإسلام مسلما فما وجده في يد ورثته من
ماله بعينه أخذه
والمرتدة إذا انصرفت في مالها في حال ردتها جاز تصرفها
ونصارى بني تغلب يؤخذ من أموالهم ضعف ما يؤاخذ من المسلمين من الزكاة ويؤخذ من نسائهم ولا يؤخذ من صبيانهم
وما جباه الإمام من الخراج ومن أموال بني تغلب وما أهداه أهل الحرب إلى الإمام والجزية تصرف في مصالح المسلمين فتسد منها الثغور وتبنى القناطر والجسور ويعطى قضاة المسلمين وعلماؤهم منه ما يكفيهم ويدفع منه أرزاق المقاتلة وذراريهم
# كتاب البغاة
إذا تغلب قوم من المسلمين على بلد وخرجوا عن طاعة الإمام
دعاهم إلى العود إلى الجماعة وكشف عن شبهتهم ولا يبدؤهم بالقتال حتى يبدؤوا فإن بدؤوا قاتلهم حتى يفرق جمعهم فإن كانت لهم فئة أجهز على جريحهم واتبع موليهم وإن لم يكن لهم فئة لم يجهز على جريحهم ولم يتبع موليهم ولا تسبى لهم ذرية ولا يغنم لهم مال ولا بأس أن يقاتلوا بسلاحهم
إن احتاج المسلمون إليه ويحبس الإمام أموالهم ولا يردها عليهم ولا يقسمها حتى يتوبوا فيردها
وما جناه أهل البغي من البلاد التي غلبوا عليها من الخراج والعشر لم يأخذه الإمام ثانيا فإن كانوا صرفوه في حقه أجزأ من أخذ منه وإن لم يكونوا صرفوه في حقه أفتى أهله فيما بينهم وبين الله تعالى أن يعيدوا ذلك
# كتاب الحظر والإباحة
لا يحل للرجال لبس الحرير ويحل للنساء ولا بأس بتوسده
عند أبي حنيفة وقال أبو يوسف ومحمد: يكره توسده
ولا بأس بلبس الديباج في الحرب عندهما ويكره عند أبي حنيفة
ولا بأس بلبس الملحم إذا كان سداه إبرسما ولحمته قطنا أو خزا
ولا يجوز للرجال التحلي بالذهب والفضة إلا الخاتم والمنطقة وحلية السيف من الفضة
ويجوز للنساء التحلي بالذهب والفضة ويكره أن يلبس الصبي الذهب والحرير
ولا يجوز الأكل والشرب والادهان والتطيب في آنية الذهب والفضة للرجال والنساء
ولا بأس باستعمال آنية الزجاج والبلور والعقيق
ويجوز الشرب في الإناء المفضض عند أبي حنيفة والركوب على السرج المفضض والجلوس على السرير المفضض
ويكره التعشير في المصحف والنفط
ولا بأس بتحلية المصحف ونقش المسجد وزخرفته بماء الذهب
ويكره استخدام الخصيان
ولا بأس بخصاء البهائم وإنزاء الحمير على النخيل
ويجوز أن يقبل في الهدية والإذن قول الصبي والعبد ويقبل في المعاملات قول الفاسق
ولا يقبل في أخبار الديانات إلا قول العدل ولا يجوز أن ينظر الرجل من الأجنبية إلا إلى وجهها وكفيها وإن كان لا يأمن الشهوة لا ينظر إلى وجهها إلا لحاجة
ويجوز للقاضي إذا أرد أن يحكم عليها وللشاهد إذا أراد الشهادة عليها
النظر إلى وجهها وإن خاف أن يشتهي
ويجوز للطبيب أن ينظر إلى موضع المرض منها
وينظر الرجل من الرجل إلى جميع بدنه إلا ما بين سرته إلى ركبته
ويجوز للمرأة أن تنظر من الرجل إلى ما ينظر الرجل إليه منه وتنظر المرأة من المرأة إلى ما يجوز للرجل أن ينظر إليه من الرجل
وينظر الرجل من أمته التي تحل له وزوجته إلى فرجها
وينظر الرجل من ذوات محارمه إلى الوجه والرأس والصدر والساقين والعضدين ولا ينظر إلى ظهرها وبطنها
ولا بأس أن يمس ما جاز أن ينظر إليه منها
وينظر الرجل من مملوكه غيره إلى ما يجوز أن ينظر إليه من ذوات محارمه
ولا بأس بأن يمس ذلك إذا أراد الشراء وإن خاف أن يشتهي
والخصي في النظر إلى الأجنبية كالفحل
ولا يجوز للمملوك أن ينظر من سيدته إلا إلى ما يجوز للأجنبي أن ينظر إليه منها
ويعزل عن أمته بغير إذنها ولا يعزل عن زوجته إلا بإذنها
ويكره الاحتكار في أقوات الآدميين
والبهائم إذا كان ذلك في بلد يضر الاحتكار بأهله ومن احتكر غلة ضيعته أو ما جلبه من بلد آخر فليس بمحتكر
ولا ينبغي للسلطان أن يسعر على الناس
ويكره بيع السلاح في أيام الفتنة ولا بأس ببيع العصير ممن يعلم أنه يتخذه خمرا
# كتاب الوصايا
الوصية غير واجبة وهي مستحبة ولا تجوز الوصية لوارث
إلا أن يجيزها الورثة ولا يجوز الوصية بما زاد على الثلث ولا للقاتل
ويجوز أن يوصي المسلم للكافر والكافر للمسلم
وقبول الوصية بعد الموت فإن قبلها الموصى له في حال الحياة أو ردها فذلك باطل
ويستحب أن يوصي الإنسان بدون الثلث
وإذا أوصى إلى رجل فقبل الوصي في وجه الموصي فردها في غير وجهه فليس برد وإن ردها في وجهه فهو رد
والموصى به يملك بالقبول إلا في مسألة وهي: أن يموت الموصي ثم يموت الموصى له قبل القبول فيدخل الموصى به في ملك ورثته
ومن أوصى إلى عبد أو كافر أو فاسق أخرجهم القاضي من الوصية ونثب غيرهم
ومن أوصى إلى عبد نفسه وفي الورثة كبار لم تصح الوصية
ومن أوصى إلى من يعجز عن القيام بالوصية صم إليه القاضي غيره
ومن أوصى إلى اثنين لم يجز لأحدهما أن يتصرف عند أبي حنيفة ومحمد دون صاحبه إلا من شراء كفن الميت وتجهيزه وطعام الصغار وكسوتهم ورد وديعة بعينها وقضاء دين وتنفيذ وصية بعينها وعتق عبد بتعينه والخصومة في حقوق الميت
ومن أوصى لرجل بثلث ماله ولآخر بثلث ماله فلم تجز الورثة فالثلث بينهما نصفان وإن أوصى لأحدهما بالثلث وللآخر بالسدس فالثلث بينهما أثلاثا وإن أوصى لأحدهما بجميع ماله وللآخر بثلث ماله فلم تجز الورثة فالثلث بينهما على أربعة أسهم عند أبي يوسف ومحمد وقال أبو حنيفة: الثلث بينهما نصفان ولا يضرب أبو حنيفة للموصى له بما زاد على الثلث إلا في المحاباة والسعاية والدراهم المرسلة
ومن أوصى وعليه دين يحيط بماله لم تجز الوصية إلا أن يبرئ الغرماء الدين
ومن أوصى بنصيب ابنه فالوصية باطلة وإن أوصى بمثل
نصيب ابنه جازت فإن كان له ابنان فللموصى له الثلث
ومن أعتق عبدا في مرضه أو باع وحابى أو وهب فذلك كله جائز يعتبر من الثلث ويضرب به مع أصحاب الوصايا
فإن حابى ثم أعتق بالمحاباة أولى عند أبي حنيفة وإن أعتق ثم حابى فهما سواء وقال أ [ويوسف ومحمد: العتق أولى في المسألتين
ومن أوصى بسهم من ماله فله أخس سهام الورثة إلا أن ينقص من السدس فيتم له السدس
وإن أوصى بجزء من ماله قيل للورثة: أعطوه ما شئتم
ومن أوصى بوصايا من حقوق الله تعالى قدمت الفرائض منها قدمها الموصي أو آخرها
مثل الحج والزكاة والكفارات وما ليس بواجب قدم منه ما قدمه الموصي
ومن أوصى بحجة الإسلام أحجوا عنه رجلا من بلده يحج عنه راكبا فإن لم تبلغ الوصية النفقة أحجوا عنه من حيث تبلغ
ومن خرج من بلده حاجا فمات في الطريق وأوصى أن يحج عنه حج عنه من بلده عند أبي حنيفة
ولا تصح وصية الصبي والمكاتب وإن ترك وفاء
ويجوز للموصي الرجوع عن الوصية
فإن صرح بالرجوع أو فعل ما يدل على الرجوع كان رجوعا ومن جحد الوصية لم يكن رجوعا
ومن أوصى لجيرانه فهم الملاصقون عند أبي حنيفة
ومن أوصى لأصهاره فالوصية لكل ذي رحم محرم من امرأته ومن أوصى لأختانه فالختن كل ذات رحم محرم منه
ومن أوصى لأقربائه فالوصية للأقرب فالأقرب من كل ذي
رحمه محرم منه ولا يدخل فيهم الوالدان والولد
ويكون للإثنين فصاعدا وإذا أوصى بذلك وله عمان وخالان فالوصية لعميه عند أبي حنيفة وإن كان له عم وخالان فللعم النصف وللخالين النصف وقال أبو يوسف ومحمد: الوصية لكل من ينسب إلى أقصى أب له في الإسلام
ومن أوصى لرجل بثلث دراهمه أو ثلث غنمه فهلك ثلثا ذلك وبقي ثلثه وهو يخرج من ثلث ما بقي من ماله فله جميع ما بقي وإن أوصى بثلث ثيابه فهلك ثلثاها وبقي ثلثها وهو يخرج من ثلث ما بقي من ماله لم يستحق إلا ثلث ما بقي من الثياب
ومن أوصى لرجل بألف درهم وله مال عين ودين فإن خرجت الألف من ثلث العين دفعت إلى الموصى له وإن لم تخرج دفع إليه ثلث العين وكلما خرج شيء من الدين أخذ ثلثه حتى يستوفي الألف
وتجوز الوصية للحمل وبالحمل إذا وضع لأقل من ستة أشهر من يوم الوصية
ومن أوصى لرجل بجارية إلا حملها صحت الوصية والاستثناء
ومن أوصى لرجل بجارية فولدت بعد موت الموصي قبل أن يقبل الموصى له ولدا ثم قبل وهما يخرجان من الثلث فهما للموصى له وإن لم يخرجا من الثلث ضرب بالثلث وأخذ ما يخصه منهما جميعا في قول أبو يوسف ومحمد
وقال أبو حنيفة: يأخذ ذلك من الأم فإن فضل شيء أخذه من الولد
وتجوز الوصية بخدمة عبده وسكنى داره سنين معلومة وتجوز بذلك أبدا فإن خرجت رقبة العبد من الثلث سلم إليه للخدمة وإن كان لا مال له غيره خدم الورثة يومين والموصى له يوما فإن مات الموصى له عاد إلى الورثة وإن مات الموصى له في حياة الموصى بطلت الوصية
وإذا أوصى لولد فلان فالوصية بينهم: الذكر والأنثى فيه سواء
ومن أوصى لورثة فلان فالوصية بينهم: للذكر مثل حظ الأنثيين
ومن أوصى لزيد وعمرو بثلث ماله فإذا عمرو ميت فالثلث كله لزيد
وإن قال: ثلث مالي بين زيد وعمرو وزيد ميت كان لعمرو نصف الثلث
ومن أوصى بثلث ماله له ثم اكتسب مالا استحق الموصى له ثلث ما يملكه عند الموت والله أعلم
# كتاب الفرائض
المجمع على توريثهم من الذكور
عشرة: الابن وابن الابن وإن سفل والأب والجد أب الأب وإن علا والأخ وابن الأخ والعم وابن العم والزوج ومولى النعمة
ومن الإناث سبع: البنت وبنت الابن والأم والجدة والأخت والزوجة ومولاة النعمة
ولا يرث أربعة: المملوك والقاتل من المقتول والمرتد وأهل الملتين والفروض المحدودة في كتاب الله تعالى ستة: النصف
والربع والثمن والثلثان والثلث والسدس
فالنصف من الأب والأم والأخت من الأب إذا لم تكن أخت لأب وأم والزوج إذا لم يكن للميت ولد ولد ولا ولد ابن
والربع: فرض الزوج مع الولد أو ولد الابن والزوجات إذا لم يكن للميت ولد ولا ولد ابن
والثمن: فرض الزوجات مع الولد وولد الابن
والثلثان: لكل اثنين فصاعدا ممن فرضه النصف إلا الزوج
والثلث: للأم إذا لم يكن للميت ولد ولا ولد ابن ولا
اثنان من الإخوة والأخوات فصاعدا ويفرض لها في مسألتين - وهما: زوج وأبوان وامرأة وأبوان - ثلث ما يبقى بعد فرض الزوج أو الزوجة وهو لكل اثنين فصاعدا من ولد الأم: ذكورهم وإناثهم فيه سواء
والسدس: فرض سبعة: لكل واحد من الأبوين مع الولد أو ولد الابن وللأم مع الإخوة والأخوات من أي جهة كانوا وللجدات وللجد مع الولد أو ولد الابن ولبنات الابن مع البنت وللأخوات لأب مع الأخت لأب وأم وللواحد من ولد الأم
وتسقط الجدات بالأم والجد والإخوة والأخوات بالأب
ويسقط ولد الأم بأربعة: بالولد وولد الابن والأب والجد
وإذا استكمل البنات الثلثين سقطت بنات الابن إلا أن يكون بإزائهن أو أسفل منهن ابن ابن فيعصبهن
وإذا استكمل الأخوات لأب وأم الثلثين سقطت الأخوات لأب إلا أن يكون معهن أخ لهن فيعصبهن
١ - باب أقرب العصبات
وأقرب العصبات البنون ثم بنوهم ثم الأب ثم الجد ثم بنو الأب وهم الإخوة
ثم بنو الجد وهم الأعمام ثم بنوا أب الجد
وإذا استوى بنو أب في الدرجة فأولاهم من كان لأب وأم
والابن وابن الابن والإخوة يقاسمون أخواتهم للذكر مثل حظ الأنثيين ومن عداهم من العصبات ينفرد بالميراث ذكورهم دون إناثهم
وإذا لم يكن عصبة من النسب فالعصبة هو المولى المعتق ثم أقرب عصبة المولى
باب الحجب وتحجب الأم من الثلث إلى السدس بالولد أو بأخوين
والفاضل عن فرض البنات لبني الابن وأخواتهم للذكر مثل حظ الأنثيين
والفاضل عن فرض الأختين من الأب والأم للإخوة والأخوات من الأب للذكر مثل حظ الأنثيين
وإذا ترك بنتا ابن وبني ابن فللبنت النصف والباقي لبني الابن وأخواتهم للذكر مثل حظ الأنثيين وكذلك الفاضل عن فرض الأخت من الأب والأم لبني الأب وبنات الأب للذكر مثل حظ الأنثيين
ومن ترك ابني عم أحدهما أخ الأم فللأخ للأم السدس والباقي بنيهما
والمشركة: أن تترك المرأة زوجا وأما - أو جدة - وأختين من أم وأخا لأب وأم فللزوج النصف وللأم السدس ولولد الأم الثلث ولا شيء للأخوة من الأب والأم
باب الرد
والفاضل عن فرض ذوي السهام إذا لم يكن عصبة مردود عليهم بمقدار سهامهم إلا على الزوجين
ولا يرث القاتل من المقتول والكفر كله ملة واحدة يتوارث به أهله
ولا يرث المسلم من الكافر ولا الكافر من المسلم ومال المرتد لورثته من
المسلمين وما اكتسبه في حال ردته فيء
وإذا غرق جماعة أو سقط عليهم حائط فلم يعلم من مات منم أولا فمال كل واحد منهم للأحياء من ورثته
وإذا اجتمع في المجوسي قرابتان لو تفرقت في شخصين ورث أحدهما مع الآخر ورث بهما ولا يرث المجوسي بالأنكحة الفاسدة التي يستحلونها في دينهم
وعصبة ولد الزنا وولد الملاعنة مولى أمهما
ومن مات وترك حملا وقف ماله حتى تضع امرأته حملها في قول أبي حنيفة
والجد أولى بالميراث من الإخوة عند أبي حنيفة وقال أبو يوسف ومحمد: يقاسمهم إلا أن تنقصه المقاسمة من الثلث
وإذا اجتمعت الجدات فالسدس لأقربهن
ويحجب الجد أمه
ولا ترث أم أبي الأم بسهم وكل جدة تحجب أمها
باب ذوي الأرحام
وإذا لم يكن للميت عصبة ولا ذو سهم ورثه ذوو أرحامه وهم عشرة: ولد البنت وولد الأخت
وابنة الأخ وابنة العم والخال والخالة وأب الأم والعم من الأم والعمة وولد الأخ من الأم ومن أدلى بهم
وأولاهم ولد الميت ثم ولد الأبوين أو أحدهما وهم بنات الإخوة وولد الأخوات ثم ولد أبوي أبويه أو أحدهما وهم الأخوال والخالات والعمات
وإذا استوى ولد أب في درجة فأولاهم من أدلى بوارث وأقربهم أولى من أبعدهم وأب الأم أولى من ولد الأخ والأخت
والمعتق أحق بالفاضل من سهم ذوي سهام إذا لم تكن عصبة
سواه ومولى الموالاة يرث
وإذا ترك المعتق أبا مولاه وابن مولاه فماله للابن وقال أبو يوسف: للأب السدس والباقي للابن فإن ترك جد مولاه وأخ مولاه فالمال للجد في قول أبي حنيفة وقال أبو يوسف ومحمد: هو بينهما
ولا يباع الولاء ولا يوهب
## باب حساب الفرائض
إذا كان في المسألة نصف ونصف أو نصف وما بقي فأصلها من اثنين وإن كان ثلث وما بقي أو ثلثان وما بقي فأصلها من ثلاثة وإن كان ربع وما بقي فأصلها من ثمانية وإذا كان سدس وما بقي أو نصف وثلث أو سدس فأصلها من ستة وتعول إلى سبعة وثمانية وتسعة وعشرة
وإن كان مع الربع ثلث أو سدس فأصلها من اثني عشر وتعول إلى ثلاثة عشر وخمسة عشرة وسبعة عشر
وإذا كان مع الثمن ثلثان أو سدس فأصلها من أربعة وعشرين وتعول إلى سبعة وعشرين
فإذا انقسمت المسألة على الورثة فقد صحت وإن لم تنقسم سهام فريق عليهم فاضرب عددهم في أصل المسألة وعولها إن كانت عائلة فما خرج فمنه تصح المسألة كامرأة وأخوين: للمرأة الربع سهم وللأخوين ما بقي وهي ثلاثة أسهم لا تنقسم عليهما فاضرب اثنين في أصل المسألة فتكون ثمانية ومنها تصح
وإن وافق سهامهم عددهم فاضرب وفق عددهم في أصل المسألة كامرأة وستة
إخوة للمرأة الربع سهم وللإخوة ثلاثة فاضرب وفق عددهم في أصل المسألة يكون ثمانية ومنه تصح
وإن لم تنقسم سهام فريقين أو أكثر فاضرب أحد الفريقين ي الآخر ثم ما اجتمع في الفريق الثالث ثم ما اجتمع في أصل المسألة
فإن تساوت الأعداد أجزأ أحدهما عن الآخر كامرأتين وأخوين
فاضرب اثنين في أصل المسألة
فإن كان أحد العددين جزءا من الآخر أغنى الأكثر عن الأقل كأربع نسوة وأخوين إذا ضربت الأربعة أجزأك عن
الآخر فإن وافق أحد العددين الآخر ضربت وفق أحدهما في جميع الآخر ثم ما اجتمع في أصل المسألة كأربع نسوة وأخت وستة أعمام فالستة توافق الأربعة بالنصف فاضرب نصف أحدهما في جميع الآخر ثم ما اجتمع في أصل المسألة تكون ثمانية وأربعين ومنها تصح
فإذا صحت المسألة فاضرب سهام كل وارث في التركة ثم اقسم ما اجتمع على ما صحت منه الفريضة يخرج حق ذلك الوارث
وإذا لم تقسم التركة حتى مات أحد الورثة فإن كان ما يصيبه من الميت الأول ينقسم على ورثته فقد صحت المسألتان مما صحت الأولى وإن لم ينقسم صححت فريضة الميت الثاني بالطريقة التي ذكرناها ثم ضربت إحدى المسألتين في الأخرى إن لم يكن بين سهام الميت الثاني وما صحت منه
فريضة موافقة فإن كان بينهما موافقة فاضرب المسألة الثانية في الأولى فما اجتمع صحت منه المسألتان
وكل من له شيء من المسألة الأولى مضروب في وفق المسألة الثانية ومن كان له شيء من المسألة الثانية مضروب في وفق تركة الميت الثاني وإذا صحت مسألة المناسخة وأردت معرفة ما يصيب كل واحد من حبات الدرهم
قسمت ما صحت منه المسألة على ثمانية وأربعين فما خرج أخذت له من سهام كل وارث والله أعلم بالصواب.

<script>
/* ===== Hoş geldin ekranı · Google / e-posta girişi ===== */
/* Giriş için Firebase kullanılır. Firebase konsolundan (Authentication > Google + E-posta/Şifre açık)
   web uygulaması ayarlarını aşağıya yapıştır. Ayarlar yapıldı. */
var FB_CFG={apiKey:"AIzaSyB2c9B_us4jbIRyFbTjnoSVQcbFf_Jrm0U",authDomain:"tefakkuh-24d74.firebaseapp.com",projectId:"tefakkuh-24d74",storageBucket:"tefakkuh-24d74.firebasestorage.app",messagingSenderId:"854382400571",appId:"1:854382400571:web:c8ce2bf30347c02898381e"};

(function(){
var KEY="user";
function getU(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function setU(u){try{localStorage.setItem(KEY,JSON.stringify(u))}catch(e){}}
function E(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var GIC='<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';
var PHIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>';
var MLIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6.5L20.5 7"/></svg>';

/* --- Firebase (gerektiğinde yüklenir) --- */
var fbP=null;
function cfgOk(){return !!(FB_CFG&&FB_CFG.apiKey&&FB_CFG.projectId)}
function loadJs(u){return new Promise(function(res,rej){var s=document.createElement("script");s.src=u;s.onload=res;s.onerror=function(){rej(new Error("net"))};document.head.appendChild(s)})}
function fb(){
  if(!cfgOk())return Promise.reject({code:"app/no-config"});
  if(fbP)return fbP;
  var v="10.12.2",b="https://www.gstatic.com/firebasejs/"+v+"/";
  fbP=loadJs(b+"firebase-app-compat.js").then(function(){return loadJs(b+"firebase-auth-compat.js")}).then(function(){return loadJs(b+"firebase-firestore-compat.js")}).then(function(){
    if(!firebase.apps.length)firebase.initializeApp(FB_CFG);
    return firebase.auth();
  }).catch(function(e){fbP=null;throw(e&&e.code?e:{code:"auth/network-request-failed"})});
  return fbP;
}
function msg(e){
  var c=(e&&e.code)||"";
  var m={"app/no-config":"Giriş henüz yapılandırılmadı. Kodun başındaki FB_CFG alanına Firebase ayarlarını yapıştır.",
  "auth/invalid-email":"E-posta adresi geçersiz.","auth/missing-password":"Şifreni yaz.","auth/weak-password":"Şifre en az 6 karakter olmalı.",
  "auth/email-already-in-use":"Bu e-posta ile zaten hesap var. “Giriş yap”ı dene.","auth/user-not-found":"Bu e-posta ile hesap bulunamadı.",
  "auth/wrong-password":"E-posta veya şifre hatalı.","auth/invalid-credential":"E-posta veya şifre hatalı.","auth/too-many-requests":"Çok fazla deneme yapıldı, biraz sonra tekrar dene.",
  "auth/network-request-failed":"İnternet bağlantısı yok veya Firebase’e ulaşılamadı.","auth/popup-closed-by-user":"Giriş penceresi kapatıldı.",
  "auth/cancelled-popup-request":"Giriş penceresi kapatıldı.","auth/popup-blocked":"Açılır pencere engellendi.","auth/operation-not-allowed":"Bu giriş yöntemi Firebase’de etkin değil.",
  "auth/unauthorized-domain":"Bu alan adı Firebase’de yetkili değil.","auth/invalid-phone-number":"Telefon numarası geçersiz. + ve ülke koduyla yaz (örn. +905551234567).","auth/missing-phone-number":"Telefon numaranı yaz.","auth/invalid-verification-code":"SMS kodu hatalı.","auth/code-expired":"Kodun süresi doldu, yeniden gönder.","auth/captcha-check-failed":"reCAPTCHA doğrulaması başarısız.","auth/quota-exceeded":"SMS kotası doldu, daha sonra dene.","auth/missing-verification-code":"SMS kodunu yaz."};
  return m[c]||("Giriş yapılamadı"+(c?" ("+c+")":"")+".");
}

/* --- Firestore: profil + yedek --- */
function ready(au){return new Promise(function(res){var un=au.onAuthStateChanged(function(u){un();res(u)})})}
function note(m){try{stMsg=m;render()}catch(e){}}
function saveProfile(u){
  if(!u||!u.uid||!cfgOk())return;
  fb().then(ready).then(function(cu){
    if(!cu)return;
    return firebase.firestore().collection("users").doc(cu.uid).set({name:u.name||"",email:u.email||"",phone:u.phone||"",prov:u.prov||"",updated:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
  }).catch(function(){});
}
var BK=["cards","qs","kn","fks","fkl"];
function backup(){
  var d={};BK.forEach(function(k){var v=localStorage.getItem(k);if(v!==null)d[k]=v});
  var s=JSON.stringify(d);
  if(s.length>900000){note("Yedek çok büyük (1 MB sınırı).");return}
  fb().then(ready).then(function(cu){
    if(!cu){note("Önce giriş yapmalısın.");return}
    return firebase.firestore().collection("users").doc(cu.uid).collection("backup").doc("main").set({d:s,t:Date.now()}).then(function(){note("Yedeklendi.")});
  }).catch(function(e){note("Yedeklenemedi"+(e&&e.code?" ("+e.code+")":"")+".")});
}
function restore(){
  fb().then(ready).then(function(cu){
    if(!cu){note("Önce giriş yapmalısın.");return}
    return firebase.firestore().collection("users").doc(cu.uid).collection("backup").doc("main").get().then(function(doc){
      if(!doc.exists){note("Bulutta yedek bulunamadı.");return}
      var d=JSON.parse(doc.data().d);
      Object.keys(d).forEach(function(k){if(BK.indexOf(k)>=0)try{localStorage.setItem(k,d[k])}catch(e){}});
      location.reload();
    });
  }).catch(function(e){note("Geri yüklenemedi"+(e&&e.code?" ("+e.code+")":"")+".")});
}

/* --- Ekran --- */
var st={step:"name",name:"",tab:"in",err:"",ok:"",busy:false,email:"",pw:"",phone:"",code:"",sent:false};
var rcv=null,conf=null;
var root=null;
function done(extra){
  var u=getU()||{};
  u.name=st.name||u.name||"";
  if(extra){for(var k in extra)u[k]=extra[k]}
  u.t=Date.now();setU(u);saveProfile(u);
  if(root){root.style.transition="opacity .35s";root.style.opacity="0";var r=root;root=null;setTimeout(function(){r.remove()},360)}
  try{if(typeof render==="function")render()}catch(e){}
}
function draw(){
  if(!root)return;
  var h='<div class="wl-c">';
  if(st.step=="name"){
    h+='<div class="wl-k">tefakkuh</div><h1>Selâmün aleyküm, hoş geldin!</h1><p>Seni tanıyalım. Adın nedir?</p>'
      +'<label for="wl-n">Adın</label><input id="wl-n" type="text" autocomplete="given-name" maxlength="40" placeholder="Adını yaz" value="'+E(st.name)+'">'
      +(st.err?'<div class="wl-err">'+E(st.err)+'</div>':'')
      +'<button class="wl-b pri" data-w="next">Devam et</button>';
  }else{
    h+='<button class="wl-bk" data-w="back">‹ Geri</button><div class="wl-k">tefakkuh</div><h1>Merhaba '+E(st.name)+'</h1><p>İlerlemeni ve kartlarını hesabına bağlamak için giriş yap.</p>';
    if(st.step=="login"){
      h+='<button class="wl-b" data-w="google"'+(st.busy?' disabled':'')+'>'+GIC+'Google ile devam et</button>'
        +'<button class="wl-b" data-w="mail">'+MLIC+'E-posta ile devam et</button>'
        +'<button class="wl-b" data-w="phone">'+PHIC+'Telefon ile devam et</button>';
    }else if(st.step=="phone"){
      h+='<label for="wl-t">Telefon numarası</label><input id="wl-t" type="tel" inputmode="tel" autocomplete="tel" placeholder="+90 5xx xxx xx xx" value="'+E(st.phone)+'"'+(st.sent?' readonly':'')+'>';
      if(st.sent){
        h+='<label for="wl-c">SMS kodu</label><input id="wl-c" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 haneli kod" value="'+E(st.code)+'">'
          +'<button class="wl-b pri" data-w="verify"'+(st.busy?' disabled':'')+'>Doğrula ve gir</button>'
          +'<button class="wl-l" data-w="sendcode">Kodu yeniden gönder</button>';
      }else{
        h+='<button class="wl-b pri" data-w="sendcode"'+(st.busy?' disabled':'')+'>Kod gönder</button>';
      }
      h+='<div id="wl-rc"></div>';
    }else{
      h+='<div class="wl-tabs"><button data-w="tin" class="'+(st.tab=="in"?"on":"")+'">Giriş yap</button><button data-w="tup" class="'+(st.tab=="up"?"on":"")+'">Kayıt ol</button></div>'
        +'<label for="wl-e">E-posta</label><input id="wl-e" type="email" autocomplete="email" inputmode="email" placeholder="ornek@mail.com" value="'+E(st.email)+'">'
        +'<label for="wl-p">Şifre</label><input id="wl-p" type="password" autocomplete="'+(st.tab=="up"?"new-password":"current-password")+'" placeholder="En az 6 karakter" value="'+E(st.pw)+'">'
        +'<button class="wl-b pri" data-w="submit"'+(st.busy?' disabled':'')+'>'+(st.tab=="up"?"Hesap oluştur":"Giriş yap")+'</button>'
        +(st.tab=="in"?'<button class="wl-l" data-w="reset">Şifremi unuttum</button>':'');
    }
    if(st.err)h+='<div class="wl-err">'+E(st.err)+'</div>';
    if(st.ok)h+='<div class="wl-ok">'+E(st.ok)+'</div>';
    h+='<button class="wl-l" data-w="skip">Şimdilik giriş yapmadan devam et</button>';
  }
  h+='</div>';
  root.innerHTML=h;
  var f=root.querySelector(st.step=="name"?"#wl-n":(st.step=="mail"?"#wl-e":(st.step=="phone"&&!st.sent?"#wl-t":null)));
  if(f&&!/iPhone|iPad|Android/i.test(navigator.userAgent))f.focus();
}
function keep(){
  if(!root)return;
  var n=root.querySelector("#wl-n"),e=root.querySelector("#wl-e"),p=root.querySelector("#wl-p");
  if(n)st.name=n.value;if(e)st.email=e.value.trim();if(p)st.pw=p.value;
  var t=root.querySelector("#wl-t"),c=root.querySelector("#wl-c");if(t)st.phone=t.value;if(c)st.code=c.value.trim();
}
function fin(cred,prov){
  var u=cred&&cred.user?cred.user:{};
  if(u.displayName===null||u.displayName===""){try{if(st.name)u.updateProfile({displayName:st.name})}catch(e){}}
  done({email:u.email||st.email||"",phone:u.phoneNumber||"",uid:u.uid||"",prov:prov});
}
function act(a){
  keep();st.err="";st.ok="";
  if(a=="next"){
    if(!st.name.trim()){st.err="Lütfen adını yaz.";draw();return}
    st.name=st.name.trim();st.step="mail";
    var u=getU()||{};u.name=st.name;setU(u);          /* isim hemen kaydedilir */
    draw();return;
  }
  if(a=="back"){if(st.step=="phone"){st.sent=false;st.code=""}st.step="name";draw();return}
  if(a=="phone"){st.step="phone";draw();return}
  if(a=="mail"){st.step="mail";draw();return}
  if(a=="tin"||a=="tup"){st.tab=a=="tup"?"up":"in";draw();return}
  if(a=="skip"){done({prov:"local"});return}
  if(a=="google"){
    st.busy=true;draw();
    fb().then(function(au){
      var pr=new firebase.auth.GoogleAuthProvider();
      return au.signInWithPopup(pr).catch(function(e){
        if(e&&(e.code=="auth/popup-blocked"||e.code=="auth/operation-not-supported-in-this-environment"))return au.signInWithRedirect(pr).then(function(){return null});
        throw e;
      });
    }).then(function(c){st.busy=false;if(c)fin(c,"google");else draw()})
    .catch(function(e){st.busy=false;st.err=msg(e);draw()});
    return;
  }
  if(a=="sendcode"){
    var ph=st.phone.replace(/[\s-]/g,"");
    if(!/^\+\d{8,15}$/.test(ph)){st.err=msg({code:"auth/invalid-phone-number"});draw();return}
    st.phone=ph;st.busy=true;st.code="";draw();
    fb().then(function(au){
      try{if(rcv)rcv.clear()}catch(e){}
      rcv=new firebase.auth.RecaptchaVerifier("wl-rc",{size:"invisible"});
      return au.signInWithPhoneNumber(ph,rcv);
    }).then(function(cr){conf=cr;st.sent=true;st.busy=false;st.ok="Kod gönderildi.";draw()})
    .catch(function(e){st.busy=false;st.err=msg(e);try{if(rcv)rcv.clear()}catch(x){}draw()});
    return;
  }
  if(a=="verify"){
    if(!conf){st.sent=false;draw();return}
    if(!st.code){st.err=msg({code:"auth/missing-verification-code"});draw();return}
    st.busy=true;draw();
    conf.confirm(st.code).then(function(c){st.busy=false;fin(c,"phone")})
    .catch(function(e){st.busy=false;st.err=msg(e);draw()});
    return;
  }
  if(a=="submit"||a=="reset"){
    if(!st.email){st.err="E-posta adresini yaz.";draw();return}
    if(a=="submit"&&!st.pw){st.err="Şifreni yaz.";draw();return}
    st.busy=true;draw();
    fb().then(function(au){
      if(a=="reset")return au.sendPasswordResetEmail(st.email).then(function(){st.ok="Şifre sıfırlama bağlantısı e-postana gönderildi.";return null});
      return st.tab=="up"?au.createUserWithEmailAndPassword(st.email,st.pw):au.signInWithEmailAndPassword(st.email,st.pw);
    }).then(function(c){st.busy=false;if(c)fin(c,"password");else draw()})
    .catch(function(e){st.busy=false;st.err=msg(e);draw()});
  }
}
function show(){
  if(getU()&&getU().name&&getU().t)return;
  var u=getU();if(u&&u.name){st.name=u.name;st.step="mail"}
  root=document.createElement("div");root.id="wl";root.setAttribute("role","dialog");root.setAttribute("aria-modal","true");
  root.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-w]");if(b)act(b.dataset.w)});
  root.addEventListener("keydown",function(e){
    if(e.key!="Enter")return;
    if(st.step=="name")act("next");else if(st.step=="mail")act("submit");else if(st.step=="phone")act(st.sent?"verify":"sendcode");
  });
  document.body.appendChild(root);draw();
}
/* splash bittikten sonra göster */
function wait(){if(document.getElementById("intro"))setTimeout(wait,150);else show()}
setTimeout(wait,200);


/* --- Ana sayfa selamı + Ayarlar'da hesap bölümü --- */
var gU=function(){return getU()||{}};
var hiDone=false,hiT=0;
if(typeof home==="function"){var _h=home;home=function(){
  var u=gU(),h=_h();
  if(!u.name||hiDone)return h;
  if(!hiT){hiT=1;(function w(){
    if(document.getElementById("intro")||document.getElementById("wl")){setTimeout(w,200);return}
    setTimeout(function(){
      var e=document.querySelector(".ac-hi");
      if(!e){hiDone=true;return}
      e.classList.add("out");
      setTimeout(function(){hiDone=true;if(e.parentNode)e.parentNode.removeChild(e)},800);
    },3000);
  })()}
  return'<div class="ac-hi"><small>Selâmün aleyküm</small><b>'+E(u.name)+'</b></div>'+h;
}}
if(typeof settings==="function"){var _s=settings;settings=function(){
  var u=gU(),h=_s();
  var inn=u.prov&&u.prov!="local"&&(u.email||u.phone);
  var sec='<section class="st-sec" style="--i:0"><h2>'+(typeof stIco==="function"?stIco('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>'):'')+'Hesap</h2>'
   +'<p>'+(inn?E(u.email||u.phone)+(u.prov=="google"?" · Google":""):"Giriş yapılmadı · veriler yalnızca bu cihazda.")+'</p>'
   +'<input class="st-in" id="ac-n" type="text" maxlength="40" value="'+E(u.name||"")+'" placeholder="Adın">'
   +'<div class="st-opts"><button class="st-opt on" data-ac="savename">Adı kaydet</button>'
   +(inn&&cfgOk()?'<button class="st-opt" data-ac="bk">Buluta yedekle</button><button class="st-opt" data-ac="rs">Yedekten yükle</button>':'')
   +(inn?'<button class="st-opt" data-ac="out">Çıkış yap</button>':'<button class="st-opt" data-ac="login">Giriş yap</button>')+'</div></section>';
  return h.replace('<div class="st">','<div class="st">'+sec);
}}
try{if(typeof render==="function")render()}catch(e){}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-ac]");if(!b)return;
  var a=b.dataset.ac,u=getU()||{};
  if(a=="bk"){backup();return}if(a=="rs"){restore();return}
  if(a=="savename"){var i=document.getElementById("ac-n"),v=i?i.value.trim():"";if(!v)return;u.name=v;u.t=u.t||Date.now();setU(u);saveProfile(u);try{render()}catch(x){}return}
  if(a=="out"){
    var go=function(){var n=u.name;setU({name:n,t:Date.now(),prov:"local"});try{render()}catch(x){}};
    if(cfgOk()&&window.firebase&&firebase.apps&&firebase.apps.length)firebase.auth().signOut().then(go,go);else go();
    return;
  }
  if(a=="login"){st={step:"mail",name:u.name||"",tab:"in",err:"",ok:"",busy:false,email:"",pw:"",phone:"",code:"",sent:false};
    if(!root){root=document.createElement("div");root.id="wl";root.addEventListener("click",function(e){var x=e.target.closest&&e.target.closest("[data-w]");if(x)act(x.dataset.w)});
      root.addEventListener("keydown",function(e){if(e.key=="Enter"&&(st.step=="mail"||st.step=="phone"))act(st.step=="mail"?"submit":(st.sent?"verify":"sendcode"))});document.body.appendChild(root)}
    draw()}
});
})();
</script>
