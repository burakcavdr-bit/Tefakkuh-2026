["Secde","السُّجُود","Namazda alnı, burnu, iki eli, dizleri ve ayak parmaklarını yere koyarak tevazu göstermek; rükündür.","وضع الجبهة والأنف مع اليدين والركبتين وأطراف القدمين على الأرض.","namaz"],
["Ka'de-i ahîre","القَعْدَةُ الأَخِيرَة","Namazın sonunda teşehhüd miktarı (Tahiyyât okunacak kadar) oturmak; namazın son rüknüdür.","الجلوس الأخير في ختام الصلاة بمقدار قراءة التشهد؛ وهو ركن أخير.","namaz"],
["Tadil-i Erkân","تَعْدِيلُ الأَرْكَان","Rükû, secde, kavme ve celsede uzuvlar tamamen hareketsiz kalacak kadar duraklamak; vaciptir.","الطمأنينة وسكون الأعضاء في الركوع والسجود والقيام والقعود؛ واجب عند الحنفية.","namaz"],
["Vitir","الوِتْر","Yatsı namazından sonra kılınan, üçüncü rekâtında Kunut duası okunan 3 rekâtlık vacip namaz.","صلاة ثلاث ركعات بتسليمة واحدة بعد العشاء فيها القنوت؛ وهي واجبة عند الحنفية.","namaz"],
["Sehiv secdesi","سُجُودُ السَّهْو","Namazın vaciplerinden birini sehven terk etmek veya geciktirmekle yapılan iki telafi secdesi.","سجدتان في آخر الصلاة لجبر الخلل الناشئ عن نسيان واجب أو تأخيره.","namaz"],
["Tilavet Secdesi","سَجْدَةُ التِّلَاوَة","Kur'an'daki on dört secde ayetinden birini okuyan veya işiten mükellefe vacip olan secde.","سجدة واحدة تجب بقراءة آية سجدة من آيات القرآن الكريم أو سماعها.","namaz"],
["Cuma Namazı","صَلَاةُ الجُمُعَة","Cuma günü öğle vaktinde cemaatle ve hutbe ile kılınması farz-ı ayn olan iki rekâtlık namaz.","ركعتان تؤديان جماعة مع الخطبة يوم الجمعة وقت الظهر؛ وهي فرض عين بشروطها.","namaz"],
["Bayram Namazı","صَلَاةُ العِيد","Ramazan ve Kurban bayramlarının ilk sabahı fazladan zevâid tekbirleriyle kılınan iki rekâtlık vacip namaz.","ركعتان تؤديان جماعة ضحى أول أيام العيدين بزوائد التكبيرات؛ وهي واجبة.","namaz"],
["Seferîlik","السَّفَرُ الشَّرْعِيّ","En az üç günlük yürüyüş mesafesine (yaklaşık 90 km) yolculuk niyetiyle çıkanın durumu.","الخروج بنية مسيرة ثلاثة أيام ولياليها سيراً وسطاً (نحو ٩٠ كم)؛ وله رخصه.","namaz"],
["Kasr-ı Salât","قَصْرُ الصَّلَاة","Dört rekâtlı farz namazları seferî iken iki rekât olarak kılmak; Hanefîlerde azîmet/vaciptir.","أداء الرباعية المفروضة ركعتين في السفر؛ وهو واجب عند الحنفية تقديراً للرخصة.","namaz"],
["İmamet","الإِمَامَة","Namazda cemaate önderlik edip onların namazına kefil olmak; cemaatle namazın esasıdır.","تقدم أهلية الصلاة بالاقتداء لربط صلاة المؤتمين بصلاة الإمام.","namaz"],
["Cemaat","الجَمَاعَة","Birden fazla müminin tek bir imama uyarak namaz kılması; müekked sünnettir.","اجتماع المصلين خلف إمام واحد في الصلاة؛ وهي سنة مؤكدة قريبة من الواجب.","namaz"],
["Ezan","الأَذَان","Farz namaz vakitlerinin girdiğini duyurmak ve cemaate davet için okunan mukaddes sözler.","إعلام بدخول وقت الصلاة المفروضة بألفاظ مخصوصة مشروعة.","namaz"],
["İkamet","الإِقَامَة","Farz namaza başlamadan önce saf düzeni kurulurken okunan, ezana denk çağrı sözleri.","ألفاظ مخصوصة شبيهة بالأذان تشرع عند الشروع في إقامة الصلاة المكتوبة.","namaz"],

// Oruç
["Savm (Oruç)","الصَّوْمُ / الصِّيَام","İmsak vaktinden iftara kadar ibadet niyetiyle yemek, içmek ve cinsî münasebetten kendini alıkoymak.","الإمساك عن المفطرات من طلوع الفجر الصادق إلى غروب الشمس بنية التقرب.","oruc"],
["İmsak","الإِمْسَاك","Fecr-i sâdıkın doğuşuyla başlayan ve oruç tutanın yeme içmeyi bıraktığı an.","وقت طلوع الفجر الصادق الذي يمتنع عنده الصائم عن جميع المفطرات.","oruc"],
["İftar","الإِفْطَAR","Güneşin batmasıyla orucun tamamlanması ve orucun açıldığı vakit.","الفطر وتناول المفطر بعد تحقق غروب الشمس وانتهاء يوم الصيام.","oruc"],
["Keffâret","الكَفَّارَة","Ramazan orucunu bilerek ve özürsüz bozanın 60 gün aralıksız oruç tutması cezası.","عقوبة وجزاء شرعي لإفساد صوم رمضان عمداً؛ صيام شهرين متتابعين.","oruc"],
["Fidye","الفِدْيَة","Aşırı yaşlılık veya iyileşme ümidi olmayan hastalık sebebiyle oruç tutamayanın her gün için verdiği sadaka.","بدل مالي يخرجه الشيخ الفاني والمريض زمناً عن كل يوم صيام عجز عنه.","oruc"],
["İtikâf","الاِعْتِكَاف","İbadet kastıyla camide belirli bir süre ikamet etmek; Ramazan'ın son on gününde sünnet-i kifâyedir.","المكث واللبث في مسجد تقام فيه الجماعة بنية التقرب إلى الله تعالى.","oruc"],
["Sadaka-i Fıtr","صَدَقَةُ الفِطْر","Ramazan bayramına yetişen zengin Müslümanın fakirlere verdiği vacip fitre sadakası.","صدقة تجب بالفطر من رمضان على من ملك نصاباً زائداً عن حاجته الأصلية.","oruc"],

// Zekât & Hac
["Nisap","النِّصَاب","Dinen bir kimsenin zengin sayılabilmesi için temel ihtiyaçtan fazla sahip olması gereken asgari servet sınırı.","القدر المقدر شرعاً من المال الذي تجب فيه الزكاة عند بلوغه وحولانه.","zekat"],
["Havâic-i Asliye","الحَوَائِجُ الأَصْلِيَّة","Hayatı sürdürmek için zaruri ev, binek, ev eşyası ve aletler; zekâttan muaftır.","ما يحتاجه الإنسان لدفع الهلاك والضرورة كالمسكن والملبس وآلات الحرفة.","zekat"],
["Havl-i Haveleyn","حَوَلَانُ الحَوْل","Nisap miktarı zekât malının üzerinden tam bir kamerî yılın (354 gün) geçmesi şartı.","مرور سنة قمرية كاملة على ملكية المال البالغ للنصاب الشرعي.","zekat"],
["Öşür","العُشْر","Toprak mahsullerinden zekât olarak verilen onda bir veya yirmide bir pay.","الزكاة الواجبة في الخارج من الأرض الزراعية؛ عشره أو نصف عشره.","zekat"],
["Rikâz","الرِّكَاز","Yer altında bulunan madenler ve eski defineler; beşte biri zekâta/devlete ayrılır.","المال المدفون في الأرض من عهد الجاهلية أو المعادن المخلوقة؛ فيه الخمس.","zekat"],
["İhram","الإِحْرَام","Hac veya umreye niyet edip telbiye getirerek helal olan bazı fiilleri kendine haram kılmak.","نية الدخول في نسك الحج أو العمرة مع التلبية واجتناب المحظورات.","zekat"],
["Tavaf","الطَّوَاف","Hacerülesved hizasından başlayarak Kâbe etrafında yedi şavt dönmek.","الدوران حول البيت العتيق سبعة أشواط متتابعة على طهارة تعظيماً لله.","zekat"],
["Vakfe","الوُقُوفُ بِعَرَفَة","Arefe günü zevalden bayram sabahına kadar Arafat'ta bulunmak; haccın en büyük farzıdır.","الوجود بعرفات ولو لحظة بعد زوال شمس يوم عرفة إلى فجر النحر؛ ركن الحج الأعظم.","zekat"],
["Sa'y","السَّعْي","Safâ ile Merve tepeleri arasında Safâ'dan başlayarak yedi defa gidip gelmek; vaciptir.","المشي والتردد بين الصفا والمروة سبعة أشواط يبدأ بالصفا ويختم بالمروة.","zekat"],
["Cemre","الجِمَار / رَمْيُ الجِمَار","Bayram günlerinde Mina'da cemrelere yedişer çakıl taşı fırlatmak; hac vacibidir.","قذف الحصيات الصغار على مواضع الجمرات المخصوصة بمنى أيام التشريق.","zekat"],
["Udhiye (Kurban)","الأُضْحِيَّة","Kurban bayramı günlerinde ibadet kastıyla belirli hayvanı boğazlamak; Hanefî'de vaciptir.","ذبح حيوان بهيمة الأنعام المخصوص في أيام النحر تقرباً إلى الله تعالى؛ واجبة.","zekat"],
["Hediy","الهَدْي","Hac veya umre yapanların Harem bölgesinde kesmek üzere sevk ettikleri kurbanlık.","ما يهدى إلى الحرم من النعم شكراً لله أو جبراً لخلل في النسك.","zekat"],

// Muâmelât
["Bey'","البَيْع","Malı mal ile karşılıklı rıza ile değiştirmek; mülkiyet devreden temel satım akdi.","مبادلة مال متقوم بمال متقوم تراضياً بطريق الإيجاب والقبول الناقل للملك.","muamelat"],
["Ribâ (Faiz)","الرِّبَا","Aynı cinsten malların değişiminde veya borçlanmada karşılığı bulunmayan fazlalık; kesinlikle haramdır.","فضل مال خال عن عوض مشروط في معاوضة مال بمال أو قرض نفعاً.","muamelat"],
["İcâre (Kira)","الإِجَارَة","Belirli bir menfaatin veya emeğin belirli bir ücret karşılığında satılması akdi.","عقد على منفعة معلومة بعوض مباح معلوم كإجارة الدور والعمل.","muamelat"],
["Şüf'a","الشُّفْعَة","Satılan gayrimenkulü müşteriye mal olduğu bedelle öncelikle alma hakkı; komşu veya ortağa aittir.","حق تملك العقار المبيع جبراً عن المشتري بما قام عليه دفعاً لضرر الجوار والخلطة.","muamelat"],
["Karz-ı Hasen","القَرْضُ الحَسَن","Menfaat ve fazlalık şart koşulmaksızın Allah rızası için verilen faizsiz borç.","دفع مال لمن ينتفع به ويرد مثله بلا زيادة ولا منفعة مشروطة.","muamelat"],
["Rehin","الرَّهْن","Bir borca teminat olmak üzere bir malı güvenceye almak akdi.","حبس مال بحق مالي يمكن استيفاؤه منه عند تعذر الوفاء.","muamelat"],
["Vedîa (Emânet)","الوَدِيعَة","Bir kimsenin korunması için başkasına emanet bıraktığı mal.","مال يتركه مالكه عند غيره لحفظه أمانة بدون مقابل.","muamelat"],
["Kefâlet","الكفَالَة","Bir kimsenin başkasının borcuna veya nefsine kefil olup sorumluluk üstlenmesi.","ضم ذمة الكفيل إلى ذمة الأصيل في المطالبة بالدين أو إحضار النفس.","muamelat"],
["Havâle","الحَوَالَة","Bir borcun bir borçludan başka bir borçluya nakledilmesi akdi.","نقل الدين من ذمة المحيل إلى ذمة المحال عليه برضا الأطراف.","muamelat"],

// Usûl & Ahkâm
["Farz-ı Ayn","فَرْضُ عَيْن","Her mükellef Müslümanın bizzat kendisinin yapması farz olan amel (beş vakit namaz gibi).","ما طلب الشارع فعله من كل مكلف طلباً جازماً ولا يسقط بفعل غيره.","usul"],
["Farz-ı Kifâye","فَرْضُ كِفَايَة","Müslümanlardan bir kısmının yapmasıyla diğerlerinin üzerinden sorumluluğun kalktığı ameller.","ما طلب الشارع حصوله دون النظر إلى فاعله، فإذا فعله البعض سقط عن الباقين.","usul"],
["Vâcip","الوَاجِب","Zannî delille emredilen fiil; inkâr eden kâfir olmaz fakat terk eden günahkâr olur (Hanefî usûlü).","ما ثبت بدليل ظني الثبوت أو الدلالة؛ يثاب فاعله ويأثم تاركه ولا يكفر جاحده.","usul"],
["Sünnet-i Müekkede","السُّنَّةُ المُؤَكَّدَة","Hz. Peygamber'in (s.a.v.) devamlı yaptığı, pek az terk ettiği sünnetler.","ما واظب النبي ﷺ على فعله ولم يتركه إلا نادراً؛ تاركها يستحق اللوم والعتاب.","usul"],
["Sünnet-i Gayr-i Müekkede","السُّنَّةُ غَيْرُ المُؤَكَّدَة","Hz. Peygamber'in bazen yapıp bazen terk ettiği nafile ameller; yapana sevap vardır.","ما لم يواظب النبي ﷺ على فعله تارة ويتركه تارة؛ في فعلها ثواب ولا عتاب في تركها.","usul"],
["Müstehab (Mendup)","المُسْتَحَبّ / المَنْدُوب","Dinen yapılması övülen ve teşvik edilen faziletli ameller.","ما رغب فيه الشارع دون إيجاب؛ يثاب فاعله ولا يعاقب ولا يلام تاركه.","usul"],
["Mübah","المُبَاح","Mükellefin yapıp yapmamakta serbest bırakıldığı fiiller.","ما خير الشارع المكلف بين فعله وتركه؛ لا مدح فيه ولا ذم لذاته.","usul"],
["Mekruh-ı Tahrîmî","المَكْرُوهُ تَحْرِيمًا","Harama yakın olan, zannî delille terk edilmesi kesinlikle istenen fiil.","ما طلب الشارع الكف عنه طلباً جازماً بدليل ظني؛ وهو إلى الحرام أقرب.","usul"],
["Mekruh-ı Tenzîhî","المَكْرُوهُ تَنْزِيهًا","Helale yakın olan, kesin olmayan üslupla terki tavsiye edilen fiil.","ما طلب الشارع تركه طلباً غير جازم؛ وهو إلى الحل أقرب ولا عقاب فيه.","usul"],
["Haram","الحَرَام","Kesin delille (ayet veya mütevâtir hadis) yapılması yasaklanan fiil; inkâr eden dinden çıkar.","ما ثبت النهي عنه بدليل قطعي لا شبهة فيه؛ يكفر جاحده ويعاقب فاعله.","usul"],
["Müfsid","المُفْسِد","Başlanmış sahih bir ibadeti veya akdi bozan ve geçersiz kılan fiil.","ما يبطل العبادة أو المعاملة ويخرجها عن كونها صحيحة معتبرة شرعاً.","usul"],
["Azîmet","العَزِيمَة","İlk olarak konulan, bütün mükellefleri bağlayan kesin asıl hüküm.","الحكم الأصلي الثابت بدليل شرعي كلي غير مقيد بعذر أو مشقة.","usul"],
["Ruhsat","الرُّخْصَة","Meşakkat sebebiyle asıl hükmün yerine geçici olarak getirilen kolaylaştırıcı hüküm.","الحكم الثابت على خلاف دليل أصلي لعذر ومشقة تيسيراً على المكلفين.","usul"],
["Nass","النَّصّ","Kur'an ve Sünnet'in manası açık, tevil ve yoruma meydan bırakmayan kesin ibareleri.","اللفظ الذي دل على معناه دلالة قطعية واضحة لا تحتمل التأويل ولا الشك.","usul"],
["İcmâ","الإِجْمَاع","Hz. Peygamber'den sonra İslam müctehidlerinin şer'î bir hüküm üzerinde ittifak etmeleri.","اتفاق مجتهدي أمة محمد ﷺ في عصر من الأعصار بعد وفاته على حكم شرعي.","usul"],
["Kıyas","القِيَاس","Açık nass bulunmayan bir meselenin hükmünü ortak illetle nass bulunan meseleye bağlamak.","إلحاق واقعة لا نص في حكمها بواقعة ورد نص بحكمها لاشتراكهما في علة الحكم.","usul"],
["İstihsân","الاِسْتِحْسَان","Kuvvetli bir maslahat veya zaruret sebebiyle açık kıyası terk edip kapalı kıyasa göre amel etmek.","العدول عن القياس الجلي إلى قياس خفي أو دليل أقوى أثراً لمصلحة راجحة.","usul"],
["Maslahat","المَصْلَحَةُ الشَّرْعِيَّة","Dinin beş temel gayesini koruyarak fayda sağlama ve zararı defetme ilkesi.","جلب المنفعة ودفع المفسدة عن العباد حفظاً للكليات الخمس المشروعة.","usul"],
["Edâ","الأَدَاء","İbadeti şer'an tayin edilmiş vaktin içinde yerine getirmek.","فعل العبادة المفروضة في وقتها المحدد لها شرعاً تام الأركان.","usul"],
["Kaza","القَضَاء","Vaktinde yapılamayan ibadeti vakti çıktıktan sonra telafi amacıyla yerine getirmek.","فعل العبادة الواجبة بعد خروج وقتها المحدد جبراً للذمة.","usul"],
["Mükellef","المُكَلَّف","Akıllı ve bülûğ çağına ermiş, Allah'ın emir ve yasaklarına muhatap olan insan.","البالغ العاقل الذي بلغته دعوة الإسلام وصار مخاطباً بأحكام التكليف.","usul"]
];
(function(){var X=[["Abdest",{"a":["Vudû","Vudû'"],"l":"Sözlükte temizlik ve güzellik anlamına gelir. Fıkıhta ise namaz ve tavaf gibi ibadetlerin sıhhati için yüzü, elleri dirseklerle beraber yıkamak, başın dörtte birini meshetmek ve ayakları topuklarla beraber yıkamaktan ibarettir.","r":["el-Kudûrî, Kitâbü't-Tahâre","el-Hidâye, 1/13","Bedâi'u's-Sanâi', 1/3"],"f":"Namaz, tilavet secdesi ve Kur'an-ı Kerim'e dokunmak için farzdır.","rel":["Gasl","Mesh","Nevâkıd","Hades"],"rt":"و - ض - أ"}],["Mesh",{"a":[],"l":"Suyun akıtılmaksızın eldeki ıslaklığın uzva isabet ettirilmesidir. Abdestte başın en az dörtte birine, mest üzerine veya sargı (cebire) üzerine uygulanır.","r":["el-Kudûrî, Babü'l-Vudû'","Mülteka'l-Ebhur"],"f":"Abdestte başın dörtte birine mesh farz, tamamını kaplamak sünnettir.","rel":["Huf","Cebîre","Nâsiye"],"rt":"م - س - ح"}],["Hades",{"a":[],"l":"İkiye ayrılır: Hades-i asgar (küçük hades) abdesti bozan hallerle oluşur ve abdest ile giderilir. Hades-i ekber (büyük hades) cünüplük, hayız ve nifas halleridir ve gusül abdesti ile giderilir.","r":["el-Kudûrî, Kitâbü't-Tahâre","el-İhtiyâr, 1/11"],"f":"Hades hali namaz kılmaya ve Mushaf'a el sürmeye manidir.","rel":["Necâset","Tahâret","Gusül"],"rt":"ح - د - ث"}],["Teyemmüm",{"a":[],"l":"Sözlükte kasıt ve yönelme anlamına gelir. Şeriatta ise suyun bulunmaması veya hastalığa sebep olması durumunda niyet ederek elleri temiz toprak cinsine iki vuruşla vurup yüzü ve kolları meshetmektir.","r":["el-Kudûrî, Babü't-Teyemmüm","el-Hidâye, 1/28"],"f":"Suya ulaşılamayan hallerde su ile yapılan taharetin tam bedelidir.","rel":["Sa'îd-i Tâhir","Niyet","Hades"],"rt":"ي - م - م"}],["Necâset-i Galîza",{"a":["Necâset-i Galîza ve Hafîfe"],"l":"Necâset-i galîza (ağır pislik): Haramlığı ve necis oluşu kesin nassla sabit pisliklerdir (insan idrarı, dışkısı, şarap, kan). Katı ise bir dirhem (yaklaşık 3 gr), sıvı ise el ayası kadarından fazlası namaza engeldir. Necâset-i hafîfe: Necis oluşunda ihtilaf olan pisliklerdir (eti yenen hayvanların idrarı gibi). Bir uzvun veya elbisenin dörtte birinden azı af kapsamında kabul edilir.","r":["el-Kudûrî, Babü'n-Necâsât","Reddü'l-Muhtâr, 1/315"],"f":"Galize necasetin dirhem miktarından fazlasını temizlemek farzdır.","rel":["Hades","Dirhem","Tathîr"],"rt":"ن - ج - س"}],["İftitah Tekbiri",{"a":["Tahrîme"],"l":"Namazın haricinde gibi görünse de Hanefilerde namazın içine bitişik olduğundan rükün kabul edilen kurucu tekbirdir. Bu tekbirle namaz kılan kimseye yeme, içme ve konuşma gibi fiiller haram hale gelir.","r":["el-Kudûrî, Babü Sıfati's-Salât","Bedâi'u's-Sanâi', 1/130"],"f":"Namazın farz rükünlerindendir.","rel":["Kıyâm","Kıraat","Rükû'"],"rt":"ح - ر - م"}],["Ka'de-i ahîre",{"a":[],"l":"Namazın rekatları bittikten sonra \"Ettehiyyâtü\" duasını okuyacak kadar oturmaktır. Bu oturuş namazın rüknü olup, terk edilmesi durumunda namaz batıl olur. İlk oturuş (ka'de-i ûlâ) ise Hanefilere göre vaciptir.","r":["el-Kudûrî, Babü Sıfati's-Salât","el-İhtiyâr, 1/51"],"f":"Ka'de-i ahire farz, ka'de-i ûlâ ise vaciptir.","rel":["Teşehhüd","Ka'de-i Ûlâ","Sücûd-i Sehv"],"rt":"ق - ع - د"}],["Sehiv secdesi",{"a":["Secde-i Sehv","Sücûd-i Sehv"],"l":"Namazda sehven (unutarak) bir vacibin terk edilmesi yahut bir farz veya vacibin vaktinden tehir edilmesi durumunda, namazdaki eksikliği telafi etmek için son oturuşta sağa selam verildikten sonra yapılan iki secdedir.","r":["el-Kudûrî, Babü Sücûdi's-Sehv","el-Hidâye, 1/74"],"f":"Hanefi mezhebinde vücubiyeti vaciptir.","rel":["Vâcip","Selâm","Teşehhüd"],"rt":"س - ه - و"}],["Nisap",{"a":["Nisâb"],"l":"Aslî ihtiyaçlardan ve borçlardan arta kalan malın belirli bir miktara ulaşmasıdır. Altında 20 miskal (yaklaşık 80-85 gr), gümüşte 200 dirhem (yaklaşık 560-595 gr), sığırda 30, koyun ve keçide 40 adettir.","r":["el-Kudûrî, Babü Zekâti'z-Zeheb","el-Hidâye, 1/97"],"f":"Nisap zekâtın vücubunun temel şartıdır.","rel":["Havl-i Havelân","Havâic-i Asliyye","Nâmî Mâl"],"rt":"ن - ص - ب"}],["Havl-i Haveleyn",{"a":["Havl-i Havelân"],"l":"Zekâtın farz olabilmesi için malın yılın başında ve sonunda nisap miktarında bulunması şarttır. Hanefilere göre yıl içerisinde nisabın altına düşüp yıl sonunda tekrar tamamlanması zekât yükümlülüğünü düşürmez.","r":["el-Kudûrî, Babü Şurûti'z-Zekât","Reddü'l-Muhtâr, 2/294"],"f":"Zekâtın farziyetinin zaman şartıdır.","rel":["Nisâb","Kamerî Yıl","Temlîk"],"rt":"ح - و - ل"}],["Havâic-i Asliye",{"a":["Havâic-i Asliyye"],"l":"Oturulan ev, ev eşyaları, giyecek elbiseler, binek/ulaşım vasıtası, meslek icra edilen alet ve edevat ile bir aylık veya yıllık temel gıda maddeleridir. Bu mallar ne kadar değerli olursa olsun zekâta tabi değildir.","r":["el-Kudûrî, Kitâbü'z-Zekât","el-İhtiyâr, 1/100"],"f":"Zekât nisabı hesaplanırken havâic-i asliyye hesaba katılmaz.","rel":["Nisâb","Nâmî Mâl","Zekât"],"rt":"ح - و - ج"}],["Öşür",{"a":["'Uşür"],"l":"Yağmur, nehir ve akarsu suları ile masrafsız sulanan arazilerden onda bir (1/10); dolap, kuyu veya masraflı sulama tesisatıyla sulanan arazilerden ise yirmide bir (1/20) oranında alınan toprak zekâtıdır. Ebû Hanîfe'ye göre az olsun çok olsun topraktan çıkan her mahsulde öşür gerekir, nisap ve havl şart değildir.","r":["el-Kudûrî, Babü'l-Uşr","Bedâi'u's-Sanâi', 2/54"],"f":"Hasat vaktinde farzdır.","rel":["Zekât","Nisâb","Havl-i Havelân"],"rt":"ع - ش - ر"}],["İmsak",{"a":[],"l":"Orucun hakikati ve rüknüdür. Fecrin doğuşuyla başlar ve iftar vaktine kadar devam eder. Sözlükte nefsini tutmak, geri durmak anlamına gelir.","r":["el-Kudûrî, Babü's-Savm","el-Hidâye, 1/116"],"f":"Orucun rüknüdür.","rel":["Fecr-i Sâdık","İftâr","Savm"],"rt":"م - س - ك"}],["Keffâret",{"a":["Savm Keffâreti"],"l":"Ramazan'ın hürmetini kasten çiğnemenin cezasıdır. Sırasıyla: Bir köle azat etmek (günümüzde mevzubahis değil), güç yetiremezse aralıksız 60 gün oruç tutmak, buna da sıhhi bakımdan gücü yetmezse 60 fakiri sabah-akşam doyurmaktır.","r":["el-Kudûrî, Babü'l-Keffâre","Reddü'l-Muhtâr, 2/408"],"f":"Kasten Ramazan orucunu bozana farzdır.","rel":["Kazâ","Fidyah","İmsâk"],"rt":"ك - ف - ر"}],["İtikâf",{"a":["İ'tikâf"],"l":"Ramazan'ın son on gününde yapılması sünnet-i müekkede-i ale'l-kifâyedir (bir mahallede bir kişi yaparsa diğerlerinden sorumluluk düşer). Adak yapılırsa vacip, Ramazan haricinde yapılırsa nafile olur. Mescitten şer'i ve zaruri bir hacet (abdest, gusül, cuma namazı) olmaksızın çıkmak itikafı bozar.","r":["el-Kudûrî, Babü'l-İ'tikâf","el-Hidâye, 1/130"],"f":"Ramazan'ın son on gününde sünnet-i kifâyedir.","rel":["Savm","Mescid","Nezr"],"rt":"ع - ك - ف"}],["İhram",{"a":[],"l":"Haccın şartıdır. Hanefi mezhebine göre ihram sadece niyetle gerçekleşmez; niyetin yanında mutlaka telbiye veya Allah'ı tazim eden bir zikrin söylenmesi şarttır. Dikişli elbise giymek, koku sürünmek, saç-sakal tıraşı olmak ihramlıya yasaklanır.","r":["el-Kudûrî, Babü'l-İhrâm","Bedâi'u's-Sanâi', 2/160"],"f":"Hac ve umrenin sıhhat şartıdır.","rel":["Mîkāt","Telbiye","Tavâf","Mahzûrât-ı İhrâm"],"rt":"ح - ر - م"}],["Vakfe",{"a":["Arafat Vakfesi"],"l":"Haccın en mühim iki rüknünden biridir. Peygamber Efendimiz ﷺ \"Hac Arafat'tır\" buyurmuştur. Arefe günü öğle vaktinden bayram sabahı fecr-i sâdık vaktine kadar çok kısa bir an dahi olsa Arafat bölgesinde bulunan kimse haccın bu rüknünü yerine getirmiş olur.","r":["el-Kudûrî, Babü Sıfati'l-Hacc","el-İhtiyâr, 1/148"],"f":"Haccın en büyük farz rüknüdür.","rel":["Tavâf-ı Ziyâret","Müzdelife","Arefe"],"rt":"و - ق - ف"}],["Tavaf",{"a":["Tavâf-ı Kudûm","Tavâf-ı Ziyâret","Tavâf"],"l":"Tavâf-ı Kudûm: Âfâkî (Mekke dışından gelen) hacıların şehre vardıklarında yaptıkları ilk sünnet tavaftır. Tavâf-ı Ziyâret (İfâda): Kurban bayramı günlerinde yapılan haccın farz rüknüdür. Tavâf-ı Sadır (Vedâ): Hacıların memleketlerine dönmeden önce yaptıkları vacip tavaftır.","r":["el-Kudûrî, Babü't-Tavâf","el-Hidâye, 1/141"],"f":"Ziyaret tavafı farz, veda tavafı vacip, kudum tavafı sünnettir.","rel":["Şavt","Remel","İstisbâb","Hacer-i Esved"],"rt":"ط - و - ف"}],["Ribâ (Faiz)",{"a":[],"l":"Hanefi usulüne göre faizin illeti \"Kadr ve Cins\"tir. Kadr: Malın hacim ölçüsü (keyl) veya ağırlık ölçüsü (vezn) ile alınıp satılmasıdır. Cins ise malın tür birliğidir. Bu iki vasıf birleşirse (örneğin buğdayın buğdayla takası), hem fazlalık hem vade haramdır. Cins ayrılırsa (altın ile gümüş gibi) fazlalık caiz fakat vadeli satış yine haramdır.","r":["el-Kudûrî, Babü'r-Ribâ","el-Mebsût, 12/109","Bedâi'u's-Sanâi', 5/183"],"f":"Kesin nassla haram kılınmıştır.","rel":["Ribâ'l-Fadl","Ribâ'n-Nesîe","Mekîl","Mevzûn","Sarf"],"rt":"ر - ب - و"}],["İstihsân",{"a":[],"l":"Hanefi usulünün en belirgin ictihad metodudur. Bir meselede ilk bakışta akla gelen genel kuralın uygulanması haksızlığa veya meşakkate yol açacaksa; nass, icma, zaruret veya örfe dayanarak daha adil ve kolaylaştırıcı özel hükmün tercih edilmesidir. Örneğin selem akdinin ve hamam ücretinin meşruiyeti istihsân iledir.","r":["Serahsî, Usûlü's-Serahsî","Pezdevî, Kenzü'l-Vüsûl"],"f":"Hanefi mezhebinde muteber bir fıkıh usulü kaynağıdır.","rel":["Kıyâs","Zarûret","Örf","Kıyâs-ı Celî"],"rt":"ح - س - ن"}]],N=[["Gasl (Yıkamak)","الْغَسْلُ","Suyun yıkanan uzuv üzerinden en az iki damla damlayacak derecede akıtılması.","","taharet",{"a":["Gasl"],"l":"Hanefi fıkhında bir yerin yıkanmış sayılması için sadece ıslatılması kafi değildir; suyun o uzuv üzerinden akıp gitmesi (seyelân) şarttır. Sadece ıslak elle dokunulursa bu mesh sayılır, yıkama sayılmaz.","r":["el-Kudûrî, Babü'l-Vudû'","Reddü'l-Muhtâr, 1/95"],"f":"Yüz, kollar ve ayaklarda farz olan fiildir.","rel":["Vudû'","Mesh","Gusül"],"rt":"غ - س - ل"}],["İsfâr ve İbrâd","الْإِسْفَارُ وَالْإِبْرَادُ","Sabah namazını aydınlıkta kılmak (isfâr) ve yazın öğleyi sıcağın kırılmasına bırakmak (ibrâd).","","namaz",{"a":["İsfâr","İbrâd"],"l":"Hanefi mezhebine göre sabah namazının vaktinde cemaatin çoğalması ve kıraatin uzatılabilmesi için ufuk aydınlanıncaya kadar ertelenmesi (isfâr) müstehaptır. Yaz aylarında ise şiddetli sıcakta öğle namazını havanın serinlemesine kadar geciktirmek (ibrâd) sünnettir.","r":["el-Kudûrî, Babü Mevâkîti's-Salât","Mebsût, 1/144"],"f":"İsfâr ve ibrâd Hanefilerde müstehaptır.","rel":["Mevâkît","Ta'cîl","Fecr-i Sâdık"],"rt":"س - ف - ر / ب - ر - د"}],["İcâb ve Kabûl","الْإِيجَابُ وَالْقَبُولُ","Akdin kurulmasını sağlayan iki tarafın karşılıklı irade beyanı.","","muamelat",{"a":["İcâb","Kabûl"],"l":"Sözleşme yapmak isteyen ilk tarafın irade açıklamasına icap, ikinci tarafın buna uygun muvafakat açıklamasına kabul denir. Hanefi mezhebinde akitlerin mazi sîgasıyla (sattım - aldım) yapılması akde kesinlik kazandırdığı için esastır.","r":["el-Kudûrî, Babü İ'nikâdi'l-Bey'","Mecelle md. 101-104"],"f":"Bütün rızâî akitlerin kurucu rüknüdür.","rel":["İttihâd-ı Meclis","Teâtî","Bey'"],"rt":"و - ج - ب / ق - ب - ل"}],["Hıyârât (Muhayyerlik Hakları)","الْخِيَارَاتُ فِي الْبَيْعِ","Akit taraflarına sözleşmeyi feshetme veya onaylama serbestisi tanıyan şer'i haklar.","","muamelat",{"a":[],"l":"Başlıcaları: Hıyârü'ş-şart (üç güne kadar akdi bozma hakkını şart koşmak), Hıyârü'l-ayb (malda gizli kusur çıkması durumunda iade hakkı), Hıyârü'r-ru'yet (görmeden alınan malı gördükten sonra beğenmeyip geri verme hakkı) ve Hıyârü't-ta'yîn'dir.","r":["el-Kudûrî, Babü'l-Hıyârât","Mecelle md. 300-355"],"f":"Akitlerin adalet ve rıza üzerine tesisini temin eden haklardır.","rel":["Hıyârü'ş-Şart","Hıyârü'l-Ayb","Fesih","Bey'"],"rt":"خ - ي - ر"}],["Selem Akdi (Ön Ödemeli Satış)","بَيْعُ السَّلَمِ","Bedeli peşin ödenerek, nitelikleri tam belirlenmiş bir malı ileri bir vadede teslim alma akdi.","","muamelat",{"a":[],"l":"Normalde mevcut olmayan malın satışı yasakken (nehiy ani'l-ma'dum), selem akdi nasla istisna kılınmıştır. Şartları: Sermayenin (semen) akit meclisinde peşin teslimi, teslim vadesinin ve yerinin net belirlenmesi, malın cins, nevi ve vasıflarının ihtilafa meydan vermeyecek şekilde tayin edilmesidir.","r":["el-Kudûrî, Babü's-Selem","el-Hidâye, 3/73"],"f":"Şartlarına riayet edildiğinde caiz ve meşrudur.","rel":["Re'sü'l-mâl","Müsellemün fîh","İsticrâr"],"rt":"س - ل - م"}],["Kefâet (Denklik)","الْكَفَاءَةُ فِي النِّكَاحِ","Evlilikte erkeğin din, dindarlık, hürriyet, nesep ve ekonomik güç açısından kadına denk olması.","","muamelat",{"a":["Kefâet"],"l":"Hanefilerde kadının velisiz evlenebilme hakkı olduğu için, velilerin aile haysiyetini korumak adına itiraz hakkı kefâet şartına bağlanmıştır. Erkek kadına denk olmalıdır; kadının erkeğe denk olması aranmaz.","r":["el-Kudûrî, Babü'l-Kefâeh","Reddü'l-Muhtâr, 3/84"],"f":"Nikâhın lüzum şartıdır (akdin sıhhati için değil, bağlayıcılığı içindir).","rel":["Nikâh","Velî","Mehr-i Misl"],"rt":"ك - ف - أ"}],["Mehir (Mehr-i Müsemmâ & Misl)","الْمَهْرُ / الصَّدَاقُ","Erkeğin evlenirken kadına vermeyi taahhüt ettiği mal veya nakit.","","muamelat",{"a":["Mehir","Mehr-i Müsemmâ"],"l":"Mehr-i Müsemmâ: Akit anında miktarında anlaşılan mehirdir. Mehr-i Misl: Akitte belirlenmemişse kadının baba tarafından akrabası olan emsal kadınların mehrine denk takdir edilen mehirdir. Hanefi fıkhına göre mehrin asgari tutarı 10 gümüş dirhemdir.","r":["el-Kudûrî, Babü'l-Mehr","el-İhtiyâr, 3/102"],"f":"Evlilik akdi neticesinde kadının şahsi mülkiyetine geçen şer'i hakkıdır.","rel":["Mehr-i Müsemmâ","Mehr-i Misl","Müt'a","Halvet-i Sahîha"],"rt":"م - ه - ر"}],["Talâk (Ahsen, Hasen, Bid'î)","أَقْسَامُ الطَّلَاقِ","Evlilik bağının koca tarafından meşru lafızlarla çözülmesi ve çeşitleri.","","muamelat",{"a":[],"l":"Talâk-ı Ahsen: Kadının temizlik (tuhr) döneminde cinsi münasebet olmaksızın bir talakla boşanması ve iddeti bitene kadar beklenmesidir. Talâk-ı Hasen: Her temizlik döneminde birer talak vermek suretiyle üç temizlikte boşamak. Talâk-ı Bid'î: Kadını hayızlıyken boşamak veya aynı anda üç talakı birden vermektir; günah olmakla birlikte Hanefilere göre hukuken üç talak vaki olur.","r":["el-Kudûrî, Babü't-Talâk","el-Hidâye, 2/4"],"f":"Sünnete uygun olan Ahsen ve Hasen olanıdır.","rel":["Talâk-ı Ric'î","Talâk-ı Bâin","İddet","Hul'"],"rt":"ط - ل - ق"}],["Zâhirü'r-Rivâye (Mesâil-i Usûl)","ظَاهِرُ الرِّوَايَةِ","İmam Ebû Hanîfe ve talebelerinden İmam Muhammed aracılığıyla tevatür/şöhret yoluyla nakledilen altı temel kitap.","","usul",{"a":[],"l":"İmam Muhammed b. Hasan eş-Şeybânî'nin telif ettiği el-Asl (el-Mebsût), el-Câmiu's-Sağîr, el-Câmiu'l-Kebîr, ez-Ziyâdât, es-Siyeru's-Sağîr ve es-Siyeru'l-Kebîr adlı altı eserdir. Hanefi mezhebinde fetvada ilk başvurulan en muteber ve en sağlam rivayet tabakasıdır.","r":["İbn Âbidîn, Risâle fî Resmi'l-Müftî","Keşfü'l-Esrâr"],"f":"Hanefi fetvasında birinci derece bağlayıcı kaynaktır.","rel":["Nevâdir","Vâkıât","İmâmeyn"],"rt":"ظ - ه - ر"}],["el-İmâmeyn (İki İmam)","الْإِمَامَانِ","Hanefi mezhebinde İmam Ebû Yûsuf ile İmam Muhammed b. el-Hasan eş-Şeybânî.","","usul",{"a":[],"l":"İmam-ı Azam Ebû Hanîfe'nin en seçkin iki talebesidir. Fıkıh metinlerinde \"Ve kâlâ\" (ve o ikisi dediler ki) ifadesi geçtiğinde kastedilen Ebû Yûsuf ve İmam Muhammed'dir. Bazı meselelerde İmam-ı Azam tek kalıp İmâmeyn ittifak ettiğinde, örf ve ihtiyaca göre fetva İmâmeyn'in kavline göre verilebilir.","r":["el-Kudûrî","el-Hidâye","Reddü'l-Muhtâr"],"f":"Mezhep içi ictihadın en mühim iki rüknüdür.","rel":["Ebû Yûsuf","İmâm Muhammed","Zâhirü'r-Rivâye"],"rt":"أ - م - م"}],["Sedd-i Zerâyi'","سَدُّ الذَّرَائِعِ","Kötülüğe ve harama götüren meşru yolların ve vasıtaların önceden kapatılması ve yasaklanması.","","usul",{"a":[],"l":"Zâtında helal olan bir fiil veya vasıta, kesin veya galip ihtimalle haram bir neticeye ulaştırıyorsa, fukaha fitne ve haramı önlemek maksadıyla o vasıtayı meneder. Örneğin cuma ezanı anında alışverişin yasaklanması böyledir.","r":["Şâtıbî, el-Muvâfakāt","Usûl-i Fıkıh"],"f":"Şeriatın fesadı defetme gayesine matuf temel ilkedir.","rel":["Kavâid-i Fıkhiyye","Haram","Maslahat"],"rt":"ذ - ر - ع"}],["Asabe","عصبة","Ölenin mirasında farz sahipleri payını aldıktan sonra kalan malı alan, erkek soyundan gelen akrabalar (oğul, baba, kardeş vb.).","","muamelat"],["Ashâb-ı Ferâiz","أصحاب الفرائض","Kur'an'da payları belirlenmiş mirasçılar (eş, anne, baba, kız, kız kardeş vb.).","","muamel     },function(e){if(tk==rtk)fail(e)});

var GCAT_KEYS=["all","taharet","namaz","oruc","zekat","muamelat","usul"];

function catLabel(catId){
  var idx=GCAT_KEYS.indexOf(catId);
  return idx>=0?L().gcats[idx]:"";
}

function fold(s){
  return String(s||"").toLowerCase()
    .replace(/İ/g,"i").replace(/ı/g,"i")
    .normalize("NFD").replace(/[\u0300-\u036f\u064B-\u065F\u0670]/g,"")
    .replace(/[\u2019'`´ʿʾ\-]/g," ").replace(/\s+/g," ").trim();
}

function filteredGL(){
  var q=fold(glossQuery);
  var res=[];
  GL.forEach(function(g,idx){
    g._idx=idx;
    var c=g[4]||"usul";
    if(glossCat!=="all"&&c!==glossCat)return;
    if(!q){res.push({g:g,s:0});return}
    var tr=fold(g[0]),ar=fold(g[1]),score=-1;
    if(tr===q||ar===q)score=3;
    else if(tr.indexOf(q)===0||ar.indexOf(q)===0)score=2;
    else if(tr.indexOf(q)>=0||ar.indexOf(q)>=0)score=1;
    else if(fold(g[2]+" "+g[3]+" "+catLabel(c)).indexOf(q)>=0)score=0;
    if(score>=0)res.push({g:g,s:score});
  });
  if(q){
    var exact=res.filter(function(x){return x.s===3});
    if(exact.length)return exact.map(function(x){return x.g});
    res.sort(function(a,b){return b.s-a.s});
  }
  return res.map(function(x){return x.g});
}

  var cs=getComputedStyle(document.documentElement),bg=(cs.getPropertyValue("--card-solid")||"#fff").trim(),gold=(cs.getPropertyValue("--gold")||"#b38938").trim();
  var H=MMH,W3=1200,H3=Math.round(H*3);
  var svgS='<svg xmlns="http://www.w3.org/2000/svg" width="'+W3+'" height="'+H3+'" viewBox="0 0 400 '+H+'"><rect width="400" height="'+H+'" fill="'+bg+'"/>'+mmBody(true,gold)+"</svg>";
  var img=new Image();
  img.onload=function(){
    try{
      var cv=document.createElement("canvas");cv.width=W3;cv.height=H3;
      var cx=cv.getContext("2d");cx.fillStyle=bg;cx.fillRect(0,0,W3,H3);cx.drawImage(img,0,0,W3,H3);
      cv.toBlob(function(blob){
        if(!blob){mmExpFail();return}
        var nm=(mmName(MM).replace(/[^\p{L}\p{N}_-]+/gu,"-")||"harita")+".png",file=null;
        try{file=new File([blob],nm,{type:"image/png"})}catch(e){}
        MMX={blob:blob,file:file,nm:nm,url:URL.createObjectURL(blob)};
        mmExpShow();
      },"image/png");
    }catch(e){mmExpFail(e)}
  };
  img.onerror=function(){mmExpFail()};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgS);
}
function mmExpFail(e){if(e)console.error(e);alert(T("Resim oluşturulamadı. Lütfen tekrar dene.","تعذّر إنشاء الصورة. حاول مرة أخرى."))}

var GLX=null;
function glx(){

  var m=[];GL.forEach(function(g,i){var k=String(g[1]||"").replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/^ال/,"");if(k.length>=3)m.push({k:k,i:i})});
  m.sort(function(a,b){return b.k.length-a.k.length});
  var seen={},u=[];m.forEach(function(x){if(!seen[x.k]){seen[x.k]=x.i;u.push(x.k)}});
  var re=null;try{re=new RegExp("(?<![\\u0621-\\u064A])(?:ال)?("+u.map(function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}).join("|")+")(?![\\u0621-\\u064A])","g")}catch(e){}
  return GLX={re:re,map:seen};
}

document.addEventListener("pointermove",function(e){
  var svg=$("mm");if(!svg){mmDrag=0;mmPtr={};return}
  if(mmDrag){
    var n=nd(mmDrag);if(!n)return;
    var q=mmPt(e.clientX,e.clientY),nx=q.x-mmOff.x,ny=q.y-mmOff.y;
    if(Math.abs(nx-n.x)+Math.abs(ny-n.y)>.5)mmMoved=true;
    n.x=nx;n.y=ny;

  }
  var pr=mmPtr[e.pointerId];if(!pr)return;
  var ids=Object.keys(mmPtr);
  if(ids.length>=2&&mmPinch){pr.x=e.clientX;pr.y=e.clientY;var a=mmPtr[ids[0]],b=mmPtr[ids[1]];mmZoomAt(mmPinch.z*(Math.hypot(a.x-b.x,a.y-b.y)||1)/mmPinch.d,(a.x+b.x)/2,(a.y+b.y)/2);return}
  var dx=e.clientX-pr.x,dy=e.clientY-pr.y;pr.x=e.clientX;pr.y=e.clientY;
  if(mmZ>1){var r=svg.getBoundingClientRect(),k=(400/mmZ)/r.width;mmVx-=dx*k;mmVy-=dy*k;if(!window._dr){window._dr=requestAnimationFrame(function(){window._dr=0;draw()})}}
  else window.scrollBy(0,-dy);
});
function mmUp(e){

}

var KDB=[{"id":"taharah","number":1,"titleAr":"كِتَابُ الطَّهَارَةِ","titleTr":"Tahâret (Temizlik) Kitabı","iconName":"Droplets","description":"Abdest, gusül, teyemmüm, sular, necasetler ve hayız gibi temizlik ahkâmı.","sections":[{"id":"taharah-1","bookId":"taharah","babTitleAr":"بَابُ فُرُوضِ الْوُضُوءِ وَسُنَنِهِ","babTitleTr":"Abdestin Farzları ve Sünnetleri","arabicTextWithHarakat":"قَالَ أَبُو الْحُسَيْنِ أَحْمَدُ بْنُ مُحَمَّدٍ الْقُدُورِيُّ رَحِمَهُ اللَّهُ تَعَالَى:\nفَرْضُ الطَّهَارَةِ: غَسْلُ الْأَعْضَاءِ الثَّلَاثَةِ، وَمَسْحُ الرَّأْسِ؛ لِقَوْلِهِ تَعَالَى: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلَاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ وَامْسَحُوا بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَيْنِ﴾.\nوَالْغَسْلُ: هُوَ إِسَالَةُ الْمَاءِ عَلَى الْعُضْوِ، وَالْمَسْحُ: إِصَابَةُ الْبَلَلِ.\nوَالْوَجْهُ: مَا بَيْنَ قِصَاصِ الشَّعْرِ إِلَى أَسْفَلِ الذَّقَنِ، وَمَا بَيْنَ شَحْمَتَيِ الْأُذُنَيْنِ.\nوَالْمِرْفَقَانِ وَالْكَعْبَانِ يَدْخُلَانِ فِي الْغَسْلِ عِنْدَنَا.\nوَالْمَفْرُوضُ فِي مَسْحِ الرَّأْسِ: مِقْدَارُ النَّاصِيَةِ، وَهُوَ رُبُعُ الرَّأْسِ.\nوَسُنَنُ الْوُضُوءِ: غَسْلُ الْيَدَيْنِ إِلَى الرُّسْغَيْنِ قَبْلَ إِدْخَالِهِمَا الْإِنَاءَ إِذَا اسْتَيْقَظَ الْمُتَوَضِّئُ مِنْ نَوْمِهِ، وَالتَّسْمِيَةُ فِي ابْتِدَائِهِ، وَالسِّوَاكُ، وَالْمَضْمَضَةُ، وَالِاسْتِنْشَاقُ، وَتَخْلِيلُ اللِّحْيَةِ، وَتَخْلِيلُ الْأَصَابِعِ، وَتَكْرَارُ الْغَسْلِ ثَلَاثًا، وَاسْتِيعَابُ الرَّأْسِ بِالْمَسْحِ، وَمَسْحُ الْأُذُنَيْنِ بِمَاءِ الرَّأْسِ، وَالنِّيَّةُ، وَالتَّرْتِيبُ.","turkishTranslation":"Ebû'l-Hüseyin Ahmed b. Muhammed el-Kudûrî (Allah ona rahmet etsin) dedi ki:\nAbdestin (tahâretin) farzı: Üç uzvun yıkanması ve başın meshedilmesidir. Zira Yüce Allah şöyle buyurmuştur: \"Ey iman edenler! Namaza kalktığınız zaman yüzlerinizi ve dirseklere kadar ellerinizi yıkayın; başlarınızı meshedip topuklara kadar ayaklarınızı da yıkayın.\" (el-Mâide 5/6).\nYıkamak (Gasl): Suyun uzuv üzerinde akıtılmasıdır. Meshetmek: Yaşlığın (ıslaklığın) değdirilmesidir.\nYüz: Saç bitiminden çene altına, iki kulak memesi arasına kadar olan kısımdır.\nDirsekler ve topuklar Hanefi mezhebimize göre yıkamaya dahildir.\nBaşın meshedilmesinde farz olan miktar: Alın (nâsiye) miktarıdır ki bu da başın dörtte biridir.\nAbdestin sünnetleri şunlardır: Uykudan uyanıldığında elleri kaba sokmadan önce bileklere kadar yıkamak, başlarken besmele çekmek, misvak kullanmak, ağza su vermek (mazmaza), burna su çekmek (istinşak), sakalı hilallemek, parmak aralarını hilallemek, yıkamayı üçer kez tekrarlamak, başın tamamını meshetmek, kulakları başın suyuyla meshetmek, niyet etmek ve tertibe (sıraya) riayet etmektir.","fiqhExplanation":"Hanefi fıkhının temel kaidesine göre abdestin farzı Maide Suresi 6. ayette zikredilen 4 uzuvdur. İmam Ebû Hanîfe ve talebelerine göre niyet ve tertip sünnettir; Şâfiîlerde ise farzdır. Başın dörtte birinin meshi farz, tamamının kaplanarak meshi ise sünnettir.","keyTerms":["Vudû","Gasl","Mesh","Mazmaza","İstinşak","Nâsiye","Hilalleme"]},{"id":"taharah-2","bookId":"taharah","babTitleAr":"بَابُ نَوَاقِضِ الْوُضُوءِ","babTitleTr":"Abdesti Bozan Şeyler (Nevâkıd)","arabicTextWithHarakat":"فَصْلٌ فِي نَوَاقِضِ الْوُضُوءِ:\nيَنْقُضُ الْوُضُوءَ: كُلُّ مَا خَرَجَ مِنَ السَّبِيلَيْنِ: مِنْ بَوْلٍ أَوْ غَائِطٍ أَوْ رِيحٍ أَوْ دَمٍ أَوْ صَدِيدٍ.\nوَالدَّمُ وَالصَّدِيدُ وَالْقَيْحُ إِذَا خَرَجَ مِنْ غَيْرِ السَّبِيلَيْنِ فَسَالَ عَنْ مَوْضِعِهِ إِلَى مَوْضِعٍ يَلْحَقُهُ حُكْمُ التَّطْهِيرِ.\nوَالْقَيْءُ إِذَا كَانَ مِلْءَ الْفَمِ: مِنْ طَعَامٍ أَوْ مَاءٍ أَوْ مِرَارٍ أَوْ عَلَقٍ.\nوَالنَّوْمُ مُضْطَجِعًا، أَوْ مُتَّكِئًا عَلَى أَحَدِ جَنْبَيْهِ، أَوْ مُسْتَنِدًا إِلَى شَيْءٍ لَوْ أُزِيلَ لَسَقَطَ.\nوَالْغَلَبَةُ عَلَى الْعَقْلِ بِإِغْمَاءٍ أَوْ جُنُونٍ أَوْ سُكْرٍ.\nوَالْقَهْقَهَةُ فِي كُلِّ صَلَاةٍ ذَاتِ رُكُوعٍ وَسُجُودٍ إِذَا كَانَتْ مِنْ بَالِغٍ يَقْظَانَ.","turkishTranslation":"Abdesti Bozan Durumlar:\nAbdesti şu durumlar bozar:\n1. İki yoldan (ön ve arka) çıkan her şey: İdrar, dışkı, yel, kan veya irin.\n2. İki yol dışından çıkan kan, irin ve sarı su; çıktığı yerden temizlenmesi gereken bir yere doğru aktığı takdirde.\n3. Ağız dolusu kusmak: Yemek, su, safra veya pıhtılaşmış kan olsun.\n4. Yan yatarak, bir tarafına yaslanarak ya da kaldırıldığında düşeceği bir şeye dayanarak uyumak.\n5. Bayılma, delilik veya sarhoşluk sebebiyle aklın örtülmesi.\n6. Rükûlu ve secdeli her namazda, uyanık ve büluğ çağına ermiş bir kimseden sadır olan kahkaha.","fiqhExplanation":"Hanefilerde kanın sadece çıkması değil, akması (seyelân) şarttır. Ayrıca namaz içindeki kahkaha hem namazı bozar hem de abdesti bozar (hadis-i şerife istinaden). Cenaze namazında kahkaha sadece namazı bozar, abdesti bozmaz.","keyTerms":["Nevâkıd","Seyelân","Kahkaha","Sebîleyn","Kay' (Kusma)"]},{"id":"taharah-3","bookId":"taharah","babTitleAr":"بَابُ الْغُسْلِ وَمُوجِبَاتِهِ","babTitleTr":"Gusül ve Gerektiren Haller","arabicTextWithHarakat":"فَرْضُ الْغُسْلِ: الْمَضْمَضَةُ، وَالِاسْتِنْشَاقُ، وَغَسْلُ سَائِرِ الْبَدَنِ.\nوَسُنَّتُهُ: أَنْ يَبْدَأَ الْمُغْتَسِلُ فَيَغْسِلَ يَدَيْهِ وَفَرْجَهُ، وَيُزِيلَ النَّجَاسَةَ إِنْ كَانَتْ عَلَى بَدَنِهِ، ثُمَّ يَتَوَضَّأَ وُضُوءَهُ لِلصَّلَاةِ، إِلَّا رِجْلَيْهِ، ثُمَّ يُفِيضَ الْمَاءَ عَلَى رَأْسِهِ وَسَائِرِ جَسَدِهِ ثَلَاثًا، ثُمَّ يَتَنَحَّى فَيَغْسِلَ رِجْلَيْهِ.\nوَلَيْسَ عَلَى الْمَرْأَةِ أَنْ تَنْقُضَ ضَفَائِرَهَا فِي الْغُسْلِ إِذَا بَلَغَ الْمَاءُ أُصُولَ الشَّعْرِ.\nوَالْمُوجِبُ لِلْغُسْلِ: خُرُوجُ الْمَنِيِّ عَلَى وَجْهِ الدَّفْقِ وَالشَّهْوَةِ مِنْ رَجُلٍ أَوْ امْرَأَةٍ، وَالْتِقَاءُ الْخِتَانَيْنِ مِنْ غَيْرِ إِنْزَالٍ، وَالْحَيْضُ، وَالنِّفَاسُ.","turkishTranslation":"Guslün Farzı: Ağza su vermek (mazmaza), burna su vermek (istinşak) ve bütün bedeni yıkamaktır.\nGuslün Sünneti: Gusledecek kimsenin önce ellerini ve avret mahallini yıkaması, bedeninde necaset varsa gidermesi, sonra namaz abdesti gibi abdest alması (ancak ayaklarını sona bırakması), ardından başına ve bütün vücuduna üç defa su dökmesi, nihayet bir kenara çekilip ayaklarını yıkamasıdır.\nKadının saç örgülerini çözmesi şart değildir; suyun saç diplerine ulaşması yeterlidir.\nGuslü gerektiren haller: Kadından veya erkekten meninin şehvetle ve fışkırarak çıkması, boşalma olmasa dahi cima (iki sünnet mahallinin birleşmesi), hayız ve nifas hallerinin sona ermesidir.","fiqhExplanation":"Hanefi mezhebinde gusülde mazmaza ve istinşak farzdır; çünkü ağız ve burnun içi bedenin zâhirinden sayılır ve yıkanmasında güçlük yoktur. Şâfiî mezhebinde ise gusülde de bunlar sünnettir.","keyTerms":["Gusül","Cenâbet","Mazmaza","İstinşak","Meni","İltikâ-i Hıtâneyn"]},{"id":"taharah-4","bookId":"taharah","babTitleAr":"بَابُ التَّيَمُّمِ وَأَحْكَامِهِ","babTitleTr":"Teyemmüm ve Hükümleri","arabicTextWithHarakat":"مَنْ عَجَزَ عَنِ اسْتِعْمَالِ الْمَاءِ لِبُعْدِهِ مِنْهُ مِقْدَارَ مِيلٍ أَوْ أَكْثَرَ، أَوْ لِمَرَضٍ يَخَافُ زِيَادَتَهُ بِاسْتِعْمَالِهِ، أَوْ لِبَرْدٍ شَدِيدٍ يَخَافُ مَعَهُ التَّلَفَ، أَوْ لِخَوْفِ عَدُوٍّ، أَوْ لِعَطَشٍ يَخَافُهُ عَلَى نَفْسِهِ أَوْ عَلَى دَابَّتِهِ: تَيَمَّمَ بِالصَّعِيدِ الطَّاهِرِ.\nوَكَيْفِيَّتُهُ: أَنْ يَضْرِبَ بِيَدَيْهِ عَلَى الصَّعِيدِ الطَّاهِرِ، فَيَمْسَحَ بِهِمَا وَجْهَهُ، ثُمَّ يَضْرِبَ ضَرْبَةً أُخْرَى، فَيَمْسَحَ بِهِمَا يَدَيْهِ إِلَى الْمِرْفَقَيْنِ.\nوَيَجُوزُ التَّيَمُّمُ بِكُلِّ مَا كَانَ مِنْ جِنْسِ الْأَرْضِ: كَالتُّرَابِ وَالرَّمْلِ وَالْحَجَرِ وَالْجِصِّ وَالْكُحْلِ وَالزِّرْنِيخِ.\nوَالنِّيَّةُ فَرْضٌ فِي التَّيَمُّمِ؛ لِأَنَّ التُّرَابَ لَيْسَ بِمُطَهِّرٍ بِنَفْسِهِ.","turkishTranslation":"Bir mil (yaklaşık 1.8 km) veya daha uzak olması sebebiyle suya ulaşamayan, su kullandığında hastalığının artmasından korkan, helak olmaktan korkulacak derecedeki şiddetli soğukta kalan, düşman tehlikesi bulunan yahut kendisi veya bineği için susuzluktan endişe eden kimse, temiz yer cinsinden bir şeyle teyemmüm eder.\nTeyemmümün Yapılışı: İki elini temiz toprağa vurup yüzünü mesheder, sonra tekrar vurup dirseklere kadar kollarını mesheder.\nYer cinsinden olan her şeyle teyemmüm caizdir: Toprak, kum, taş, kireç, sürme ve zırnık gibi.\nTeyemmümde niyet farzdır; çünkü toprak bizâtihi temizleyici olmayıp niyet ile bedel kılınmıştır.","fiqhExplanation":"Hanefilerde toprak dışındaki yer cinsinden taş, mermer, kum, tuğla ve kireç gibi maddelerle de teyemmüm caizdir. Teyemmümde niyet şarttır; zira Kur'an'da 'feteyemmemû' emri 'kastediniz/niyet ediniz' manasını taşır.","keyTerms":["Teyemmüm","Sa'îd-i Tâhir","Niyet","Cinsü'l-Ard"]},{"id":"taharah-5","bookId":"taharah","babTitleAr":"بَابُ الْمَسْحِ عَلَى الْخُفَّيْنِ","babTitleTr":"Mestler Üzerine Meshetmek","arabicTextWithHarakat":"الْمَسْحُ عَلَى الْخُفَّيْنِ جَائِزٌ بِالسُّنَّةِ مِنَ الْأَحْدَاثِ كُلِّهَا، إِذَا لَبِسَهُمَا عَلَى طَهَارَةٍ كَامِلَةٍ، ثُمَّ أَحْدَثَ.\nيَمْسَحُ الْمُقِيمُ يَوْمًا وَلَيْلَةً، وَالْمُسَافِرُ ثَلَاثَةَ أَيَّامٍ وَلَيَالِيهَا.\nوَابْتِدَاءُ الْمُدَّةِ: مِنْ وَقْتِ الْحَدَثِ بَعْدَ اللُّبْسِ.\nوَفَرْضُ الْمَسْحِ: مِقْدَارُ ثَلَاثِ أَصَابِعَ مِنْ أَصَابِعِ الْيَدِ عَلَى ظَاهِرِ مُقَدَّمِ الْخُفِّ.\nوَيَبْطُلُ الْمَسْحُ: بِمَا يَنْقُضُ الْوُضُوءَ، وَبِنَزْعِ الْخُفِّ، أَوْ مُضِيِّ الْمُدَّةِ.","turkishTranslation":"Mestler üzerine mesh, sünnet ile sabittir ve tam bir abdest üzere giyilip sonradan hades (abdest bozucu hal) meydana geldiğinde caizdir.\nMukim için süre bir gün bir gece (24 saat), yolcu (müsâfir) için ise üç gün üç gecedir (72 saat).\nMüddetin başlangıcı: Mesti giydikten sonra abdestin ilk bozulduğu andan itibarendir.\nMeshte farz olan miktar: Mestine üst (zahiri) kısmından elin üç parmağı miktarı kadar çekilmesidir.\nMeshi bozan haller: Abdesti bozan her şey, mestin çıkarılması yahut sürenin dolmasıdır.","fiqhExplanation":"Mest süresi giyme anından değil, giyildikten sonraki İLK HADES anından hesaplanır. Süre dolduğunda veya mest çıktığında kişi sadece ayaklarını yıkar, abdesti tam ise baştan abdest alması gerekmez.","keyTerms":["Huf","Mest","Mesh Müddeti","Hadesten Taharet"]}]},{"id":"salat","number":2,"titleAr":"كِتَابُ الصَّلَاةِ","titleTr":"Salât (Namaz) Kitabı","iconName":"Clock","description":"Vakitler, ezan, namazın şartları, rükünleri, cemaat, vitir, teravih ve sehiv secdesi ahkâmı.","sections":[{"id":"salat-1","bookId":"salat","babTitleAr":"بَابُ مَوَاقِيتِ الصَّلَاةِ","babTitleTr":"Namaz Vakitleri","arabicTextWithHarakat":"أَوَّلُ وَقْتِ الْفَجْرِ: إِذَا طَلَعَ الْفَجْرُ الثَّانِي، وَهُوَ الْبَيَاضُ الْمُسْتَطِيرُ فِي الْأُفُقِ، وَآخِرُ وَقْتِهَا: مَا لَمْ تَطْلُعِ الشَّمْسُ.\nوَأَوَّلُ وَقْتِ الظُّهْرِ: إِذَا زَالَتِ الشَّمْسُ، وَآخِرُ وَقْتِهَا: عِنْدَ أَبِي حَنِيفَةَ رَحِمَهُ اللَّهُ إِذَا صَارَ ظِلُّ كُلِّ شَيْءٍ مِثْلَيْهِ سِوَى فَيْءِ الزَّوَالِ، وَقَالَا: إِذَا صَارَ ظِلُّهُ مِثْلَهُ.\nوَأَوَّلُ وَقْتِ الْعَصْرِ: إِذَا خَرَجَ وَقْتُ الظُّهْرِ، وَآخِرُهُ: مَا لَمْ تَغْرُبِ الشَّمْسُ.\nوَأَوَّلُ وَقْتِ الْمَغْرِبِ: إِذَا غَرَبَتِ الشَّمْسُ، وَآخِرُ وَقْتِهَا: مَا لَمْ يَغِبِ الشَّفَقُ؛ وَالشَّفَقُ هُوَ الْبَيَاضُ الَّذِي يَلِي الْحُمْرَةَ عِنْدَ أَبِي حَنِيفَةَ، وَقَالَا: هُوَ الْحُمْرَةُ.\nوَأَوَّلُ وَقْتِ الْعِشَاءِ: إِذَا غَابَ الشَّفَقُ، وَآخِرُ وَقْتِهَا: مَا لَمْ يَطْلُعِ الْفَجْرُ الصَّادِقُ.\nوَالْوِتْرُ: وَقْتُهُ بَعْدَ الْعِشَاءِ إِلَى طُلُوعِ الْفَجْرِ.","turkishTranslation":"Sabah namazının ilk vakti: İkinci fecir (ufukta enlemesine yayılan beyazlık/fecr-i sadık) doğduğu andır. Son vakti ise güneş doğuncaya kadardır.\nÖğle namazının ilk vakti: Güneş zevalden (tam tepe noktasından) batıya kaydığı andır. Son vakti ise Ebû Hanîfe'ye göre zeval gölgesi hariç her şeyin gölgesi kendisinin iki katı (asrü'l-mislleyn) olduğu andır. İmâmeyn'e (Ebû Yûsuf ve Muhammed) göre ise gölgesi bir katı olduğunda biter.\nİkindi namazının ilk vakti: Öğle vakti çıktığı andır. Son vakti güneş batıncaya kadardır.\nAkşam namazının ilk vakti: Güneş battığı andır. Son vakti şafak kayboluncaya kadardır. Ebû Hanîfe'ye göre şafak kırmızılıktan sonraki beyazlıktır; İmâmeyn'e göre ise kırmızılıktır.\nYatsı namazının ilk vakti: Şafak kaybolduğu andır. Son vakti ikinci fecir doğuncaya kadardır.\nVitir namazının vakti ise: Yatsı namazından sonra başlar ve fecrin doğuşuna kadar sürer.","fiqhExplanation":"Hanefi fıkhında sabah namazını isfâr (ortalık aydınlandığında), sıcak yaz günlerinde öğleyi ibrâd (serinliğe bırakmak), kışın ise ta'cil (erken kılmak) müstehaptır. İkindi namazını güneşin rengi değişmeyecek şekilde geciktirmek de müstehaptır.","keyTerms":["Fecr-i Sâdık","Zevâl","Fey-i Zevâl","Şafak","İsfâr","İbrâd"]},{"id":"salat-2","bookId":"salat","babTitleAr":"بَابُ الْأَذَانِ وَالْإِقَامَةِ","babTitleTr":"Ezan ve İkamet","arabicTextWithHarakat":"الْأَذَانُ سُنَّةٌ لِلصَّلَوَاتِ الْخَمْسِ وَلِلْجُمُعَةِ دُونَ مَا سِوَاهَا.\nوَكَيْفِيَّتُهُ: «اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ. أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ. أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ. حَيَّ عَلَى الصَّلَاةِ، حَيَّ عَلَى الصَّلَاةِ. حَيَّ عَلَى الْفَلَاحِ، حَيَّ عَلَى الْفَلَاحِ. اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ. لَا إِلَهَ إِلَّا اللَّهُ».\nوَلَا تَرْجِيعَ فِيهِ عِنْدَنَا.\nوَفِي أَذَانِ الْفَجْرِ يَزِيدُ بَعْدَ الْفَلَاحِ: «الصَّلَاةُ خَيْرٌ مِنَ النَّوْمِ» مَرَّتَيْنِ.\nوَالْإِقَامَةُ مِثْلُ الْأَذَانِ إِلَّا أَنَّهُ يَزِيدُ فِيهَا بَعْدَ الْفَلَاحِ: «قَدْ قَامَتِ الصَّلَاةُ، قَدْ قَامَتِ الصَّلَاةُ».\nوَالْأَذَانُ يُتَرَسَّلُ فِيهِ، وَالْإِقَامَةُ تُحْدَرُ.","turkishTranslation":"Ezan, beş vakit namaz ve Cuma namazı için sünnettir; diğer namazlar için ezan okunmaz.\nEzanın lafızları: 4 tekbir, 2 defa şehadeteyn, 2 defa Hayye ala's-Salah, 2 defa Hayye ala'l-Felah, 2 tekbir ve Kelime-i Tevhid'dir.\nHanefi mezhebimize göre ezanda tercî' (şehadetleri gizli söyleyip sonra sesli tekrarlamak) yoktur.\nSabah ezanında 'Hayye ale'l-felâh'tan sonra iki defa «es-Salâtü hayrun mine'n-nevm» (Namaz uykudan hayırlıdır) ilave edilir.\nKāmet de ezan gibidir; ancak felâhtan sonra iki kere «Kad kâmeti's-salâh» (Namaz başladı) denir.\nEzan ağır ağır (teressül ile), kāmet ise seri bir şekilde (hadr ile) okunur.","fiqhExplanation":"Hanefilerde kāmet cümleleri de ezan gibi çift çift söylenir (Şâfiîlerde tekbirden başka cümleler tektir). Ezanda sesin tane tane çıkarılması sünnettir.","keyTerms":["Ezân","İkāmet","Teressül","Hadr","Tesvîb","Tercî'"]},{"id":"salat-3","bookId":"salat","babTitleAr":"بَابُ شُرُوطِ الصَّلَاةِ وَأَرْكَانِهَا","babTitleTr":"Namazın Şartları ve Rükünleri","arabicTextWithHarakat":"شُرُوطُ الصَّلَاةِ الَّتِي تَتَقَدَّمُهَا:\nطَهَارَةُ الْبَدَنِ مِنَ الْحَدَثِ وَالنَّجَسِ، وَطَهَارَةُ الثَّوْبِ، وَطَهَارَةُ الْمَكَانِ، وَسَتْرُ الْعَوْرَةِ؛ وَعَوْرَةُ الرَّجُلِ: مَا تَحْتَ السُّرَّةِ إِلَى تَحْتِ الرُّكْبَةِ، وَالرُّكْبَةُ مِنَ الْعَوْرَةِ عِنْدَنَا؛ وَبَدَنُ الْمَرْأَةِ الْحُرَّةِ كُلُّهُ عَوْرَةٌ إِلَّا وَجْهَهَا وَكَفَّيْهَا وَقَدَمَيْهَا.\nوَاسْتِقْبَالُ الْقِبْلَةِ، وَالنِّيَّةُ، وَدُخُولُ الْوَقْتِ.\nوَأَرْكَانُ الصَّلَاةِ: التَّحْرِيمَةُ، وَالْقِيَامُ، وَالْقِرَاءَةُ، وَالرُّكُوعُ، وَالسُّجُودُ، وَالْقَعْدَةُ الْأَخِيرَةُ مِقْدَارَ التَّشَهُّدِ.","turkishTranslation":"Namazdan önce gelen şartlar (Dışındaki Farzlar):\n1. Bedenin hadesten (abdestsizlik/cünüplük) ve necasetten temiz olması.\n2. Elbisenin temiz olması.\n3. Namaz kılınacak yerin temiz olması.\n4. Setr-i avret (avret yerlerinin örtülmesi). Erkeğin avreti göbeğin altından diz kapağının altına kadardır; diz kapağı Hanefi mezhebimize göre avrettir. Hür kadının ise yüzü, iki eli ve ayakları müstesna bütün bedeni avrettir.\n5. Kıbleye yönelmek (İstikbâl-i Kıble).\n6. Niyet etmek.\n7. Vaktin girmesi.\nNamazın Rükünleri (İçindeki Farzlar): İftitah tekbiri (Tahrime), Kıyâm (ayakta durmak), Kırâat (Kur'an okumak), Rükû', Sücûd (secde etmek) ve Teşehhüt miktarı son oturuş (Ka'de-i ahîre).","fiqhExplanation":"Hanefilere göre namazın farzları şartlar ve rükünler olmak üzere ikiye ayrılır. İftitah tekbiri bir şarta benzerse de namazın ayrılmaz başlangıcı olduğu için rükün sayılmıştır. Ayakta durmaya gücü yetmeyen oturarak rükû ve secde eder.","keyTerms":["Şurût","Erkân","Setr-i Avret","İstikbâl-i Kıble","Tahrîme","Ka'de-i Ahîre"]},{"id":"salat-4","bookId":"salat","babTitleAr":"بَابُ سُجُودِ السَّهْوِ","babTitleTr":"Sehiv Secdesi","arabicTextWithHarakat":"سُجُودُ السَّهْوِ وَاجِبٌ فِي الزِّيَادَةِ وَالنُّقْصَانِ.\nوَكَيْفِيَّتُهُ: أَنْ يَسْجُدَ سَجْدَتَيْنِ بَعْدَ التَّسْلِيمِ، ثُمَّ يَتَشَهَّدَ وَيُسَلِّمَ.\nفَإِنْ شَكَّ فِي صَلَاتِهِ فَلَمْ يَدْرِ كَمْ صَلَّى؟ فَإِنْ كَانَ ذَلِكَ أَوَّلَ مَا عَرَضَ لَهُ: اسْتَأْنَفَ الصَّلَاةَ.\nوَإِنْ كَانَ يَكْثُرُ ذَلِكَ مِنْهُ: تَحَرَّى وَبَنَى عَلَى غَالِبِ ظَنِّهِ؛ فَإِنْ لَمْ يَكُنْ لَهُ ظَنٌّ بَنَى عَلَى الْيَقِينِ وَهُوَ الْأَقَلُّ، وَيَسْجُدُ لِلسَّهْوِ فِي آخِرِ صَلَاتِهِ.","turkishTranslation":"Sehiv secdesi, namazın vaciplerinden birinin sehven (yanılarak) geciktirilmesi yahut terk edilmesi halinde vaciptir.\nYapılışı: Son oturuşta tahiyyatı okuduktan sonra sağ tarafa selam verir, iki secde yapar, tekrar teşehhüt okur ve her iki tarafa selam verir.\nKişi namazında kaç rekat kıldığında şüphe ederse:\nEğer bu şüphe hayatında veya uzun zamandır ilk defa başına geliyorsa, namazını baştan kılar (isti'naf).\nEğer sık sık şüpheye düşen biri ise, galip zannına göre araştırıp amel eder; bir zannı oluşmazsa en az olan kesin rekatı (yakîn) esas alır ve namazın sonunda sehiv secdesi yapar.","fiqhExplanation":"Hanefi mezhebinde sehiv secdesi farzın terkiyle değil, ancak vacibin sehven terki veya tehir edilmesiyle vacip olur. Farz kasten veya sehven terk edilirse namaz batıl olur, iadesi gerekir.","keyTerms":["Sücûd-i Sehv","Gālib-i Zan","İsti'nâf","Taharrî","Vâcibât-ı Salât"]}]},{"id":"zekat","number":3,"titleAr":"كِتَابُ الزَّكَاةِ","titleTr":"Zekât Kitabı","iconName":"Coins","description":"Nisap miktarları, altın ve gümüş zekâtı, hayvanların zekâtı, öşür ve fıtır sadakası.","sections":[{"id":"zekat-1","bookId":"zekat","babTitleAr":"بَابُ شُرُوطِ وُجُوبِ الزَّكَاةِ وَالنِّصَابِ","babTitleTr":"Zekâtın Vücub Şartları ve Nisap","arabicTextWithHarakat":"الزَّكَاةُ وَاجِبَةٌ عَلَى كُلِّ مُسْلِمٍ حُرٍّ بَالِغٍ عَاقِلٍ إِذَا مَلَكَ نِصَابًا حَوْلِيًّا نَامِيًا فَاضِلًا عَنْ حَاجَتِهِ الْأَصْلِيَّةِ وَعَنْ دَيْنِهِ.\nوَلَا زَكَاةَ فِي مَالِ الصَّبِيِّ وَالْمَجْنُونِ عِنْدَ أَبِي حَنِيفَةَ رَحِمَهُ اللَّهُ.\nوَنِصَابُ الذَّهَبِ: عِشْرُونَ مِثْقَالًا، وَفِيهَا نِصْفُ مِثْقَالٍ.\nوَنِصَابُ الْفِضَّةِ: مِائَتَا دِرْهَمٍ، وَفِيهَا خَمْسَةُ دَرَاهِمَ.\nفَمَا زَادَ فَبِحِسَابِهِ؛ عِنْدَ أَبِي حَنِيفَةَ لَا شَيْءَ فِي الزِّيَادَةِ حَتَّى تَبْلُغَ أَرْبَعِينَ دِرْهَمًا فَيَكُونَ فِيهَا دِرْهَمٌ، وَقَالَا: مَا زَادَ فَبِحِسَابِهِ وَإِنْ قَلَّ.","turkishTranslation":"Zekât; hür, bâliğ, akıl sahibi her müslümana, borcundan ve aslî ihtiyaçlarından (havâic-i asliyye) fazla, nâmî (artıcı) bir nisap miktarı mala sahip olup üzerinden bir kamerî yıl (havl-i havelân) geçtiğinde farzdır.\nEbû Hanîfe'ye göre çocuk ve akıl hastasının malında zekât farz değildir (İmâmeyn ve Şâfiî'ye göre ise velisi onların malından verir).\nAltının nisabı: Yirmi miskaldir (yaklaşık 80.18 - 85 gram) ve bunda kırkta bir olan yarım miskal zekât verilir.\nGümüşün nisabı: İki yüz dirhemdir (yaklaşık 595 - 560 gram) ve bunda beş dirhem verilir.\nNisabın üzerindeki fazlalıkta ise Ebû Hanîfe'ye göre 40 dirheme ulaşmadıkça fazlalık için bir şey verilmez; İmâmeyn'e göre ise az da olsa orantılı olarak zekâtı verilir.","fiqhExplanation":"Zekâtta 'temlik' şarttır. Yani zekât hak eden fakirin mülkiyetine doğrudan geçirilmelidir. Vakıf, cami yapımı gibi yerlere zekât verilmez, zira temlik gerçekleşmez.","keyTerms":["Nisâb","Havl-i Havelân","Havâic-i Asliyye","Nâmî Mâl","Temlîk","Miskâl"]},{"id":"zekat-2","bookId":"zekat","babTitleAr":"بَابُ مَصَارِفِ الزَّكَاةِ وَصَدَقَةِ الْفِطْرِ","babTitleTr":"Zekâtın Verileceği Yerler ve Sadaka-i Fıtır","arabicTextWithHarakat":"مَصَارِفُ الزَّكَاةِ: هُمُ الْفُقَرَاءُ، وَالْمَسَاكِينُ، وَالْعَامِلُونَ عَلَيْهَا، وَالْمُؤَلَّفَةُ قُلُوبُهُمْ، وَفِي الرِّقَابِ، وَالْغَارِمُونَ، وَفِي سَبِيلِ اللَّهِ، وَابْنُ السَّبِيلِ.\nوَلَا يَجُوزُ أَنْ يَدْفَعَ الزَّكَاةَ إِلَى أَصْلِهِ وَإِنْ عَلَا، وَلَا إِلَى فَرْعِهِ وَإِنْ سَفَلَ، وَلَا إِلَى زَوْجَتِهِ، وَلَا إِلَى غَنِيٍّ.\nوَصَدَقَةُ الْفِطْرِ: وَاجِبَةٌ عَلَى كُلِّ حُرٍّ مُسْلِمٍ عِنْدَهُ فَضْلٌ عَنْ قُوتِهِ وَقُوتِ عِيَالِهِ يَوْمَ الْعِيدِ وَلَيْلَتِهِ.\nوَقَدْرُهَا: نِصْفُ صَاعٍ مِنْ بُرٍّ أَوْ دَقِيقِهِ، أَوْ صَاعٌ مِنْ تَمْرٍ أَوْ شَعِيرٍ أَوْ زَبِيبٍ.","turkishTranslation":"Zekâtın verileceği yerler (Tevbe 60. ayette bildirilen sınıflar):\nFakirler, miskinler, zekât memurları (âmiller), müellefe-i kulûb, köleler (kurtulmak isteyen mükâtebler), borçlular (gārimîn), Allah yolundakiler ve yolda kalmış yolculardır.\nKişi zekâtını usûlüne (anne, baba, dede, nene) ve fürûuna (çocukları, torunları) veremez. Eşine ve zengine de zekât veremez.\nSadaka-i Fıtır (Fitre): Bayram günü ve gecesi kendisinin ve ailesinin temel nafakasından fazla nisap miktarı mala sahip her hür müslümana vaciptir.\nFitre miktarı: Buğday veya unundan yarım sâ' (yaklaşık 1.66 kg) yahut hurma, arpa veya kuru üzümden bir sâ'dır (yaklaşık 3.32 kg). Değeri nakit olarak da ödenebilir.","fiqhExplanation":"Hanefi mezhebinde fitre ve zekâtın ayni olarak (buğday/arpa) verilmesi caiz olduğu gibi, kıymetinin (para olarak) verilmesi fakirin ihtiyacını daha iyi karşılayacağı için efdal görülmüştür.","keyTerms":["Masârif","Fakir","Miskîn","Gârimîn","Sâ'","Sadaka-i Fıtır"]}]},{"id":"savm","number":4,"titleAr":"كِتَابُ الصَّوْمِ","titleTr":"Savm (Oruç) Kitabı","iconName":"Moon","description":"Ramazan hilali, orucun farzları, orucu bozan ve bozmayan şeyler, kaza ve kefaret.","sections":[{"id":"savm-1","bookId":"savm","babTitleAr":"بَابُ رُؤْيَةِ الْهِلَالِ وَصِفَةِ الصَّوْمِ","babTitleTr":"Hilalin Görülmesi ve Orucun Mahiyeti","arabicTextWithHarakat":"الصَّوْمُ هُوَ: الْإِمْسَاكُ عَنِ الْأَكْلِ وَالشُّرْبِ وَالْجِمَاعِ، مِنِ اسْتِبَانَةِ الْفَجْرِ الصَّادِقِ إِلَى غُرُوبِ الشَّمْسِ، مَعَ النِّيَّةِ.\nوَيَجِبُ صَوْمُ رَمَضَانَ بِرُؤْيَةِ الْهِلَالِ، فَإِنْ غُمَّ عَلَيْهِمْ عَدُّوا ثَلَاثِينَ يَوْمًا.\nوَالنِّيَّةُ شَرْطٌ فِي الصَّوْمِ: فَصَوْمُ رَمَضَانَ وَالنَّذْرُ الْمُعَيَّنُ وَالنَّفْلُ يَجُوزُ بِنِيَّةٍ مِنْ اللَّيْلِ إِلَى مَا قَبْلَ نِصْفِ النَّهَارِ الشَّرْعِيِّ.\nوَأَمَّا الْقَضَاءُ وَالْكَفَّارَاتُ وَالنَّذْرُ الْمُطْلَقُ: فَلَا يَجُوزُ فِيهَا إِلَّا النِّيَّةُ مِنَ اللَّيْلِ مَعَ التَّعْيِينِ.","turkishTranslation":"Oruç (Savm): Fecr-i sâdıkın zuhurundan güneşin batışına kadar niyet ederek yemekten, içmekten ve cinsi münasebetten kendini tutmaktır (imsâk).\nRamazan orucu hilalin görülmesiyle farz olur. Eğer gökyüzü kapalı olup hilal görülemezse Şaban ayı otuza tamamlanır.\nOruçta niyet şarttır: Ramazan orucu, belirli adak (nezr-i muayyen) ve nafile oruçlar için geceden itibaren kaba kuşluğa (zevalden önceki yarı zamana / nısf-ı nehâr-ı şer'î) kadar niyet etmek caizdir.\nKaza oruçları, kefaretler ve mutlak adaklar için ise mutlaka geceden niyet etmek ve orucun türünü belirlemek (tayin) şarttır.","fiqhExplanation":"Hanefilerde Ramazan orucuna mutlak niyet kafi gelir; hatta nafileye dahi niyet edilse o gün Ramazan orucuna sayılır. Zira Ramazan vakti sırf farz oruca tahsis edilmiştir.","keyTerms":["İmsâk","Hilâl","Nısf-ı Nehâr","Keffâret","Kazâ","Nezr"]},{"id":"savm-2","bookId":"savm","babTitleAr":"بَابُ مَا يُفْسِدُ الصَّوْمَ وَمَا لَا يُفْسِدُهُ","babTitleTr":"Orucu Bozan ve Bozmayan Haller","arabicTextWithHarakat":"مَنْ أَكَلَ أَوْ شَرِبَ أَوْ جَامَعَ نَاسِيًا: لَمْ يُفْطِرْ، وَيُتِمُّ صَوْمَهُ.\nوَإِنِ احْتَلَمَ، أَوْ نَظَرَ بِشَهْوَةٍ فَأَنْزَلَ، أَوْ ادَّهَنَ، أَوْ اكْتَحَلَ، أَوْ قَبَّلَ فَلَمْ يُنْزِلْ: لَمْ يُفْطِرْ.\nوَإِنْ أَفْطَرَ عَمْدًا فِي رَمَضَانَ بِأَكْلٍ أَوْ شُرْبٍ مِمَّا يُتَغَذَّى بِهِ أَوْ يُتَدَاوَى بِهِ أَوْ بِجِمَاعٍ: فَعَلَيْهِ الْقَضَاءُ وَالْكَفَّارَةُ.\nوَالْكَفَّارَةُ: عِتْقُ رَقَبَةٍ، فَإِنْ لَمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ، فَإِنْ لَمْ يَسْتَطِعْ فَإِطْعَامُ سِتِّينَ مِسْكِينًا.\nوَإِنْ أَكَلَ مَا لَا يُتَغَذَّى بِهِ كَالتُّرَابِ وَالْحَصَى وَالْوَرَقِ أَوْ أُوجِرَ أَوْ سُعِطَ: فَعَلَيْهِ الْقَضَاءُ دُونَ الْكَفَّارَةِ.","turkishTranslation":"Unutarak yiyip içen veya cinsi münasebette bulunan kimsenin orucu bozulmaz; orucunu tamamlar.\nRüyalanan, şehvetle bakıp inzal olan, yağ sürünen, sürme çeken yahut öpüp de inzal olmayan kimsenin de orucu bozulmaz.\nRamazan ayında oruçlu olduğunu bilerek gıda veya ilaç niteliğindeki bir şeyi kasten yiyip içen yahut cima eden kimseye hem kaza hem de kefaret gerekir.\nKefaret: Bir köle azat etmek, buna gücü yetmezse aralıksız iki kameri ay oruç tutmak, buna da gücü yetmezse altmış fakiri sabah-akşam doyurmaktır.\nGıda veya deva özelliği taşımayan toprak, çakıl taşı, kâğıt gibi bir şeyi yutan veya boğazına zorla bir şey akıtılan kimseye ise sadece kaza gerekir, kefaret gerekmez.","fiqhExplanation":"Hanefilerde kefaret hem kasten yemek-içmekle hem de cima ile gerekir. Şâfiî mezhebinde ise kefaret sadece cima ile vacip olur, yemek-içmekte sadece kaza gerekir.","keyTerms":["Keffâret","Kazâ","İnzâl","Nisyân (Unutma)","Mütetâbi'"]}]},{"id":"hacc","number":5,"titleAr":"كِتَابُ الْحَجِّ","titleTr":"Hac Kitabı","iconName":"Compass","description":"Mîkatlar, ihram, tavaf, sa'y, Arafat vakfesi ve hac ibadetinin rükünleri.","sections":[{"id":"hacc-1","bookId":"hacc","babTitleAr":"بَابُ الْمَوَاقِيتِ وَالْإِحْرَامِ","babTitleTr":"Mîkatlar ve İhrama Giriş","arabicTextWithHarakat":"مَوَاقِيتُ الْإِحْرَامِ الَّتِي لَا يَجُوزُ لِمَنْ أَرَادَ دُخُولَ مَكَّةَ أَنْ يُجَاوِزَهَا إِلَّا مُحْرِمًا:\nذُو الْحُلَيْفَةِ: لِأَهْلِ الْمَدِينَةِ. وَالْجُحْفَةُ: لِأَهْلِ الشَّامِ. وَيَلَمْلَمُ: لِأَهْلِ الْيَمَنِ. وَقَرْنُ الْمَنَازِلِ: لِأَهْلِ نَجْدٍ. وَذَاتُ عِرْقٍ: لِأَهْلِ الْعِرَاقِ.\nفَإِذَا أَرَادَ الْإِحْرَامَ: اغْتَسَلَ أَوْ تَوَضَّأَ، وَالْغُسْلُ أَفْضَلُ، وَلَبِسَ ثَوْبَيْنِ جَدِيدَيْنِ أَوْ غَسِيلَيْنِ: إِزَارًا وَرِدَاءً، وَتَطَيَّبَ.\nثُمَّ صَلَّى رَكْعَتَيْنِ، وَقَالَ: «اللَّهُمَّ إِنِّي أُرِيدُ الْحَجَّ فَيَسِّرْهُ لِي وَتَقَبَّلْهُ مِنِّي».\nثُمَّ يُلَبِّي عَقِيبَ صَلَاتِهِ، وَالتَّلْبِيَةُ: «لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكَ».","turkishTranslation":"Mekke'ye girmek isteyen kimsenin ihramsız geçmesinin caiz olmadığı Mîkat yerleri şunlardır:\n1. Zülhuleyfe: Medine ehli için.\n2. Cuhfe: Şam ehli için.\n3. Yelemlem: Yemen ehli için.\n4. Karnü'l-Menâzil: Necid ehli için.\n5. Zât-ı Irk: Irak ehli için.\nİhrama girmek isteyen kimse önce gusleder veya abdest alır (gusül efdaldir). İki parçadan oluşan temiz/yeni ihram örtüsünü (izâr ve ridâ) giyer, güzel koku sürünür.\nSonra iki rekat ihram namazı kılar ve şöyle dua eder: \"Allahım! Ben hac yapmayı irade ediyorum; onu bana kolaylaştır ve benden kabul eyle.\"\nNamazın ardından telbiye getirir: \"Lebbeyk Allâhümme lebbeyk, lebbeyke lâ şerîke leke lebbeyk, inne'l-hamde ve'n-ni'mete leke ve'l-mülk, lâ şerîke lek.\"","fiqhExplanation":"Hanefilerde ihrama girmek yalnızca niyetle tamamlanmaz; niyet ile birlikte mutlaka telbiye veya zikir getirilmelidir. Telbiyesiz sadece niyetle ihram sahih olmaz.","keyTerms":["Mîkāt","İhrâm","İzâr","Ridâ","Telbiye","Zülhuleyfe"]},{"id":"hacc-2","bookId":"hacc","babTitleAr":"بَابُ أَفْعَالِ الْحَجِّ وَالْوُقُوفِ بِعَرَفَةَ","babTitleTr":"Haccın Menâsiki ve Arafat Vakfesi","arabicTextWithHarakat":"فَإِذَا دَخَلَ مَكَّةَ: بَدَأَ بِالْمَسْجِدِ الْحَرَامِ، فَطَافَ بِالْبَيْتِ سَبْعَةَ أَشْوَاطٍ، يَسْتَلِمُ الْحَجَرَ فِي كُلِّ شَوْطٍ، وَيَرْمُلُ فِي الثَّلَاثَةِ الْأُوَلِ، وَيَمْشِي فِي الْأَرْبَعَةِ الْبَاقِيَةِ؛ وَهُوَ طَوَافُ الْقُدُومِ.\nثُمَّ يَخْرُجُ إِلَى الصَّفَا فَيَسْعَى بَيْنَ الصَّفَا وَالْمَرْوَةِ سَبْعَةَ أَشْوَاطٍ.\nفَإِذَا كَانَ يَوْمُ التَّرْوِيَةِ خَرَجَ إِلَى مِنًى.\nفَإِذَا صَلَّى الْفَجْرَ يَوْمَ عَرَفَةَ تَوَجَّهَ إِلَى عَرَفَاتٍ، فَوَقَفَ بِهَا بَعْدَ الزَّوَالِ؛ وَالْوُقُوفُ بِعَرَفَةَ هُوَ الرُّكْنُ الْأَعْظَمُ لِلْحَجِّ.\nفَإِذَا غَرَبَتِ الشَّمْسُ أَفَاضَ إِلَى مُزْدَلِفَةَ، فَيَبِيتُ بِهَا، وَيَجْمَعُ بَيْنَ الْمَغْرِبِ وَالْعِشَاءِ جَمْعَ تَأْخِيرٍ.\nثُمَّ يَدْفَعُ إِلَى مِنًى قَبْلَ طُلُوعِ الشَّمْسِ، فَيَرْمِي جَمْرَةَ الْعَقَبَةِ بِسَبْعِ حَصَيَاتٍ، ثُمَّ يَحْلِقُ أَوْ يُقَصِّرُ، وَقَدْ حَلَّ لَهُ كُلُّ شَيْءٍ إِلَّا النِّسَاءَ.\nثُمَّ يَطُوفُ بِالْبَيْتِ طَوَافَ الزِّيَارَةِ، وَهُوَ فَرْضٌ.","turkishTranslation":"Mekke'ye girdiğinde Mescid-i Harâm'a gider. Kâbe'yi yedi şavt olarak tavaf eder (Tavâf-ı Kudûm); her şavtta Hacer-i Esved'i istilam eder. İlk üç şavtta remel yapar (omuzları silkerek çalımlı yürür), kalan dört şavtta normal yürür.\nSonra Safâ tepesine çıkarak Safâ ile Merve arasında yedi defa sa'y eder.\nTerviye günü (Zilhicce 8) Mina'ya çıkar.\nArefe günü sabah namazından sonra Arafat'a yönelir ve zevalden sonra vakfeye durur. Arafat vakfesi haccın en büyük rüknüdür (\"el-Haccü Arafah\").\nGüneş batınca Müzdelife'ye intikal eder, orada geceler ve akşam ile yatsı namazlarını yatsı vaktinde cem'-i te'hir ile birlikte kılar.\nGüneş doğmadan önce Mina'ya hareket eder; Akabe cemresine yedi taş atar, ardından tıraş olur (halk) veya saçını kısaltır (taksir). Artık kadınlarla yakınlaşma hariç ihram yasakları kalkar (Birinci Tahallül).\nDaha sonra Kâbe'ye gidip farz olan Ziyaret Tavafı'nı (Tavâf-ı İfâda) eda eder.","fiqhExplanation":"Haccın iki rüknü vardır: Arafat vakfesi ve Ziyaret tavafı. Şartı ise ihramdır. Müzdelife vakfesi, sa'y, şeytan taşlama, saç kesme ve Veda tavafı ise Hanefilere göre vaciptir.","keyTerms":["Tavâf-ı Kudûm","Tavâf-ı Ziyâret","Vakfe","Remel","Sa'y","Cemre","Tahallül"]}]},{"id":"buyu","number":6,"titleAr":"كِتَابُ الْبُيُوعِ","titleTr":"Büyû' (Alışveriş & Ticaret) Kitabı","iconName":"Scale","description":"Akdin kuruluşu, icap ve kabul, muhayyerlikler, faiz, selem ve fasid satışlar.","sections":[{"id":"buyu-1","bookId":"buyu","babTitleAr":"بَابُ انْعِقَادِ الْبَيْعِ وَأَرْكَانِهِ","babTitleTr":"Satış Akdinin Kuruluşu ve Rükünleri","arabicTextWithHarakat":"الْبَيْعُ يَنْعَقِدُ بِالْإِيجَابِ وَالْقَبُولِ إِذَا كَانَا بِلَفْظِ الْمَاضِي، مِثْلَ أَنْ يَقُولَ أَحَدُهُمَا: «بِعْتُ»، وَيَقُولَ الْآخَرُ: «اشْتَرَيْتُ».\nوَإِذَا أَوْجَبَ أَحَدُ الْمُتَعَاقِدَيْنِ: فَالْآخَرُ بِالْخِيَارِ: إِنْ شَاءَ قَبِلَ فِي الْمَجْلِسِ، وَإِنْ شَاءَ رَدَّهُ؛ وَأَيُّهُمَا قَامَ مِنَ الْمَجْلِسِ قَبْلَ الْقَبُولِ بَطَلَ الْإِيجَابُ.\nوَيَنْعَقِدُ الْبَيْعُ بِالتَّعَاطِي فِي الْأَشْيَاءِ الْخَسِيسَةِ وَالنَّفِيسَةِ.\nوَلَا بُدَّ أَنْ يَكُونَ الْمَبِيعُ مَعْلُومًا، وَالثَّمَنُ مَعْلُومًا؛ نَفْيًا لِلْجَهَالَةِ الْمُفْضِيَةِ إِلَى النِّزَاعِ.","turkishTranslation":"Satış akdi, her ikisi de mazi (geçmiş zaman) kipiyle ifade edilen icap ve kabul ile kurulur. Örneğin birinin \"Sattım\", diğerinin \"Satın aldım\" demesi gibi.\nTaraflardan biri icapta bulunduğunda diğeri muhayyerdir: Dilerse o mecliste kabul eder, dilerse reddeder. Kabulden önce taraflardan biri meclisten ayrılırsa icap hükümsüz kalır.\nSatış akdi hem değerli hem de değersiz mallarda teâtî (söz söylemeksizin fiilen alıp verme) yoluyla da kurulur.\nAnlaşmazlığa yol açacak cehaleti bertaraf etmek için satılan malın (mebî') ve bedelin (semen) belirli ve bilinir olması şarttır.","fiqhExplanation":"Hanefi mezhebinde akit meclisi (ittihad-ı meclis) esastır. Meclis dağılmadıkça icap geçerlidir. Hanefilerde Şâfiîlerin aksine hıyâr-ı meclis (meclisten ayrılıncaya kadar tek taraflı akdi feshetme hakkı) kabul edilmez; icap ve kabul tamamlanınca akit bağlayıcı olur.","keyTerms":["İcâb","Kabûl","İttihâd-ı Meclis","Teâtî","Mebî'","Semen"]},{"id":"buyu-2","bookId":"buyu","babTitleAr":"بَابُ الرِّبَا وَأَحْكَامِهِ","babTitleTr":"Riba (Faiz) Ahkâmı","arabicTextWithHarakat":"الرِّبَا حَرَامٌ فِي كُلِّ مَكِيلٍ أَوْ مَوْزُونٍ إِذَا بِيعَ بِجِنْسِهِ مَعَ التَّفَاضُلِ.\nفَعِلَّةُ تَحْرِيمِ الرِّبَا عِنْدَ أَبِي حَنِيفَةَ وَأَصْحَابِهِ: الْقَدْرُ مَعَ اتِّحَادِ الْجِنْسِ؛ وَالْقَدْرُ هُوَ الْكَيْلُ أَوْ الْوَزْنُ.\nفَإِذَا وُجِدَ الْوَصْفَانِ: حَرُمَ التَّفَاضُلُ وَحَرُمَ النَّسَاءُ.\nوَإِذَا عُدِمَا: حَلَّ التَّفَاضُلُ وَالنَّسَاءُ.\nوَإِذَا وُجِدَ أَحَدُهُمَا وَعُدِمَ الْآخَرُ: حَلَّ التَّفَاضُلُ وَحَرُمَ النَّسَاءُ.\nوَلَا يَجُوزُ بَيْعُ الْحِنْطَةِ بِالْحِنْطَةِ، وَلَا الشَّعِيرِ بِالشَّعِيرِ، وَلَا التَّمْرِ بِالتَّمْرِ، وَلَا الذَّهَبِ بِالذَّهَبِ، وَلَا الْفِضَّةِ بِالْفِضَّةِ: إِلَّا مِثْلًا بِمِثْلٍ، يَدًا بِيَدٍ.","turkishTranslation":"Kendi cinsiyle fazlalıklı olarak satıldığında, ölçülebilen (mekîl) veya tartılabilen (mevzûn) her malda faiz (ribâ) haramdır.\nEbû Hanîfe ve talebelerine göre faizin illeti: Cins birliği ile birlikte miktar ölçüsüdür (yani tartı veya hacim ölçüsü olmasıdır).\nBu iki vasıf (aynı cins ve ölçü/tartı) bir arada bulunursa: Hem fazlalık (ribâ'l-fadl) hem de veresiye satmak (ribâ'n-nesîe) haram olur.\nİkisi de bulunmazsa: Hem fazlalık hem veresiye helaldir.\nBiri bulunur diğeri bulunmazsa (örneğin buğday ile arpa veya altın ile gümüş gibi cins farklı ama ikisi de tartılır/ölçülürse): Fazlalık helal, fakat veresiye satış haramdır; peşin takas şarttır.\nBuğdayın buğdayla, arpanın arpayla, hurmanın hurmayla, altının altınla, gümüşün gümüşle satışı ancak denk ve peşin olarak caizdir.","fiqhExplanation":"Hanefilerde faizin illeti 'Kadr ve Cins'tir (ölçülebilirlik/tartılabilirlik ve cins birliği). Şâfiîlerde ise yiyecek maddesi olmak (mat'ûmiyyet) veya para/kıymet (semeniyyet) olmaktır.","keyTerms":["Ribâ","Ribâ'l-Fadl","Ribâ'n-Nesîe","Mekîl","Mevzûn","Cins","Sarf"]}]},{"id":"nikah","number":7,"titleAr":"كِتَابُ النِّكَاحِ","titleTr":"Nikâh (Evlilik) Kitabı","iconName":"HeartHandshake","description":"Evlilik akdi, şahitler, denklik (kefâet), mehir, talak çeşitleri ve nafaka hükümleri.","sections":[{"id":"nikah-1","bookId":"nikah","babTitleAr":"بَابُ أَرْكَانِ النِّكَاحِ وَشُرُوطِهِ","babTitleTr":"Nikâhın Rükünleri ve Şahitlik","arabicTextWithHarakat":"النِّكَاحُ يَنْعَقِدُ بِالْإِيجَابِ وَالْقَبُولِ، بِلَفْظَيْنِ يُعَبَّرُ بِهِمَا عَنِ الْمَاضِي، أَوْ بِأَحَدِهِمَا عَنِ الْمَاضِي وَبِالْآخَرِ عَنِ الْمُسْتَقْبَلِ إِذَا كَانَ أَمْرًا.\nوَلَا يَنْعَقِدُ نِكَاحُ الْمُسْلِمِينَ إِلَّا بِحُضُورِ شَاهِدَيْنِ حُرَّيْنِ عَاقِلَيْنِ بَالِغَيْنِ مُسْلِمَيْنِ، رَجُلَيْنِ أَوْ رَجُلٍ وَامْرَأَتَيْنِ.\nوَيَنْعَقِدُ نِكَاحُ الْمَرْأَةِ الْحُرَّةِ الْعَاقِلَةِ الْبَالِغَةِ بِأَمْرِهَا وَإِنْ لَمْ يَعْقِدْ عَلَيْهَا وَلِيٌّ عِنْدَ أَبِي حَنِيفَةَ رَحِمَهُ اللَّهُ.\nوَلِلْأَوْلِيَاءِ حَقُّ الِاعْتِرَاضِ إِذَا تَزَوَّجَتْ مِنْ غَيْرِ كُفْءٍ أَوْ بِدُونِ مَهْرِ الْمِثْلِ.","turkishTranslation":"Nikâh akdi; mazi sîgasıyla söylenen iki lafızla (icap ve kabul) veya biri mazi diğeri emir olan lafızla kurulur.\nMüslümanların nikâhı; hür, akıllı, büluğ çağına ermiş, müslüman iki şahidin huzuru olmaksızın sahih olmaz. Şahitler ya iki erkek ya da bir erkek iki kadın olmalıdır.\nEbû Hanîfe'ye göre hür, akıllı ve baliğa bir kadın velisinin izni veya aracılığı olmaksızın bizzat kendi iradesiyle evlenebilir.\nAncak denk olmayan (gayr-i küf') biriyle evlenmişse yahut mehr-i mislinden az bir mehre razı olmuşsa velilerin itiraz ve fesih hakkı vardır.","fiqhExplanation":"Hanefi mezhebinin en belirgin özelliklerinden biri, ergen kadının bizzat nikah akdi yapabilme ehliyetini tanımasıdır. Diğer üç mezhepte ise velinin izni ve akdi yapması sıhhat şartıdır.","keyTerms":["Nikâh","Velî","Şuhûd (Şahitler)","Kefâet","Mehr-i Misl","Bâliğa"]},{"id":"nikah-2","bookId":"nikah","babTitleAr":"بَابُ الْمَهْرِ وَأَحْكَامِهِ","babTitleTr":"Mehir ve Çeşitleri","arabicTextWithHarakat":"أَقَلُّ الْمَهْرِ: عَشَرَةُ دَرَاهِمَ؛ فَمَنْ سَمَّى أَقَلَّ مِنْهَا كَانَ لَهَا عَشَرَةٌ.\nوَإِنْ سَمَّى مَهْرًا عَشَرَةً فَمَا زَادَ: لَزِمَهُ مَا سَمَّى إِذَا دَخَلَ بِهَا أَوْ مَاتَ عَنْهَا.\nفَإِنْ طَلَّقَهَا قَبْلَ الدُّخُولِ وَقَدْ سَمَّى لَهَا مَهْرًا: فَلَهَا نِصْفُ الْمَهْرِ الْمُسَمَّى.\nوَإِنْ تَزَوَّجَهَا وَلَمْ يُسَمِّ لَهَا مَهْرًا أَوْ تَزَوَّجَهَا عَلَى أَنْ لَا مَهْرَ لَهَا: فَالنِّكَاحُ جَائِزٌ، وَلَهَا مَهْرُ مِثْلِهَا إِنْ دَخَلَ بِهَا أَوْ مَاتَ عَنْهَا؛ فَإِنْ طَلَّقَهَا قَبْلَ الدُّخُولِ فَلَهَا الْمُتْعَةُ.","turkishTranslation":"Mehrin en az miktarı on dirhemdir (yaklaşık 28-32 gram gümüş değeri). Kim on dirhemden az mehir belirlerse kadına on dirhem verilmesi gerekir.\nOn dirhem veya daha fazla bir mehir belirlenmişse, zifaf gerçekleştikten yahut taraflardan biri vefat ettikten sonra belirlenen bu mehrin (mehr-i müsemmâ) tamamı lazım gelir.\nZifaftan önce boşanma vaki olursa ve daha önce mehir belirlenmişse, kadına belirlenen mehrin yarısı ödenir.\nMehir belirlenmeksizin veya mehir verilmemesi şartıyla evlenilirse nikâh sahihtir; zifaf yahut vefat halinde kadına mehr-i misil (kendi ailesindeki emsali kadınların mehri) verilir. Eğer zifaftan önce boşanırsa kadına müt'a (bir kat elbise kıymeti) ödenir.","fiqhExplanation":"Hanefilerde mehir nikahın rüknü değil, neticesidir. Bu yüzden mehir zikredilmese dahi akit geçerlidir ve zifaf vaki olunca mehr-i misil terettüp eder.","keyTerms":["Mehr-i Müsemmâ","Mehr-i Misl","On Dirhem","Halvet-i Sahîha","Müt'a"]}]},{"id":"kerahiye","number":8,"titleAr":"كِتَابُ الْكَرَاهِيَةِ وَالِاسْتِحْسَانِ","titleTr":"Kerâhiye ve İstihsân (Âdâb & Helaller/Haramlar)","iconName":"ShieldAlert","description":"Yeme-içme, giyim-kuşam, altın-gümüş kaplar ve bakılması helal-haram olan avret sınırları.","sections":[{"id":"kerahiye-1","bookId":"kerahiye","babTitleAr":"بَابُ اللِّبَاسِ وَالْآنِيَةِ وَالْحُلِيِّ","babTitleTr":"Giyim, Kaplar ve Ziynet Eşyası","arabicTextWithHarakat":"لَا يَجُوزُ لِلرِّجَالِ لُبْسُ الْحَرِيرِ وَلَا الدِّيبَاجِ، وَيَجُوزُ ذَلِكَ لِلنِّسَاءِ.\nوَلَا بَأْسَ بِعَلَمِ الْحَرِيرِ فِي الثَّوْبِ إِذَا كَانَ مِقْدَارَ أَرْبَعِ أَصَابِعَ فَمَا دُونَهَا.\nوَلَا يَجُوزُ لِلرِّجَالِ وَلَا لِلنِّسَاءِ الْأَكْلُ وَالشُّرْبُ فِي آنِيَةِ الذَّهَبِ وَالْفِضَّةِ، وَلَا الِادِّهَانُ فِيهَا، لِقَوْلِهِ ﷺ: «لَا تَشْرَبُوا فِي آنِيَةِ الذَّهَبِ وَالْفِضَّةِ وَلَا تَأْكُلُوا فِي صِحَافِهَا».\nوَلَا يَجُوزُ لِلرَّجُلِ أَنْ يَتَحَلَّى بِالذَّهَبِ، وَيَجُوزُ لَهُ خَاتَمُ الْفِضَّةِ.","turkishTranslation":"Erkeklerin saf ipek ve atlas giymesi caiz değildir; kadınlar için ise caizdir.\nElbisede dört parmak veya daha az genişlikte ipek şerit ve nakış bulunmasında bir sakınca yoktur.\nAltın ve gümüş kaplarda yemek yemek, bir şey içmek ve yağ sürünmek hem erkeklere hem kadınlara haramdır. Zira Peygamberimiz ﷺ: \"Altın ve gümüş kaplarda içmeyiniz, tabaklarında yemek yemeyiniz\" buyurmuştur.\nErkeğin altından ziynet eşyası takması caiz değildir; gümüş yüzük takması ise sünnet ve caizdir.","fiqhExplanation":"Altın ve gümüş kapların kullanılması haram olmakla birlikte, evde süs olarak bulundurulması Hanefilere göre caizdir; asıl yasak doğrudan yeme-içmede istimal edilmesidir.","keyTerms":["Harîr (İpek)","Âniye (Kaplar)","Huliyy","Hâtem (Yüzük)","İstihsân"]}]},{"id":"feraiz","number":9,"titleAr":"كِتَابُ الْفَرَائِضِ","titleTr":"Ferâiz (Miras Hukuku) Kitabı","iconName":"PieChart","description":"Ashâb-ı Ferâiz, asabe, hacb (mirastan düşme), red ve avl kaideleri.","sections":[{"id":"feraiz-1","bookId":"feraiz","babTitleAr":"بَابُ ذَوِي الْفُرُوضِ وَالْعَصَبَاتِ","babTitleTr":"Pay Sahipleri (Ashâb-ı Ferâiz) ve Asabeler","arabicTextWithHarakat":"يَبْدَأُ مِنْ تَرِكَةِ الْمَيِّتِ بِتَجْهِيزِهِ وَتَكْفِينِهِ مِنْ غَيْرِ تَبْذِيرٍ وَلَا تَقْتِيرٍ، ثُمَّ تُقْضَى دُيُونُهُ مِنْ جَمِيعِ مَا بَقِيَ مِنْ مَالِهِ، ثُمَّ تُنَفَّذُ وَصَايَاهُ مِنْ ثُلُثِ مَا بَقِيَ بَعْدَ الدَّيْنِ، ثُمَّ يُقْسَمُ الْبَاقِي بَيْنَ وَرَثَتِهِ.\nوَأَصْحَابُ الْفُرُوضِ اثْنَا عَشَرَ: أَرْبَعَةٌ مِنَ الرِّجَالِ: الْأَبُ، وَالْجَدُّ الصَّحِيحُ، وَالْأَخُ لِأُمٍّ، وَالزَّوْجُ.\nوَثَمَانٍ مِنَ النِّسَاءِ: الزَّوْجَةُ، وَالْبِنْتُ، وَبِنْتُ الِابْنِ، وَالْأُخْتُ لِأَبٍ وَأُمٍّ، وَالْأُخْتُ لِأَبٍ، وَالْأُخْتُ لِأُمٍّ، وَالْأُمُّ، وَالْجَدَّةُ الصَّحِيحَةُ.\nوَالْعَصَبَةُ: كُلُّ مَنْ يَأْخُذُ مَا أَبْقَتْهُ فُرُوضُ أَهْلِ الْفَرَائِضِ، وَإِذَا انْفَرَدَ حَازَ جَمِيعَ الْمَالِ.","turkishTranslation":"Ölen kimsenin terekesinden ilk olarak israf ve cimrilik yapılmaksızın teçhiz ve tekfin (yıkama ve kefenleme) masrafları karşılanır. Ardından kalan malının tamamından borçları ödenir. Sonra borçtan arta kalanın üçte birinden vasiyetleri yerine getirilir. Kalan mal ise mirasçıları arasında taksim edilir.\nKur'an'da payları belirlenmiş ashâb-ı ferâiz on iki sınıftır:\nErkeklerden dört kişi: Baba, sahih dede, anne bir erkek kardeş ve zevc (koca).\nKadınlardan sekiz kişi: Zevce (eş), öz kız, oğlun kızı, öz kız kardeş, baba bir kız kardeş, anne bir kız kardeş, anne ve sahih nene.\nAsabe ise: Ashâb-ı ferâiz paylarını aldıktan sonra artan malı alan, tek başına kaldığında ise malın tamamını alan mirasçılardır.","fiqhExplanation":"Miras taksiminde borçlar vasiyetten ve mirastan önce gelir. Vasiyet ancak terekenin üçte birinde geçerlidir. Varislerden biri diğerini hacb (mirastan mahrum) edebilir; örneğin baba varken dede miras alamaz.","keyTerms":["Tereke","Ashâb-ı Ferâiz","Asabe","Hacb","Teçhiz ve Tekfîn","Vasiyet (1/3)"]}]}];
