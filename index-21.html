ومن ابتاع أرضا وعلى نخلها ثمر أخذها الشفيع بثمرها فإن أخذها المشتري سقط عن الشفيع حصته وإذا قضي للشفيع بالدار ولم يكن رآها فله خيار الرؤية وإن وجد بها عيبا فله أن يردها به وإن كان المشتري شرط البراءة منه
وإذا ابتاع بثمن مؤجل فالشفيع بالخيار: إن شاء أخذها بثمن حال وإن شاء صبر حتى ينقضي الأجل ثم يأخذها وإذا قسم الشركاء العقار فلا شفعة لجارهم بالقسمة وإذا اشترى دارا فسلم الشفيع الشفعة ثم ردها المشتري بخيار رؤية أو شرط إو عيب بقضاء قاض فلا شفعة للشفيع وإن ردها بغير قضاء أو تقاتلا فللشفيع الشفعة
# كتاب الشركة
الشركة على ضربين: شركة أملاك وشركة عقود
فشركة الأملاك: العين يرثها رجلان أو يشتريانها فلا يجوز لأحدهما أن ينصرف في نصيب الآخر إلا بإذنه وكل واحد منهما في نصيب صاحبه كالأجنبي
والضرب الثاني: شركة العقود
وهي على أربعة أوجه: مفاوضة وعنان وشركة الصنائع وشركة الوجوه
فأما شركة المفاوضة فهي: إن يشتري الرجلان فيستويان في مالهما وتصرفهما ودينهما فتجوز بين الحرين المسلمين العاقلين البالغين ولا تجوز بين الحر والمملوك ولا بين الصبي والبالغ ولا بين المسلم والكافر وتنعقد على الوكالة والكفالة
وما يشتريه كل واحد منهما يكون على الشركة إلا طعام أهله وكسوتهم وما يلزم كل واحد منهما من الديون بدلا عما يصح فيه الاشتراك فالآخر ضامن له فإن ورث أحدهما مالا تصح فيه الشركة أو وهب له ووصل إلى يده بطلت المفاوضة وصارت الشركة عنانا
ولا تنعقد الشركة إلا بالدراهم والدنانير والفلوس
النافقة ولا يجوز بما سوى ذلك إلا أن يتعامل الناس بها كالتبر والنقرة فتصح الشركة بهما وإذا أرادا الشركة بالعروض باع كل واحد منهما نصف ماله بنصف مال الآخر ثم عقدا الشركة
وأما الشركة العنان: فتنعقد على الوكالة دون الكفالة ويصح التفاضل في المال ويصح أن يتساويا في المال ويتفاضلا في الربح
ويجوز أن يعقدها كل واحد منهما ببعض ماله دون بعض ولا تصح إلا بما بينا أن المفاوضة تصح به
ويجوز أن يشتركا ومن جهة أحدهما دراهم ومن جهة الآخر دنانير وما اشتراه كل واحد منهما للشركة طولب بثمنه دون الآخر ثم يرجع على شريكه بحصته منه
وإذا هلك مال الشركة أو أحد المالين قبل أن يشتريا شيئا بطلت الشركة وإن اشترى أحدهما بماله وهلك مال الآخر قبل الشراء فالمشترى بينهما على ما شرطا
ويرجع على شريكه بحصته من ثمنه
وتجوز الشركة وإن لم يخلطا المالين ولا تصح الشركة إذا شرطا لأحدهما دارهم مسماة من الربح
ولكل واحد من المتفاوضين وشريكي العنان أن يبضع المال ويدفعه مضاربة ويوكل من يتصرف فيه ويده في المال يد أمانة
وأما شركة الصنائع فالخياطان والصباغان يشتركان على أن يتقبلا الأعمال ويكون اكسب بينهما فيجوز ذلك وما يتقبله كل واحد منهما من العمل يلزمه ويلزم شريكه
فإن عمل أحدهما دون الآخر فالكسب بينهما نصفان
وأما شركة الوجوه: فالرجلان يشتركان ولا مال لهما على أن يشتريا بوجوههما ويبيعا فتصح الشركة على هذا وكل واحد منهما وكيل الآخر فيما يشتريه فإن شرطا أن يكون المشتري بينهما نصفين فالربح
كذلك ولا يجوز أن يتفاضلا فيه وإن شرطا أن يكون المشتري بينهما أثلاثا فالربح كذلك
ولا تجوز الشركة في الاحتطاب والاحتشاش والاصطياد وما اصطاده كل واحد منهما أو احتطبه فهو له دون صاحبه
وإذا اشتركا ولأحدهما بغل وللآخر رواية يستقي عليها الماء والكسب بينهما لم تصح الشركة والكسب كله للذي استقى وعليه أجر مثل الراوية إن كان صاحب البغل وإن كان صاحب الراية فعليه أجر مثل البغل
وكل شركة فاسدة فالربح فيها على قدر المال ويبطل شرط التفاضل
وإذا مات أحد الشريكين أو ارتد ولحق بدار الحرب بطلت الشركة
وليس لواحد من الشركين أن يؤدي زكاة مال الأخر إلا بإذنه
فإن أذن كل واحد منهما لصاحبه أن يؤدي زكاته فأدى كل واحد منهما فالثاني ضامن
علم بأداء الأول أو لم يعلم
# كتاب المضاربة
المضاربة: عقد على الشركة بمال من أحد الشريكين وعمل من الآخر
ولا تصح المضاربة إلا بالمال الذي بيننا أن الشركة تصح به
ومن شرطها: أن يكون الربح بينهما مشاعا لا يستحق أحدهما منه دراهم مسماة ولا بد أن يكون المال مسلما إلى المضارب ولا بد لرب المال فيه
فإذا صحت المضاربة مطلقة جاز للمضارب أن يشتري ويبيع ويسافر ويبضع ويوكل وليس له أن يدفع المال مضاربة إلا أن يأذن له رب المال في ذلك
وإن خص له رب المال التصرف في بلد بعينه أو في سلعة بعينها لم يجز له أن يتجاوز ذلك
وكذلك إن وقت للمضاربة مدة بعينها جاز وبطل العقد بمضيها
وليس للمضارب أن يشتري أبا رب المال ولا ابنه ولا من يعتق عليه فإن اشتراهم كان مشتريا لنفسه دون المضاربة وإن كان في المال ربح فليس له أن يشتري من يعتق عله فإن اشتراهم ضمن مال المضاربة وإن لم يكن في المال ربح جاز أن يشتريهم فإن زادت قيمتهم عتق نصيبه منهم ولم يضمن لرب المال شيئا ويسعى المعتق لرب المال في قيمة نصيبه منه وإذا دفع المضارب المال مضاربة ولم يأذن له رب المال في ذلك لم يضمن بالدفع ولا بتصرف المضارب الثاني حتى يربح فإذا ربح ضمن المضارب الأول المال
وإذا دفع إليه المال مضاربة
بالنصف فأذن له أن يدفعها مضاربة فدفعها بالثلث فإن كان رب المال قال له على أن رزق الله بيننا نصفان فلرب المال نصف الربح وللمضارب الثاني ثلث الربح وللأول السدس وإن قال على أن ما رزقك الله بيننا نصفان فللمضارب الثاني الثلث وما بقي بين رب المال والمضارب الأول نصفان فإن قال له على أن ما رزق الله فلي نصفه فدفع المال إلى آخر مضاربة بالنصف فللمضارب الثاني نصف الربح ولرب المال النصف ولا شيء للمضارب الأول فإن شرط للمضارب الثاني ثلثي الربح فلرب المال نصف الربح وللمضارب الثاني نصف الربح ويضمن الأول للمضارب الثاني سدس الربح من ماله
وإذا مات رب المال أو المضارب بطلت المضاربة وإن ارتد رب المال عن الإسلام ولحق بدار الحرب بطلت المضاربة
وإذا عزل رب المال المضارب ولم يعلم بعزله حتى اشترى وباع فتصرفه جائز وإن علم بعزله والمال عروض فله أن يبيعها ولا يمنعه العزل من ذلك ثم لا يجوز أن يشتري بثمنها شيئا آخر
وإن عزله ورأس المال دراهم أو دنانير قد نصت فليس له أن يتصرف فيه
وإذا افترقا وفي المال ديون وقد ربح المضارب فيه أجبره
الحاكم على اقتضاء الديون وإن لم يكن له ربح لم يلزمه الاقتضاء ويقال له: وكل رب المال في الاقتضاء
وما هلك من مال المضاربة فهو من الربح دون رأس المال فإن زاد الهالك على الربح فلا ضمان على المضارب فيه وإن كانا قد اقتسما الربح والمضاربة بحالها ثم هلك المال أو بعضه ترادا الربح حتى يستوفي رب المال رأس المال فإن فضل بشيء كان بينهما وإن عجز عن رأس المال لم يضمن المضارب وإن كانا قد اقتسما الربح وفسخا المضاربة ثم عقداها فهلك المال لم يترادا الربح الأول
ويجوز للمضارب أن يبيع بالنقد والسيئة ولا يزوج عبدا ولا أمة من مال المضاربة
# كتاب الوكالة
كل عقد جاز أن يعقده الإنسان بنفسه جاز أن يوكل به غيره ويجوز التوكيل بالخصومة في سائر الحقوق وبإثباتها ويجوز التوكيل بالاستيفاء إلا في الحدود والقصاص فإن الوكالة لا تصح باستيفائهما مع غيبة الموكل عن المجلس
وقال أبو حنيفة: لا يجوز التوكيل بالخصومة إلا برضا الخصم إلا أن يكون الموكل مريضا أو غائبا مسيرة ثلاثة أيام فصاعدا
وقال أبو يوسف ومحمد: يجوز التوكيل بغير رضا الخصم
ومن شرط الوكالة: أن يكون الموكل ممن يملك التصرف وتلزمه الأحكام والوكيل ممن يعقل العقد
ويقصده
وإذا وكل الحر البالغ أو المأذون مثلهما جاز وإن وكلا صبيا محجورا يعقل البيع والشراء أو عبدا محجورا جاز ولا تتعلق بهما الحقوق وتتعلق بموكليهما
والعقود التي يعقدها الوكلاء على ضربين: فكل عقد يضيفه الوكيل إلى نفسه - مثل البيع والإجارة - فحقوق ذلك العقد تتعلق بالوكيل دون الموكل فيسلم المبيع ويقبض الثمن ويطالب بالثمن إذا اشترى
ويقبض المبيع ويخاصم بالعيب
وكل عقد يضيفه إلى موكله - كالنكاح والخلع والصلح من دم العمد - فإن حقوقه تتعلق بالموكل دون الوكيل فلا يطالب وكيل الزوج بالمهر ولا يلزم وكيل المرأة تسليمها وإذا طالب الموكل المشتري فله أن يمنعه إياه فإن دفعه إليه جاز ولم يكن للوكيل أن يطالبه به ثانيا
ومن وكل رجلا بشراء شيء فلا بد من تسمية جنسه وصفته أو جنسه ومبلغ ثمنه إلا أن يوكله وكالة عامة فيقول: ابتع لي ما رأيت
وإذا اشترى الوكيل وقبض المبيع ثم اطلع على عيب فله
أن يرد بالعيب ما دام المبيع في يد وإن سلمه إلى الموكل لم يدره إلا بإذنه
ويجوز التوكيل بعقد الصرف والسلم فإن فارق الوكيل صاحبه قبل القبض بطل العقد ولا تعتبر مفارقة الموكل وإذا دفع الوكيل بالشراء الثمن من ماله وقبض المبيع فله أن يرجع به على الموكل فإن هلك المبيع في يده قبل حبسه هلك من مال الموكل ولم يسقط الثمن
وله أن يحبسه حتى يستوفي الثمن فإن حبسه فهلك كان مضمونا ضمان الرهن عند أبي يوسف وضمان المبيع عند محمد
وإذا وكل رجلين فليس لأحدهما أن يتصرف فيما وكلا فيه دون الآخر إلا أن يوكلهما بالخصومة أو بطلاق زوجته بغير عوض أو برد وديعة عنده أو بقضاء دين عليه
وليس للوكيل أن يوكل فيما وكل به
إلا أن يأذن له الموكل أو يقول له: اعمل برأيك فإن وكل بغير إذن موكله فعقد وكيله بحضرته جاز وإن عقد بغير حضرته فأجازه الوكيل الأول جاز وللموكل أن يغزل الوكيل عن الوكالة فإن لم يبلغه العزل فهو على وكالته وتصرفه جائز حتى يعلم
وتبطل الوكالة بموت الموكل وجنوبه جنوبا مطبقا ولحاقه بدرا الحرب مرتدا وإذا وكل المكاتب ثم عجز أو المأذون فحجر عليه أو الشريكان فافترقا فهذه الوجوه تبطل الوكالة علم الوكيل أو لم يعلم
وإذا مات الوكيل أو جن جنونا مطبقا بطلت وكالته وإن لحق بدار الحرب مرتدا لم يجز له التصرف إلا أن يعود مسلما ومن وكل آخر بشيء ثم تصرف فيما وكل به بطلت الوكالة والوكيل بالبيع والشراء لا يجوز أن يعقد عند أبي
حنيفة مع أبيه وجده وولده ولده وزوجته وعبده ومكاتبه
وقال أبو يوسف ومحمد: يجوز بيعه منهم بمثل القيمة
إلا في عبده ومكاتبه والوكيل بالبيع يجوز بيعه بالقليل والكثير عند أبي حنيفة
وقال أبو يوسف ومحمد: لا يجوز بيعه بنقصان لا يتغابن الناس في مثله والوكيل بالشراء يجوز عقده بمثل القيمة وزيادة يتغابن الناس في مثلها ولا يجوز بما لا يتغابن الناس في مثله والذي لا يتغابن الناس فيه: ما لا يدخل تحت تقويم المقومين
وإذا ضمن الوكيل بالبيع الثمن عن المبتاع فضمانه باطل وإذا وكله ببيع عبده فباع نصفه جاز عند أبي حنيفة وإن وكله بشراء عبد فاشترى نصفه فالشراء موقوف فإن اشترى باقية لزم الموكل وإذا وكله بشراء عشرة أرطال لحم بدرهم فاشترى عشرين رطلا بدرهم من لحم يباع مثله عشرة بدرهم لزم الموكل منه عشرة أرطال بنصف درهم عند أبي حنيفة وقال أبو يوسف ومحمد: يلزمه العشرون وإذا وكله بشراء شيء بعينه فليس له أن يشتريه لنفسه
وإن وكله بشراء عبد بغير عينه فاشترى عبدا فهو للوكيل إلا أن يقول: نويت الشراء للموكل أو يشتريه بمال الموكل
والوكيل بالخصومة وكيل بالقبض عند أبي حنيفة وأبي يوسف ومحمد والوكيل بقبض الدين وكيل بالخصومة فيه عند أبي حنيفة
وإذا أقر الوكيل بالخصومة على موكله عند القاضي جاز إقراره ولا يجوز إقراره عليه عند غير القاضي عند أبي حنيفة ومحمد إلا أنه يخرج من الخصومة
وقال أبو يوسف: يجوز إقراره عليه عند غير القاضي ومن ادعى أنه وكيل الغائب في قبض دينه فصدقه الغريم أمر بتسليم الدين إليه فإن حضر الغائب فصدقه وإلا دفع إليه الغريم الدين ثانيا ورجع به على الوكيل إن كان باقيا في يده
وإن قال إني وكيل بقبض الوديعة فصدقه المودع لم يؤمر بالتسليم إليه
# كتاب الكفالة
الكفالة ضربان: كفالة بالنفس وكفالة بالمال
فالكفالة بالنفس جائزة والمضمون بها إحضار المكفول به وتنعقد إذا قال تكفلت بنفس فلان أوبرقبته أو بروحه أو بجسده أو برأسه أو بنصفه أو بثلثه وكذلك إن قال ضمنته أو هو علي أو إلي أو أنا زعيم به أو قبيل
فإن شرط في الكفالة تسليم المكفول به في وقت بعينه لزمه إحضاره إذا طالبه به في ذلك الوقت فإن أحضره وإلا حبسه الحاكم حتى يحضره وإذا أحضره وسلمه في مكان يقدر المكفول له على محاكمته برئ الكفيل من الكفالة وإذا تكفل به على أن يسلمه في مجلس القاضي فسلمه في السوق برئ وإن سلمه في برية لم يبرأ
وإن مات المكفول به برئ الكفيل بالنفس من الكفالة فإن تكفل بنفسه على أنه إن لم يواف به في وقت كذا فهو ضامن لما عليه وهو ألف ولم يحضره في ذلك الوقت لزمه ضمان المال ولم يبرأ من الكفالة بالنفس
ولا يجوز الكفالة بالنفس في الحدود والقصاص عند أبي حنيفة وقالا: يجوز
وأما الكفالة بالمال فجائزة معلوما كان المال المكفول به أو مجهولا إذا كان دينا صحيحا
مثل أن يقول: تكلفت عنه بألف أو بما لك عليه أو بما يدركك في هذا البيع والمكفول به بالخيار: إن شاء طالب الذي عليه الأصل وإن شاء طالب كفيله
ويجوز تعليق الكفالة بالشرط مثل أن يقول: ما بايعت فلانا فعلي أو ما ذاب لك عليه
فعلي أو ما غصبك فلانا فعلي وإذا قال: تكفلت بما لك عليه فقامت البينة بألف عليه ضمنه الكفيل فإن لم تقم البينة فالقول قول الكفيل مع يمينه في مقدار ما يعترف به
فإن اعترف المكفول عنه بأكثر من ذلك لم يصدق على كفيله
وتجوز الكفالة بأمر المكفول عنه وبغير أمره فإن كفل بأمره رجع بما يؤدي عليه وإن كفل بغير أمره لم يرجع بما يؤديه وليس للكفيل أن يطالب المكفول عنه بالمال قبل أن يؤدي عنه فإن لوزم بالمال كان له أن يلازم المكفول عنه حتى يخلصه وإذا أبرأ الطالب المكفول عنه أو استوفى منه برئ الكفيل وإن أبرأ الكفيل لم يبرإ المكفول عنه
ولا يجوز تعليق البراءة من الكفالة بشرط
وكل حق لا يمكن استيفاؤه من الكفيل لا تصح الكفالة به كالحدود والقصاص وإذا تكفل عن المشتري بالثمن جاز وإن تكفل عن البائع بالمبيع لم يصح ومن استأجر دابة للحمل فإن كانت بعينها لم تصح الكفالة بالحمل وإن كانت بغير عينها جازت الكفالة
ولا تصح الكفالة إلا بقبول المكفول له في مجلس العقد إلا في مسألة واحدة وهي أن يقول المريض لوارثه: تكفل عني بما علي من الدين فتكفل به مع غيبة الغرماء
وإذا كان الدين على اثنين وكل واحد منهما كفيل ضامن عن الآخر فما أدرى أحدهما لم يرجع به على شريكه حتى يزيد ما يؤديه على النصف فيرجع بالزيادة
وإذا كفل اثنان عن رجل بألف على أن كل واحد منهما كفيل عن صاحبه فما أداره أحدهما يرجع بنصفه على شريكه قليلا كان أو كثيرا ولا تجوز الكفالة بمال الكتابة حر تكفل به أو عبد
وإذا مات الرجل وعليه ديون ولم يترك شيئا فتكفل رجل عنه للغرماء لم تصح الكفالة عند أبي حنيفة وقالا: تصح
# كتاب الحوالة
الحوالة: جائزة بالديون وتصح برضا المحيل والمحتال له والمحال عليه وإذا تمت الحوالة برىء المحيل من الدين ولم يرجع المحتال على المحيل إلاأن يتوى حقه والتوى عند أبي حنيفة أحد أمرين: إما أن يجحد الحوالة ويحلف ولا بينة عليه أو يموت مفلسا وقال أبو يوسف ومحمد هاذان ووجه ثالث وهو أن يحكم الحاكم بإفلاسه في حال حياته
وإذا طالب المحال عليه المحيل بمثل مال الحواله فقال المحيل: أحلت بدين لي عليك لم يقبل قوله وكان عليه مثل الدين وإن طالب المحيل المحتال بما أحاله به فقال: إنما أحلتك لتقبضه لي وقال المحتال: بل أحلتني بدين
# كتاب الصلح
الصلح: على ثلاثة أضرب: صلح مع إقرار وصلح مع سكوت وهو أن لا يقر المدعى عليه ولا ينكره وصلح مع إنكار وكل ذلك جائز
فإن وقع الصلح عن إقرار اعتبر فيه ما يعتبر في البياعات إن وقع عن مال بمال وإن وقع عن مال بمنافع فيعتبر بالإجارات
والصلح عن السكوت والإنكار في حق المدعى عليه لافتداء اليمين وقطع الخصومة وفي حق المدعي بمعنى المعاوضة
وإذا صالح عن دار لم تجب فيه شفعة وإذا صالح على دار وجبت فيها الشفعة
وإذا كان الصلح عن إقرار فاستحق بعض المصالح عنه رجع المدعى عليه بحصة ذلك من العوض
وإن وقع الصلح عن سكوت أو إنكار فاستحق المتنازع فيه رجع المدعي بالخصومة ورد العوض وإن استحق بعض ذلك رد حصته ورجع بالخصومة فيه وإن ادعى حقا في دار لم يبينه فصولح من ذلك على شيء ثم استحق بعض الدار لم يرد شيئا من العوض لأن دعواه يجوز أن تكون فيما بقي
والصلح جائز من دعوى الأموال والمنافع وجنابة العمد والخطإ ولا يجوز من دعوى حد
وإذا ادعى رجل على امرأة نكاحا وهي تجحد فصالحته على مال بذلته
حتى يترك الدعوى جاز وكان في معنى الخلع وإن ادعت امرأة نكاحا على رجل فصالحها على مال بذله لها لم تجز وإن ادعى على رجل أنه عبده فصالحته على مال أعطاه جاز وكان في حق المدعي في معنى العتق على مال وكل شيء وقع عليه الصلح وهو مستحق بعقد المداينة لم يحمل على المعاوضة لم يحمل على المعاوضة وإنما يحمل على أنه استوفى بعض حقه وأسقط باقية
كمن له على رجل ألف دلاهم جياد فصالحه على خمسمائة زيوف جاز وصار كأنه أبرأه عن بعض حقه وأخذ باقيه ولو صالحه على ألف مؤجل جاز وصار كأنه أجل نفس الحق
ولو صالحه على دنانير إلى شهر لم يجز ولو كان له ألف مؤجلة فصالحه على خمسمائة حالة لم يجز ولو كان له ألف سود فصالحه على خمسمائة بيض لم يجز
ومن وكل رجلا بالصلح عنه فصالحه لم يلزم الوكيل ما صالح عليه إلا أن يضمنه والمال لازم للموكل
فإن صالح عنه على شيء بغير أمره فهو على أربعة أوجه: إن صالح بمال وضمنه تم الصلح
وكذلك لو قال: صالحتك على ألفي هذه تم الصلح ولزمه تسليمها وكذلك لو قال: صالحتك على ألف وسلمها وإن قال: صالحتك على ألف ولم يسلمها فالعقد موقوف: فإن أجازه المدعى عليه جاز ولزمه الألف وإن لم يجزه بطل
وإذا كان الدين بين شريكين فصالح أحدهما من نصيبه على ثوب فشريكه بالخيار: إن شاء اتبع عليه الدين بنصفه وإن شاء أخذ نصف الثوب إلا أن يضمن له شريكه ربع الدين ولو استوفى نصف نصيبه من الدين كان لشريكه أن يشركه فيما قبض
ثم يرجعان على الغريم بالباقي ولو اشترى أحدهما نصيبه من الدين سلعة كان لشريكه أن يضمنه ربع الدين
وإذا كان السلم بين شريكين فصالح أحدهما من نصيبه على رأس المال لم يجز عند أبي حنيفة ومحمد رحمهما
الله وقال أبو يوسف رحمه الله: يجوز الصلح
وإذا كانت التركة بين ورثة فأخرجوا أحدهم منها بمال أعطوه إياه والتركة عقار أو عروض جاز قليلا كان ما أعطوه أو كثيرا
وإن كانت التركة فضة فأعطوه ذهبا أو كانت ذهبا فأعطوه فضة فهو كذلك
وإن كانت التركة ذهبا وفضة وغير ذلك فصالحوه على فضة أو ذهب فلا بد أن يكون ما أعطوه أكثر من نصيبه من ذلك الجنس حتى يكون نصيبه بمثله والزيادة بحقه من بقية الميراث
وإن كان في التركة دين على الناس فأدخلوه في الصلح على أن يخرجوا المصالح عنه ويكون الدين لهم فالصلح باطل فإن شرطوا أن يبرئ الغرماء منه ولا يرجع عليهم بنصيب المصالح فالصلح جائز
# كتاب الهبة
الهبة: تصح بالإيجاب والقبول وتتم القبض فإذا قبض الموهوب له في المجلس بغير أمر الواهب جاز
وإن قبض بعد الافتراق لم تصح إلا أن يأذن له الواهب في القبض
وتنعقد الهبة بقوله: وهبت ونحلت وأعطيت وأطعمتك هذا الطعام وجعلت هذا الثوب لك وأعمرتك هذا الشيء وحملتك على هذه الدابة إذا نوى بالحملان الهبة
ولا تجوز الهبة فيما يقسم إلا محوزة مقسومة
وهبة المشاع فيما لا يقسم جائزة
ومن وهب شقصا مشاعا فالهبة فاسدة
فإن قسمه وسلمه جاز
ولو وهب دقيقا في حنطة أو دهنا في سمسم فالهبة فاسدة فأن طحن وسلم لم يجز
وإذا كانت العين في يد الموهوب ملكها بالهبة وإن لم يجددفيها قبضا وإذا وهب الأب لابنه الصغير هبة ملكها الابن بالعقد فإن وهب له أجنبي هبة تمت بقبض الأب
وإذا وهب لليتيم هبة فقبضها له وليه جاز فأن كان في حجر أمه فقبضها له جائز وكذلك إن كان في حجر أجنبي يربيه فقبضه له جائز
وإن قبض الصبي الهبة بنفسه له جاز
وإن وهب اثنان من واحد دارا جاز وإن وهب واحد من اثنين دارا لم يصح عند أبي حنيفة وقال أبو يوسف ومحمد: يصح
وإذا وهب هبة لأجنبي فله الرجوع فيها
إلا أن يعوضه عنها أو تزيد زيادة متصلة أو يموت أحد المتعاقدين أو
تخرج الهبة من ملك الموهوب له
وإن وهب هبة لذي رحم محرم منه فلا رجوع فيها
وكذلك ما وهب أحد الزوجين لآخر
وإذا قال الموهوب له للواهب: خذ هذا عوضا عن هبتك أو بدلا عنها أو في مقابلتها فقبضه الواهب سقط الرجوع وإن عوضه أجنبي عن الموهوب له متبرعا فقبض الواهب العوض سقط الرجوع
وإذا استحق نصف الهبة رجع بنصف العوض وإن استحق نصف العوض لم يرجع في الهبة إلا أن يرد ما بقي من العوض ثم يرجع
ولا يصح الرجوع إلا بتراضيهما أو بحكم الحاكم
وإذا تلفت العين الموهوبة فاستحقها مستحق فضمن
الموهوب له لم يرجع على الواهب بشي
وإذا وهب بشرط العوض اعتبر التقابض في العوضين وإذا تقابضا صح العقد وصار في حكم البيع: يرد بالعيب وخيار الرؤية وتجيب فيه الشفعة
والعمرى جائزة للمعمر في حال حياته ولورثته من بعده
والرقبى باطلة عند أبي حنيفة ومحمد وقال أبو يوسف: جائزة
ومن وهب جارية إلا حملها صحت الهبة وبطل الاستثناء
والصدقة كالهبة: لا تصح إلا بالقبض ولا تجوز في مشاع يحتمل القسمة وإذا تصدق على فقيرين بشي جاز ولا يجوز الرجوع في الصدقة بعد القبض
ومن نذر أن يتصدق بماله لزمه أن يتصدق
بجنس ما تجب فيه الزكاة ومن نذر أن يتصدق بجنس ما تجب في الزكاة ومن نذر أن يتصدق بملكه لزمه أن يتصدق بالجميع ويقال له: أمسك منه مقدار ما تنفقه على نفسك وعيالك إلى أن تكسب مالا فإذا اكتسبت مالا تصدق بمثل ما أمسكت لنفسك
# كتاب الوقف
لا يزول ملك الواقف عن الوقف عند أبي حنيفة إلا أن يحكم به الحاكم أو يعلقه بموته فيقول: إذا مت فقد وقفت داري على كذا وقال أبو يوسف: يزول الملك بمجرد القول
وقال محمد: لا يزول الملك حتى يجعل للوقف وليا ويسلمه إليه
وإذا صح الوقف - على اختلافهم - خرج عن ملك الواقف ولم يدخل في ملك الموقوف عليه
ووقف المشاع جائز عند أبي يوسف وقال محمد: لا يجوز
ولا يتم الوقف عند أبي حنيفة ومحمد حتى يجعل آخره لجهة لا تنقطع أبدا وقال أبو يوسف: إذا سمو فيه جهة تنقطع جاز وصار بعدها للفقراء وإن لم يسمهم
ويصح وقف العقار ولا يجوز وقف ما ينقل ويحول وقال أبو يوسف: إذا وقف ضيعة ببقرها وهم عبيده جاز
وقال محمد: يجوز حبس الكراع والسلاح
وإذا صاح الوقف لم يجز بيعه ولا تمليكه إلا أن يكون مشاعا عند أبي يوسف فيطلب الشريك القسمة فتصح مقاسمته
والواجب: أن يبدأ من ريع الوقف بعمارته شرط الواقف ذلك أو لم يشرط
وإن وقف دارا على سكنى ولده فالعمارة على من له السكنى
فإن امتنع من ذلك أو كان فقيرا أجرها الحاكم
وعمرها بأجرتها فإذا عمرت رجها إلى من له السكنى
وما انهدم من بناء الوقف وآلته صرفه الحاكم في عمارة الوقف إن احتاج إليه وإن استغنى
عنه أمسكه حتى يحتاج إلى عمارته فيصرفه فيها ولا يجوز أن يقسمه بين مستحقي الوقف
وإذا جعل الوقف غلة الوقف لنفسه أو جعل الولاية إليه جاز عند أبي يوسف
وإذا بنى مسجدا لم يزل ملكه عنه حتى يفرزه عن ملكه بطريقه ويأذن للناس بالصلاة فيه فإذا صلى فيه واحد زال ملكه عنه عند أبي حنيفة ومحمد وقال أبو يوسف: يزول ملكه عنه بقوله: جعلته مسجدا
ومن بنى سقاية للمسلمين أو خانا يسكنه بنو السبيل أو رباطا أو جعل أرضه مقبرة لم يزل ملكه عن ذلك عند أبي حنيفة حتى يحكم به حاكم
وقال أبو يوسف: يزول ملكه بالقول وقال محمد: إذا استقى الناس من السقاية وسكنوا ألخان والرباط ودفنوا في المقبرة زال الملك
# كتاب الغصب
ومن غصب شيئا مما له مثل فهلك في يده فعليه ضمان مثله وإن كان مما لا مثل له فعليه قيمته يوم الغصب
وعلى الغاصب رد العين المغصوبة فإن ادعى هلاكها حبسه الحاكم حتى يعلم أنها لو كانت باقية لأظهرها ثم قضى عليه ببدلها
والغصب فيما ينقل ويحول وإذا غصب عقارا فهلك في يده لم يضمنه عند أبي حنيفة وأبي يوسف وقال محمد: يضمنه كهدمه وما نقص منه بفعله وسكناه ضمنه في قولهم جميعا
وإذا هلك المغصوب في يد الغاصب بفعله أو بغير فعله فعليه ضمانه
وإن نقص في يده فعليه ضمان النقصان
ومن ذبح شاة غيره فمالكها بالخيار: إن شاء ضمنه قيمتها وسلمها إليه وإن شاء ضمنه نقصانها ومن خرق ثوب غيره خرقا يسيرا ضمن نقصانه وإن خرقه خرقا كثيرا يبطل عامة منفعته فلمالكه أن يضمنه جميع قيمته
وإذا تغيرت العين المغصوبة بفعل الغاصب
حتى زال اسمها وأعظم منافعها زال ملك المغصوب منه عنها وملكها الغاصب وضمنها ولم يحل له الانتفاع بها حتى يؤدي بدلها وهذا كمن غصب شاة فذبحها وشواها أو طبخها أو غصب حنطة فطحنها أو حديدا فاتخذه سيفا أو صفرا فعلمه آنية
وإن غصب فضة أو ذهبا فضربها دنانير أو دراهم أو
دنانير أو آنية لم يزل ملك مالكها عنها عند أبي حنيفة ومن غصب ساجة فبنى عليها زال ملك مالكها عنها ولزم الغاصب قيمتها
ومن غصب أرضا فغرس فيها أو بنى قيل له: اقلع الغرس والبناء وردها فارغة فإن كانت الأرض تنقص بقلع ذلك فللمالك أن يضمن له قيمة البناء والغرس مقلوعا فيكون له
ومن غصب ثوبا فصبغه أحمر أو سويقا فلته بسمن فصاحبه بالخيار: إن شاء ضمنه قيمة ثوبه أبيض ومثل السويق وسلمها للغاصب وإن شاء أخذهما وضمن ما زاد الصبغ والسمن فيهما
ومن غصب عينا فغيبها فضمنه المالك قيمتها ملكها الغاصب والقول في القيمة قول الغاصب مع يمينه إلا أن يقيم المالك البينة بأكثر من ذلك فإن ظهرت العين وقيمتها أكثر مما ضمن وقد ضمنها بقول المالك أو ببينة أقامها أو بنكول الغاصب عن اليمين فلا خيار للمالك وإن كان ضمنها بقول الغاصب مع يمينه فالمالك بالخيار: إن شاء أمضى الضمان وإن شاء أخذ العين ورد العوض
وولد المغصوبة ونماؤها وثمرة البستان المغصوب أمانة في يد الغاصب فإن هلك فلا ضمان عليه إلا أن يتعدى فيها أو يطلبها مالكها فيمنعها إياه
وما نقصت الجارية بالولادة في ضمان الغاصب فإن كان في قيمة الولد وفاء به خير النقصان بالولد وسقط ضمانه عن الغاصب ولا يضمن الغاصب منافع ما غصبه إلا أن بنقص باستعماله فيغرم النقصان
وإذا استهلك المسلم خمر الذمي أو خنزيره ضمن قيمتهما وإن استهلكهما المسلم على المسلم لم يضمن
# كتاب الوديعة
الوديعة: أمانة في يد المودع إذا هلكت لم يضمنها وللمودع أن يحفظها بنفسه وبمن في عياله فإن حفظها بغيرهم أو أودعها ضمن
إلا أن يقع في داره حريق فيسلمها إلى جاره أو يكون في سفينة يخاف الغرق فلقيها إلى سفينة أخرى
وإن خلطها المودع بماله حتى لا تتميز ضمنها فإن طلبها صاحبها فحبسها عنه وهو يقدر على تسليمها ضمنها
وإن اختلطت بماله من غيره فعله فهو شريك لصاحبها وإن أنفق المودع بعضها ثم رد مثله فخلطه بالباقي ضمن الجميع
وإذا تعدى المودع في الوديعة - بأن كانت دابة فركبها أو ثوبا فلبسه أو عبدا فاستخدمه أو أودعها عند غيره - ثم أزال التعدي وردها إلى يده زال الضمان فإن طلبها صاحبها فجحدها إياه فهلكت ضمنها فإن عاد إلى الاعتراف لم يبرأ من الضمان
وللمودع أن يسافر بالوديعة وإن كان لها حمل ومؤنة
وإذا أودع رجلان عند رجل وديعة ثم حضر أحدهما فطلب نصيبه منها لم يدفع إليه شيئا حتى يحضر الآخر عند أبي حنيفة وقال أبو يوسف ومحمد: يدفع إليه نصيبه
وإن أودع رجل عند رجلين شيئا مما يقسم لم يجز أن يدفعه أحدهما إلى الآخر ولكنهما يقتسمانه فيحفظ كل واحد منهما نصفه وإن كان مما لا يقسم جاز أن يحفظه أحدهما بإذن الآخر
وإذا قال صاحب الوديعة للمودع: لا تسلمها إلى زوجتك فسلمها إليها لم يضمن
وإن قال له: احفظها في هذا البيت فحفظها في بيت آخر من الدار لم يضمن فإن
حفظهما في دار أخرى ضمن
# كتاب العارية
العارية: جائزة وهي: تمليك المنافع بغير عوض وتصح بقوله: أعرتك وأطعمتك هذه الأرض ومنحتك هذا الثوب وحملتك على هذه الدابة إذا لم يرد به الهبة وأخدمتك هذا العبد
وداري لك سكنى وداري لك عمرى سكنى
وللمعير أن يرجع في العارية متى شاء
والعارية أمانة: إن هلكت من غير تعد لم يضمن شيئا
وليس للمستعير أن يؤاجر ما استعاره ولا أن يرهنه وله أن يعيره إذا كان مما لا يختلف باختلاف المستعمل
وعارية الدراهم والدنانير والمكيل والموزون قرض
وإذا استعار أرضا ليبني فيها أو يغرس نخلا جاز وللمعير أن يرجع فيها ويكلفه قلع البناء والغرس فإن لم يكن وقت العارية فلا ضمان عليه وإن كان وقت العارية فرجع قبل الوقت ضمن المعير ما نقض البناء والغرس بالقلع
وأجرة رد العارية على المستعمر وأجرة رد العين المستأجرة على المؤجر وأجرة المغصوبة على الغاصب
وإذا استعار دابة فردها إلى دار مالكها ولم يسلمها إليه ضمن وإن رد الوديعة إلى درا المالك ولم يسلمها إليه ضمن
# كتاب اللقيط
اللقيط: حر مسلم ونفقته من بيت المال
فإن التقطه رجل لم يكن لغيره أن يأخذه من يده فإن ادعى مدع أنه ابنه فالقول قوله وإن ادعاه اثنان ووصف أحدهما علامة في جسده فهو أولى به
وإذا وجد في مصر من أمصار المسلمين أو في قرية من قراهم فادعى ذمي أنه ابنه ثبث نسبه منه وكان مسلما وإن وجد في قرية من قرى أهل الذمة أو في بيعة أو كنيسة كان ذميا
ومن ادعى أن اللقيط عبده لم يقبل منه فإن ادعى عبد أنه ابنه ثبت نسبه منه وكان حرا
وإن وجد مع اللقيط مال مشدود عليه فهو له ولا يجوز تزويج الملتقط ولا تصرفه في مال اللقيط
ويجوز أن يقبض له الهبة ويسلمه في صناعة ويؤاجره
## باب اللقطة
اللقطة: أمانة إذا أشهد الملتقط أنه يأخذها ليحفظها ويردها على صاحبها فإن كانت أقل من عشرة دراهم عرفها أياما وإن كانت عشرة فصاعدا عرفها حولا
فإن جاء صاحبها وإلا تصدق بها فإن جاء صاحبها فهو بالخيار: إن شاء أمضى الصدقة وإن شاء ضمن الملتقط
ويجوز الالتقاط في الشاة والبقرة والبعير
فإن أنفق الملتقط عليها بغير إذن الحاكم فهو متبرع وإن أنفق بأمره كان ذلك دينا على مالكها
وإذا رفع ذلك إلى الحاكم نظر فيه فإن كان للبهيمة منفعة أجرها وأنفق عليها من أجرتها وإن لم يكن لها منفعة وخاف أن تستغرق النفقة قيمتها باعها وأمره بحفظ ثمنها وإن كان الأصلح الإنفاق عليها أذن له في ذلك وجعل النفقة دينا على مالكها
فإذا حضر مالكها فللملتقط أن يمنعه منها حتى يأخذ النفقة
ولقطه الحل والحرم سواء
وإذا حضر الرجل فادعى
أن اللقطة له لم تدفع إليه حتى يقم البينة فإن أعطى علامتها حل للملتقط أن يدفعها إليه ولا يجبر على ذلك في القضاء
ولا يتصدق باللقطة على غني وإن كان الملتقط غنيا لم يجز له أن ينتفع بها وإن كان فقيرا فلا بأس أن ينتفع بها ويجوز أن يتصدق بها إذا كان غنيا على أبيه وابنه وزوجته إذا كانوا فقراء والله أعلم
# كتاب الخنثى
إذا كان للمولود فرج وذكر فهو خنثى فإن كان يبول من الذكر فهو غلام وإن كان يبول من الفرج فهو أنثى وإن كان يبول منهما والبول يسبق من أحدهما نسب إلى الأسبق فإن كانا في السبق سواء فلا عبرة بالكثرة عند أبي حنيفة وقال أبو يوسف ومحمد: ينسب إلى أكثرهماز
وإذا بلغ الخنثى وخرجت له لحية أو وصل إلى النساء فهو رجل وإن ظهر له ثدي كثدي المرأة أو نزل له لبن في ثديه أو حاض أو حبل أو أمكن الوصول إليه من الفرج فهو امرأة فإن لم تظهر إحدى هذه العلامات فهو خنثى مشكل
وإذا وقف خلف الإمام قام بين صف الرجال والنساء وتبتاع له أمة تختنه إن كان له مال فإن لم يكن له مال ابتاع له الإمام من بيت المال فإذا ختنته باعها ورد ثمنها إلى بيت المال
وإذا مات أبوه وخلف ابنا وخنثى فالمال بينهما عند أبي حنيفة على ثلاثة أسهم: للابن سهمان وللخنثى سهم وهو أنثى عنده في الميراث إلا أن يثبت غير ذلك فيتبع
وقال أبو يوسف ومحمد: للخنثى نصف ميراث الذكر ونصف ميراث الأنثى وهو قول الشعبي واختلفا في قياس قوله قال أبو يوسف: المال بينهما على سبعة أسهم: للابن أربعة وللخنثى ثلاثة وقال محمد: المال بينهما على اثني عشر منهما: للابن سبعة وللخنثى خمسة
# كتاب المفقود
إذا غاب الرجل ولم يعرف له موضع ولا يعلم أحي هو أم ميت نصب القاضي من يحفظ ماله ويقوم عليه ويستوفي حقوقه وينفق على زوجته وأولاده من ماله
ولا يفرق بينه وبين امرأته
فإذا تم له مائة وعشرون سنة من يوم ولد حكمنا بموته واعتدت امرأته وقسم ماله بين ورثته الموجودين في ذلك الوقت ومن مات منهم قبل ذلك لم يرث منه ولا يرث المفقود من أحد مات في حال فقده
# كتاب الإباق
إذا أبق مملوك فرده رجل على مولاه من مسيرة ثلاثة أيام فصاعدا فله عليه الجعل أربعون درهما وإن رده لأقل من ذلك فبحسابه وإن كانت قيمته أقل من أربعين درهما قضي له بقيمته إلا درهما وإن أبق من الذي رده فلا شيء عليه وينبغي أن يشهد إذا أخذه أنه يأخذه ليرده فإن كان العبد الآبق رهنا فالجعل على المرتهن
# كتاب إحياء الموات
الموات: ما لا ينتفع به من الأرض لانقطاع الماء عنه أو لغلبه الماء عليه أو ما أشبه ذلك مما يمنع الزراعة فما كان منها عاديا لا مالك له أو كان مملوكا في الإسلام لا يعرف له مالك بعينه وهو بعيد من القرية بحيث إذا وقف إنسان
في أقصى العامر فصاح لم يسمع الصوت فيه فهو موات
من أحياه بإذن الإمام ملكه وإن أحياه بغير إذنه لم يملكه عند أبي حنيفة وقال أبو يوسف ومحمد: يملكه
ويملك الذمي بالإحياء كما يملك المسلم
ومن حجر أرضا ولم يعمرها ثلاث سنين أخذها الإمام ودفعها إلى غيره
ولا يجوز إحياء ما قرب من العامر ويترك مرعى لأهل القرية ومطرحا لحصائدهم
ومن حفر بئرا في برية فله حريمها فإن كانت البئر للعطن فحريمها أربعون ذراعا وإن كانت للناضح فستون ذراعا وإن كانت عينا فحريمها ثلاثمائة ذراع
ومن أراد أن يحفر في حريمها منع منه
وما ترك الفرات أو الدجلة وعدل عنه فإن كان يجوز عوده إليه لم يجز إحياؤه وإن كان لا يجوز أن يعود إليه فهو كالموات إذا لم يكن حريما لعامر يملكه من أحياه بإذن الإمام عند الإمام
ومن كان له نهر في أرض غيره فليس له حريمه عند أبي حنيفة إلا أن يقيم بينة على ذلك وقال أبو يوسف ومحمد: له مسناة يمشي عليها ويلقي عليها طينه
# كتاب المأذون
إذا أذن المولى لعبده في التجارة إذنا عاما جاز تصرفه في سائر التجارات:
يشتري ويبيع ويرهن ويسترهن
وإن أذن له في نوع منها دون غيره فهو مأذون في جمعيها
وإن أذن له في شيء بعينه فليس بمأذون
وإقرار المأذون بالديون والغصوب جائز وليس له أن يتزوج ولا أن يزوج مماليكه ولا يكاتب ولا يعتق على مال ولا يهب بعوض ولا بغير عوض إلا أن يهدي اليسير من الطعام أو يضيف من يطعمه
وديونه متعلقة برقبته: يباع للغرماء إلا أن يفديه المولى ويقسم ثمنه بينهم بالحصص فإن فضل من ديونه شيء طولب به بعد الحرية
وإن حجر عليه لم يصر محجورا عليه حتى يظهر الحجر بين أهل سوقه فإن مات المولى أو جن أو لحق بدار الحرب مرتدا صار المأذون محجورا عليه
وإن أبق العبد صار محجورا عليه
وإذا حجر عليه فإقراره جائز فيما في يده من المال عند أبي حنيفة
وإن لزمته ديون تحيط بماله ورقبته لم يملك المولى ما في يده فإن أعتق عبيده لم يعتقوا عند أبي حنيفة وقال أبو يوسف ومحمد: يملك ما في يده
وإذا باع من المولى شيئا بمثل قيمته جاز فإن باعه بنقصان لم يجز فإن باعه المولى شيئا بمثل القيمة جاز البيع فإن سلمه إليه قبل قبض الثمن بطل الثمن وإن أمسكه في يده حتى يستوفي
الثمن جاز وإن أعتق المولى المأذون وعليه ديون فعتقه جائز والمولى ضامن لقيمته للغرماء وما بقي من الديون يطالب به المعتق وإذا ولدت المأذونة من مولاها فذلك حجر عليها
وإن أذن ولي الصبي في التجارة فهو في الشراء والبيع كالعبد المأذون إذا كان يعقل البيع والشراء
# كتاب المزارعة
قال أبو حنيفة رحمه الله: المزارعة بالثلث والربع باطلة وقال أبو يوسف ومحمد: جائزة
وهي عندهما على أربعة أوجه: إذا كانت الأرض والبذر لواحد والعمل والبقر لواحد جازت المزارعة
وإن كانت الأرض لواحد والعمل والبقر والبذر لآخر جازت
وإن كانت الأرض والبقر والبذر لواحد والعمل لآخر جازت
وإن كانت الأرض والبقر لواحد والبذر والعمل لآخر فهي باطلة
ولا تصح المزارعة إلا على مدة معلومة
ومن شرائطها: أن يكون الخارج مشاعا بينهما فإن شرطا لأحدهما قفزانا مسماة فهي باطلة وكذلك إن شرطا ما على الماذيانات والسواقي
وإذا صحت المزارعة فالخارج بينهما على الشرط فإن لم تخرج الأرض شيئا فلا شيء للعامل
وإذا فسدت المزارعة فالخارج لصاحب البذر فإن كان البذر من قبل رب الأرض فللعامل أجر مثله لا يزاد على مقدار ما شرط له من الخارج وإن كان البذر من قبل العامل فلصاحب الأرض أجر مثلها
وإذا عقدت المزارعة فامتنع صاحب البدر من العمل لم يجبر عليه وإن امتنع الذي ليس من قبله البذر أجبره الحاكم على العمل
وإذا مات أحد المتعاقدين بطلت المزارعة وإذا
انقضت مدة المزارعة والزرع لم يدرك كان على المزارع أجر مثل نصيبه من الأرض إلى أن يستحصد والنفقة على الزرع عليهما على مقدار حقوقهما وأجره الحصاد والرفاع والدياس والتذرية عليهما بالحصص فإن شرطاه في المزارعة على العامل فسدت
باب المساقاة
قال أبو حنيفة: المسافاة بجزء من الثمرة باطلة وقال أبو يوسف ومحمد: جائزة إذا ذكرا مدة معلومة وسميا جزاءا من الثمرة مشاعا
وتجوز المساقاة في النخل والشجر والكرم والرطاب وأصول
الباذنجان فإن دفع نخلا فيه ثمره مساقاة والثمرة تزيد بالعمل جاز وإن كانت قد انتهت لم يجز
وإذا فسدت المساقاة فللعامل أجر مثله وتبطل المساقاة بالموت وتفسخ بالإعذار كما تفسخ الإجارة
# كتاب النكاح
النكاح ينعقد بالإيجاب والقبول بلفظين يعبر بهما عن الماضي أو يعبر بأحدهما عن الماضي وبالآخر عن المستقبل مثل أن يقول: زوجتي فيقول زوجتك
ولا يعقد نكاح المسلمين إلا بحضور شاهدين حرين بالغين عاقلين مسلمين أو رجل
وامرأتين عدولا كانوا غيرا عدول أو محدودين في قذف فإن تزوج مسلم ذمية بشهادة ذميين جاز عند أبي حنيفة وأبي يوسف وقال محمد: لا يجوز
ولا يحل للرجل أن يتزوج بأمه ولا بجداته من قبل الرجال والنساء ولا ببنته ولا ببنت ولده وإن سفلت ولا بأخته ولا ببنات أخته ولا ببنات أخيه ولا بعمته وال بخالته ولا بأم دخل بابنتها أو لم يدخل ولا ببنت امرأته التي دخل بها سواء كانت في حجره أو في حجر غيره ولا بامرأة أبيه وأجداده ولا بامرأة ابنه وبني أولاده ولا بأمه من الرضاعة ولا بأخيه من الرضاعة
ولا يجمع بين أختين بنكاح ولا بملك يمين وطئا ولا يجمع بين المرأة وبين عمتها وخالتها ولا ابنة أخيها ولا ابنة أختها ولا يجمع بين امرأتين لو كانت كل واحدة منهما رجلا لم يجز له أن يتزوج بالأخرى ولا بأس أن يجمع بين امرأة وابنة زوج كان لها من قبل
ومن زنى بامرأة حرمت عليه أمها وابنتها
وإذا طلق الجل امرأته طلاقا بائنا لم يجز له أن يتزوج بأختها حتى تنقضي عدتها
ولا يجوز أن يتزوج المولى أمته ولا المرأة عبدها
ويجوز تزوج الكتابيات ولا يجوز تزوج المجوسيات ولا الوثنيات ويجوز تزوج الصابئيات إذا
كانوا يؤمنون بنبي ويقرون بكتاب وإن كانوا يعبدون الكواكب ولا كتاب لهم لم تجز مناكحتهم
ويجوز للمحرم والمحرمة أن يتزوجا في حال الإحرام
وينعقد نكاح المرأة الحرة البالغة العاقلة برضاها وإن لم يعقد عليها ولي عند أبي حنيفة بكر كانت أو ثيبا وقال أبو يوسف ومحمد: لا ينعقد إلا بولي
ولا يجوز للولي إجبار البكر البالغة على النكاح وإذا استأذنها فسكتت أو ضحكت أو بكت فذلك إذن منها وإن أبت لم يزوجها وإذا استأذن الثيب فلا بد من رضاها بالقول وإذا زالت بكارتها بوثبة أو حيضة أو جراح فهي في حكم الأبكار وإن زالت بزنا فهي كذلك عند أبي حنيفة
وإذا قال الزوج: بلغك النكاح فسكت وقال: بل رددت فالقول قولها ولا يمين عليها ولا يستحلف في النكاح عند أبي حنيفة وقال أبو يوسف ومحمد: يستحلف فيه
وينعقد النكاح بلفظ النكاح والتزويج والتمليك والهبة والصدقة ولا ينعقد بلفظ الإجارة والإباحة
ويجوز نكاح الصغير إذا زوجهما الولي بكرا كانت الصغيرة أو ثيبا والولي هو العصبة فإن زوجهما الأب أو الجد فلا خيار لهما بعد بلوغهما وإن زوجهما غير الأب والجد فلكل
واحد منهما الخيار إذا بلغ إن شاء أقام على النكاح وإن شاء فسخ
ولا ولاية لعبد ولا صغير ولا مجنون ولا كافر على مسلمة
وقال أبو حنيفة: يجوز لغير العصبات من الأقارب التزويج
ومن لا ولي لها إذا زوجها مولاها الذي أعتقها جاز وإذا غاب الولي الأقرب غيبة جاز لمن هو أبعد منه أن يزوج
والغيبة المنقطعة: أن يكون في بلد لا تصل إليه القوافل في السنة إلا مرة واحدة
والكفاءة في النكاح معتبرة فإذا تزوجت المرأة غير كفء فللأولياء أن يفرقوا بينهما
والكفاءة تعتبر في النسب
والدين
والمال وهو: أن يكون مالكا للمهر والنفقة وتعتبر في الصنائع وإذا تزوجت المرأة ونقصت من مهرها فللأولياء الاعتراض عليها عند أبي حنيفة حتى يتم لها مهر مثلها أو يفارقها
وإذا تزوج الأب ابنيه الصغيرة ونقص من مهرها أو ابنه الصغير وزاد في مهر جاز ذلك عليهما
ولا يجوز ذلك لغير الأب والجد
ويصح النكاح إذا سمى فيه مهرا ويصح وإن لم يسم فيه مهرا
وأقل المهر عشرة دراهم فإن سمى أقل من عشرة فلها العشرة ومن سمى مهرا عشرة فما زاد فعليه المسمى إن دخل بها أو مات عنها وإن طلقها قبل الدخول والخلوة فلها نصف المسمى
وإن تزوجها ولم يسم لها مهرا أو تزوجها على أن لا مهر لها فلها مهر مثلها إن دخل بها أو مات عنها
وإن طلقها قبل الدخول فلها المتعة وهي ثلاثة أثواب من كسوة مثلها
وإن تزوج المسلم على خمر أو خنزير فالنكاح جائز ولها مهر مثلها
وإن تزوجها ولم يسلم لها مهرا ثم تراضيا على تسمية مهر فهو لها إن دخل بها أو مات عنها وإن طلقها قبل الدخول لها المتعة
وإن زادها في المهر بعد العقد لزمته الزيادة وتسقط
بالطلاق قبل الدخول وإن حطت عنه من مهرها صح الحط وإذا خلا الزوج بامرأته ولي هناك مانع من الوطء ثم طلقها فلها كمال المهر وإن كان أحدهما مريضا أو صائما في رمضان أو محرما بفرض أو نفل بحج أو عمرة أو كانت حائضا فليست بخلوة صحيحة وإذا خلا المجبوب بامرأته ثم طلقها فلها كمال المهر عند أبي حنيفة
وتستحب المتعة لكل مطلقة إلا لمطلقة واحدة وهي:
التي طلقها قبل الدخول ولم يسم لها مهرا
وإذا تزوج الرجل ابنته على أن يزوجه الرجل أخته أو ابنته ليكون أحد العقدين عوضا عن الآخر فالعقدان جائزان ولكل واحدة منهما مهر مثلها
وإن تزوج حر امرأة على خدمته سنة أو على تعليم القرآن فلها مهر مثلها وإن تزوج عبد حرة بإذن مولاه على خدمتها سنة جاز
وإذا اجمع في المجنونة أبوها وابنها فالولي
في نكاحها ابنها عند أبي حنيفة وأبي يوسف وقال محمد: أبوها
ولا يجوز نكاح العبد والأمة إلا بإذن مولاهما وإذا تزوج العبد بإذن مولاه فالمهر دين في رقبته يباع فيه وإذا زوج المولى أمته فليس عليه أن يبوئها بيت الزوج ولكنها تخدم المولى ويقال للزوج: متى ظفرت بها وطئتها
وإذا تزوج امرأة على ألف درهم على أن لا يخرجها من البلد أو على أن لا يتزوج عليها فإن وفى بالشرط فلها المسمى وإن تزوج عليها أو أخرجها من البلد فلها مهر مثلها
وإذا تزوجها على حيوان غير موصوف
صحت التسمية ولها الوسط منه والزوج مخير: إن شاء أعطاها ذلك وإن شاء أعطاها قيمته
ولو تزوجها على ثوب غير موصوف فلها مهر مثلهاز
ونكاح المتعة والنكاح المؤقت
باطل وتزويج العبد والأمة بغير إذن مولاهما موقوف: فإن أجازه المولى جاز وإن رده بطل وكذلك لو زوج امرأة بغير رضاها أو رجلا بغير رضاه
ويجوز لابن العم أن يزوج بنت عمه من نفسه وإذا أذنت المرأة لرجل أن يزوجها من نفسه فقعد بحضرة شاهدين جاز
وإذا ضمن الولي المهر صح ضمانه وللمرأة الخيار في مطالبة زوجها أو وليها
وإذا فرق القاضي بين الزوجين في النكاح الفاسد قبل الدخول فلا مهر لها وكذلك بعد الخلوة وإن دخل بها فلها مهر مثلها لا يزاد على المسمى وعليها العدة ويثبت نسب ولدها
ومهر مثلها يعتبر بأخواتها وعماتها وبنا عمها ولا يعتبر بأمها وخالتها إذا لم يكونا من قبيلتها
ويعتبر في مهر المثل: أن تتساوى المرأتان في السن والجمال والعفة والمال والعقل والدين والبلد والعصر
ويجوز تزويج الأمة مسلمة كانت أو كتابية ولا يجوز أن يتزوج أمة على حرة ويجوز الحرة عليها
وللحر أن يتزوج أربعا من الحرائر والإماء وليس له أن يتزوج أكثر من ذلك
ولا يتزوج العبد أكثر من اثنتين
فإن طلق الحر إحدى الأربع طلاقا بائنا لم يجز له
أن يتزوج رابعة حتى تنقضي عدتها
وإذا زوج الأمة مولاها ثم أعتقت فلها الخيار حرا كان زوجها أو عبدا وكذلك المكاتبة
وإن تزوجت أمه بغير إذن مولاها ثم أعتقت صح النكاح ولا خيار لها
ومن تزوج امرأتين في عقد واحد إحداهما لا يحل له نكاحها صح نكاح التي يحل له نكاحها وبطل نكاح الأخرى
وإن كان بالزوجة عيب فلا خيار لزوجها وإذا كان بالزوج جنون أو جذام أو برص فلا خيار للمرأة عند أبي حنيفة وأبي يوسف وقال محمد: لها الخيار فإن كان عنينا أجله الحاكم حولا فإن وصل إليها وإلا فرق بينهما إن طلبت المرأة ذلك
والفرقة تطليقه بائنة ولها كمال المهر إن كان قد خلا بها وإن كان
مجنونا فرق القاضي بينهما في الحال ولم يؤجله والخصي يؤجل كما يؤجل العنين
وإذا سلمت المرأة وزوجها كافر عرض عليه القاضي الإسلام فإن أسلم فهي امرأته وإن أبى عن الإسلام فرق بينهما وكان ذلك طلاقا بائنا عند أبي حنيفة ومحمد: وقال أبو يوسف: هي فرقة بغير طلاق
فإن أسلم الزوج وتحته مجوسية عرض عليها الإسلام فإن أسلمت فهي امرأته وإن أبت فرق القاضي بينهما ولم تكن هذه الفرقة طلاقا فإن كان قد دخل لها فلها المهر وإن لم يكن دخل بها فلا مهر لها
وإذا أسلمت المرأة في دار الحرب لم تقع الفرقة عليها حتى
تحيض ثلاث حيض فإذا حاضت بانت من زوجها
وإذا أسلم زوج الكتابية فهما على نكاحهما
وإذا خرج أحد الزوجين إلينا من دار الحرب مسلما وقعت البينونة بينهما وإن سبي أحدهما البينونة بينهما وإن سبيا معا لم تقع البينونة وإذا خرجت المرأة إلينا مهاجرة جاز لها أن تتزوج ولا عدة عليها عند أبي حنيفة فإن كانت حاملا لم تتزوج حتى تضع حملها
وإذا أرتد أحد الزوجين عن الإسلام وقعت الفرقة بينهما بغير طلاق فإن كان الزوج هو المرتد وقد دخل بها فلها كمال المهر وإن كان لم يدخل بها
فلها نصف المهر وإن كانت المرأة هي المرتدة فإن كان قبل الدخول فلا مهر لها وإن كانت الردة بعد الدخول فلها المهر وإن ارتدا معا وأسلما فهما على نكاحهما
ولا يجوز أن يتزوج المرتد مسلمة ولا كافرة ولا مرتدة وكذلك المرتدة لا يتزوجها مسلم ولا كافر ولا مرتد
وإذا كان أحد الزوجين مسلما فالولد على دينه وكذلك إن أسلم أحدهما وله ولد صغير صار
ولده مسلما بإسلامه وإن كان أحد الأبوين كتابيا والآخر مجوسيا فالولد كتابي
وإذا تزوج الكافر بغير شهود أو في عدة الكافر وذلك في دينهم جائ ثم أسلما أقرا عليه وإذا تزوج المجوسي أمه أو ابنته ثم أسلما فرق بينهما
وإذا كان للرجل امرأتان حرتان فعليه أن يعد بينهما في القسم بكرين كانتا أو ثيبتين أو إحداهما بكرا والأخرى ثيبا
وإن كانت إحداهما والأخرى أمة فللحرة الثلثان من القسم وللأمة الثلث
ولا حق لهن في القسم حالة السفر ويسافر الزوج بمن شاء منهن والأولى أن يفرغ بينهن فيسافر بمن خرجت قرعتها وإن رضيت الزوجات بترك قسمها لصاحبتها جاز ولها أن ترجع في ذلك
# كتاب الرضاع
قليل الرضاع وكثيره سواء إذا حصل في مدة الرضاع تعلق به التحريم
ومدة الرضاع عند أبي حنيفة ثلاثون شهرا وقال أبو يوسف ومحمد: سنتان فإذا مضت مدة الرضاع لم يتعلق بالرضاع تحريم
ويحرم من الرضاع ما يحرم من النسب إلا أم أخته من الرضاع فإنه يجوز أن يتزوجها ولا يجوز أن يتزوج أم أخته من النسب وأخت ابنه من الرضاع يجوز أن يتزوجها ولا يجوز أخت ابنه من النسب وامرأة ابنه من الرضاع لا يجوز أن يتزوجها كما لا يجوز أن يتزوج امرأة ابنه من النسب وامرأة أبيه من الرضاع لا يجوز أن يتزوجها كما لا يجوز أن يتزوج امرأة أبيه من النسب
ولبن الفحل يتعلق به التحريم وهو: أن ترضع المرأة صبية فتحرم هذه الصبية على زوجها وعلى آبائه وأبنائه ويصير الزوج الذي نزل منه اللبن أبا للمرضعة
ويجوز أن يتزوج الرجل بأخت أخيه من الرضاع كما يجوز أن يتزوج بأخت أخيه من النسب وذلك مثل الأخ من الأب إذا كان له أخت من أمه جاز لأخيه من أبيه أن يتزوجهل
وكل صبيين اجتمعا على ثدي واحد لم يجز لأحدهما أن يتزوج بالآخر ولا يجوز أن تتزوج المرضعة أحدا من ولد التي أرضعتها ولا ولد ولدها ولا يتزوج الصبي المرضع أخت زوج المرضعة لأنها عمته من الرضاع
وإذا اختلط اللبن بالماء واللبن هو الغالب تعلق به التحريم وإن غلب الماء لم يتعلق به التحريم وإذا اختلط بالطعام لم يتعلق به التحريم وإن كان اللبن غالبا عند أبي حنيفة وإذا اختلط بالدواء وهو الغالب تعلق به التحريم
وإذا حلب اللبن من المرأة
بعد موتها فأوجر به الصبي تعلق به التحريم وإذا اختلط اللبن بلبن شاة واللبن هو الغالب تعلق به التحريم وإن غلب لبن الشاة لم يتعلق به التحريم
وإذا اختلط لبن امرأتين تعلق التحريم بأكثرهما عند أبي حنيفة وأبي يوسف وقال محمد: يتعلق بهما
وإذا نزل للبكر لبن فأرضعت به صبيا تعلق به التحريم وإذا نزل للرجل لبن فأرضع به صبيا لم يتعلق به التحريم
وإذا شرب صبيان من لبن شاو فلا رضاع بينهما
وإذا تزوج الرجل صغيرة وكبيرة فأرضعت الكبيرة الصغيرة حرمتا على الزوج
فإن كان لم يدخل بالكبيرة فلا مهر لها وللصغيرة نصف المهر ويرجع به الزوج على الكبيرة إن كانت تعمدت به الفساد
وإن لم تتعمد فلا شيء عليها
ولا تقبل في الرضاع شهادة النساء منفردات وإنما يثبت بشهادة رجلين أو رجل وامرأتين
# كتاب الطلاق
الطلاق على ثلاثة أوجه: أحسن الطلاق وطلاق السنة وطلاق البدعة
فأحسن الطلاق: أن يطلق الرجل امرأته تطليقه واحدة في طهر لم يجامعها فيه ويتركها حتى تنقضي عدتها وطلاق السنة: أن يطلق المدخول بها ثلاثا في ثلاثة أطهار
وطلاق البدعة: إن يطلقها ثلاثا بكلمة واحدة أو ثلاثا في طهر واحد فإذا فعل ذلك وقع الطلاق وبانت منه وكان عاصيا
والسنة ي الطلاق من وجهين: سنة في العدد فالسنة في العدد يستوي فيها المدخول بها وغير المدخول بها والسنة في الوقت تثبت في المدخول بها خاصة وهو: أن يطلقها في طهر لم يجامعها فيه وغير المدخول بها يطلقها في حال الطهر والحيض وإذا كانت المرأة لا تحيض من صغر أو كبر فأراد أن يطلقها للسنة طلقها واحدة فإذا مضى شهر طلقها أخرى
فإذا مضى شهر آخر طلقها آخرى ويجوز أن يطلقها ولا يفصل بين وطئها وطلاقها بزمان
وطلاق الحامل يجوز عقيب الجماع ويطلقها للسنة ثلاثا يفصل بين كل تطليقتين بشهر
عند أبي حنيفة وأبي يوسف وقال محمد: لا يطلقها للسنة إلا واحدة
وإذا طلق الرجل امرأته في حال الحيض وقع الطلاق ويستحب له أن يراجعها وإن شاء أمسكها
فإذا طهرت وحاضت وطهرت فهو مخير: إن شاء طلقها وإن شاء أمسكها
ويقع طلاق كل زوج إذا كان عاقلا بالغا ولا يقع طلاق الصبي والمجنون والنائم وإذا تزود العبد ثم طلق وقع طلاقه ولا يقع طلاق مولاه على امرأته
والطلاق على ضربين: صريح وكناية فالصريح قوله: أنت طالق ومطلقه وطلقتك فهذا يقع به الطلاق الرجعي ولا يقع به إلا واحدة وإن نوى أكثر من ذلك ولا يفتقر إلى النية
وقوله: أنت الطلاق أو أنت طالق الطلاق أو أنت طالق طلاقا فإن لم تكن له نية فهي واحدة رجعية وإن نوى به ثلاثا كان ثلاثا
والضرب الثاني: والكنايات ولا يقع بها الطلاق إلا بينة أو دلاله حال وهي على ضربين منها ثلاثة ألفاظ بها الطلاق الرجعي ولا يقع بها إلا واحدة وهي قوله: اعتدي واستبرئي رحمك وأنت واحدة
وبقيه الكنايات إذا نوى بها الطلاق كانت واحدة بائنة
وإن نوى ثلاثا كانت وإن نوى اثنتين كانت واحدة مثل قوله: أنت بائن وبتة وبتلة وحرام وحبلك على غاربك والحقي بأهلك وخلية وبرية ووهبتك لأهلك وسرحتك وفارقتك وأنت حرة وتقنعي وتخمري واستتري واعزبي واغربي وابتغي الأزواج فإن لم يكن له نية لم يقع بهذه الألفاظ طلاق إلا أن يكونا في مذاكرة الطلاق فيقع بها الطلاق في القضاء ولايقع فيما بينه وبين الله تعالى إلا أن ينويه وإن لم يكونا في مذاكرة الطلاق وكانا في غضب أو خصومة وقع الطلاق
بكل لفظ لا يقصد به السب والشتيمة ولم يقع بما يقصد به السب والشتيمه إلا أن ينويه
وإذا وصف الطلاق بضرب من الزيادة والشدة كان بائنا مثل أن يقول: أنت طالق بائن أو طالق أشد الطلاق أو أفحش الطلاق أو طلاق الشيطان والبدعة وكالجبل وملء البيت
وإذا أضاف الطلاق إلى جملها أو إلى ما يعبر به عن الجملة وقع الطلاق
مثل أن يقول: أنت طالق أو رقبتلك طالق أو عنقك طالق أو روحك طالق أو بدنك أو جسدك أو فرجك أو وجهك
وكذلك أن طلق جزءا شائعا منها مثل أن يقول: نصفك أو ثلثك
وإن قال: يدك أو رجلك طالق لم يقع الطلاق
وإن طلقها نصف تطليقة أو ثلث تطليقة كانت طلقة واحدة
وطلاق المكره والسكران واقع ويقع طلاق الأخرس بالإشارة
وإذا أضاف الطلاق إلى النكاح وقع عقيب النكاح مثل أن يقول: إن تزوجتك فأنت طالق أو كل امرأة أتزوجها فهي طالق
وإن أضافه إلى شرط وقع عقب الشرط مثل أن يقول لامرأته: إن دخلت الدار فأنت طالق
ولا يصح إضافة الطالق إلا أن يكون الحالف مالكا أو يضيفه إلى ملك
وإن قال لأجنبية: إن دخلت الدار فأنت طالق ثم تزوجها فدخلت الدار لم تطلق
وألفاظ الشرط: إن وإذا وإذ ما وكل وكلما ومتى ومتى ما
ففي كل هذه الشروط إذا وجد الشرط انحلت اليمين إلا في كلما فإن الطلاق يتكرر بتكرار الشرط حتى يقع ثلاث
تطليقات فإن تزوجها بعد ذلك وتكرر الشرط لم يقع شيء وزوال الملك بعد اليمين لا يبطلها
فإن وجد في ملكه انحلت اليمين
ووقع الطلاق وإن وجد في غير الملك انحلت اليمين ولم يقع شيء وإذا اختلفا في وجود الشرط فالقول قول الزوج فيه إلا أن تقيم البينة
فإن كان الشرط لا يعلم إلا من وجهتها فالقول قولها في حق نفسها مثل أن يقول: إن حضت فأنت طالق فقالت: قد حضت طلقت وإذا قال: إذا حضت فأنت طالق وفلانة فقالت: قد حضت طلقت هي ولم تطلق فلانة وإذا قال لها: إذا حضت فأنت طالق فرأت الدم لم يقع الطلاق حتى يستمر ثلاثة أيام فإذا تمت ثلاثة أيام
حكمنا بوقوع الطلاق من حين حاضت وإذا قال لها: إذا حضت حيضة فأنت طالق لم تطلق حتى تطهر من حيضها
وطلاق الأمة تطليقتان حرل كان زوجها أو عبدا وطلاق الحرة ثلاث حرا كان زوجها أو عبدا
وإذا طلق الرجل امرأته قبل الدخول بها ثلاثا وقعن عليها فإن فرق الطلاق بانت بالأولى ولم تقع الثانية وإذا قال لها: أنت طالق وواحدة وقعت عليها واحدة
وإن قال لها أنت طالق واحدة وقعت واحدة وإن قال لها واحدة قبلها واحدة وقعت اثنتان
وإن قال واحدة بعدها وقعت واحدة وإن قال واحدة بعد واحدة أو مع واحدة أو معها واحدة وقعت اثنتان
وإذا قال لها: إن دخلت الدار فأنت طالق واحدة فدخلت الدار وقعت عليها واحدة عند أبي حنيفة وإذا قال لها أنت طالق بمكة فهي طالق في كل البلاد
وكذلك إذا قال أنت طالق في الدار وإن قال لها أنت طالق إذا دخلت مكة لم تطلق حتى تدخل مكة وإن قال لها: أنت طالق غدا وقع الطلاق عليها بطلوع الفجر
وإذا قال لامرأته:: اختاري نفسك ينوي بذلك الطلاق أو قال لها: طلقي نفسك فلها أن تطلق نفسها ما دامت في مجلسها ذلك فإن قامت منه أو أخذت في عمل آخر خرج الأمر من يدها وإن اختارت نفسها في قوله: اختاري كانت
واحدة بائنة ولا يكون ثلاثا وإن نوى الزوج ذلك
ولا بد من ذكر النفس في كلامه أو في كلامها وإن طلقت نفسها في قوله: طلقي نفسك فهي واحدة رجعية وإن طلقت نفسها ثلاثا وقد أراد الزوج ذلك وقعن عليها وإن قال لها: طلقي نفسك متى شئت فلها أن تطلق نفسها في المجلس وبعده
وإذا قال لرجل: طلق امرأتي فله أن يطلقها في المجلس وبعده وإن قال: طلقها إن شئت فله أن يطلقها في المجلس خاصة وإن قال لها: إن كنا تحبيني أو تبغضيني فأنت طالق فقالت: أنا أحبك أو أبغضك وقع الطلاق وإن كان في قلبها خلاف ما أظهرت
وإذا طلق الرجل امرأته في مرض موته طلاقا بائنا وهي في العدة ورثت منه وإن مات بعد انقضاء عدتها فلا ميراث لها
وإذا قال الزوج لامرأته: أنت طالق إن شاء الله متصلا لم يقع الطلاق عليها
وإن قال: لها أنت طالق ثلاثا إلا واحدة طلقت اثنتين وإن قال: ثلاثا إلا اثنتين طلقت واحدة
وإذا ملك الزوج امرأته أو شقصا منها أو ملكت المرأة زوجها أو شقصا منه وقعت الفرقة بينهما
## باب الرجعة
إذا طلق الرجل امرأته تطليقة رجعية أو تطليقتين فله أن يراجعها في عدتها رضيت بذلك أو لم ترض
والرجعة أن يقول: راجعتك أو راجعت امرأتي
أو يطأها أو يقبلها أو يلمسها شهوة أو ينظر إلى فرجها بشهوة
ويستحب أن يشهد على الرجعة شاهدين فإن لم يشهد صحت الرجعة
وإذا انقضت العدة فقال: قد كنت راجعتها في العدة فصدقته فهي رجعة وإن كذبته فالقول قولها ولا يمين عليها عند أبي حنيفة
وإذا قال الزوج: قد راجعتك فقالت مجيبة له: قد انقضت عدتي لم تصح الرجعة عند أبي حنيفة
وإذا قال زوج الأمة بعد انقضاء عدتها: قد كنت راجعتها في العدة فصدقه المولى وكذبته الأمة فالقول قولها
وإذا انقطع الدم من الحيضة الثالثة لعشرة أيام انقطعت الرجعة وإن لم تغتسل وإن انقطع لأقل من عشرة أيام لم تنقطع الرجعة حتى تغتسل أو يمضي عليها وقت صلاة أو تتيمم وتصلي عند أبي حنيفة وأبي يوسف
وقال محمد: إذا تيممت انقطعت الرجعة وإن لم تصل
وإن اغتسلت ونسيت شيئا من بدنها لم يصبه الماء فإن كان عضوا فما فوقه لم تنقطع الرجعة وإن كان أقل من عضو انقطعت
والمطقة الرجعية تتشوف وتتزين ويستحب لزوجها أن لا يدخل عليها حتى يستأذنها أو يسمعها خفق نعليه
والطلاق الرجعي لا يحرم الوطء وإذا كان الطلاق بائنا دون الثلاث فله أن يتزوجها في عدتها وبعد انقضاء عدتها
وإن كان الطلاق ثلاثا في الحرة أو اثنتين في الأمة لم تحل له حتى تنكح زوجا غيره نكاحا صحيحا ويدخل بها ثم يطلقها أو يموت عنها
والصبي المراهق في التحليل كالبالغ
ووطء المولى أمته لا يحللها وإذا تزوجها بشرط التحليل فالنكاح مكروه فإن طلقها بعد وطئها حلت للأول
وإذا طلق الرجل الحرة تطليقه أو تطليقتين وانقضت عدتها وتزوجت بزوج آخر ثم عادت إلى الأول عادت بثلاث تطليقات ويهدم الزوج الثاني ما دون الثلاث من الطلاق كما يهدم الثلاث
وقال محمد: لا يهدم ما دون الثلاث
وإذا طلقها ثلاثا فقالت: قد انقضت عدتي وتزوجت ودخل بي وطلقني وانقضت عدتي والمدة تحتمل ذلك جاز للزوج أن يصدقها إذا كان في غالب ظنه أنها صادقة
# كتاب الإيلاء
إذا قال الرجل لامرأته: والله لا أقربك أو لا أقربك أربعة أشهرفهو مول فإن وطئها في الأربعة الأشهر حنث في يمينه ولزمته الكفارة وسقط الإيلاء
وإن لم يقربها حتى مضت أربعة أشهر بانت منه بتطليقة
فإن كان خلف على أربعة أشهر فقد سقطت اليمين وإن كان حلف على الأبد فاليمين باقية فإن عاد فتزوجها عاد الإيلاء فإن وطئها لزمته الكفارة وإلا وقعت بمضي أربعة أشهر تطليقه أخرى فإن تزوجها عاد الإيلاء ووقع بمضي أربعة أشهر تطليقه أخرى فإن تزوجها بعد
زوج آخر لم يقع بذلك الإيلاء طلاق واليمين باقية فإن وطئها كفر عن يمينه
وإذا حلف على أقل من أربعة أشهر لم يكن موليا وإن حلف بحج أو صوم أوصدقة أو عتق أو طلاق فهو مول
وإن آلى من المطلقة الرجعية كان موليا وإن آلى من البائنة لم يكن موليا ومدة إيلاء الأمة شهران
وإن كان المولى مريضا لا يقدر على الجماع أو كانت المرأة مريضة أو كانت بينهما مسافة لا يقدر أن يصل إليها في مدة الإيلاء ففيئه أن يقول بلسانه: فئت إليها فإن قال ذلك سقطر الإيلاء وإن صح في المدة بطل ذلك الفيء وصار فيئه بالجماع
وإذا قال لامرأته أنت علي حرام سئل عن نيته فإن قال: أردت الكذب فهو كما قال
وإن قال: أردت الطلاق فهي تطليقة بائنة إلا أن ينوي الثلاث وإن قال: أردت الظهار فهو ظهار وإن قال: أردت التحريم أو لم أرد به شيئا فهو يمين يصير بها موليا
## باب الخلع
إذا اشتاق الزوجان وخافا أن لا يقيما حدود الله فلا بأس أن تفتدي نفسها منه بمال يخلعها به فإذ فعل ذلك وقع بالخلع تطليقة بائنة ولزمها المال
وإن كان النشوز من قبله كره له أن يأخذ منها عوضا وإن كان النشوز من قبلها كره له أيأخذ منها أكثر مما أعطاها فإن فعل ذلك جاز في القضاء
وإن طلقها على مال فقبلت وقع الطلاق ولزمها المال وكان الطلاق بائنا
وإذا بطل العوض في الخلع مثل أن تخالع المرأة المسلمة على خمر أو خنزير فلا شيء للزوج والفرقة بائنة وإن بطل العوض في الطلاق كان رجعيا
وما جاز أن يكون مهرا جاز أن يكون بدلا في الخلع
فإن قالت له: خالعني على ما في يدي فخالعها ولم يكن في يدها شيء فلا شيء له عليها وإن قالت: خالعني على ما في يدي من مال ولم يكن في يدها شيء ردت عليه مهرها وإن قالت: خالعني على ما في يدي من دراهم فخالها ولم يكن في يدها شيء فعليها ثلاثة دراهم وإن قالت: طلقني ثلاثا بألف فطلقها واحدة فعليها ثلث الألف وإن قالت: طلقني ثلاثا على ألف فطلقها واحدة فلا شيء عليها عند أبي حنيفة
ولو قال الزوج: طلقي نفسك ثلاثا بألف أو على ألف فطلقت نفسها واحدة لم يقع عليها شيء
والمبارأة كالخلع والخلع كالمبارأة يسقطان كل حق لكل واحد من الزوجين على الآخر مما يتعلق بالنكاح عند أبي حنيفة رحمه الله إلا نفقة العدة وقال أبو يوسف رحمه الله المبارأة تسقط والخلع لا تسقط وقال محمد رحمه الله لا تسقطان إلا ما سمياه.
# كتاب الظهار
إذا قال الزوج لامرأته: أنت علي كظهر أمي فقد حرمت عليه ولا يحل له وطؤها ولا لمسها ولا تقبيلها حتى يكفر عن ظهاره فإن وطئها قبل أن يكفر استغفر
الله تعالى ولا شيء عليه غير الكفارة الأولى ولا يعاودها حتى يكفر
والعود الذي تجب به الكفارة أن يعزم على وطئها
وإذا قال: أنت علي كبطن أمي أو كفخذها أو كفرجها فهو مظاهر وكذلك إن شبهها بمن لا يحل له النظر على التأييد من محارمه مثل أخته أو عمته أو أمه من الرضاعة وكذلك إن قال: رأسك علي كظهر أمي أو فرجك أو وجهك أو رقبتك أو نصفك أو ثلثك وإن قال: أنت علي مثل أمي رجع إلى نيته
فإن قال أردت الكرامة فهو كما قال وإن قال: أردت الظهار فهو ظهار وإن قال: أردت الطلاق فهو طلاق بائن وإن لم يكن له نية
فليس شيء
ولا يكون الظهار إلا من زوجته فإن ظاهر من أمته لم يكن مظاهرا ومن قال لنسائه: أنتن علي كظهر أمي كان مظاهرا من جماعتهن وعليه لكل واحدة منهن كفارة
وكفارة الظهار: عتق رقبة فإن لم يجد فصيام شهرين متتابعين فإن لم يستطع فإطعام مسكينا كل ذلك قبل المسيس ويجزئ في ذلك عتق الرقبة الكافرة والمسلمة والذكر والأنثى والصغير والكبير ولا تجزئ العمياء ولا المقطوعة اليدين أو الرجلين
ويجوز الأصم والمقطوع إحدى اليدين وإحدى الرجلين من خلاف ولا يجوز مقطوع إبهامي اليدين ولا المجنون الذي
لا يعقل ولا يجوز عتق المدبر وأم الولد والمكاتب الذي أدى بعض المال
فإن أعتق مكاتبا لم يود شيئا جاز فإن اشترى أباه أو ابنه ينوي بالشراء الكفارة جاز عنها وإن أعتق نصف عبد مشترك عن الكفارة وضمن قيمة باقية فأعتقه لم يجز عند أبي حنيفة وإن أعتق نصف عبده عن كفارته ثم أعتق باقية عنها جاز
وإن أعتق نصف عبده عن كفارته ثم جامع التي ظاهر منها ثم أعتق باقية لم يجز عند أب حنيفة وإذا لم يجد المظاهر ما يعتق فكفارته صوم شهرين متتابعين ليس فيهما شهر رمضان ولا يوم الفطر ولا يوم النحر ولا أيام التشريق
فإن جامع التي ظاهر منها في خلال الشهرين ليلا عامدا أو نهارا ناسيا استأنف الصوم عند أبي حنيفة ومحمد وإن أفطر يوما بعذر أو بغير عذر استأنف
وإن ظاهر العبد لم يجزه في الكفارة إلا الصوم
فإن أعتق المولى عنه أو أطعم لم يجزه
وإذا لم يستطع المظاهر الصيام أطعم ستين مسكينا كل مسكين نصف صاع من بر أو صاعا من تمر أو شعير أو قيمة تلك فإن غداهم وعشاهم جاز قليلا ما أكلوا أو كثيرا فإن أعطى مسكينا واحدا ستين يوما أجزأه وإن أعطاه في يوم واحد لم يجزه إلا عن يومه وإن قرب التي ظاهر منها في خلال الإطعام لم يستأنف
ومن وجب عليه كفارتا ظهار فأعتق رقبتين لا ينوي عن إحداهما بعينها جاز عنهما وكذلك إن صام أربعة كفارتا ظهار فأعتق رقبتين لا ينوي عن إحداهما بعينها جاز عنهما وكذلك إن صام أربعة أشهر أطعم مائة وعشرين مسكينا جاز وإن أعتق رقبة واحدة أو صام شهرين كان له أن يجعل ذلك عن أيتهما شاء
## باب اللعان
إذا قذف الرجل امرأته بالزنا وهما من أهل الشهادة والمرأة ممن يحد قاذفها أو نفى نسب ولدها وطالبته بموجب القذف فعليه اللعان فإن امتنع منه حبسه الحاكم حتى يلاعن أو يكذب نفسه فيحد وإن لاعن وجب عليها اللعان
فإن امتنعت حبسها الحاكم حتى تلاعن أو تصدقه
وإذا كان من أهل الشهادة وهي أمة أو كافر أو محدودة في قذف أو كانت ممن لا يحد قاذفها فلا حد عليه في قذفها ولا لعان
وصفة اللعان: أن يبتدئ القاضي بالزوج فيشهد أربع مرات يقول في كل مرة: أشهد بالله إني لمن الصادقين فيما رميتها به من الزنا
ثم يقول في الخامسة: لعنة الله عليه إن كان من الكاذبين فيما رماها به من الزنا ويشير إليها في جميع ذلك ثم تشهد المرأة أربع مرات تقول في كل مرة: أشهد بالله إنه لمن الكاذبين فيما رماني به من الزن وتقول في الخامسة: إن غضب الله عليها إن كان من الصادقين فيما رماني به من الزنا فإذا التعنا فرق القاضي بينهما وكانت الفرقة تطليقه بائنة عند أبي حنيفة ومحمد وقال أبو يوسف: تحريم مؤبد
وإن كان القذف بولد نفى القاضي نسبه وألحقه بأمه
فإن عاد الزوج فأكذب نفسه حده القاضي وحل له أن يتزوجها وكذلك إن قذف غيرها فحد أو زنت فحدت
وإذا قذف امرأته وهي صغيرة أو مجنونة فلا لعان بينهما
وقذف الأخرس لا يتعلق به اللعان
وإذا قال الزوج: ليس حملك مني فلا لعان بينهما
وإن قال: زنيت وهذا الحمل من الزنا تلاعنا ولم ينف القاضي الحمل
وإذا نفى الرجل ولد امرأته عقيب الولادة أو في الحال التي تقبل التهنئة أو تبتاع له آلة الولادة صح نفيه ولاعن به وإن نفاه بعد ذلك لاعن وثبت النسب
وقال أبو يوسف ومحمد: يصح نفيه في مدة النفاس وإذا ولدت ولدين في بطن واحد فنفى الأول واعترف بالثاني ثبت نسبهما وحد الزوج وإن اعترف بالأول ونفى الثاني ثبت نسبهما ولاعن
## باب العدة
إذا طلق الرجل امرأته طلاقا بائنا أو رجعيا أو وقعت الفرقة بينهما بغير طلاق وهي حرة ممن تحيض فعدتها ثلاثة أقراء والأقراء: الحيض وإن كانت لا تحيض من صغر أو كبر فعدتها ثلاثة أشهر وإن كانت حاملا فعدتها أن تضع حملها
وإن كانت أمة فعدتها حيضتان وإن كانت لا تحيض فعدتها شهر ونصف
وإذا مات الرجل عن امرأته الحرة فعدتها أربعة أشهر وعشر وإن كانت أمة فعدتها شهران وخمسة أيام وإن كانت حاملا فعدتها أن تضع حملها وإذا ورثت المطلقة في المرض فعدتها أبعد الأجلين
فإن أعتقت الأمة في عدتها من طلاق رجعي انتقلت عدتها إلى عدة
الحرائر وإن أعتقت وهي مبتوتة أو متوفى عنه زوجها لم تنتقل عدتها وإن كانت آيسة فاعتدت بالشهور ثم رأت الدم انتقض ما مضى من عدتها وكان عليها أن تستأنف العدة بالحيض
والمنكوحة نكاحا فاسدا والموطوءة بشبهة عدتها الحيض في الفرفة والموت
وإذا مات مولى أم الولد عنه أو أعتقها فعدتها ثلاث حيض
وإذا مات الصغير عن امرأته وبها حبل فعدتها أن تضع حملها وإن حدث الحبل بعد الموت فعدتها أربعة أشهر وعشر
وإذا طلق الرجل امرأته في حال
الحيض لم تعتد بالحيضة التي وقع فيها الطلاق
وإذا وطئت المعتدة بشبهة فعليها عدة أخرى وتداخلت العدتان فيكون ما تراه من الحيض محتسبا به منهما جميعا وإذا انقضت العدة الأولى ولم تكمل الثانية فإن عليها تمام العدة الثانية
وابتداء العدة في الطلاق عقيب الطلاق وفي الوفاة عقيب الوفاة فإن لم تعلم بالطلاق أو الوفاة حتى مضت مدة العدة فقد انقضت عدتها
والعدة في النكاح الفاسد عقيب التفريق بينهما أو عزم الواطئ على ترك وطئها
وعلى المبتوتة والمتوفى عنها زوجها - إذا كانت بالغة مسلمة - الإحداد وهو: ترك الطيب والزينة والدهن
والكحل إلا من عذر ولا تختضب بالحناء ولا تلبس ثوبا مصبوغا بعصفر ولا بزعفران
ولا إحداد على كافرة ولا صغيرة وعلى الأمة الإحداد وليس في عدة النكاح الفاسد ولا في عدة أم الولد إحداد
ولا ينبغي أن تخطب المعتدة ولا بأس بالتعريض في الخطبة
ولا يجوز للمطلقة الرجعية والمبتوتة الخروج من بيتها ليلا ولا نهارا
والمتوفى عنها زوجها تخرج نهارا وبعض الليل ولا تبيت في غير منزلها
وعلى المعتدة أن تعتد في المنزل الذي يضاف إليها بالسكنى حال وقوع الفرقة فإن كان نصيبها من دار الميت لا يكفيها وأخرجها الورثة من نصيبهم انتقلت
ولا يجوز أن يسافر الزوج بالمطلقة الرجعية
وإذا طلق الرجل امرأته طلاقا بائنا ثم تزوجها في عدتها وطلقها قبل أن يدخل بها فعليه مهر كامل وعليها عدة مستقبلة وقال محمد: لها نصف المهر وعليها إتمام العدة الأولى
ويثبت نسب ولد المطلقة الرجعية إذا جاءت به لسنتين أو أكثر ما لم تقر بانقضاء عدتها فإن جاءت به
لأقل من سنتين بانت من زوجها وإن جاءت به لأكثر من سنتين ثبت نسبه وكانت رجعة
والمبتوتة يثبت نسب ولدها إذا جاءت به لأقل من سنتين فإن جاءت به لتمام سنتين من يوم الفرقة لم يثبت نسبه
إلا أن يدعيه
ويثبت نسب ولد المتوفى عنها زوجها ما بين الوفاة وبين سنتين
وإذا اعترفت المعتدة بانقضاء عدتها ثم جاءت بولد لأقل من ستة أشهر ثبت نسبه وإن جاءت به لستة أشهر لم يثبت نسبه
وإذا ولدت المعتدة ولدا لم يثبت نسبه عند أبي حنيفة إلا أن يشهد بولادتها رجلان أول رجل وامرأتان إلا أن يكون هناك حبل ظاهر
أو اعتراف من قبل الزوج فيثبت النسب من غير شهادة وقال أبو يوسف ومحمد: يثبت في الجميع بشهادة امرأة واحدة
وإذا تزوج امرأة فجاءت بولد لأقل من ستة أشهر منذ يوم تزوجها لم يثبت نسبه وإن جاءت به لستة أشهر فصاعدا ثبت إن اعترف به الزوج أو سكت وإن جحد الولادة ثبت بشهادة امرأة واحدة تشهد بالولادة
وأكثر مدة الحمل سنتان وأقله ستة أشهر
وإذا طلق الذمي الذمية فلا عدة عليها
وإذا تزوجت الحامل من الزنا جاز النكاح ولا يطؤها حتى تضع حملها والله أعلم
# كتاب النفقات
النفقة واجبة على زوجها مسلمة كانت أو كافرة إذا سملت نفسها في منزله فعليه نفقتها وكسوتها وسكناها
يعتبر ذلك لحالهما جميعا موسرا كان الزوج أو معسرا
فإن امتنعت من تسليم نفسها حتى يعطيها مهرها فلها النفقة
وإن نشزت فالا نفقة لها حتى تعود إلى منزله
وإن كانت صغيرة لا يستمتع بها فلا نفقة لها وإن سلمت نفسها إليه
وإن كان الزوج صغيرا لا يقدر على الوطء والمرأة كبيرة فلها النفقة من ماله
وإذا طلق الرجل امرأته فلها النفقة والسكنى في عدتها رجعيا كان أو بائنا
ولا نفقة للمتوفى عنها زوجها وكل فرقة جاءت من قبل المرأة بمعصية فلا نفقة لها وإن طلقها ثم ارتدت سقطت نفقتها
وإن أمكنت ابن زوجها من نفسها إن كان بعد الطلاق فلها النفقة وإن كان قبل الطلاق فلا نفقة لها
وإذا حبست المرأة في دين أو غصبها رجل كرها فذهب بها أو حجت مع محرم فلا نفقة لها
وإن مرضت في منزل الزوج فلها النفقة
وتفرض على الزوج نفقة خادمها إذا كان موسرا ولا تفرض لأكثر من خادم واحد
وعليه أن يسكنها في دار منفردة ليس فيها أحد من أهله إلا أن تختار ذلك وإن كان له ولد من غيرها فليس له أن يسكنه معها
للزوج أن يمنع والديها وولدها من غيره وأهلها من الدخول
عليها ولا يمنعهم من النظر إليها وكلامها أي وقت اختاروا
ومن أعسر بنفقة امرأته لم يفرق بينهما ويقال لها: استديني عليه
وإذا غاب الرجل وله مال في يد رجل وهو يعرف به وبالزوجية فرض القاضي في ذلك المال نفقة زوجة الغائب وأولاده الصغار ووالديه ويأخذ منها كفيلا بها ولا يقضى بنفقة في مال الغائب إلا لهؤلاء
وإذا قضى القاضي لها بنفقة الإعسار ثم أيسر فخاصمته تمم لها نفقة الموسر
وإذا مضت مدة لم ينفق الزوج عليها وطالبته بذلك فلا شيء لها إلا أن يكون القاضي فرض لها النفقة أو صالحت الزوج على مقدارها فيقضي لها بنفقة ما مض وإذا مات الزوج بعد ما قضي عليه بالنفقة ومضت شهور سقطت النفقة
وإن أسلفها نفقة سنة ثم مات يسترجع منها شيء وقال محمد: يحتسب لها نفقة ما مضى وما بقي للزوج
وإذا تزوج العبد حرة فنفقتها دين عليه يباع فيها
وإذا تزوج الرجل أمة فبوأها مولاها معه منزلا فعليه النفقة وإن لم يبوئها فلا نفقة لها
ونفقة الأولاد الصغار على الأب لا يشاركه فيها أحد
كما لا يشاركه في نفقة الزوجة أحد
فإن كان الصغير وضيعا فليس على أمه أن ترضعه ويستأجر له الأب من ترضعه عندها فإن استأجرها وهي زوجته أو معتدته لترضع ولدها لم يجز وإن انقضت عدتها فاستأجرها على إرضاعه جاز
فإن قال الأب لا أستأجرها وجاء بغيرها
فرضيت الأم بمثل أجر الأجنبية كانت الأم أحق به وإن التمست زيادة لم يجبر الزوج عليها
ونفقة الصغير واجبة على أبيه وإن خالفه في دينه كما تجب نفقة الزوجة على الزوج وإن خالفته في دينه
٤٣ - كتاب الحضانة
وإذا وقعت الفرقة بين الزوجين فالأم أحق بالولد فإن لم تكن الأم فأم الأم أولى من أم الأب فإن لم تكن فأم الأب أولى من الأخوات فإن لم تكن جدة فلأخوات أولى من العمات والخالات وتقدم الأخت من الأب والأم ثم الأخت من الأم ثم الأخت من
الأب ثم الخالات أولى من العمات وينزلن كذلك ثم العمات ينزلن كذلك
وكل من تزوجت من هؤلاء سقط حقها إلا الجدة إذا كان زوجها الجد وإن لم تكن للصبي امرأة من أهله واختصم فيه الرجال فأولاهم به أقربهم تعصبيا
والأم والجدة أحق بالغلام حتى يأكل وحده ويلبس وحده ويستنجي وحده وبالجارية حتى تحيض ومن سوى الأم والجدة أحق بالجارية حتى تبلغ حدا تشتهى
والأمة إذا أعتقها مولاها وأم الولد إذا أعتقت في الولد كالحرة وليس للأمة وأم الولد قبل العتق حق في الولد والذمية أحق بولدها المسلم ما لم يعقل الأديان ويخاف أن يألف الكفر
وإذا أرادت المطلقة أن تخرج بولدها من المصر فليس لها ذلك إلا أن تخرجه إلى وطنها وقد كان الزوج تزوجها فيه
وعلى الرجل أن ينفق على أبويه وأجداده وجداته إذا كانوا فقراء وإن خالفوه في دينه ولا تجب النفقة مع اختلاف الدين إلا للزوجة والأبوين والأجداد والجدات والولد وولد الولد ولا يشارك الولد في نفقة أبويه أحد
والنفقة لكل ذي رحم محرم إذا كان صغيرا فقيرا أو كانت امرأة بالغة فقيرة أو كان ذكرا زمنا أو أعمى فقيرا
ويجب ذلك على مقدار الميراث
وتجب نفقة الابنة البالغة والابن الزمن على أبويه أثلاثا: على الأب الثلثان وعلى الأم الثلث
ولا تجب نفقتهم مع اختلاف الدين ولا تجب على الفقير
وإذا كان للابن الغائب مال فضي عليه بنفقة أبويه وإن باع
أبوه متاعه في نفقته جاز عند أبي حنيفة وإن باع العقار لم يجز
وإن كان للابن الغائب مال في يد أبويه فانفقا منه لم يضمنا
وإن كان له مال في يد أجنبي فأنفق عليهما بغير إذن القاضي ضمن
وإذا قضى القاضي للولد والوالدين وذوي الأرحام بالنفقة فمضت مدة سقطت إلا أن يأذن القاضي في الاستدانة عليه
وعلى المولى أن ينفق على عبده وأمته فإن امتنع وكن لهما كسب اكتسبا وأنفقها على أنفسهما
وإن لم يكن لهما كسب أجبر المولى على بيعهما
# كتاب العتاق
العتق يقع من الحر البالغ في مكه فإذا قال لعبده أو أمتهأنت حر أو محرر أو قد حررتك أو أعتقتك فقد عتق نوى المولى العتق أو لم ينو وكذلك إذا قال: رأسك حر أو وجهك أو رقبتك أو بدن: أو قال لأمته: فرجك حر ولو قال: لا ملك لي عليك ونوي به الحرية عتق وإن لم ينو لم يعتق وكذلك كنايات العتق وإن قال: لا سلطان لي عليك ونوى به العتق لم يعتق وإن قال: هذا ابني وثبت على ذلك أو قال: هذا مولاي أو يا مولاي عتق وإن قال يا ابني أو يا أخي لم يعتق وإن قال لغلام لا يولد مثله لمثله هذا ابني عتق عليه عند أبي حنيفة رحمه الله وعندها لا يعتق وإن قال لأمته أنت طالق ونوى به الحرية وإن قال لعبده أنت مثل الحر لم يعتق وإن قال ما أنت إلا حر عتق عليه وإذا ملك الرجل ذا رحم محرم منه عتق عليه وإذا أعتق المولى بعض عبده عتق عليه ذلك البعض ويسعى في بقية قيمته لمولاه عند أبي حنيفة رحمه الله وقالا يعتق كله وإذا كان العبد بين شريكين فأعتق أحدهما نصيبه
عتق فإن كان المعتق موسرا فشريكه بالخيار إن شاء أعتقه وإن شاء ضمن شريكه قيمة نصيبه وإن شاء استسعى العبد وإن كان المعتق معسرا فالشريك بالخيار إن شاء أعتق نصيبه وإن شاء استسعى العبد وهذا عند أبي حنيفة رحمه الله وقال أبو يوسف ومحمد: ليس له إلا الضمان مع اليسار والسعاية مع الإعسار وإذا اشترى رجلان ابن أحدهما عتق نصيب الأب ولا ضمان عليه وكذلك إذا ورثاه فالشريك بالخيار إن شاء أعتق نصيبه وإن شاء استسعى وإذا شهد كل واحد من الشريكين على الآخر بالحرية عتق كله وسعى العبد لكل واحد منهما في نصيبه موسرين كانا أو معسرين عند أبي حنيفة وقال أبو يوسف ومحمد: إن كانا موسرين فلا سعاية عليه
وإن كانا معسرين سعى لهما وإن كان أحدهما موسرا والآخر معسرا سعى للموسر ولم يسع للمعسر ومن أعتق عبده لوجه الله تعالى أو للشيطان أو للصنم عتق
وعتق المكره والسكران واقع وإذا أضاف العتق إلى ملك أو شرط صح كما يصح في الطلاق وإذا خرج عبد من دار الحرب إلينا مسلما عتق وإذا أعتق جارية حاملا عتق حملها وإن أعتق الحمل خاصة عتق ولم تعتق الأم
وإذا أعتق عبده على مال فقبل العبد عتق ولزمه المال ولو قال: إن أديت إلي ألفا فأنت حر صح وصار مأذونا فإن أحضر المال أجبر الحاكم المولى على قبضه وعتق العبد
وولد الأمة من مولاها حر وولدها من زوجها مملوك لسيدها وولد الحرة من العبد حر
## باب التدبير
إذا قال المولى لمملوكه: إذا مت فأنت حر أو أنت حر عن دبر مني أو أمن مدبر أو قد دبرتك فقد صار مدبرا لا يجوز بيعه ولا هبته وللمولى أن يستخدمه ويؤاجره وإن كانت أمة وطئها وله أن يزوجه فإذا مات المولى عتق المدبر من ثلث ماله إن خرج من الثلث وإن لم يكن له مال غيره سعى في ثلثي قيمته وإن كان على المولى دين سعى في جميع قيمته لغرمائه وولد المدبرة مدبر فإن علق التدبير بموته على صفة - مثل أن يقول: إن مت من مرضي هذا أو سفري هذا أو من مرض كذا - فليس بمدبر ويجوز بيعه فإن مات المولى على الصفة التي ذكرها عتق كما يعتق المدبر
## باب الاستيلاد
إذا ولدت الأمة من مولاها فقد صارت أم ولد له لا يجوز بيعها ولا تمليكها وله وطؤها واستخدامها وإجارتها وتزويجها ولا يثبت نسب ولدها إلا أن يعترف به المولى فإن جاءت بعد ذلك بولد ثبت نسبه بغير إقرار وإن نفاه انتفى بقوله وإن زوجها فجاءت بولد فهو حكم أمه وإذا مات المولى عتقت من جميع المال ولا تلزمها السعاية للغرماء إن كان على المولى دين
وإذا وطئ أمة غيره بنكاح فولدت منه ثم ملحها صارت أم ولد له وإذا وطئ الأب جارية ابنه فجاءت بولد فادعاه ثبت نسبه وصارت أم ولد له وعليه قيمتها وليس عليه عقرها ولا قيمة ولدها وإن وطئ أب مع بقاء الأب لم يثبت النسب فإن كان الأب ميتا يثبت النسب من الجد كما يثبت من الأب وإذا كانت الجارية بين شريكين فجاءت بولد فادعاه أحدهما ثبت نسبه منه وصارت أم ولد له
وعليه نصف عقرها ونصف قيمتها وليس عليه شيء من قيمة ولدها وإذا ادعياه معا ثبت نسبه منهما وكانت الأم أم ولد لهما وعلى كل واحد منهما نصف العقر قصاصا بما له على الآخر ويرث الابن من كل واحد منهما ميراث ابن كامل وهما يرثان منه ميراث أب واحد وإذا وطئ المولى جارية مكاتبه فجاءت بولد فادعاه: فإن صدقه المكاتب ثبت نسب الولد منه وكان عليه عقرها وقيمة ولدها ولا تصير أم ولد له وإن كذبه في النسب لم يثبت
# كتاب المكاتب
وإذا كاتب المولى عبده أو أمته على مال شرطه عليه وقبل العبد ذلك صار مكاتبا ويجوز أن يشترط المال حالا ومؤجلا ومنجما وتجوز كتابة العبد الصغير إذا كان يعقل البيع والشراء
وإذا صحت الكتابة خرج المكاتب من يد المولى ولم يخرج من ملكه فيجوز له البيع والشراء والسفر ولا يجوز له التزويج إلا بإذن المولى ولا يهب ولا يصدق إلا بشيء اليسير ولا يتكفل
فإنه ولد له ولد من أمة له دخل في كتابته وكان حكمه كحكمه وكسبه له وإن زوج المولى عبده من أمته ثم كاتبهما فولدت منه ولدا دخل في كتابتها وكان كسبه لها
وإن وطئ المولى مكاتبته لزمه العقر وإن جنى عليها أو على ولدها لزمته الجناية وإن أتلف مالا لها غرمه
وإذا اشترى المكاتب أباه أو أبنه دخل في كتابته وإن اشترى أم ولده دخل ولدها في الكتابة ولم يجز بيعها وإن اشترى ذا رحم محرم منه لا ولاد له لم يدخل في كتابته عند أبي حنيفة
وإذا عجز المكاتب عن نجم نظر الحاكم في حاله فإن كان له دين يقتضيه أو مال يقدم إليه ولم يعجل بتعجيزه وانتظر عليه اليومين
والثلاثة وإن لم يكن له وجه وطلب المولى تعجيزه عجزه الحاكم وفسخ الكتابة عند أبي حنيفة رحمه الله وقالا
رحمهما الله: حتى يتوالى عليه نجمان وإذا عجز المكاتب عاد إلى أحكام الرق وكان ما في يده من الأكساب لمولاه
وإن مات المكاتب وله مال لم تنفسخ الكتابة وقضيت كتابته من أكسابه وحكم بعتقه في آخر جزء من أجزاء حياته وإن لم يترك وفاء وترك ولدا مولودا في الكتابة سعى في كتابة أبيه على نجومه وإذا أدى حكمنا بعتق أبيه قبل موته وعتق الولد وإن ترك ولدا مشترى في الكتابة قيل له: إما أن تؤدي الكتابة حالا وإلا رددت في الرق
وإذا كاتب المسلم عبده على خمر أو خنزير أو على قيمة نفسه فالكتابة فاسدة
فإن أدى الخمر عتق ولزمه أن يسعى في قيمته ولا ينقص من المسمى ويزاد عليه
وإن كاتبه على حيوان غير موصوف فالكتابة جائزة وإذا كاتب عبديه كتابة واحدة ضامن عن الآخر جازت الكتابة وأيهما أدى عتقا ويرجع على شريكه بنصف ما أدى
وإذا أعتق المولى مكاتبه عتق بعتقه وسقط عنه مال الكتابة
وإذا مات مولى المكاتب لم تنفسخ الكتابة وقيل له: أد المال إلى ورثة المولى على نجومه فإن أعتقه أحد الورثة لم ينفذ عتقه وإن أعتقوه جميعا عتق وسقط عنه مال الكتابة
وإذا كاتب المولى أم ولده جاز وإن مات المولى سقط عنها مال الكتابة وإن
ولدت مكاتبته منه فهي بالخيار: إن شاءت مضت على الكتابة وإن شاءت عجزت نفسها وصارت أم ولد له
وإذا كاتب مدبرته جاز فإن مات المولى ولا مال له كانت بالخيار بين أن تسعى في ثلثي قيمتها أو جميع مال الكتابة وإن دبر مكاتبته صح التدبير ولها الخيار: إن شاءت مضت على الكتابة وإن شاءت عجزت نفسها وصارت مدبرة وإن مضت على كتابتها فمات المولى ولا مال له فهي بالخيار: إن شاءت سعت في ثلثي مال الكتابة أو ثلثي قيمتها عند أبي حنيفة
وإذا أعتق المكاتب عبده على مال لم يجز
وإن وهب على عوض لم يصح وإن كاتب عبده جاز فإن أدى الثاني قبل أن يعتق الأول فولاؤه للمولى وإن أدى بعد عتق المكاتب الأول فولاؤه له
# كتاب الولاء
إذا أعتق الرجل مملوكه فولاؤه له وكذلك المرأة تعتق فإن شرط أنه سائبه فالشرط باطل والولاء لمن أعتق
وإذا أدى المكاتب عتق وولاؤه للمولى
وكذلك إن عتق بعد موت المولى فولاؤه لورثة المولى فإن مات المولى عتق مدبره وأمهات أولاده وولاؤهم له ومن ملك ذا رحم محرم منه عتق عليه وولاؤه له
وإذا تزوج عبد رجل أمة لآخر فأعتق مولى الأمة الأمة وهي حامل من العبد عتقت وعتق حملها وولاء الحمل لمولى الأم لا ينتقل عنه أبدا فإن ولدت بعد عتقها لأكثر من ستة أشهر ولدا فولاؤه لمولى الأم فإن أعتق العبد جر ولاء ابنه وانتقل عن مولى الأم إلى مولى الأب
ومن تزوج من العجم بمعتقه من العرب فولدت له أولاد فولاء أولادها لمواليها عند أبي حنيفة
وولاء العتاقة تعصيب فإن كان للمعتق عصبة من النسب فهو أولى منه وإن لم يكن له عصبة من النسب فميراثه للمعتق
فإن مات
المولى ثم مات المعتق فميراثه لبني المولى دون بناته وليس للنساء من الولاء إلا ما أعتقن أو أعتق من أعتقن أو كاتبن أو كاتب من كاتبن إذا ترك المولى ابنا أولاد ابن آخر فميراث المعتق للابن دون بني البن والولاء للكبر
وإذا أسلم رجل على يد رجل ووالاه على أن يرثه ويعقل عنه أو أسلم على يد غيره ووالاه فالولاء صحيح وعقله على مولاه فإن مات ولا وارث له فميراثه للمولى وإن كان له وارث فهو أولى منه وللمولى أن ينتقل عنه بولائه إلى غيره ما لم يعقل عنه فإذا عقل عنه لم يكن له أن يتحول بولائه إلى غيره وليس لمولى العتاقة أن يوالي أحد
# كتاب الجنايات
القتل على خمسة أوجه: عمد وشبه عمد وخطإ وما أجزي مجرى الخطإ والقتل بسبب
فالعمد: ما تعمد ضربه بسلاح أو ما أجزي مجرى السلاح في تفريق الأجزاء كالمحدد من الخشب والحجر والنار وموجب ذلك
المأثم والقرد إلا أن يعفو الأولياء ولا كفار فيه
وشبه العمد عند أبي حنيفة: أن يتعمد الضرب بما ليس بسلاح ولا ما أجري مجرى السلاح وقال أبو يوسف ومحمد: إذا ضربه بحجر عظيم أو خشبة عظيمة فهو عمد وشبه العمد: أن يتعمد ضربه بما لا يقتل غالبا وموجب ذلك على القولين والمأثم والكفارة ولا قود وفيه دية مغلظة على العاقلة
والخطأ على وجهين: خطأ في القصد وهو: أن يرمي شخصا يظنه صيدا فإذا هو آدمي وخطأ في الفعل وهو: أن يرمي غرضا فيصيب آدميا وموجب ذلك: الكفارة والدية على العاقلة ولا مأثم فيه
وما أجري مجرى الخطإ: مثل النائم ينقلب على رجل فيقتله فحكمه حكم الخطإ
وأما القتل بسبب: كحافر البئر وواضع الحجر في غير ملكه وموجبه إذا تلف فيه آدمي: الدية على العاقلة ولا كفارة فيه
والقصاص واجب بقتل كل محقون الدم على التأبيد إذا قتل عمدا
ويقتل الحر بالحر والحر بالعبد والمسلم بالذمي ولا يقتل والمسلم بالمستأمن ويقتل الرجل بالمرأة والكبير بالصغير والصحيح بالأعمى والزمن ولا يقتل الرجل بابنه ولا بعبده ولا مدبره ولا مكاتبه ولا بعبد ولده ومن ورث قصاصا على أبيه سقط ولا يستوفى
القصاص إلا بالسيف
وإذا قتل المكاتب عمدا وليس له وارث إلا المولى وترك وفاء فله القصاص فإن ترك وفاء ووارثه غير المولى فلا قصاص لهم وإن اجتمعوا مع المولى
وإذا قتل عبد الرهن لم يجب القصاص حتى يجتمع الراهن والمرتهن
ومن جرح رجلا عمدا فلم يزل صاحب فراش حتى مات فعليه القصاص ومن قطع يد غيره عمدا من المفصل قطعت يده وكذلك الرجل ومارن الأنف والأذن
ومن ضرب عين رجل فقلعها فلا قصاص عليه وإن كانت قائمة فذهب ضوؤها فعليه القصاص تحمى له المرآة ويجعل على وجهه قطن رطب وتقابل عينه بالمرآة حتى يذهب ضوءها
وفي السن القصاص وفي كل شجة يمكن فيها المماثلة القصاص ولا قصاص في عظم إلا في السن وليس فيما دون النفس شبه عمد إنما هو عمد أو خطأ
ولا قصاص بين الرجل والمرأة فيما دون النفس ولا بين الحر والعبد ولا بين العبدين
ويجب القصاص في الأطراف بين المسلم والكافر ومن قطع يد رجل من نصف الساعد أو جرحه جائفة فبرأ منها فلا قصاص عليه
وإذا كانت يد المقطوع ويد القاطع شلاء أو ناقصه الأصابع فالمقطوع بالخيار: إن شاء قطع اليد المعيبة ولا شيء له غيرها وإن شاء آخذ الأرض كاملا
ومن شج رجلا فاستوعب الشجة ما بين قرنية وهي لا تستوعب ما بين قرني الشاج فالمشجوج بالخيار: إن شاء اقتض بمقدار شجته يبتدئ من أي الجانبين شاء وإن شاء أخذ الأرش
ولا قصاص في اللسان ولا في الذكر إلا أن تقطع الحشفة
وإذا اصطلح القاتل وأولياء المقتول على مال سقط القصاص ووجب المال قليلا كان أو كثيرا فإن عفا أحد الشركاء أو صالح من نصيبه على عوض سقط حق الباقين من القصاص وكان لهم نصيبهم من الدية وإذا قتل جماعة واحدا عمدا اقتض من جميعهم
وإذا قتل واحد جماعة فحضر أولياء المقتولين قتل بجماعتهم ولا شيء لهم غير ذلك فإن حضر واحد قتل له وسقط حق الباقين ومن وجب عليه القصاص فمات
سقط عنه القصاص وإذا قطع رجلان يد رجل فلا قصاص على واحد منهما وعليهما نصف الدية وإن قطع واحد يميني رجلين فحضرا فلهما أن يقطعا يده ويأخذا منه نصف الدية ويقتسمانه نصفين وإن حضر واحد منهما فقطع يده فللآخر عليه نصف الدية
وإذا أقر العبد بقتل العمد لزمه القود
ومن رمى رجلا عمدا فنفذ السهم منه إلى آخر فماتا فعليه القصاص للأول والدية الثاني على عاقلته
# كتاب الديات
إذا قتل رجل رجلا عمد فعلى عاقلته دية مغلظة وعليه كفارة ودية شبه العمد عند أبي حنيفة وأبي يوسف مائة من الإبل أرباعا: خمس وعشرون بنت مخاض وخمس وعشرون بنت لبون وخمس وعشرون حقة وخمس وعشرون جذعة ولا يثبت
التغليظ إلا في الإبل خاصة فإن قضي بالدية من غير الإبل لم تتغلظ
وقتل الخطإ جب به الدية على العاقلة والكفارة على القاتل
والدية في الخطأ مائة من الإبل أخماسا: عشرون بنت مخاض وعشرون ابن مخاض وعشرون بنت لبون وعشرون حقة ولا تثبت الدية إلا من هذه الأنواع الثلاثة عند أبي حنيفة وقال أبو يوسف ومحمد: من البقر مائتا بقرة ومن الغنم ألفا شاة ومن الحلل مائتا حلة كل حلة ثوبان ودية المسلم والذمي سواء
وفي النفس الدية وفي المارن الدية وفي اللسان الدية وفي الذكر الدية وفي العقل إذا ضرب رأسه فذهب عقله الدية وفي اللحية إذا حلقت فلم تنبت الدية وفي شعر الرأس الدية وفي الحاجبين الدية وفي العينين الدية وفي اليدين الدية وفي الرجلين الدية وفي الأذنين الدية وفي الشفتين الدية وفي الأنثيين الدية وفي ثديي
المرأة الدية
وفي كل واحد من هذه الأشياء نصف الدية وفي أشفار العينين الدية وفي أحدهما ربع الدية وفي كل إصبع من أصابع اليدين والرجلين عشر الدية والأصابع كلها سواء وكل إصبع فيها ثلاثة مفاصل ففي أحدهما ثلث دية الإصبع وما فيها مفصلان ففي أحدهما نصف دية الإصبع وفي كل سن خمس من الإبل والأسنان والأضراس كلها سواء
ومن ضرب عضوا فأذهب منفعة ففيه دية كاملة
كما لو قطعه كاليد إذا شلت والعين إذا ذهب ضوءها
والشجاج عشرة: الحارصة والدامعة والدامية والباضعة والمتلاحمة والسمحاق والموضحه والهاشمة والمنقلة والأمة
ففي الموضحه القصاص إن كانت عمدا ولا قصاص في بقية الشجاج وما دون الموضحة ففيه حكومة عدل
وفي الموضحة إن كانت خطأ نصف عشر الدية وفي الهاشمية عشر الدية وفي المنقلة عشر ونصف عشر الدية وفي الأمة ثلث الدية وفي الجائفة ثلث الدية
فإن نفذت فهي جائفتان ففيها ثلثا الدية وفي أصابع اليد نصف الدية
وإن قطعها مع الكف ففيها الدية وإن قطعها مع نصف الساعد ففي الكف نصف الدية وفي الزيادة حكومة عدل وفي الإصبع الزائدة حكومة عدل
وفي عين الصبي وذكره ولسانه إذا لم تعلم صحته حكومة عدل ومن شج رجلا موضحة فذهب عقله أو شعر رأسه دخل أرش الموضحة في الدية
وإن ذهب سمعة أو بصره أو كلامه فعليه أرش الموضحة مع الدية ومن قطع إصبع رجل فشلت أخرى إلى جنبها ففيهما الأرش ولا قصاص فيه عند أبي حنيفة
ومن قلع سن رجل فنبتت أخرى سقط الأرش ومن شج رجلا
فالتحمت الجراحة ولم يبق لها أثر ونبت الشعر سقط الأرش عند أبي حنيفة وقال أبو يوسف: عليه أرش الألم وقال محمد: عليه أجرة الطبيب ومن جرح رجلا جراحة لم يقتض منه حتى يبرأ
ومن قطع يد رجل خطأ ثم قتله قبل البرء فعليه الدية وسقط
أرش اليد
وكل عمد سقط فيه القصاص بشبهة فالدية في مال القاتل وكل أرش وجب بالصلح فهو في مال القاتل
وإذا قتل الأب ابنه عمدا فالدية في ماله في ثلاث سنين وكل جناية اعترف بها الجاني فهي في ماله ولا يصدق على عاقلته
وعمد الصبي والمجنون خطأ وفيه الدية على العاقلة
ومن حفر بئرا في طريق المسلمين أو وضع حجرا فتلف بذلك إنسان فديته على عاقلته وإن تلف فيه بهيمة فضمانها في ماله وإن أشرع في الطريق ورشنا أو ميزابا فسقط على إنسان فعطب فالدية على عاقلته ولا كفارة على حافر البئر وواضع الحجر
ومن حفر بئرا في ملكه فعطب به إنسان لم يضمن والراكب ضامن لما وطئت الدابة وما أصابت بيدها أو كدمت ولا يضمن ما نفخت برجلها أو ذنبها
فإن راثت أو بالت في الطريق فعطب به إنسان لم يضمن والسائق ضامن لما أصابت بيدها أو رجلها والقائد ضامن لما أصابت بيدها دون رجلها
ومن قاد قطارا فهو ضامن لما وطئ فإن كان معه سائق
فالضمان عليهما وإذا جنى البعد جناية خطإ قيل لمولاه: إما أن تدفعه بها أو تفديه
فإن دفعه ملكه ولي الجناية وإن فداه بأرشها فإن عاد فجنى كان حكم الجناية الثانية حكم الألى فإن جنى قيل للمولى: إما أن تدفعه إلى ولي الجنايتين يقتسمان على قدر حقيهما وإما أن تفديه بأرش كل واحدة منهما وإن أعتقه المولى وهو لا يعلم بالجناية ضمن الأقل من قيمته ومن أرشها وإن باعه المولى أو أعتقه بعد العلم بالجناية وجب عليه الأرش
وإذا جنى المدبر أو أم الولد جناية خطأ ضمن المولى الأقل من قيمته ومن أرشها فإن جنى أخرى وقد دفع المولى القيمة إلى ولي الأولى بقضاء فلا شيء عليه ويتبع ولي الجناية الثانية ولي الجناية الأولى فيشاركه فيما أخذ وإن كان المولى دفع القيمة بغير قضاء فالولي بالخيار: إن شاء اتبع المولى وإن شاء اتبع ولي الجناية الأولى
وإذا مال الحائط إلى طريق المسلمين فطولب صاحبه بنقضه وأشهد عليه فلم ينقض في مدة يقدر على نقضه حتى سقط ضمن ما تلف به من نفس أو مال
ويستوي أن يطالبه بنقضه مسلم أو ذمي وإن مال إلى دار رجل فالمطالبة إلى مالك الدار خاصة وإذا اصطدم فارسان فماتا فعلى عاقلة كل واحد منهما دية الآخر
وإذا قتل رجل عبدا خطأ فعليه قيمته لا يزاد على عشرة آلاف درهم فإن كانت قيمته عشرة آلاف أو أكثر قضي عليه بعشرة آلاف إلا عشرة
وفي الأمة إذا زادت قيمتها على الدية خمسة آلاف إلا عشرة
وفي يد العبد نصف القيمة لا يزاد على خمسة آلاف إلا خمسة وكل ما يقدر من دية الحر فهو مقدر من قيمة العبد
وإذا ضرب بطن امرأة فألقت جنينا ميتا فعليه غرة
والغرة نصف عشر الدية فإن ألقته حيا ثم مات فعليه دية كاملة وإن ألقته ميتا ثم ماتت الأم فعليه دية وغرة وإن ماتت الأم ثم ألقته ميتا فعليه دية في الأم ولا شيء في الجنين
وما يجب في الجنين موروث عنه وفي جنين الأمة إذا كان ذكرا نصف عشر قيمته لو كان حيا وعشر قيمته إن كان أنثى ولا كفارة في الجنين
والكفارة في شبه العمد والخطإ: عتق رقبة مؤمنة فإن لم يجد فصيام شهرين متتابعين ولا يجزئ فيها الإطعام
## باب القسامة
وإذا وجد القتيل في محلة ولا يعلم من قتله استحلف خمسون رجلا منهم
يتخيرهم الولي: بالله ما قتلناه ولا علمنا له قاتلا فإذا حلفوا قضي على أهل المحلة بالدية ولا يستحلف الولي ولا يقضي له بالجناية وإن لم يكمل أهل المحلة كررت الأيمان عليهم حتى يتم خمسون
ولا يدخل في القسامة صبي ولا مجنون
ولا امرأة ولا عبد وإن وجد ميت لا أثر به فلا قسامة ولا دية وكذلك إن كان الدم يسيل من أنفه أو من دبره أو من فمه فإن كان يخرج من عينيه أو من أذنه فهو قتيل
وإذا وجد القتيل على دابة يسوقها رجل فالدية على عاقلته دون أهل المحلة وإن وجد القتيل في دار إنسان فالقسامة عليه والدية على عاقلته
ولا يدخل السكان في القسامة مع الملاك عند أبي حنيفة وهي على أهل الخطة
دون المشترين ولو بقي منهم واحد وإن وجد القتيل في سفينة فالقسامة على من فيها من الركاب والملاحين وإن وجد القتيل في مسجد محلة فالقسامة على أهلها وإن وجد في الجامع أو الشارع الأعظم فلا قسامة فيه والدية على بيت المال وإن وجد في برية ليس بقربها عمارة فهو هدر وإن وجد بين قريتين كان على أقربهما وإن وجد في وسط الفرات بمر به الماء فهو هدر
فإن كان محتسبا بالشاطئ فهو على أقرب القرى من ذلك
المكان
وإن ادعى الولي على واحد من أهل المحلة بعينه لم تسقط القسامة عنهم وإن ادعى على واحد من غيرهم سقطت عنهم القسامة
وإذا قال المستحلف: قتله فلان استحلف بالله ما قتلت ولا عرفت له قاتلا غير فلان
وإذا شهد اثنان من أهل المحلة على رجل من غيرهم أنه قتله لم تقبل شهادتهما
## باب المعاقل
الدية في شبه العمد والخطإ وكل دية وجبت بنفس القتل على العاقلة
والعاقلة: أهل الديوان
إن كان القاتل من أهل الديوان يؤخذ من عطاياهم في ثلاث سنين فإن خرجت العطايا في أكثر من ثلاث سنين أو أقل أخذت منها ومن لم يكن من أهل الديوان فعاقلته قبيلته تقسط عليهم في ثلاث سنين لا يزاد الواحد على أربعة دراهم في كل سنة وينقض منها فإن لم تتسع القبيلة لذلك ضم إليهم أقرب القبائل من غيرهم
ويدخل القاتل مع العاقلة فيكون فيما يؤدي مثل أحدهم
وعاقلة المعتق قبيلة مولاه ومولى الموالاة يعقل عنه مولاه وقبيلته ولا تتحمل العاقلة أقل من نصف عشر الدية وتتحمل نصف العشر فصاعدا وما ينقص من ذلك فهو في مال الجاني
ولا تعتقل العاقلة جناية العبد ولا تعقل الجناية التي اعترف بها الجاني إلا أن يصدقوه ولا تعقل ما لزم بالصلح
وإذا جنى الحر على العبد جناية خطأ كانت على عاقلته
# كتاب الحدود
الزنا يثبت بالبينة والإقرارز
فالبينة: أن تشهد أربعة من الشهود على رجل أو امرأة بالزنا فيسألهم الإمام عن الزنا
ما هو؟ وكيف هو؟ وأين زنى؟ وبمن زنى؟ ومتى زنى؟ فإذا بينوا ذلك وقالوا: رأيناه وطئها في فرجها كالميل في المكحلة وسأل القاضي عنهم فعدلوا في السر والعلانية حكم بشهادتهم
والإقرار: أن يقر البالغ العاقل على نفسه بالزنا أربع مرات في أربعة مجالس من مجالس المقر كلما أقر رده القاضي فإذا تم إقراره أربع مرات سأله الإمام عن الزنا: ما هو؟ وكيف هو؟ وأين زنى؟ وبمن زنى؟ فإذا بين ذلك لزمه الحد
فإن كان الزاني محصنا رجمه بالحجارة حتى يموت يخرجه إلى أرض فضاء يبتدئ الشهود برجمه ثم الإمام ثم الناس فإن امتنع الشهود من الابتداء سقط الحد
وإن كان مقرا ابتدأ الإمام ثم الناس ويغسل ويكفن ويصلي عليه
وإن لم يكن محصنا وكان حرا فحده مائة جلدة يأمر الإمام بضربه بسوط لا ثمرة له ضربا متوسطا تنزع عنه ثيابه ويفرق الضرب على أعضائه إلا رأسه ووجهه وفرجه وإن كان عبدا جلده
خمسين وكذلك الأمة
فإن رجع المقر عن إقراره قبل إقامة الحد عليه أو في وسطه قبل رجوعه وخلي سبيله
ويستحب للإمام أن يلقن المقر الرجوع ويقول له: لعلك لمست أو قبلت
والرجل والمرأة في ذلك سواء غير أن المرأة لا تنزع عنها ثيابها إلا الفرو والحشو وإن حفر لها في الرجم جاز
ولا يقيم المولى الحد على عبده إلا بإذن الإمام
وإذا رجع أحد الشهود بعد الحكم وقبل الرجم ضربوا الحد وسقط الرجم فإن رجع بعد الرجم حد الراجع وحده
وضمن ربع الدية وإن نقص عدد الشهود عن أربعة حدوا
وشرط إحصان الرجم: أن يكون حرا بالغا عاقلا مسلما قد تزوج امرأة نكاحا صحيحا ودخل بها وهما على صفة الإحصان
ولا يجمع في المحصن بين الجلد والرجم ولا يجمع في البكر بين الجلد والنفي إلا أن يرى الإمام ذلك مصلحة فيغربه على قدر ما يراهوإذا زنى المريض وحده الرجم رجم وإن كان حده الجلد لم يجلد حتى يبرأ
وإذا زنت الحامل لم تحد حتى تضع حملها فإن كان حدها الجلد فحتى تتعالى من نفسها وإذا كان حدها الرجم رجمت
وإذا شهد الشهود بحد متقادم لم يقطعهم عن إقامته بعدهم عن الإمام لم تقبل
شهادتهم إلا في حد القذف خاصة
ومن وطئ أجنبية فيما دون الفرج عزز
ولا حد على من وطئ جارية ولده وولد ولده وإن قال: علمت أنها علي حرام: وإذا وطئ جارية أبيه أو أمه أو زوجته أو وطئ العبد جارية مولاه وقال: علمت أنها علي حرام حد وإن قال: ظننت أنها حلال حد
ومن زفت إليه غير امرأته وقالت النساء: إنها زوجتك فوطئها فلا حد عليه
وعليه المهر
ومن وجد امرأة على فراشه فوطئها فعليه الحد ومن تزوج امرأة لا يحل له نكاحها فوطئها لم يجب عليه الحد ومن أتى امرأة في الموضع المكروه أو عمل عمل قوم لوط فلا حد عليه عند أبي حنيفة ويعزر وقال أبو يوسف ومحمد: هو كالزنا ومن وطئ بهيمة فلا حد عليه
