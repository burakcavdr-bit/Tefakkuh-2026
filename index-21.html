وينقض التيمم كل شيء ينقض الوضوء وينقضه أيضا رؤية الماء إذا قدر على
استعماله ولا يجوز التيمم إلا بصعيد طاهر
ويستحب لمن لا يجد الماء وهو يرجو أن يجده في آخر الوقت أن يؤخر الصلاة إلى آخر الوقت فإن وجد الماء توضأ به وصلى وإلا تيمم
ويصلي بتيممه ما شاء من الفرائض والنوافل
ويجوز التيمم للصحيح في المصر إذا حضرت جنازة والولي غيره فخاف إن اشتغل بالطهارة أن تفوته الصلاة فإنه يتيمم ويصلي وكذلك من حضر العيد فخاف إن اشتغل بالطهارة أن تفوته صلاة العيدين فإنه يتيمم ويصلي وإن خاف من شهد الجمعة إن اشتغل بالطهارة أن تفوته صلاة الجمعة لم يتيمم ولكنه يتوضأ فإن أدرك الجمعة صلاها وإلا صلى الظهر أربعا وكذلك إذا ضاق الوقت فخشي إن توضأ قات الوقت لم يتيمم ولكنه يتوضأ ويصلي فائتة
والمسافر إذا نسي الماء في رحله فتيمم وصلى ثم ذكر الماء في الوقت لم يعد الصلاة عند أبي حنيفة ومحمد رحمهما الله
وقال أبو يوسف: يعيدها
وليس على المتيمم إذا لم يغلب على ظنه أن بقربه ماء أن يطلب الماء فإن غلب على ظنه أن هناك ماء لم يجز له أن يتيمم حتى يطلبه وإن كان مع رفيقه ماء طلبه منه قبل أن يتيمم فإن منعه منه تيمم وصلى
## باب المسح على الخفين
المسح على الخفين جائز بالسنة من كل حدث موجب للوضوء إذا لبس الخفين على طهارة كاملة ثم أحدث
فإن كان مقيما مسح يوما وليلة وإن كان مسافرا مسح ثلاثة أيام ولياليها وابتداؤها عقيب الحدث
والمسح على الخفين على ظاهرهما خطوطا بالأصابع يبدأ من رؤوس أصابع الرجل إلى الساق
وفرض ذلك مقدار ثلاث أصابع من أصغر أصابع اليد
ولا يجوز المسح على خف فيه خرق كبير يبين منه مقدار ثلاث أصابع من أصابع الرجل وإن كان أقل من ذلك جاز
ولا يجوز المسح على الخفين لمن وجب عليه الغسل
ونقض المسح ما ينقض الوضوء وينقضه أيضا نزع الخف ومضي المدة فإذا مضت المدة نزع خفيه وغسل رجليه وصلى وليس عيه إعادة بقيه الوضوء
ومن ابتدأ المسح وهو مقيم فسافر قبل تمام يوم وليلة مسح ثلاثة أيام ولياليها ومن ابتدأ المسح وهو مسافر ثم أقام فإن كان مسح يوما وليلة أو أكثر لزمه نزع خفيه وغسل رجليه وإن كان مسح أقل من يوم وليلة تمم مسح يوم وليلة
ومن لبس الجرموق فوق الخف مسح عليه
ولا يجوز المسح على الجوربين عند أبي حنيفة رحمه الله
إلا أن يكونا منعلين أو مجلدين وقال أبو يوسف ومحمد رحمهما الله: يجوز المسح على الجوربين إذا كانا ثخينين لا يشفان الماء
ولا يجوز المسح على العمامة والقلنسوة والبرقع والقفازين
ويجوز المسح على الجبائر وإن شدها على غير وضوء فإن سقطت عن غير برء لم يبطل المسح وإن سقطت عن برء بطل المسح
## باب الحيض
أقل الحيض ثلاثة أيام ولياليها
وما نقض عن ذلك فليس بحيض وهو استحاضة
وأكثر الحيض عشرة أيام ولياليها وما زاد على ذلك فهو استحاضة
وما تراه المرأة من الحمرة والصفرة والكدرة في أيام الحيض فهو حيض حتى ترى البياض الخالص
والحيض يسقط عن الحائض الصلاة ويحرم عليها الصوم وتقضي الصوم ولا تضي الصلاة ولا تدخل المسجد ولا تطوف بالبيت ولا يأتيها زوجها
ولا يجوز لحائض ولا جنب قراءة القرآن
ولا يجوز لمحدث مس المصحف إلا أن يأخذه بغلافه
وإذا انقطع دم الحيض لأقل من عشرة أيام لم يجز وطؤها حتى تغتسل أو يمضي عليها وقت صلاة كامل فإن انقطع دمها لعشرة أيام جاز وطؤها قبل الغسل
والطهر إذا تخلل بين الدمين في مدة الحيض فهو كالدم الجاري
وأقل الطهر خمسة عشر يوما ولا غاية لأكثره
ودم الإستحاضة هو ما تراه المرأة أقل من ثلاثة أيام أو أكثر من عشرة أيام فحكمه حكم الرعاف الدائم: لا يمنع الصوم ولا الصلاة ولا الوطء
وإذا زاد الدم على عشرة أيام وللمرأة عادة
معروفة ردت إلى أيام عادتها وما زاد على ذلك فهو استحاضة وإن ابتدأت مع البلوغ مستحاضة فيحضها عشرة أيام من كل شهر والباقي استحاضة
والمستحاضة ومن به سلس البول والرعاف الدائم والجرح الذي لا يزقلأ يتوضئون لوقت كل صلاة فيصلون بذلك الوضوء في الوقت ما شاءوا من الفرائض والنوافل فإذا خرج الوقت بطل وضوءهم وكان عليهم استئناف الوضوء لصلاة أخرى
والنفاس: هو الدم الخارج عقيب الولادة والدم الذي تراه الحامل وما تره المرأة في حال ولادتها قبل خروج الولد استحاضة
وأقل النفاس لا حد له وأكثره أربعون يوما وما زاد على ذلك فهو استحاضة وإذا تجاوز الدم الأربعين وقد كانت هذه المرأة ولدت قبل ذلك ولها عادة في النفاس ردت إلى أيام عادتها وإن لم لها عادة فابتدأ نفاسها أربعون يوما ومن ولدت ولدين في بطن واحد
فنفاسها ما خرج من الدم عقيب الولد الأول عند أبي حنيفة وأبي يوسف وقال محمد وزفر: نفاسها ما خرج من الدم عقيب الولد الثاني
## باب الأنجاس
تطهير النجاسة واجب من بدن المصلي وثوبه
والمكان الذي يصلي عليه
ويجوز تطهير النجاسة بالماء وبكل مائع طاهر يمكن إزالتها به كالخل وماء الورد
وإذا أصابت الخف نجاسة ولها جرم فجفت فدلكه بالأرض جاز
والمني نجس يجب غسل رطبه فإذا جف على الثوب أجزأ فيه الفرك
والنجاسة إذا أصابت المرآة أو السيف اكتفي بمسحهما
وإذا أصابت الأرض نجاسة فجفت بالشمس وذهب أثرها جازت الصلاة بمكانها ولا يجوز التيمم منها
ومن أصابه من النجاسة المغلظة كالدم والبول والغائط والخمر مقدار الدرهم فما دونه جازت الصلاة معه فإن زاد لم تجز وإن أصابته نجاسة مخففة كبول ما يؤكل لحمه
جازت الصلاة معه ما لم يبلغ ربع الثوب
وتطهير النجاسة التي يجب غسلها على وجهين:
فما كان له منها مرئية زوال عينها إلا أن يبقى من أثرها ما يشق إزالته وما ليس له عني مرئية فطهارتها أن يغسل حتى يغلب على ظن الغاسل أنه قد طهر
والاستنجاء سنة يجزي فيها الحجر وما يقوم مقامه يمسحه حتى ينقه وليس فيه عدد مسنون وغسله بالماء أفضل فإن تجاوزت النجاسة مخرجها لم يجز فيه إلا الماء ولا يستنجي بعظم ولا بروث ولا بطعام ولا
بيمينه إلا بعذر
# كتاب الصلاة
أول وقت الصبح إذا طلع الفجر الثاني وهو البياض المعترض في الأفق وآخر وقتها ما لت تتطلع الشمس وأول وقت الظهر إذا زالت الشمس وآخر وقتها عند أبي حنيفة إذا صار ظل كل شيء مثليه سوي فيء الزوال
وقال أبو يوسف ومحمد: إذا صار ظل كل شيء مثله
وأول وقت العصر إذا خرج وقت الظهر على القولين وآخر وقتها ما لم تغرب الشمس
وأول وقت المغرب إذا فربت الشمس وآخر وقتها ما لم يغب الشفق وهو البياض الذي ف الأفق بعد الحمرة
عند أبي حنيفة وقال أبو يوسف ومحمد: هو الحمرة وأول وقت العشاء إذا غاب الشفق وآخر وقتها ما لم يطلع الفجر وأول وقت الوتر بعد العشاء وآخر وقتها ما لم يطلع الفجر
ويستحب الإسفار بالفجر
والإبراد بالظهر في الصيف وتقديمها في الشتاء وتأخير العصر ما لم تتغير الشمس وتعجيل
المغرب وتأخير العشاء إلى ما قبل ثلث الليل ويستحب في الوتر لمن يألف صلاة الليل أن يؤخر الوتر إلى آخر الليل فإن لم يثق بالانتباه أوتر قبل النوم
## باب الأذان
الأذان سنة للصلوات الخمس والجمعة
دون ما سواها
وصفة الأذان: أن يقول: الله أكبر الله أكبر - إلى آخره ولا ترجيع فيه ويزيد في أذان الفجر بعد الفلاح: الصلاة خير من النوم مرتين
والإقامة مثل الأذان إلا أنه يزيد فيها بعد الفلاح: قد قامت الصلاة مرتين
ويترسل في الأذان ويحدر في الإقامة ويستقبل بهما القبلة فإذا بلغ إلى الصلاة والفلاح حول وجهه يمينا وشمالا
ويؤذن للفائتة ويقيم فإن فاتته صلوات أذن للأولى وأقام وكان مخيرا في الباقية: إن شاء أذن وأقام وإن شاء اقتصر على الإقامة
وينبغي أن يؤذن ويقيم على طهر فإن أذن على غير وضوء جاز ويكره أن يقيم على غير وضوء أو يؤذن وهو جنب ولا يؤذن لصلاة قبل دخول وقتها
## باب شروط الصلاة التي تتقدمها
يجب على المصلي أن يقدم الطهارة من الأحداث والأنجاس على ما قدمناه ويستر عورته والعورة من الرجل: ما تحت السرة إلى الركبة والركبة من العورة
وبدن المرأة الحرة كله عورة إلا وجهها وكفيها وقدميها وما كان عورة من الرجل فهو عروة من الأمة وبطنها وظهرها عورة وما سوى ذلك من بدنها فليس بعورة
ومن لم يجد ما يزل به النجاسة صلى معها ولم يعد الصلاة
ومن لم يجد ثوبا صلى عريانا قاعدا يومئ بالركوع والسجود فإن صلى قائما أجزاه والأول أفضل وينوي الصلاة التي يدخل فيها بنية لا يفصل بينها وبين
التحريمة بعمل ويستقبل القبلة إلا أن يكون خائفا فيصلي إلى أي جهة قدر فإن اشتبهت عليه القبلة وليس بحضرته من يسأله عنها اجتهد وصلى
فإن علم أنه أخطأ بإخبار بعد ما صلى فلا إعادة عليه وإن علم ذلك وهو في الصلاة استدار إلى القبلة وبنى عليها
## باب صفة الصلاة
فرائض الصلاة ستة:
التحريمة
والقيام والقرءة والركوع والسجود والقعدة الأخيرة مقدار التشهد
وما زاد على ذلك فهو سنة فإذا دخل الرجل في الصلاة كبر ورفع يديه مع التكبير حتى يحاذى بإبهاميه شحمتي أذنيه فإن قال بدلا من التكبير: الله أجل أو أعظم
أو الرحمن أكبر أجزأه عند أبي حنيفة ومحمد وقال أبو يوسف: لا يجزئه إلا بلفظ التكبير ويعتمد بيده اليمنى على اليسرى ويضعهما تحت سرته ثم يقول: سبحانك اللهم وبحمدك وتبارك اسمك وتعلى جدك ولا إله غيرك ويستعيذ بالله من الشيطان الرجيم ويقرأ بسم الله الرحمن الرحيم ويسر بهما ثم يقرأ فاتحة الكتاب وسورة معها أو ثلاث آيات من أي سورة شاء وإذا قال الإمام ﴿ولا الضالين﴾ قال: آمين ويقولها ويخفونها ثم يكبر ويركع
ويعتمد بيديه على ركبتيه ويفرج أصابعه ويبسط ظهره ولا يرفع رأسه ولا ينكسه ويقول في ركوعه: سبحان ربي العظيم ثلاثا وذلك أذناه ثم يرفع رأسه ويقول: وسجد واعتمد بيديه على الأرض ووضع وجهه بين كفيه وسجد على أنفه وجبهته فإن اقتصر على أحدهما جاز عند أبي حنيفة
وقال أبو يوسف ومحمد: لا يجوز الاقتصار على الأنف إلا من عذر وإن سجد على كور عمامته أو فاضل ثوبه جاز ويبدي ضبعيه ويجافي بطنه عن فخذيه ويوجه أصابع رجليه نحو القبله ويقول في سجوده: سبحان ربي الأعلى ثلاثا وذلك أدناه ثم يرفع رأسه
ويكبر فإذا اطمأن جالسا كبر وسجد فإذا اطمأن ساجدا كبر واستوى قائما على صدور قدميه ولا يقعد ولا يعتمد بيديه على الأرض
ويفعل في الركعة الثانية مثل ما فعل في الأولى إلا أنه لا يستفتح ولا يتعوذ ولا يرفع يديه إلا في التكبير الأولى
فإذا رفع رأسه من السجدة الثانية في الركعة الثانية افترش رجله اليسرى فجلس عليها ونصب اليمنى نصبا ووجه أصابعه نحو القبله ووضع يديه على فخذيه وبسط أصابعة وتشهد
والتشهد أن يقول: التحيات لله والصلوات والطيبات السلام عليك أيها النبي ورحمة الله وبركاته السلام علينا وعلى عباد الله الصالحين أشهد أن لا إله إلا الله وأشهد أن محمدا عبده ورسوله ولا يزيد على هذا في القعدة الأولى
ويقرأ في الركعتين الأخريين الكتاب خاصة فإذا جلس في آخر الصلاة جلس كما في الأولى وتشهد وصلى على النبي صلى الله عليه وآله وسلم ودعا بما شاء بما يشبه ألفاظ القرآن والأدعيه المأثورة ولا يدعو بما يشبه كلام الناس ثم يسلم عن يمينه فيقول: السلام عليكم ورحمة الله وعن يساره مثل ذلك
ويجهز بالقرءة في الفجر والركعتين
الأوليين من المغرب والعشاء إن كان إماما ويخفي القراءة فيما بعد الأوليين وإن كان منفردا فهو مخير: إن شاء جهر وأسمع نفسه وإن شاء خافت ويخفي الإمام القرءة في الظهر والعصر
والوتر:
ثلاث ركعات لا يفصل بينها بسلام
ويقنت في الثالثه قبل الركوع في جميع السنة ويقرأ في كل ركعة من الوتر بفاتحة الكتاب وسورة معها فإذا أراد أن يقنت كبر ورفع يديه ثم قنت
ولا يقنت في صلاة غيرها
وليس في شيء من الصلوات قراءة سورة بعينها لا يجزئ غيرها ويكره أن يتخذ سورة بعينها لصلاة لا يقرأ فيها غيرها
وأدنى ما يجزئ من القراءة في الصلاة ما يتناوله اسم القرآن عند أبي حنيفة
وقال يوسف ومحمد: لا يجزئ أقل من ثلاث آيات قصار أو آية طويلة
ولا يقرأ المؤتم خلف الإمام
ومن أراد الدخول في صلاة غيره يحتاج إلى نيتين: نية الصلاة ونية المتابعة
والجماعة: سنة مؤكدة
وأولى الناس بالإمامة أعلمهم
بالسنة فإن تساووا فأقرهم فإن تساووا فأورعهم فإن تساووا فأسنهم
ويكره تقديم العبد والأعرابي والفاسق والأعمى وولد الزنا فإن تقدموا جاز
وينبغي للإمام أن لا يطول بهم الصلاة
ويكره للنساء أن يصلين وحدهن جماعة فإن فعلن وقفت الإمام وسطهن
ومن صلى مع واحد أقامه عن يمينه
فإن كان اثنين تقدم عليهما
ولا يجوز للرجال أن يقتدوا بامرأة أو صبي
ويصف الرجال ثم الصبيان ثم النساء
فإن قامت امرأة إلى جنب رجل وهما مشتركان في صلاة واحدة فسدت صلاته
ويكره للنساء حضور الجماعة ولا بأس بأن تخرج العجوز في الفجر والمغرب والعشاء عند أبي حنيفة وقال أبو يوسف ومحمد يجوز خروج العجوز في كل
صلاة ولا يصلي الطاهر خلف من به سلس البول ولا الطاهرات خلف المستحاضة ولا القارئ خلف الأمي ولا المكتسي خلف العريان ويجوز أن يؤم المتيمم المتوضئين والماسح على الخفين الغاسلين ويصلي القائم خلف القاعد ولا يصلي الذي يركع ويسجد خلف الموميء ولا يصلي المفترض خلف المتنقل ولا من يصلي فرضا خلف من يصلي فرضا آخر ويصلي المتنقل خلف المفترض
ومن اقتدى بإمام ثم علم أنه على غير وضوء
إعاد الصلاة
ويكره للمصلي أن يعبث بثوبه أو بجسدهن ولا يقلب الحصى إلا أن لا يمكنه السجود فيسويه مرة واحدة ولا يفرقع أصابعه ولا يتخصر ولا يسدل ثوبه ولا يعقص شعره ولا يكف ثوبه
ولا يلتفت ولا يقعي ولا يرد السلام بلسانه ولا بيده ولا يتربع إلا من عذر ولا يأكل ولا يشرب
فإن سبقه الحدث انصرف فإن كان إماما استخلف وتوضأ وبنى على صلاته والاستئناف أفضل
وإن نام فاحتلم أو جن أو أغمي عليه أو قهقه استأنف الوضوء والصلاة
وإن تكلم في صلاته عامدا أو ساهيا بطلت صلاته
وإن سبقه الحدث بعد التشهد توضأ وسلم وإن تعمد الحدث في هذه الحالة أو تكلم أو عمل عملا ينافي الصلاة تمت صلاته
وإن رأى المتيمم الماء في صلاته بطلب صلاته
وإن رآه بعدما قعد قدر التشهد أو كان ماسحا على الخفين فانقضت مدة مسحه أو خلع حفيه بعمل رفيق أو كان أميا فتعلم سورة أو عريانا فوجد ثوبا أو موميا فقدر على الركوع والسجود أو تذكر أن عليه صلاة قبل هذه الصلاة أو وقت العصر في الجمعة أو كان ماسحا على الجبيرة فسقطت عن برء أو كان صاحب عذر فانقطع عذره
بطلت صلاته في قول أبي حنيفة وقال أبو يوسف ومحمد: تمت صلاته
## باب قضاء الفوائت
ومن فاتته الصلاة قضاها إذا ذكرها وقدمها لزوما على صلاة الوقت إلا أن يخاف فوات صلاة الوقت فيقدم صلاة الوقت ثم يقضيها فإن فاتته صلوات رتبها في القضاء كما وجبت في الأصل إلا أن تزيد الفوائت على ست صلوات فيسقط الترتيب فيها
## باب الأوقات التي تكره فيها الصلاة
لا تجوز الصلاة عند طلوع الشمس ولا عند قيامها في الظهيرة ولا عند غروبها ولا يصلي على جنازة ولا يسجد للتلاوة إلا عصر يومه عند غروب الشمس
ويكره أن يتنفل بعد صلاة الفجر حتى تطلع الشمس وبعد صلاة العصر حتى تغرب الشمس ولا بأس بأن يصلي في هذين الوقتين الفوائت ويسجد للتلاوة ويصلي على الجنازة
ولا يصلي ركعتي الطواف
ويكره أن يتنقل بعد طلوع الفجر بأكثر من ركعتي الفجر ولا يتنقل قبل المغرب
## باب النوافل
السنة في الصلاة أن يصلي ركعتين بعد طلوع الفجر وأربعا قبل الظهر وركعتين بعدها وأربعا قبل العصر وإن شاء ركعتين وركعتين بعد المغرب وأربعا قبل العشاء وأربعا بعدها وإن شاء ركعتين
ونوافل النهار إن شاء صلى ركعتين بتسليمة واحدة وإن شاء أربعا وتكره الزيادة على ذلك
فأما نافلة الليل فقال أبو حنيفة إن صلى ثمان ركعات بتسليمة واحدة جاز وتكره الزيادة على ذلك وقال أبو يوسف ومحمد: لا يزيد بالليل على ركعتين بتسليمة واحدة
والقراءة في الفرض واجبة في الركعتين الأوليين وهو مخير في الأخريين إن شاء قرأ وإن شاء سبح وإن شاء سكت
والقراءة واجبة في جميع ركعات النفل وفي جميل الوتر ومن دخل في صلاة النفل ثم أفسدها قضاها
فإن صلى أربع ركعات وقعد في الأوليين ثم أفسد الأخريين قضى ركعتين
ويصلي النافلة قاعدا مع القدرة على القيام وإن افتتحها قائما ثم قعد جاز عند أبي حنيفة
وقال أبو يوسف ومحمد: لا يجوز إلا من عذر
ومن كان خارج المصر يجوز أن ينتقل على دابته إلى أي جهة توجهت يومئ إيماء
## باب السجود السهو
سجود السهو واجب في الزيادة والنقصان بعد السلام ثم يسجد سجدتين ثم يشهد ويسلم
والسهو يلزم إذا راد في صلاته فعلا من جنسها ليس منها أو ترك فعلا مسنونا أو ترك قراءة فاتحة الكتاب أو القنوت أو التشهد أو تكبيرات العيدين أو جهز الإمام فيما يخافت أو خافت فيما يجهر
وسهو الإمام يوجب على المؤتم السجودن فإن لم يسجد الإمام لم يسجد المؤتم وإن سها المؤتم لم يلزم الإمام ولا المؤتم السجود
ومن سها عن القعدة الأولى ثم تذكر وهو إلى حال القعود أقرب عاد فجلس وتشهد وإن كان إلى حال القيام أقرب لم يعد
ويسجد للسهو ومن سها عن القعدة الأخيرة فقام إلى الخامسة رجع إلى القعدة ما لم يسجد وألغى الخامسة ويسجد للسهو وإن قيد الخامسة بسجدة بطل فرضه وتحولت صلاته نفلا وكان عليه أن يضم إليها ركعة سادسة
وإن قعد في الرابعة قدر التشهد ثم قام ولم يسلم يظنها القعدة الأولى عاد إلى القعود ما لم يسجد في الخامسة ويسلم وإن قيد الخامسة بسجدة ضم
إليها ركعة أخرى ويسجد للسهو وقد تمت صلاته والركعتان له نافله
ومن شك في صلاته فلم يدر أثلاثا صلى أم أربعا وكان ذلك أول ما عرض له استأنف الصلاة فإن كان الشك يعرض له كثيرا بنى على غالب ظنه إن كان له ظن فإن لم يكن له ظن بنى على اليقين
## باب صلاة المريض
إذا تعذر على المريض القيام صلى قاعدا يركع ويسجد فإن لم يستطع الركوع والسجود أومأ إيماء برأسه وجعل السجود أخفض من الركوع
ولا يرفع إلى وجهه شيئا يسجد عليه
فإن لم يستطع القعود استلقى على ظهره وجعل رجله إلى القبلة وأومأ بالركوع والسجود وإن استلقى على جنبه ووجهه إلى القبلة وأومأ جاز فإن لم يستطع الإيماء برأسه أخر الصلاة ولا يومئ بعينه ولا بقلبه ولا بحاجبيه فإن قدر على القيام ولم يقدر على الركوع والسجود لم يلزمه القيام
وجاز أن يصلي قاعدا يومئ إيماء فإن صلى الصحيح بعض صلاته قائما ثم حدث به مرض
أتمها قاعدا يركع ويسجد أو يومئ إن لم يستطع الركوع والسجود أو مستلقيا إن لم يستطع القعود فإن صلى بإيماء ثم قدر على الركوع والسجود استأنف الصلاة
ومن أغمي عليه خمس صلوات فما دونها قضاها إذا صح فإن فاتته بالإغماء أكثر من ذلك لم يقض
## باب سجود التلاوة
سجود التلاوة في القرآن أربعة عشر: في
آخر الأعراف وفي الرعد والنحل وبني إسرائيل ومريم والأولى من الحج والفرقان والنمل و﴿الم * تنزيل﴾ وص ﴿حم﴾ السجدة و﴿إذا السماء انشقت﴾ و﴿اقرأ باسم ربك﴾
والسجود واجب في هذه المواضع كلها على التالي والسامع سواء قصد سماع القرآن أولم يقصد وإذا تلا الإمام آية السجدة سجدها وسجد المأموم معه وإن تلا المأموم لم يسجد الإمام ولا المأموم
وإن سمعوا وهم في الصلاة آية سجدة من رجل ليس معهم في الصلاة لم يسجدوها في الصلاة وسجدوها بعد الصلاة فإن سجدوها في الصلاة لم تجزهم
ولم فسد صلاتهم
ومن تلا آية سجدة فلم يسجدها حتى دخل في الصلاة فتلاها وسجد لها أجزأته السجدة عن التلاوتين وإن تلاها في غير الصلاة فسجد لها ثم دخل في الصلاة فتلاها سجد لها ولت تجزه السجدة الأولى ومن كرر تلاوة سجدة واحدة في مجلس واحد أجزأته سجدة واحدة
ومن أراد السجود كبر ولم يرفع يديه وسجد ثم كبر ورفع رأسه ولا تشهد عليه ولا سلام
## باب صلاة المسافر
السفر الذي تتغير به الأحكام:
أن يقصد الإنسان موضا بينه وبين ذلك الموضع مسيرة ثلاثة أيام ولياليها بسير الإبل ومشي الأقدام ولا يعتبر ذلك بالسير في الماء
وفرض المسافر عندنا: في كل صلاة رباعية ركعتان لا تجوز له الزيادة عليهما فإن صلى أربعا وقد قعد في الثانية مقدار التشهد أجزأته ركعتان عن فرضه وكانت الأخريان له نافلة وإن لم يقعد مقدار التشهد في الركعتين الأوليين بطلت صلاته
ومن خرج مسافرا صلى وكعتين إذا فارق بيوت المصر ولا يزال على حكم السفر حتى ينوي الإقامة في بلد خمسة عشر يوما فصاعدا فيلزمه الإتمام وإن نوى الإقامة أقل من ذلك لم يتم
ومن دخل بلدا ولم ينو أن يقيم فيه خمسة عشر يوما وإنما يقول غدا أخرج أو بعد غد أخرج حتى بقي على ذلك سنين صلى ركعتين
وإذا دخل العسكر أرض الحرب فنووا الإقامة بها خمسة عشر يوما لم يتموا الصلاة
وإذا دخل المسافر في صلاة المقيم مع بقاء الوقت أتم الصلاة
وإن دخل معه في فائتة لم تجز صلاته خلفه
وإذا صلى المسافر بالمقيمين ركعتين سلم ثم أتم المقيمون صلاتهم ويستحب له إذا سلم أن يقول: أتموا صلاتكم فإنا قوم سفر وإذا دخل المسافر مصرة أتم الصلاة وإن لم ينو الإقامة فيه
ومن كان له وطن فانتقل عنه واستوطن غيره ثم سافر فدخل وطنه الأول لم يتم الصلاة وإذا نوى المسافر أن يقيم بمكة ومنى خمسة عشر يوما لم يتم الصلاة
ومن فاتته صلاة في السفر قضاها في الحضر ركعتين
ومن فاتته صلاة في الحضر قضاها في السفر أربعا
والعاصي والمطيع في السفر في الرخصة سواء
## باب صلاة الجمعة
لا تصح الجمعة إلا بمصر جامع أو في مصلى المصر
ولا تجوز في القرى ولا تجوز إقامتها إلا بالسطان أو من أمره السلطان
ومن شرائطها: الوقت فتصح في الوقت ولا تصح بعده
ومن شرائطها الخطبة قبل الصلاة يخطب الإمام خطبتين يفصل بينهما بقعدة ويخطب قائما على طهارة فإن اقتصر على ذكر الله تعالى جاز عند أبي حنيفة
وقال أبو يوسف ومحمد: لا بد من ذكر طويل يسمى خطبة وإن خطب قاعدا أو على غير طهارة جاز ويكره ومن شرائطها: الجماعة وأقلهم عند أبي حنيفة
ثلاثة سوى
الإمام وقال أبو يوسف ومحمد: اثنان سوى الإمام ويجهر الإمام بالقراءة في الركعتين وليس فيهما قراءة سورة بعينها
ولا تجب الجمعة على مسافر ولا امرأة ولا مريض ولا عبد ولا أعمى فإن حضروا وصلوا مع الناس أجزاهم عن فرض الوقت
ويجوز للمسافر والعبد والمريض ونحوهم أن يؤم في الجمعة
ومن صلى الظهر في منزله يوم الجمعة قبل صلاة الإمام ولا عذر له كره له ذلك وجازت صلاته فإن بدا له أن يحضر الجمعة فتوجه إليها بطلب صلاة الظهر
عند أبي حنيفة بالسعي وقال أبو يوسف ومحمد: لا تبطل حتى يدخل مع الإمام
ويكره أن يصلي المعذورون الظهر بجماعة يوم الجمعة وكذلك أهل السجن
ومن أدرك الإمام يوم الجمعة صلى معه ما أدرك وبنى عليها الجمعة وإن أدركه في التشهد أو في سجود السهو بنى عليها الجمعة عند أبي حنيفة وأبي يوسف وقال محمد: إن أدرك معه أكثر الركعة الثانية بنى عليها الجمعة وإن أدرك أقلها بنى عليها الظهر
وإذا خرج الإمام على المنبر يوم الجمعة ترك الناس الصلاة والكلام حتى يفرغ من خطبته وإذا أذن المؤذنون يوم الجمعة الأذان الأول ترك الناس البيع والشراء وتوجهوا إلى صلاة الجمعة
فإذا صعد الإمام المنبر جلس وأذن المؤذنون بين يدي المنبر فإذا فرغ من خطبته أقاموا الصلاة وصلوا
## باب صلاة العيدين
ويستحب في يوم الفطر: أن يطعم الإنسان قبل الخروج إلى المصلى ويغتسل ويتطيب ويتوجه إلى المصلى ولا يكبر في طريق المصلى عند أبي حنيفة وعندها يكبر
ولا يتنقل في المصلى قبل صلاة العيد فإذا حلت الصلاة من ارتفاع الشمس دخل وقتها إلى الزوال فإذا زالت الشمس خرج وقتها
ويصلي الإمام بالناس ركعتين: يكبر في الأولى تكبيرة الأفتتاح وثلاثا بعدها ثم يقرأ فاتحة الكتاب وسورة معها ثم يكبر تكبيرة يركع بها ثم يبتدئ في الركعة الثانية بالقراءة كبر ثلاث تكبيرات وكبر تكبيرة رابعة يركع بها ويرفع يديه في تكبيرات العيدين ثم يخطب بعد الصلاة خطبتين يعلم الناس فيها صدقة الفطر وأحكامها
ومن فاتته صلاة العيد مع الإمام لم يقضها
فإن غم الهلال على الناس فشهدوا عند الإمام برؤية الهلال بعد الزوال صلى العيد من الغد فإن حدث عذر منع الناس من الصلاة في اليوم الثاني لم يصلها بعده
ويستحب في يوم الأضحى: أن يغتسل ويتطيب ويؤخر الأكل حتى يفرغ من الصلاة ويتوجه إلى المصلى وهو يكبر
ويصلي الأضحى ركعتين كصلاة الفطر ويخطب بعدها خطبيتن يعلم الناس فيهما الأضحية وتكبيرات التشريق فإن حدث عذر منع الناس من الصلاة في يوم الأضحى صلاها من الغد وبعد الغد ولا يصليها بعد ذلك
وتكبير التشريق أوله عقيب صلاة الفجر من يوم
عرفة وآخره عقيب صلاة العصر من النحر عند أبي حنيفة وقال أبو يوسف ومحمد: إلى صلاة العصر
من آخر أيام التشريق
والتكبير عقيب الصلوات المفروضات وهو أن يقول: الله أكبر الله أكبر لا إله إلا الله والله أكبر الله أكبر ولله الحمد
## باب صلاة الكسوف
إذا انكسفت الشمس صلى الإمام بالناس ركعتين كهيئة النافلة في كل ركعة ركوع واحد ويطول القراءة فيهما ويخفي عند أبي حنيفة وقال أبو يوسف ومحمد: يجهر ثم يدعو بعدها حتى تنجلي الشمس
ويصلي بالناس الإمام الذي يصلي بهم الجمعة فإن لم يجمع صلاها الناس فرادى
وليس في خسوف القمر جماعة وإنما يصلي كل واحد بنفسه وليس في الكسوف خطبة
## باب الاستسقاء
قال أبو حنيفة رحمه الله عليه: ليس في الاستسقاء صلاة مسنونة في جماعة فإن صلى الناس وحدانا جاز وإنما الاستسقاء الدعاء والاستغفار
وقال أبو يوسف ومحمد: يصلي الإمام بالناس ركعتين يجهر فيهما بالقراءة لم يخطب ويستقبل القبلة بالدعاء ويقلب الإمام رداءه ولا يقلب القوم أرديتهم ولا يحضر أهل الذمة الاستسقاء
## باب قيام شهر رمضان
يستحب أن يجتمع الناس في شهر رمضان بعد العشاء
فيصلي بهم إمامهم خمس ترويحات في كل ترويحه تسليمتان ويجلس بن كل ترويحتين مقدار ترويحة ثم يوتر بهم ولا يصلي الوتر بجماعة في غير شهر رمضان
## باب صلاة الخوف
إذا اشتد الخوف جعل الإمام الناس طائفتين:
طائفة في وجه العدو وطائفة خلفه فيصلي بهذه الطائفة ركعة وسجدتين فإذا رفع رأسه من السجدة الثانية مضت هذه الطائفة إلى وجه
العدو وجاءت تلك الطائفة فيصلي بهم الإمام ركعة وسجدتين وتشهد وسلم ولم يسلموا وذهبوا إلى وجه العدو وجاءت الطائفة الأولى فصلوا وحدانا ركعة وسجدتين بغير قراءة وتشهدوا وسلموا ومضوا إلى وجه العدو وجاءت الطائفة الأخرى فصلوا ركعة وسجدتين بقراءة وتشهدوا وسلموا
فإن كان الإمام مقميا صلى بالطائفة الأولى ركعتين وبالثانية ركعتين ويصلي بالطائفة الأولى ركعتين من المغرب وبالثانية ركعة
ولا يقاتلون في حال الصلاة فإن فعلوا ذلك بطلت صلاتهم وإن اشتد الخوف صلوا ركبانا وحدانا يومئون بالركوع والسجود إلى أي جهة شاءوا إذا لم يقدروا على التوجه إلى القبلة
## باب صلاة الجنائز
إذا احتضر الرجل وجه إلى القبلة على شقة الأيمن ولقن الشهادتين فإذا مات شدوا لحييته وغمضوا عينيه وإذا أرادوا غسله وضعوه على سرير وجعلوا على عورته خرقة
ونزعوا ثيابه ووضئوة ولا يمضمض ولا يستنشق ثم يفيضون الماء عليه ويجمر سريره وترا ويغلى الماء بالسدر أو بالحرض فإن لم يكن فالماء القراح ويغتسل رأسه ولحيته بالخطمي
ثم يضجع على شقه الأيسر فيغتسل بالماء والسدر حتى يرى أن الماء قد وصل إلى ما يلي التخت منه ثم يضجع على شقة الأيمن فيغتسل بالماء والسدر حتى يرى أن الماء قد وصل إلى ما يلي التخت منه
ثم يجلسه ويسنده إليه ويمسح بطنه مسحا وفيقا فإن خرج منه شيء غسله ولا يعيد غسله
ثم ينشفه بثوب ويجعله في أكفانه ويجعل الحنوط على رأسه ولحيته والكافور على مساجده
والسنة أن يكفن الرجل في ثلاثة أثواب:
إزار وقميص ولفافة فإن اقتصروا على ثوبين جاز
وإذا أرادوا لف اللفافة عليه ابتداءوا بالجانب الأيسر فألقوه عليه ثم بالأيمن فإن خافوا أن ينشر الكفن عنه عقدوه
وتكفن المرأة في خمسة أثواب: إزار وقميص وخمار وخرقة يربط بها ثدياها ولفافة فإن اقتصروا على
ثلاثة أثواب جاز ويكون الخمار فوق القميص تحت اللفافة ويجعل شعرها على صدرها ولا يسرح شعر الميت ولا ليحته ولا يقص ظفره ولا يعقص شعره وتجمر الأكفان قبل أن يدرج فيها وترا
فإذا فرغوا منه صلوا عليه وأولى الناس بالصلاة عليه السلطان إن حضر فإن لم يحضر فيستحب تقديم إمام الحي ثم الولي
فإن صلى عليه غير الولي والسلطان أعاد الولي وإن صلى الولي لم يجز لأحد أن يصلي بعده فإن دفن ولم يصل عليه صلي على قبره
والصلاة: أن يكبر تكبيرة يحمد الله تعالى عقيبها ثم يكبر تكبيرة ويصلي على النبي صلى الله عليه وآله وسلم ثم يكبر تكبيرة يدعو فيها لنفسه وللميت وللمسليمن ثم يكبر تكبيرة رابعة ويسلم ولا يصلى
على ميت في مسجد جماعة
فإذا حملوه على سريره أخذوا بقوائمه الأربع ويمشون به مسرعين دون الخبب فإذا بلغوا إلى قبره كره للناس أن يجلسوا قبل أن يوضع عن أعناق الرجال ويحفر القبر ويلحد ويدخل الميت مما يلي القبلة فإذا وضع في لحده قال الذي يضعه: باسم الله وعلى ملة رسول الله ويوجهه إلى القبلة ويحل العقدة ويسوي اللبن عليه ويكره الآجر
والخشب ولا بأس بالقصب ثم ينهال التراب عليه ويسنم القبر ولا يصطح ومن استهل بعد الولادة سمي وغسل وصلي عليه وإن لم يستهل أدرج في خرقه ولم يصل عليه
## باب الشهيد
الشهيد: من قتله المشركون
أو وجد في المعركة وبه أثر الجراحة أو قتله المسلمون ظلما ولم تجب بقتله دية فيكفن ويصلي عيه ولا يغتسل وإذا استشهد الجنب غسل عند أبي حنيفة وكذلك الصبي وقال أبو يوسف ومحمد: لا يغسلان ولا يغتسل عن الشهيد دمه ولا ينزع عنه ثيابه وينزع عنه الفرو والحف والحشو والسلاح
ومن ارتث غسل والارتثات: أن يأكل أو يشرب أو يداوى أو يبقى حيا حتى يمضي عليه وقت صلاة وهو يعقل أو ينقل من المعركة حيا
ومن قتل في حد أو قصاص غسل وصلي عليه ومن قتل من البغاة أو قطاع الطريق لم يصل عليه
## باب الصلاة في الكعبة وحولها
الصلاة في الكعبة جائزة فرضها ونفلها فإن صلى الإمام بجماعة فجعل بعضهم ظهره الإمام جاز ومن جعل منهم ظهره إلى وجه الإمام لم تجز صلاته
وإذا صلى الإمام في المسجد الحرام تحلق
الناس حول الكعبة وصلوا بصلاة الإمام فمن كان منهم أقرب إلى الكعبة من الإمام جازت صلاته إذا لم يكن في جانب الإمام
ومن صلى على ظهر الكعبة جازت صلاته
# كتاب الزكاة
الزكاة: واجبة على الحر المسلم البالغ العاقل إذا ملك نصابا ملكا تاما وحال عليه الحول وليس على صبي ولا مجنون وال مكاتب زكاة
ومن كان عليه دين يحيط فلا زكاة عليه
وإن كان ماله أكثر من الدين زكى الفاضل إذا بلغ نصابا وليس في دور السكنى وثياب البدن وأثاث المنازل ودواب الركوب وعبيد الخدمة وسلاح الاستعمال زكاة
ولا يجوز أداء الزكاة إلا بينة مقارنة للأداء أو مقارنة لعزل مقدار الواجب
ومن تصدق بجميع ماله ولم ينو الزكاة سقط فرضها عنه
## باب زكاة الإبل
ليس في أقل من خمس ذود من الإبل صدقة فإذا بلغت خمسا سائمة
وحال عليها الحول ففيها شاة إلى تسع فإذا كانت عشرا ففيها شاتان إلى أربع عشرة فإذا كانت خمس عشرة ففيها ثلاث شياه إلى تسع عشرة فإذا كانت عشرين ففيها أربع شياه إلى أربع وعشرين فإذا كانت خمسا وعشرين ففيها بنت مخاض إلى خمس وثلاثين فإذا كانت ستا وثلاثين ففيها بنت لبون إلى خمس وأربعين فإذا كانت ستا وأربعين ففيها حقة إلى ستين فإذا كانت إحدى وستين ففيها جذعة إلى خمس وسبعين فإذا كانت ستا وسبعين ففيها بنتا لبون إلى تسعين فإذا كانت إحدى وتسعين ففيها حقتان إلى مائة وعشرين
ثم تستأنف الفريضة فيكون في الخمس شاة مع الحقتين وفي العشر شاتان وفي خمس عشرة ثلاث شياه وفي عشرين أربع شياه وفي خمس وعشرين بنت مخاض إلى مائة وخمسين فيكون فيها
ثلاث حقاق: ثم تستأنف الفريضة فيكنون في الخمس شاة وفي العشر شاتان وفي خمس عشرة ثلاث شياه وفي عشرين أربع شياه وفي خمس وعشرين بنت مخاض وفي ست وثلاثين بنت لبون فإذا بلغت مائة وستا وتسعين ففيها أربع حقاق إلى مائتين ثم تستأنف الفريضة أبدا كما استؤنفت في الخمسين التي بعد المائة والخميسين
والبخت والعراب سواء
## باب صدقة البقر
ليس في أقل من ثلاثين من البقر صدقة فإذا كانت ثلاثين سائمة وحال عليها الحول ففيها تبيع أو تبيعة وفي أربعين مسنة أو مسن فإذا زادت على الأربعين وجب في الزيادة بقدر ذلك إلى ستين عند أبي حنيفة ففي الواحدة ربع عشر مسنة وفي الاثنين نصف عشر مسنة وفي الثلاثة ثلاثة أرباع عشر مسنة وفي الأربع عشر
وقال أبو يوسف ومحمد: لا شيء في الزيادة حتى تبلغ ستين فيكون فيها تبيعان أو تبيعتان وفي سبعين مسنة وتبيع وفي ثمانين مسنتان وفي تسعين ثلاثة أتبعة وفي مائة تبيعان ومسنة والجوامس والبقر سواء
## باب صدقة الغنم
ليس في أقل من أربعين شاة صدقة فإذا كانت أربعين سائمة وحال عليها الحول ففيها شاة إلى مائة وعشرين فإذا زادت واحدة ففيها شاتان إلى مائتين فإذا زادت واحدة ففيها ثلاث شياه فإذا بلغت أربعمائة ففيها أربع شياه ثم في كل مائة شاة والضأن والمعز سواء
## باب زكاة الخيل
إذا كانت الخيل سائمة ذكورا وإناثا فصاحبها بالخيار: إن شاء أعطى عن كل فرس دينارا وإن شاء قومها وأعطى عن كل مائتي درهم خمسة دراهم وليس في ذكورها منفردة زكاة
وقال أبو يوسف ومحمد: لا زكاة في الخيل
ولا في شيء من البغال والحمير إلا أن تكون للتجارة
وليس في الفصلان والحملان والعجاجيل صدقة عند أبي حنيفة
ومحمد إلا أن يكون معها كبار وقال أبو يوسف فيها واحدة منها
ومن وجب عليه سن فلم توجد عنده أخذ المصدق أعلى منها ورد الفضل أو أخذ دونها وأخذ الفضل
ويجوز دفع القيم في الزكاة وليس في العوامل والعلوفة صدقة
ولا يأخذ المصدق خيار المال ولا رذالته ويأخذ الوسط منه ومن كان له نصاب فاستفاد في أثناء الحول من جنسه
ضمه إلى ماله وزكاه به
والسائمة هي: التي تكتفي بالرعي في أكثر حولها فإن علفها نصف الحول أو أكثر فلا زكاة فيها
والزكاة عند أبي حنيفة وأبي يوسف في النصاب دون العفو وقال محمد: فيهما وإذا هلك المال بعد وجوب الزكاة سقطت فإن قدم الزكاة على الحول وهو مالك للنصاب جاز
## باب زكاة الفضة
ليس فيما دون مائتي درهم صدقة فإذا كانت مائتي درهم وحال عليها الحول ففيها خمسة دراهم ولا شيء في الزيادة حتى تبلغ أربعين درهما فيكون فيها درهم ثم في كل أربعين درهما درهم وقال أبو يوسف ومحمد: ما زاد على المائتين فزكاته بحسابه
وإذا كان الغالب على الورق الفضة فهي في حكم الفضة وإن كان الغالب عليها الغش فهي في حكم العروض ويعتبر أن تبلغ فيمتها نصابا
## باب زكاة الذهب
ليس فيما دون عشرين مثفالا من الذهب صدقة فإذا كانت عشرين مثقالا وحال عليها الحول ففيها نصف مثقال ثم في كل أربعة مثاقيل قيراطان وليس فيما دون أربعة مثاقيل صدقة عند أبي حنيفة
وفي تبر الذهب والفضة وحليهما والآنية منهما الزكاة
## باب زكاة العروض
الزكاة واجبة في عروض التجارة كائنة ما كانت إذا بلغت قميتها نصابا من الذهب أو الورق يقومها بما هو أنفع للفقراء والمساكين منهما
وإذا كان النصاب كاملا في طرفي الحول فنقصانه فيما بين ذلك لا يسقط الزكاة
وتضم قيمة العروض إلى الذهب والفضة وكذلك يضم الذهب إلى الفضة بالقيمة حتى يتم النصاب عند أبي حنيفة وقال أبو يوسف ومحمد: لا يضم الذهب إلى الفضة بالقيمة ويضم بالأجزاء
## باب زكاة الزروع والثمار
قال أبو حنيفة رحمه الله تعالى: في قليل ما أخرجته الأرض وكثير العشر سواء سقي سيحا أو سقته السماء إلا الحطب والقصب الحشيش
وقال أبو يوسف ومحمد: لا يجب العشر إلا فيما له ثمرة باقية إذا بلغ خمسة أوسق
والوسق: ستون صاعا بصاع النبي صلى الله عليه وآله وسلم وليس في الخضروات عندهما عشر
وما سقي بغرب أو دالية أو سانية
ففيه نصف العشر في القولين وقال أبو يوسف فيما لا يوسق كالزعفران والقطن يجب فيه العشر إذا بلغت قيمته خمسة أوسق من أدنى ما يدخل تحت الوسق
وقال محمد: يجب العشر إذا بلغ الخارج خمسة أمثال من أعلى ما يقدر به نوعه فاعتبر في القطن خمسة أحمال وفي الزعفران خمسة أمناء وفي العسل العشر إذا أخذ من أرض العشر قل أو أكثر وقال أبو يوسف: لا شيء فيه حتى يبلغ عشرة أزقاق وقال محمد: خمسة أفراق
وليس في الخارج من أرض الخراج عشر
## باب من يجوز دفع الصدقة إليه ومن لا يجوز
قال الله تعالى: ﴿إنما الصدقات للفقراء والمساكين﴾ الآية فهذه ثمانية أصناف قد سقطت منها المؤلفة قلوبهم لأن الله تعالى أعز الإسلام وأغنى عنهم
والفقير: من له أدنى شيء والمسكين: من لا شيء له والعامل: يدفع إليه الإمام بقدر عمله إن عمل وفي الرقاب: يعان المكاتبون في فك رقابهم والغارم: من لزمه دين وفي سبيل الله: منقطع الغزاة وابن السبيل: من كان له مال في وطنه وهو في مكان لا شيء له فيه فهذه جهات الزكاة
وللمالك أن يدفع إلى كل واحد منهم وله أن يقتصر على صنف واحد
ولا يجوز أن يدفع الزكاة إلى ذمي
ولا يبنى بها مسجد ولا يكفن بها ميت ولا يشترى بها رقبة تعتق ولا تدفع إلى غني ولا يدفع المزكي زكاته إلى أبيه وجده وإن علا ولا إلى ولده وولد ولده وإن سفل ولا إلى امرأته ولا تدفع المرأة إلى زوجها عند أبي حنيفة وقال أبو يوسف ومحمد: تدفع إليه
ولا يدفع إلى مكاتبه ولا
مملوكه ولا مملوك غني ولا ولد غني إذا كان صغيرا ولا تدفع إلى بني هاشم وهم: آل علي وآل عباس وآل جعفر وآل عقيل وآل حارث بن عبد المطلب ومواليهم
وقال أبو حنيفة ومحمد: إذا دفع الزكاة إلى رجل يظنه فقيرا ثم بان أنه غني أو هاشمي أو كافر أو دفع في ظلمة إلى فقير ثم بان أنه أبوه أو ابنه فلا إعادة عليه
وقال أبو يوسف عليه الإعادة
ولو دفع إلى شخص ثم علم أنه عنده أو مكاتبه لم يجز في قولهم جميعا
ولا يجوز دفع الزكاة إلى من يملك نصابا من أي مال كان ويجوز دفعها إلى من يملك أقل من ذلك وإن كان صحيحا مكتسبا
ويكره نقل الزكاة من بلد إلى بلد آخر وإنما تفرق صدقة كل قوم فيهم إلا أن ينقلها الإنسان إلى قرابته أو إلى ثوم هم أحوج من أهل بلده
## باب صدقة الفطر
صدقة الفطر واجبة على الحر المسلم إذا كان مالكا لمقدار النصاب فاضلا عن مسكنه وثيابه وأثاثه وفرسه وسلاحه وعبيده للخدمة يخرج ذلك عن نفسه وعن أولاده الصغار وعن مماليكه ولا يؤدي عن زوجته ولا عن أولاده الكبار وإن كانوا في عياله
ولا يخرج عن مكاتبه ولاعن مماليكه للتجارة والعبد بين شريكين لا فطرة على واحد منهما ويؤدي المولى المسلم الفطرة عن عبده الكافر
والفطرة: نصف صاع من بر أو صاع من تمر أو زبيب أو شعير
والصاع عند أبي حنيفه ومحمد ثمانية أرطال بالعراقي
وقال أبو يوسف: خمسة أرطال وثلث رطل
ووجوب الفطرة يتعلق بطلوع الفجر من يوم الفطر فمن مات قبل ذلك لم تجب فطرته ومن أسلم أو ولد بعد طلوع الفجر لم تجب فطرته
ويستحب للناس أن يخرجوا الفطرة يوم الفطر قبل الخروج إلى المصلى فإن قدموها قبل يوم الفطر جاز وإن أخروها عن يوم الفطر لم تسقط وكان عليهم إخراجها
# كتاب الصوم
الصوم ضربان: واجب ونفل فالواجب ضربان: منه ما يتعلق بزمام بعينه كصوم رمضان والنذر المعين فيجوز صومه بينة من الليل فإن لم ينو حتى أصبح
والضرب الثاني: ما يثبت في الذمة كقضاء رمضان والنذر المطلق والكفارات فلا يجوز إلا بنية من الليل والنفل كله يجوز بنية قبل الزوال
وينبغي للناس أن يلتمسوا الهلال في اليوم التاسع والعشرين من شعبان فإن رأوه صاموا وإن غم عليهم أكملوا عدة شعبان ثلاثين يوما ثم صاموا ومن رأى هلال رمضان وحده صام وإن لم يقبل الإمام شهادته وإذا كان بالسماء علة قبل الإمام شهادة الواحد العدل في رؤية الهلال رجلا أو امرأة حرا كان أو عبدا
فإن لم يكن بالسماء عله لم تقبل شهادته حتى يراه جمع كثير يقع
العلم بخبرهم
ووقت الصوم من طلوع الفجر الثاني إلى غروب الشمس
والصوم هو: الإمساك عن الأكل واشرب والجماع نهارا مع النية فإن أكل الصائم أو شرب أو جامع ناسيا لم يفطر وإن نام فاحتلم أو نظر إلى امرأة فأنزل أو ادهن أو احتجم أو اكتحل أو اكتحل أو قبل لم يفطره فإن أنزل بقبلة أو لمس فعليه القضاء
ولا بأس بالقبلة إذا أمن على نفسه ويكره إن لم يأمن وإن ذرعه القيء لم يفطر وإن استقاء عامدا ملء فيه فعليه القضاء ومن ابتلع الحصاة أو الحديد أفطر
ومن جامع عامدا في أحد السبيلين أو أكل أو شرب ما يتغذى به أو يتداوى به فعليه القضاء والكفارة مثل كفارة الظهار ومن جامع فيما دون الفرج فأنزل فعليه القضاء ولا
كفارة عليه في إفساد الصوم في غير رمضان كفارة ومن احتقن أو استعط أوقطر في أذنيه أو داوى جائفة أو آمة بدواء فوصل إلى جوفه أو دماغه أفطر وإن أقطر في إحليله لم يفطر عند أبي حنيفة وقال أبو يوسف يفطر
ومن ذاق شيئا بفمه لم يفطر ويكره له ذلك ويكره للمرأة أن تمضغ لصبيها الطعام إذا كان لها منه بد
ومضغ العلك لا يفطر الصائم ويكره
ومن كان مريضا في رمضان فخاف إن صام زاد مرضه أفطر وقضى وإن كان مسافرا لا يستضر بالصوم فصومه أفضل وإن أفطر وقضى جاز وإن مات المريض أو المسافر وهما على حالهما لم يلزمهما القضاء وإن صح المريض أو أقام المسافر ثم ماتا لزمهما القضاء بقدر الصحة والإقامة
وقضاء رمضان إن شاء فرقه وإن شاء تابعه فإن أخره حتى دخل رمضان آخر صام رمضان الثاني وقضى الأول بعده ولا فدية عليه
والحامل والمريض إذا خافتا على ولديهما
أفطرتا وقضتا ولا فدية عليهما
والشيخ الفاني الذي لا يقدر على الصيام يفطر ويطعم لكل يوم مسكينا كما يطعم في الكفارات
ومن مات وعليه قضاء رمضان فأوصى به أطعم عنه وليه لكل يوم مسكينا نصف صاع من بر أو صاعا من تمر أو صاعا من شعير
ومن دخل في صوم التطوع أو صلاة التطوع ثم أفسده قضاه وإذا بلغ الصبي أو أسلم الكافر في رمضان أمسكا بقية يومهما وصاما ما بعده ولم يقضيا ما مضى
ومن أغمي عليه في رمضان لم يقض اليوم الذي حدث فيه الإغماء وقضى ما بعده وإذا أفاق المجنون في بعض رمضان قضى ما مضى منه وإذا حاضت المرأة أفطرت وقضت وإذا قدم السافر أو طهرت الحائض في بعض النهار أمسكا عن الطعام والشراب بقية يومهما
ومن تسحر وهو يظن أن الفجر لم يطلع أو أفطر وهو يرى
أن الشمس قد غربت ثم تبين أن الفجر كان قد طلع أو أن الشمس لم تغرب قضى ذلك اليوم ولا كفارة عليه
ومن رأى هلال الفطر وحده لم يفطر
وإذا كان بالسماء علة لم تقبل في هلال الفطر إلا شهادة رجلين أو رجل وامرأتين وإن لم يكن بالسماء علة لم تقبل إلا شهادة جمع كثير يقع العام بخبرهم
## باب الاعتكاف
الاعتكاف مستحب وهو اللبث في المسجد مع الصوم ونية الاعتكاف
ويحرم على المعتكف: الوط واللمس والقبلة ولا يخرج من المسجد إلا لحاجة الإنسان أو الجمعة ولا بأس بأن يبيع ويبتاع في المسجد من غير أن يحضر السلع
ولا يتكام إلا بخير ويكره له الصمت فإن جامع المعتكف ليلا أو نهارا بطل اعتكافه ومن أوجب على نفسه اعتكاف أيام لزمه اعتكافها بلياليها وكانت متتابعة وإن لم يشترط التتابع
# كتاب الحج
الحج: واجب على الأحرار البالغين العقلاء الأصحاء إذا قدروا على الزاد والراحلة فاضلا عن مسكنه وما لا بد منه
وعن نفقة عياله إلى حين عوده وكان الطريق آمنا
ويعتبر في المرأة أن يكون لها محرم يحج بها أو زوج ولا يجوز لها أن تحج بغيرهما إذا كان بينها وبين مكة مسيرة ثلاثة أيام ولياليها وإذا بلغ الصبي بعد ما أحرم أو أعتق العبد فمضيا على ذلك لم يجزيهما عن حجة الإسلام
باب تحديد المواقيت
والمواقيت التي لا يجوز أن يتجاوزها الإنسان إلا محرما: لأهل المدينة ذو الحليفة ولأهل العراق ذات عرق ولأهل الشام الجحفة
ولأهل نجد قرن المنازل ولأهل اليمن يلملم فإن قدم الإحرام على هذه المواقيت جاز
ومن كان منزله بعد المواقيت فميقاته الحل ومن كان بمكة فميقاته في الحج الحرم وفي العمرة الحل
وإذا أراد الإحرام اغتسل أو توضأ - والغسل أفضل - ولبس ثوبين جديدين أو غسيلين إزارا ورداء ومس طيبا إن كان له طيب وصلى ركعتين وقال: اللهم إني أريد الحج فيسره لي وتقبله مني
ثم يلبي عقيب صلاته
فإن كان مفردا بالحج نوى بتلبيته الحج والتلبية أن يقول: لبيك اللهم لبيك لبيك لا شريك لك لبيك إن الحمد والنعمة لك والملك لا شريك لك ولا ينبغي أن يخل بشي من هذه الكلمات فإن زاد فيها جاز
فإذا لبى فقد أحرم فليتق ما نهى الله عنه من الرفث والفسوق والجدال ولا يقتل صيدا ولا يشير إليه ولا يدل عليه ولا يلبس قميصا ولا سراويل ولا عمامة ولا قلنسوة ولا قباء
ولا خفين إلا أن لا يجد النعلين فيقطعهما أسفل الكعبين ولا يغطي رأسه ولا
وجهه ولا يمس طيبا ولا يحلق رأسه ولا شعر بدنه ولا يقص من لحيته ولا من ظفره ولا يلبس ثوبا مصبوغا بورس زعفران ولا عصفر إلا أن يكون غسلا لا ينفض
ولا بأس أن يغتسل ويدخل الحمام ويستظل بالبيت والمخمل ويشد في وسطه الهميان
ولا يغتسل رأسه ولا لحيته بالخطمي ويكثر من التلبية عقب الصلوات وكلما علا شرفا أو هبط واديا أو لقي ركبانا وبالأسحار
فإذا دخل مكة ابتدأ بالمسجد الحرام فإذا عاين البيت كبر وهلل ثم ابتدأ بالحجر الأسود فاستقبله وكبر ورفع يديه واستلمه وقبله إن استطاع من غير أن يؤدي مسلما ثم آخذ عن يمينه مما يلي الباب وقد اضطبع رداءه قبل ذلك فيطوف بالبيت سبعة أشواط
ويجعل طوافه من وراء الحطيم ويرمل في الأشواط الثلاثة الأول ويمشي فيما بقي على هينته ويستلم الحجر كلما مر به إن استطاع ويختم الطواف بالاستلام
ثم يأتي المقام فيصلي عنده ركعتين أو حيث تيسر من المسجد
وهذا الطواف طواف القدوم وهو سنة وليس بواجب وليس على أهل مكة طواف القدوم
ثم يخرج إلى الصفا فيصعد عليه ويستقبل البيت ويكبر ويهلل ويصلي على النبي صلى الله عليه وآله وسلم ويدعو الله تعالى بحاجته
ثم ينحط نحو المروة ويمشي على هينته فإذا بلغ إلى بطن الوادي سعى بين الميلين الأخضرين سعيا حتى يأتي المروة فيصعد عليها ويفعل كما فعل على الصفا وهذا شوط فيطوف سبعة أشواط يبدأ بالصفا ويختم بالمروة
ثم يقيم بمكة حراما يطوف بالبيت كلما بدا له فإذا كان قبل يوم التروية بيوم خطب الإمام خطبة يعلم الناس فيها الخروج إلى منى والصلاة بعرفات والوقوف والإفاضة فإذا صلى الفجر يوم التروية بمكة خرج إلى منى فأقام بها حتى يصلي الفجر يوم عرفة
ثم يتوجه إلى عرفات فيقيم بها
فإذا زالت الشمس من يوم عرفة صلى الإمام بالناس الظهر والعصر ثم يبتدئ فيخطب خطبتين قبل الصلاة يعلم الناس فيها
الصلاة والوقوف بعرفة والمزدلفة ورمي الجمار والنحر والحلق وطواف الزيارة ويصلي بهم الظهر والعصر في وقت الظهر بأذان ةإقامتين ومن صلى في رحله وحده صلى كل واحدة منهما في وقتها عند أبي حنيفة رحمه الله تعالى
وقال أبو يوسف ومحمد رحمهما الله: يجمع بينهما المنفرد ثم يتوجه إلى الموقف فيقف بقرب الجبل وعرفات كلها موقف إلا بطن عرنة
وينبغي للإمام أن يقف بعرفة على راحلته ويدعو ويعلم الناس المناسك ويستحب أن يغتسل قبل الوقوف ويجتهد في الدعاء فإذا غربت الشمس أفاض الإمام والناس معه على
هينتهم حتى يأتوا المزدلفة فينزلوا بها والمستحب أن ينزل بقرب الجبل الذي عليه الميقدة يقال له قزح ويصلي الإمام بالناس المغرب والعشاء بأذان وإقامة ومن صلى المغرب في الطريق لم يجز عند أبي حنيفة ومحمد
فإذا طلع الفجر صلى الإمام بالناس الفجر بغلس ثم وقف ووقف الناس معه فدعا: والمزدلفة كلها موقف إلا بطن محسر
ثم أفاض الإمام والناس معه قبل طلوع الشمس حتى يأتوا منى فيبتدئ بجمرة العقبة فيرميها من بطن الوادي بسبع حصيات مثل الخذف
ويكبر مع كل حصاة ولا يقف عندها ويقطع التلبية مع أول حصاة
ثم يذبح إن أحب ثم يحلق أو يقصر والحلق أفضل وقد حل له كل شيء إلا النساء
ثم يأتي مكة من يومه ذلك أو من الغد أو من بعد الغد فيطوف بالبيت طواف الزيارة ستعة أشواط فإن كان سعى بين الصفا والمروة عقيب طواف القدوم لم يرمل في هذا الطواف ولا سعي عليه وإن لم يكن قدم السعي رمل في هذا الطواف وسعى بعده على ما قدمناه وقد حل له النساء وهذا الطواف هو المفروض في الحج ويكره تأخيره عن هذه الأيام فإن أخره عنها لزمه دم عند أبي حنيفة
ثم يعود إلى منى فيقيم بها فإذا زالت الشمس من اليوم الثاني من النحر رمى الجمار الثلاث يبتدئ بالتي تلي المسجد فيرميها بسبع حصيات يكبر مع كل حصاة ويقف ويدعو عندها ثم يرمي التي تليها مثل ذلك ويقف عندها ثم يرمي جمرة العقبة كذلك ولا يقف عندها فإذا كان من الغد رمى الجمار الثلاث بعد زوال الشمس كذلك فإذا أراد أن يتعجل النفر نفر إلى مكة وإن أراد أن يقيم رمى الجمار الثلاث في يوم الرابع بعد زوال الشمس فإن قدم الرمي في هذا اليوم قبل الزوال بعد طلوع الفجر جاز عند
أبي حنيفة رحمه الله، ويكره أن يقدم الإنسان ثقله إلى مكة ويقيم بها حتى يرمي فإذا نفر إلى مكة نزل بالمحصب ثم طاف بالبيت سبعة أشواط لا يرمل فيها وهذا طواف الصدر هو واجب إلا على أهل مكة ثم يعود إلى أهله
فإن لم يدخل المحرم مكة وتوجه إلى عرفات ووقف بها على ما قدمناه فقد سقط عنه طواف القدوم ولا شيء عليه لتركه
ومن أدرك الوقوف بعرفة ما بين زوال الشمس من يوم عرفة إلى طلوع الفجر من يوم النحر فقد أدرك الحج
ومن اجتاز بعرفة وهو نائم أو مغمى عليه أو لم يعلم أنها عرفة أجزأه ذلك عن الوقوف
والمرأة في جميع ذلك كالرجل غير أنها لا تكشف رأسها وتكشف وجهها ولا ترفع صوتها بالتلبية ولا ترمل في الطواف ولا تسعى بين الميلين ولا تحلق رأسها ولكن تقصر
## باب القران
القران أفضل عندنا من التمتع والإفراد
وصفة القران:
أن يهمل بالعمرة والحج معا من الميقيات
ويقول عقيب صلاته: اللهم إني أريد الحج والعمرة فيسرهما لي وتقبلهما مني فإذا دخل مكة ابتدأ فطاف بالبيت سبعة أشواط يرمل في الثلاث الأول منها ويسعى يعدها بين الصفا والمروة وهذه أفعال العمرة
ثم يطوف بعد السعي طواف القدوم ويسعى بين الصفا والمروة كما بينا في المفرد فإذا رمى الجمرة يوم النحر ذبح شاة أو بقرة أو بدنة أوسبع بدنة فهذا دم القران
فإن لم يكن له ما يذبح صام ثلاثة أيام في الحج وآخرها يوم عرفة فإن فاته الصوم حتى جاء يوم النحر لم يجزه إلا الدم ثم يصوم سبعة أيام إذا رجع إلى أهله وإن صامها بمكة بعد فراغه من الحج جاز
وإن لم يدخل القارن مكة وتوجه مكة وتوجه إلى عرفات فقد صار رافضا لعمرته بالوقوف وبطل عنه دم القران وعليه دم لرفض عمرته وعليه قضاؤها
## باب التمتع
التمتع أفضل من الإفراد عندنا
والتمتع على وجهين:
ومتمتع يسوق الهدي ومتمتع لا بسوق الهدي
وصفة التمتع:
أن يبتدئ من الميقات فيحرم بعمرة ويدخل مكة فيطوف لها ويسعى ويحلق أو يقصر وقد حل من عمرته
ويقطع التلبية إذا ابتدأ بالطواف ويقيم بمكة حلالا فإذا كان يوم التروية أحرم بالحج من المسجد وفعل ما يفعله الحاج المفرد وعليه دم التمتع فإن لم يجد صام ثلاثة أيام في الحج وسبعة إذا رجع
وإذا أراد المتمتع أن يسوق الهدي أحرم وساق هديه فإن كانت بدنة قلدها بمزادة أو نعل وأشعر البدنة عند أبي يوسف ومحمد وهو: أن يشق سنامها من الجانب الأيمن ولا يشعرها عند أبي حنيفة
فإذا دخل مكة طاف وسعى ولم يتحلل حتى يحرم بالحج يوم التروية وإن قدم الإحرام قبله جاز وعليه دم فإذا حلق يوم النحر فقد حل من الإحرامين
وليس لأهل مكة تمتع ولا قران وإنما لهم الإفراد خاصة
وإذا عاد التمتع إلى أهله بعد فراغه من العمرة ولم يكن ساق الهدي بطل تمتعه
ومن أحرم بالعمرة قبل أشهر الحج فطاف لها أقل من أربعة أشواط ثم دخلت أشهر الحج فتممها وأحرم بالحج كان متمتعا
وإن طاف لعمرته قبل أشهر الحج أربعة أشواط فصاعدا ثم حج من عامه ذلك لم يكن متمتعا
وأشهر الحج:
شوال وذو القعدة وعشر من ذي الحجة فإن قدم الإحرام بالحج عليها جاز إحرامه وانعقد حجا
وإذا حاضت المرأة عند الإحرام اغتسلت وأحرمت وصنعت كما يصنعة الحاج
غير أنها لا تطوف بالبيت حتى تطهر وإن حاضت بعد الوقوف وطواف الزيارة انصرفت من مكة ولا شيء عليها لترك طواف الصدر
## باب جنايات المحرم
إذا تطيب المحرم فعليه الكفارة فإذا طيب عضوا كاملا فما زاد فعليه دم وإن طيب أقل من عضو فعليه صدقة
وإن لبس ثوبا مخيطا أو غطى رأسه يوما كاملا فعليه دم وإن كان أقل من ذلك فعليه صدقة وإن حلق ربع رأسه فصاعدا فعليه دم وإن حلق أقل من الربع فعليه صدقة
وإن حلق مواضع المحاجم فعليه دم عند أبي حنيفة وقال أبو يوسف ومحمد: عليه صدقة وإن قص أظافير يديه ورجليه فعليه دم
وإن قص يدا أو رجلا فعليه دم وإن قص أقل من خمسة أظافير متفرقة من يديه ورجليه فعليه صدقة عند أبي حنيفة وأبي يوسف وقال محمد: عليه دم
وإن تطيب أو حلق أو لبس من عذر فهو مخير: إن شاء ذبح شاة وإن شاء تصدق على ستة مساكين بثلاثة أصوع من طعام وإن شاء صام ثلاثة أيام
وإن قبل أو لمس بشهوة فعليه دم ومن جامع في أحد السبيلين قبل الوقوف بعرفة فسد حجه وعليه شاة ويمضي في الحج كما يمضي من لم يفسد حجه وعليه القضاء وليس عليه أن يفارق امرأته إذا حج بها في القضاء
ومن جامع بعد الوقوف بعرفة لم يفسد حجه وعليه بدنة فإن جامع بعد الحلق فعليه شاة ومن جامع في العمرة يقبل أن يطوق أربعة أشواط أفسدها ومضى فيها وقضاها وعليه شاة وإن وطئ بعدها طاف أربعة أشواط فعليه شاة ولا تفسد عمرته ولا يلزمه قضاؤها ومن جامع ناسيا كمن جامع عامدا
ومن طاف طواف القدوم محدثا فعليه صدقه وإن طاف جنبا فعليه شاة ومن طاف طواف الزيارة محدثا فعليه شاة وإن كان
جنبا فلعيه بدنة والأفضل أن يعيد الطواف ما دام بمكة ولا ذبح عليه ومن طاف طواف الصدر محدثا فعليه صدقة وإن طاف جنبا فعليه شاة
ومن ترك من طواف الزيارة ثلاثة أشواط فما دونها فعليه شاة وإن ترك أربعة أشواط بقي محرما أبدا حتى يطوفها ومن ترك ثلاثة أشواط من طواف الصدر فعليه صدقة وإن ترك طواف الصدر أو أربعة أشواط منه فعليه شاة
ومن ترك السعي بين الصفا والمروة فعليه شاة وحجه تام
ومن أقاض من عرفه قبل الإمام فعليه دم
ومن ترك الوقوف بالمزدلفة فعليه دم
ومن ترك رمي الجمار في الأيام كلها فعليه دم وإن ترك رمي يوم واحد فعليه دم وإن ترك رمي إحدى الجمار الثلاث فعليه صدقة وإن ترك رمي جمرة العقبة في يوم النحر فعليه دم
ومن أخر الحلف حتى مضت أيام النحر فعليه دم عند أبي حنيفة وكذلك لو أخر طواف الزيارة عند أبي حنيفة رحمه الله
وإذا قتل المحرم صيدا أو دل عليه من قتله فعليه الجزاء يستوي في ذلك العامد والناسي والمبتدئ والعائد والجزاء عند أبي حنيفة وأبي يوسف أن يقوم الصيد في المكان الذي قتله فيه أو في أقرب المواضع منه إن كان في برية يقومه ذوا عدل ثم هو مخير في القيمة إن شاء ابتاع بها هديا وإن شاء اشترى بها طعاما فتصدق به على كل مسكين نصيف صاع من بر أو صاعا من تمر أوشعير وإن شاء صام عن كل نصف صاع من بر يوما وعن كل صاع من شعير يوما فإن فضل من الطعام أقل من نصف صاع فهو مخير: إن شاء تصدق به وإن شاء صام عنه يوما كاملا
وقال محمد: يجب في الصيد النظير فيما له نظير ففي الظبي شاة وفي الضبع شاة وفي الأرنب عناق وفي النعامة بدنة وفي اليربوع جفرة ومن جرح صيدا أو نتف شعره أو قطع عضوا منه ضمن ما نقصه وإن نتف ريش طائر أو قطع قوائم صيد فخرج من حيز الامتناع فعليه قيمته كاملة ومن كسر بيض صيد فعليه قيمته فإن خرج من البيض فرخ فلعيه قيمته كاملة ومن كسر بيض صيد فعليه قيمته فإن خرج من البيض فرخ ميت فعليه قيمته حيا وليس في قتل الغراب والحدأة والذئب والحية والعقرب والفأرة جزاء
وليس في قتل البعوض والبراغيث والقراد شيء
ومن قتل قملة تصدق بما شاء ومن قتل جرادة تصدق بما شاء وتمرة خير من جرادة
ومن قتل ما لا يؤكل لحمه من الصيد كالسباع ونحوها فعليه الجزاء ولا يتجاوز بقيمتها شاة
وإن
صال السبع على محرم فقتله فلا شيء عليه
وإن اضطر المحرم إلى أكل لحم الصيد فقتله فعليه الجزاء ولا بأس أن يذبح المحرم الشاة والبقرة والبعير والدجاج والبط الكسكري وإن قتل حماما مسرولا أو ظبيا مستأنسا فعليه الجزاء
وإن ذبح المحرم صيدا فذبيحته ميتة لا يحل أكلها ولا بأس أن يأحل المحرم لحم صيد اصطاده أو ذبحه إذا لم يدله المحرم عليه ولا أمره بصيده وفي صيد الحرم إذا ذبحه الحلال فعليه الجزاء وإن قطع حشيش الحرم أو شجره الذي ليس بمملوك ولا هو مما ينبته الناس فعليه قيمته
وكل شيء فعله القارن مما ذكرنا أن فيه على المفرد دما فعليه دمان: دم لحجته ودم لعمرته إلا أن يتجاوز الميقات من غير إحرام ثم يحرم بالعمرة والحج فيلزمه دم واحد وإذا اشترك المحرمان في قتل صيد فعلى كل واحد منهما الجزاء كاملا وإذا اشترك الحلالان في قتل صيد الحرم فعليهما جزاء واحد
وإذا باع المحرم صيدا أو ابتاعه فالبيع باطل
## باب الإحصار
إذا أحصر المحرم بعدو أو أصابه مرض منعه من المضي جاز له التحلل وقيل له: ابعث شاة تذبح في الحرم وواعد من يحملها يوما بعينه يذبحها فيه ثم تحلل وإن كان قارنا بعث بدمين
ولا يجوز ذبح دم الإحصار إلا في الحرم ويجوز ذبحه قبل يوم النحر عند أبي حنيفة وقال أبو يوسف ومحمد رحمهما الله: لا يجوز الذبح للمحصر بالحج إلا في يوم النحر
ويجوز للمحصر بالعمرة أن يذبح متى شاء والمحصر بالحج إذا تحلل فعليه
حجة وعمرة وعلى المحصر بالعمرة القضاء وعلى القارن حجة وعمرتان
وإذا بعث المحصر هديا وواعدهم أيذبحوه في يوم بعينه ثم زال الإحصار فإن قدر على إدراك الهدي والحج لم يجز له التحلل ولزمه المضي وإن قدر على إدراك الهدي دون الحج تحلل وإن قدر على إدراك الحج دون الهدي جاز له التحلل استحسانا
ومن أحضر بمكة وهو ممنوع من الوقوف والطواف كان محصرا وإن قدر على إحدهما فليس بمحصر
## باب الفوات
ومن أحرم بالحج ففاته الوقوف بعرفة حتى طلع
الفجر من يوم النحر فقد فاته الحج وعليه أن يطوف ويسعى ويتحلل ويقضي الحج من قابل ولا دم عليه
والعمرة لا تفوت وهي جائزة في جميع السنة إلا خمسة أيام يكره فعلها فيها: يوم عرفة ويوم النحر وأيام التشريق
والعمرة سنة وهي: الإحرام والطواف والسعي والحلق أو التقصير
## باب الهدي
الهدي: أدناه شاة
وهو من ثلاثة نوع: الإبل والبقر والغنم يجزئ في ذلك الثني فصاعدا إلا من الضأن فإن الجذع منه يجزئ ولا يجوز في الهدي مقطوع الأذن أو أكثرها ولا مقطوع الذنب ولا اليد ولا الرجل ولا الذاهبة العين ولا العجفاء ولا العرجاء التي لا تمشي إلى المسك والشاة جائزة في كل شيء إلا في موضعين: من طاف طواف الزيارة جنبا ومن جامع بعد الوقوف بعرفة فإنه لا يجوز إلا بدنة
والبدنة والبقرة تجزئ كل واحدة منهما عن سبعة إذا كان كل
واحد من الشركاء يريد القربة فإن أراد أحدهم بنصيبه اللحم لم يجزئ عن الباقين ويجوز الأكل من هدي التطوع والمتعة والقران
ولا يجوز الأكل من بقية الهدايا ولا يجوز ذبح هدي التطوع
والمتعة والقران إلا في يوم النحر ويجوز ذبح بقية الهدايا أي وقت شاء ولا يجوز ذبح الهدايا إلا في الحرم ويجوز أن يتصدق بها على مساكين الحرم وغيرهم ولا يجب التعريف بالهدايا والأفضل في البدن النحر وفي البقر والغنم الذبح
والأولى أن يتولى الإنسان ذبحها بنفسه إذا كان يحسن ذلك ويتصدق بجلالها وخطامها ولا يعطي أجرة الجزار منها
ومن ساق بدنة فاضطر إلى ركوبها ركبها وإن استغنى عن ذلك لم يركبها وإن كان لها لبن لم يحلبها وينضح ضرعها بالماء البارد حتى ينقطع اللبن
ومن ساق هديا فعطب فإن كان تطوعا فليس عليه غيره وإن كان عن واجب فعليه أن يقيم غيره مقامه وإن أصابه عيب كبير أقام غيره مقامه
وصنع بالمغيب ما شاء وإذا عطبت البدنة في الطريق فإن كان تطوعا نحرها وصبغ نعلها بدمها وضرب بها صفحتها ولا يأكل منها هو ولا غيره من الأغنياء وإن كانت واجبة أقام غيرها مقامها وصنع بها ما شاء ويقلد هدي التطوع والمتعة والقران ولا يقلد دم الإحصار ولا دم الجنايات
# كتاب البيوع
البيع: ينعقد بالإيجاب والقبول إذا كانا بلفظ الماضي
وإذا أوجب أحد المتعاقدين البيع فالآخر بالخيار: إن شاء قبل في المجلس وإن شاء رده وأيهما قام من المجلس قبل القبول بطل الإيجاب وإذا حصل الإيجاب والقبول لزم البيع ولا خيار لواحد منهما إلا من عيب أو عدم رؤية والأعواض المشار إليها لا يحتاج إلى معرفة مقدراها في جواز البيع والأثمان المطلقة لا تصح إلا أن تكون معروفة القدر والصفة
ويجوز البيع بثمن حال ومؤجل إذا كان الأجل معلوما ومن أطلق الثمن في البيع كان على غالب نقد البلد فإن كانت النقود مختلفة فالبيع فاسد إلا أن يبين أحدها
ويجوز بيع الطعام والحبوب مكايلة ومجازفة وبإناء بعينه لا يعرف مقدراه وبوزن حجر بعينه لا يعرف مقداره ومن باع صبرة طعام كل قفيز بدرهم جاز البيع في قفيز واحد عند أبي حنيفة إلا أن يسمي جملة قفزانها ومن باع قطيع غنم كل شاة بدرهم فالبيع فاسد في جميعها وكذلك من باع ثوبا مذارعة كل ذراع
بدرهم ولم يسم جمله الذرعان ومن ابتاع صبرة على أنها قفيز بمائة درهم فوجدها أقل كان المشتري بالخيار: إن شاء أخذ الموجود بحصته من الثمن وإن شاء فسخ البيع وإن وجدها أكثر فالزيادة للبائع ومن اشترى ثوبا على أنه عشرة أذرع بعشرة دراهم أو أرضا على أنها مائة ذراع بمائة درهم فوجدها أقل فالمشتري بالخيار: إن شاء أخذها بجملة الثمن وإن شاء تركها وإن وجدها أكثر من الذراع الذي سماه فهو المشتري ولا خيار للبائع وإن قال: بعتكها على أنها مائة ذراع بمائة درهم كل ذراع بدرهم فوجدها ناقصة فهو الخيار: إن شاء أخذها بحصتها من الثمن وإن شاء تركها وإن وجدها
زائد كان المشتري بالخيار: إن شاء أخذ الجيمع كل ذراع بدرهم وإن شاء فسخ البيع ومن باع دارا دخل بناؤها في البيع وإن لم يسمه
ومن باع أرضا دخل ما فيها وإن لم يسمه ولا يدخل الزرع في بيع الأرض إلا بالتسمية ومن باع نخلا أو شجرا فيه ثمر فثمرته للبائع إلا أن يشترطها المبتاع ويقال للبائع: اقطعها وسلم المبيع ومن باع ثمرة لم يبد صلاحها أو قد بدا جاز البيع ووجب على المشتري قطعها في الحال فإن شرط تركها على النخل فسد البيع
ولا يجوز أن يبيع ثمرة ويستثني منها أرطالا معلومة ويجوز بيع الحنطة في سبيلها والباقلاء في قشرها ومن باع دارا دخل في المبيع مفاتيح أغلاقها وأجرة الكيال وناقد الثمن على البائع وأجرة وزان الثمن على المشتري ومن باع سلعة بثمن قيل للمشتري: ادفع الثمن أولا فإذا دفع قيل للبائع: سلم البيع ومن باع سلعة بسلعة أو ثمنا بثمن قيل لهما سلما معا
## باب خيار الشرط
خيار الشرط: جائز في البيع للبائع والمشتري ولهما الخيار ثلاثة أيام فما دونها ولا يجوز أكثر من ذلك عند أبي حنيفة رحمه الله وقال أبو يوسف ومحمد رحمهما الله: يجوز إذا سمى مدة معلومة
وخيار البائع يمنع خروج المبيع من ملكه فإن قبضه المشتري فهلك في يده صمنه بالقيمة وخيار المشتري لا يمنع خروج المبيع من ملك البائع إلا أن المشتري لا يملكه عند أبي حنيفة وعندهما يملكه فإن هلك في يده هلك بالثمن وكذلك إن دخله عيب ومن شرط له الخيار فله أن يفسخ في مدة الخيار وله أن يجيزه فإن أجازه بغير حضره صاحبه جاز وإن فسخ لم يجز إلا أن يكون الآخر حاضرا وإذا مات من له الخيار بطل خياره ولم ينتقل إلى ورثته
ومن باع عبدا على أنه خباز أو كاتب بخلاف ذلك فالمشتري بالخيار: إن شاء أخذه بجميع الثمن وإن شاء ترك
## باب خيار الرؤية
ومن اشتر شيئا لم يره فالبيع جائز
وله الخيار إذا رآه: إن شاء أخذه وإن شاء دره ومن باع ما لم يره فلا خيار له ومن نظر إلى وجه الصبرة إلى ظاهر الثوب مطويا أو إلى وجه الجارية أو إلى وجه الدابة وكفلها فلا خيار له وإن رأى صحن الدار فلا خيار له وإن لم يشاهد
بيوتها وبيع الأعمى وشرؤاه جائز وله الخيار إذا اشترى ويسقط خياره بأن يجس المبيع إذا كان يعرف بالجس أو يشمه إذا كان يعرف بالشم أو يذوقه إذا كان يعرف بالذوق ولا يسقط خياره في العقار حتى يوصف له
ومن باع ملك غيره أمره فالمالك بالخيار: إن شاء أجاز البيع وإن شاء فسخ وله الإجازة إذا كان المعقود عليه باقيا والمتعاقدان بحالهما
ومن رأى أحد ثوبين فاشتراهما ثم رأى الآخر جاز له أن يردهما
ومن مات وله خيار الرؤية بطل خياره ومن رأى شيئا ثم اشتراه بعد مدة: فإن كان على الصفة التي رآه فلا خيار له وإن وجده متغيرا فله الخيار
## باب خيار العيب
إذا طلع المشتري على عيب في المبيع فهو الخيار: إن شاء أخذه بجميع الثمن وإن شاء رده وليس له أن يمسكه ويأخذ النقصان
وكل ما أوجب نقصان الثمن في عادة التجار فهو عيب والإباق والبول في الفراش والسرقة عيب في الصغير ما لم يبلغ فإذا بلغ
فليس ذلك بعيب حتى يعادوه بعد البلوغ والبخر والدفر عيب في الجارية وليس بعيب في الغلام إلا أن يكون من داء والزنا وولد الزنا عيب في الجارية دون الغلام
وإذا حدث عند المشتري عيب ثم اطلع على عيب كان عند البائع فله أن يرجع بنقصان العيب ولا يرد المبيع إلا أن يرضى البائع أن يأخذه بعيبه وإن قطع المشتري الثوب فوجد به عيبا رجع بالعيب وإن خاطه أو صبغه أو لت السويق بسمن ثم اطلع على عيب رجع بنقصانه وليس للبائع أن يأخذه ومن اشترى عبدا فأعتقه أو مات ثم اطلع على عيب رجع بنقصانه فإن قتل المشتري العبد أو كان طعاما فأكله لم يرجع عليه بشيء في قول أبي حنيفة وقال أبو يوسف ومحمد: يرجع
ومن باعا عبدا فباعه المشتري ثم رد عليه بعيب فإن قبله بقضاء القاضي فله أن يرده على بائعه وإن قبله بغير قضاء القاضي فليس له أن يرده
ومن اشترى عبدا وشرط البراءة من كل عيب فليس له أن يرده بعيب وإن لم يسم العيوب ولم يعدها
## باب البيع الفاسد
إذا كان أحد العوضين أو كلاهما محرما فالبيع فاسد كالبيع بالميتة أو بالدم أو بالخمر أو بالخنزير وكذلك إذا كان غير مملوك كالحر وبيع أم الولد والمدبر والمكاتب فاسد ولا يجوز بيع السمك في الماء ولا بيع الطير في الهواء ولا يجوز بيع الحمل ولا النتاج ولا بيع اللبن في الضرع والصرف على ظهر الغنم وذراع من ثوب وجذع في سقف وضربة القانص وبيع المزابنة - وهو بيع الثمر على رؤوس النخل بخرصه تمرا - ولا يجوز البيع بإلقاء الحجر والملامسة
ولا يجوز بيع ثوب من ثوبين
ومن باع عبدا على أن يعتقه المشتري أو يدبره أو يكاتبه أو باع أمة على أن يستولدها فالبيع فاسد وكذلك لو باع عبدا على أن يستخدمه البائع شهرا أو دارا
على أن يسكهنا أو على أن يقرضه المشتري درهما أو على أن يهدي له هدية
ومن باع عينا على أن لا يسلمها إلى رأس الشهر فالبيع فاسد ومن باع جارية إلا حملها فسد البيع
ومن اشترى ثوبا على أن يقطعه البائع ويخيطه قميصا أو قباء أو نعلا على أن يحذوها أو يشركها فالبيع فاسد والبيع إلى النيروز والمهرجان وصوم النصارى وفطر اليهود - إذا
لم يعرف المتبايعان ذلك فالبيع فاسد
ولا يجوز البيع إلى الحصاد والدياس والقطاف وقدوم الحاج فإن تراضيا
بإسقاط الأجل قبل أن يأخذ الناس في الحصاد والدياس وقبل قدوم الحاج جاز البيع
وإذا قبض المشتري المبيع في البيع الفاسد بأمر البائع وفي العقد عوضان كل واحد منهما مال ملك المبيع ولزمته قيمته ولكل واحد من المتعاقدين فسخه فإن باعه المشتري نفذ بيعه
ومن جمع بين حر وعبد أو شاة ذكية وميتة بطل البيع فيهما ومن جمع بين عبد ومدبر أو عبده وعبد غيره صح العقد في العبد بحصته من الثمن
ونهى رسول الله صلى الله عليه وآله وسلم عن النجش وعن السوم على سوم غيره وعن تلقي الجلب وعن بيع الحاضر للبادي وعن البيع عند أذان الجمعة وكل ذلك يكره ولا يفسد به العقد
ومن ملك مملوكين صغيرين أحدهما ذو رحم محرم من الآخر لم يفرق بينهما وكذلك إن كان أحدهما كبيرا والآخر صغيرا فإن فرق بينهما كره له ذلك وجاز البيع وإن كانا كبيرين فلا بأس بالتفريق بينهما
## باب الإقالة
الإقالة: جائزة في البيع
بمثل الثمن الأول فإن شرط أقل منه أو أكثر فالشرط باطل ويرد مثل الثمن الأول وهي فسخ في حق المتعاقدين بيع جديد في حق غيرهما في قول أبي حنيفة
وهلاك الثمن لا يمنع صحة الإقالة وهلاك المبيع يمنع منها فإن هلك بعض المبيع جازت الإقالة في باقيه
## باب المرابحة والتولية
المرابحة: نقل ما ملكه بالعقد الأول بالثمن الأول
مع زيادة ربح
والتولية: نقل ما ملكه بالعقد الأول بالثمن الأول من غير زيادة ربح
ولا تصح المرابحة ولا التولية حتى يكون العوض مما له مثل ويجوز أن يضيف إلى رأس المال أجرة القصار والصباغ والطراز والفتل وأجرة حمل الطعام ولكن يقول: قام علي بكذا ولا يقول: اشتريته بكذا
فإن اطلع المشتري على خيانة في المرابحة فهو بالخيار عند أبي حنيفة: إن شاء أخذه بجميع الثمن وإن شاء رده وإن اطلع على خيانة في التولية أسقطها المشتري من الثمن
وقال أبو يوسف: يحط فيهما وقال محمد: لا يحط فيهما
ومن اشترى شيئا مما ينقل ويحول لم يجز له بيعه حتى يقبضه ويجوز بيع العقار قبل القبض عند أبي حنيفة وأبي يوسف وقال محمد: لا يجوز
ومن اشترى مكيلا مكايلة أو موزونا موازنة فاكتاله أو أتزنه ثم باعه مكايلة أو موازنة لم يجز للمشتري منه أن يبيعه ولا يأكله حتى يعيد الكيل والوزن والتصرف في الثمن قبل القبض في الثمن قبل القبض جائز
ويجوز للمشتري أن يزيد البائع في الثمن ويجوز للبائع أن يزيد في المبيع ويجوز أن يحط من الثمن ويتعلق الإستحقاق بجميع ذلك
ومن باع بثمن حال ثم أجله أجلا معلوما مؤجلا وكل دين حال إذا أجله صاحبه صار مؤجلا إلا القرض فإن تأجيله لا يصح
## باب الربا
الربا محرم كل مكيل أو موزون إذا بيع بجنسه متفاضلا فالعلة فيه الكيل مع الجنس مع الجنس أو الوزن مع الجنس فإذا بيع المكيل أو الموزون بجنسه مثلا بمثل جاز البيع وإن تفاضلا لم يجز
ولا يجوز: بيع الجيد بالرديء مما فيه إلا مثلا بمثل فإذا عدم الوصفان الجنس والمعنى المضموم إليه حل التفاضل والنساء وإذا وجدوا حرم التفاضل والنساء وإذا وجد أحدهما وعدم الآخر حل التفاضل وحرم النساء
وكل شيء نص رسول الله صلى الله عليه وآله وسلم على تحريم التفاضل فيه كيلا فهو مكيل أبدا وإن ترك الناس الكيل فيه مثل الحنطة والشعير والتمر والملح وكل ما نص على تحريم التفاضل فيه وزنا فهو موزون أبدا مثل الذهب والفضة وما لم ينص عليه فهو محمول عادات الناس
وعقد الصرف: بما وقع على جنس الأثمان يعتبر فيه قبض عوضيه في وما سواه مما فيه الربا يعتبر فيه التعيين ولا يعتبر فيه التقابض ولا يجوز بيع الحنطة بالدقيق ولا بالسويق
ويجوز: بيع اللحم بالحيوان عند أبي حنيفة وأبي يوسف وقال محمد: لا يجوز إلا أن يكون اللحم الذي في الحيوان أقل مما هو المعقود عليه
ويجوز: بيع الرطب بالتمر مثلا بمثل والعنب بالزبيب ولا يجوز بيع الزيتون بالزيت والسمسم بالشيرج
حتى يكون الزيت والشيرج أكثر مما في الزيتون والسمسم فيكون الدهن بمثله والزيادة بالثجير
ويجوز بيع اللحمان المختلفة بعضها ببعض متفاضلا وكذلك ألبان البقر والغنم وحل الدقل بخل العنب ويجوز بيع الخبز بالحنطة والدهن متفاضلا
ولا ربا بين المولى وعبده ولا بين المسلم والحربي في دار الحرب
## باب السلم
السلم جائز في المكيلات والموزونات والمعدودات التي لا تتفاوت كالجوز والبيض وفي المذروعات ولا يجوز السلم في الحيوان ولا في أطرافه ولا في الجلود عددا ولا في الحطب حزما ولا في الرطبة جرزا
ولا يجوز السلم حتى يكون المسلم فيه موجودا من حين العقد إلى حين المحل ولا يصح السلم إلا مؤجلا ولا يجوز إلا بأجل معلوم ولا يجوز السلم بمكيال رجل بعينه ولا بذراع رجل بعينه
ولا في طعام قرية بعينها ولا ثمرة نخلة بعينها
ولا يصح السلم عند أبي حنيفة إلا بسبع شرائط تذكر العقد: جنس معلوم ونوع معلوم وصفة معلومة وأجل معلوم ومعرفة مقدار رأس المال إذا كان مما يتعلق العقد على قدره كالمكيل والموزون والمعدود وتسمية المكان الذي يوافيه فيه إذا كان له حمل ومؤنة
وقال أبو يوسف ومحمد: لا يحتاج إلى تسمية رأس المال إذا كان معنيا ولا إلى مكان التسليم ويسلمه في موضع العقد
ولا يصح السلم حتى يقبض رأس المال قبل أن يفارقه
ولا يجوز التصرف في رأس المال ولا في المسلم فيه قبل قبض ولا تجوز الشركة ولا التولية في المسلم فيه قبل قبضه
ويجوز السلم في الثياب إذا سمى طولا وعرضا ورقعة ولا يجوز السلم في الجواهر ولا في الخرز ولا بأس بالسلم في اللبن والآجر إذا سمى ملبنا معلوما
وكل ما أمكن ضبط صفته ومعرفة مقدراه جاز السلم فيه وما لا يمكن ضبط صفته ولا يعرف مقدراه لا يجوز السلم فيه
ويجوز بيع الكلب والفهد والسباع ولا يجوز بيع الخمر والخنزير ولا يجوز بيع دود القز إلا أن يكون مع القز ولا النحل إلا مع الكوارات
وأهل الذمة في البياعات كالمسلمين إلا في الخمر والخنزير خاصة فإن عقدهم على الخمر كعقد المسلم على العصير وعقدهم على الخنزير كعقد المسلم على الشاة
## باب الصرف
الصرف هو: البيع إذا كان كل واحد من العوضين من جنس الأثمان فإن باع فضة بفضة أو ذهبا بذهب لم يجز إلا مثلا بمثل وإن اختلفا في الجودة والصياغة ولا بد من قبض العوضين قبل الافترق
وإذا باع الذهب بالفضة جاز التفاضل ووجب التقابض وإن افترقا في الصرف قبل قبض العوضين أو أحدهما بطل العقد
ولا يجوز التصرف في ثمن الصرف قبل قبضه
ويجوز بيع الذهب بالفضة مجازفة
ومن باع سيفا محلى بمائة درهم وحليته خمسون درهما فدفع من ثمنه خمسين جاز البيع وكان المقبوض حصة الفضة وإن لم يبين ذلك وكذلك إن قال: خذ هذه الخمسين من ثمنهما فإن لم يتقابضا حتى افترقا بطل العقد في الحلية والسيف إن كان لا يتخلص إلا بضرر وإن كان يتخلص بغير ضرر جاز البيع في السيف
وبطل في الحلية
ومن باع إناء فضة ثم افترقا وقد قبض بعض ثمنه بطل العقد فيما لم يقبض وصح فيما قبض وكان الإناء مشتركا بينهما وإن استحق بعض الإناء كان المشتري بالخيار: إن شاء أخذ الباقي بحصته من الثمن وإن شاء رده
وإن باع قطعة نقرة فاستحق أخذ ما بقي بحصته ولا خياؤ له ومن باع درهمين ودينارا بدينارين ودرهم جاز البيع وجعل كل واحد من الجنسين بالجنس الآخر
ومن باع أحد عشر درهما بعشرة دراهم ودينار جاز البيع وكانت العشرة بمثلها والدينار بدرهم
ويجوز بيع درهمين صحيحين ودرهم غلة بدرهم
صحيح ودرهمين غلة
وإذا كان الغالب على الدراهم الفضة فهي فضة وإن كان الغالب على الدنانير الذهب فهي ذهب ويعتبر فيهما من تحريم التفاضل ما يعتبر في الجياد وإن كان الغالب عليهما الغش فليسا في حكم الدراهم والدنانير
فإذا بيعت بجنسها متفاضلا جاز وإذا اشترى بها سعلة ثم كسدت وترك الناس المعاملة بها بطل البيع عند أبي حنيفة
وقال أبو يوسف: عليه قيمتها يوم البيع وقال محمد: عليه قيمتها آخر ما تعامل الناس بها
ويجوز البيع بالفلوس النافقة وإن لم تتعين وإن كانت كاسدة لم يجز البيع بها حتى يعينها وإذا باع بالفلوس النافقة ثم كسدت بطل البيع عند أبي حنيفة
ومن اشترى شيئا بنصف درهم فلوسا جاز البيع وعليه ما يباع بنصف درهم من الفلوس
ومن أعطى الصيرفي درهما وقال: أعطني بنصفه فلوسا وبنصفه نصفا إلا حبة فسد البيع في الجميع عند أبي حنيفة وقال أبو يوسف ومحمد: جاز البيع في الفلوس وبطل فيما بقيي ولو قال: أعطني نصف درهم فلوسا ونصفا إلا حبة جاز البيع وكانت الفلوس والنصف إلا حبة بدرهم
# كتاب الرهن
الرهن: ينعقد بالإيجاب والقبول ويتم القبض فإذا قبض المرتهن الرهن محوزا مفرغا مميزا ثم العقد فيه وما لم يقبضه فالراهن بالخيار: إن شاء سلمه وإن شاء رجع عن الرهن فإذا سلمه إليه وقبضه دخل في ضمانه
ولا يصح الرهن إلا بدين مضمون وهو مضمون بالأقل من قيمته ومن الدين فإذ هلك في يد المرتهن وقيمته والدين سواء صار المرتهن مستوفيا لدينه حكما وإن كانت قيمة الرهن أكثر من الدين فالفضل أمانة في يده وإن كانت أقل سقط من الدين بقدرها ورجع المرتهن بالفضل
ولا يجوز رهن المشاع ولا رهن ثمرة على رؤوس النخل دون النخل ولا زرع في الأرض دون الأرض ولا يجوز رهن الأرض والنخل دونهما ولا يصح الرهن بالأمانات كالودائع والمضاربات ومال الشركة
ويصح الرهن برأس مال السلم وثمن الصرف والمسلم فيه فإن هلك في مجلس العقد ثم الصرف والسلم المرتهن مستوفيا لدينه
وإذا اتفقا على وضع الرهن على يد عدل جاز وليس للمرتهن ولا للراهن أخذه من يده فإن هلك في يده هلك من ضمان المرتهن
ويجوز رهن الدراهم والدنانير والمكيل والموزون فإن رهنت بجنسها وهلكت هلكت بمثلها من الدين وإن اختلفا في الجودة والصناعة
ومن كان له دين على غيره فأخذ منه مثل دينه فأنفقه ثم علم أنه كان زيوفا فلا شيء له عند أبي حنيفة وقال أبو يوسف ومحمد: يزد مثل الزيوف ويرجع بالجياد ومن رهن عيدين بألف
درهم فقضى حصة أحدهما لم يكن له أن يقضه حتى يؤدي باقي الدين
وإذا وكل الراهن المرتهن أو العدل أو غيرهما ببيع الرهن عند حلول الدين فالوكالة جائزة فإن شرطت في عقد الرهن فليس للراهن عزله عنها فإن عزله لم ينعزل ن وإن مات الراهن لم ينعزل
وللمترتهن أن يطالب الراهن ويحبسه به وإن كان الرهن في يده فليس عليه أن يمكنه من بيعه حتى يقضه الدين من ثمنه فإن قضاه الدين قيل له: سلم الرهن إليه
وإذا باع الراهن الرهن بغير إذن المرتهن فالبيع موقوف فإن أجازه المرتهن جاز وإن قضاه الراهن دينه جاز البيع
وإن اعتق الراهن عبد الرهن نفذ عتقه فإن كان الدين حالا طولب بأداء الدين وإن كان مؤجلا أخذ منه قيمة العبد فجعلت رهنا مكانه حتى يحل الدين وإن كان الراهن معسرا استسعي العبد في قيمته فقضى بها دينه
وكذلك إذا استهلك الراهن الرهن وإن استهلكه أجنبي فالمرتهن هو الخصم في تضمينه ويأخذ القيمة فتكون رهنا في يده وجناية الراهن على الرهن مضمونة وجناية المرتهن عليه تسقط من دينه بقدرها وجناية الرهن على الراهن وعلى المرتهن وعلى مالهما هدر
وأجرة البيت الذي يحفظ فيه الرهن على المرتهن وأجرة الراعي ونفقة الرهن على الراهن ونماؤه
للراهن فيكون رهنا مع الأصل
فإن هلك هلك بغير شيء وإن هلك الأصل وبقي النماء افتحه الراهن بحصته ويقسم الدين على قيمة الرهن يوم القبض وقيمة النماء يوم الفكاك فما أصاب الأصل سقط من الدين وما أصاب النماء افتكه الراهن به
وتجوز الزيادة في الرهن ولا تجوز في الدين عند أبي حنيفة ومحمد ولا يصير الرهن رهنا بهما وقال أبو يوسف: تجوز الزيادة في الدين أيضا
وإذا رهن عينا واحدة عند رجلين بدين لكل واحد منهما جاز وجميعها رهن عند كل واحد منهما والمضمون على كل واحد منهما حصة دينه منهما فإن قضى أحدهما دينه كانت كلها رهنا في يد الآخر حتى يستوفي دينه
ومن باع عبدا على أن يرهنه المشتري بالثمن شيئا بعينه فإن امتنع المشتري من تسليم الهن لم يجبر عليه وكان البائع بالخيار: إن شاء رضي بترك الرهن وإن شاء فسخ البيع إلا أن يدفع المشتري الثمن حالا أو يدفع قيمة الرهن رهنا مكانه
وللمرتهن أن يحفظ الرهن بنفسه وزوجته
وولده وخادمه الذي في عياله وإن حفظه بغير من في عياله أو أوده ضمن
وإذا تعدى المرتهن في الرهن ضمنه ضمان الغضب بجميع قيمته وإذا أعار المرتهن الرهن للراهن فقبضه خرج من ضمان المرتهن فإن هلك في يد الراهن هلك بغير شيء وللمرتهن أن يسترجعه إلى يده فإذا أخذه عاد الضمان
وإذا مات الراهن باع وصيه الرهن وقضى الدين فإن لم يكن له وصي نصب القاضي له وصيا وأمره ببيعه
# كتاب الحجر
الأسباب الموجبة للحجر ثلاثة:
الصغر والرق والجنون ولا يجوز تصرف الصغير إلا بإذن وليه ولا تصرف العبد إلا بإذن سيده ولا يجوز تصرف المجنون المغلوب على عقله بحال
ومن باع من هؤلاء شيئا
أو اشتراه وهو يعقل البيع ويقصده فالوالي بالخيار: إن شاء أجازه إذا كان فيه مصلحة وإن شاء فسخه
وهذه المعاني الثلاثة توجب الحجر في الأقوال دون الأفعال فالصبي والمجنون لا تصح عقودهما ولا إقرارهما ولا يقع طلاقهما ولا عتاقهما وإن أتلفا شيئا لومهما ضمانه
وأما العبد فأقواله نافذة في حق نفسه غير نافذة في حق مولاه فإن أقر بمال لزمه بعد الحرية ولم يلزمه في الحال وإن أقر بحد أو قصاص لزمه في الحال وينفذ طلاقه
وقال أبو حنيفة: لا يحجز على السفيه إذا كان بالغا عاقلا حرا وتصرفه في ماله جائز وإن كان مبذرا مفسدا يتلف ماله فيما لا غرض له فيه ولا مصلحة إلا أنه قال: إذا بلغ الغلام غير رشيد لم يسلم إليه ماله حتى يبلغ خمسا وعشرين سنة
فإن تصرف فيه قبل ذلك نفذ تصرفه فإذا بلغ خمسا وعشرين سنة سلم إليه مله وإن لم يؤنس منه الرشد
وقال أبو يوسف ومحمد: يحجز على السفينه ويمنع من التصرف في ماله فإن باع لم ينفذ بيعه فإن كان فيه مصلحة أجازه الحاكم وإن أعتق عبدا نفذ عتقه وكان على العبد أن يسعى في قيمته وإن تزوج امرأة جاز نكاحه فإن سمى لها مهرا جاز منه مقدار
مهر مثلها وبطل الفضل
وقالا فيمن بلغ غير رشيد: لا يدفع أليه ماله أبدا حتى يؤنس منه الرشد ولا يجوز تصرفه فيه وتخرج الزكاة من مال السفيه
وينفق منه على أولاده وزوجته ومن تجب نفقته عله من ذوي أرحامه فإن أراد حجة الإسلام لم يمنع منها ولا يسلم القاضي النفقة إليه ويسلمها إلى ثقة من الحاج ينفقها عليه في طريق الحج فإن مرض وأوصى بوصايا في القرب وأبواب الخير جاز ذلك في ثلث ماله
وبلوغ الغلام الاحتلام والإحبال والإنزال إذا وطئ فإن لم يوجد ذلك فحتى يتم له ثماني عشرة سنة عند أبي حنيفة
وبلوغ الجارية بالحيض والاحتلام والحبل فإن لم يوجد ذلك فحتى يتم لها سبع عشرة سنة وقال أبو يوسف ومحمد: إذا تم للغلام والجارية خمس عشرة سنة فقد بلغا
وإذا راعق الغلام والجارية وأشكل أمرهما في البلوغ وقالا: قد بلغنا فالقول قولهما وأحكامهما أحكام البالغين
وقال أبو حنيفة: لا أحجر في الدين: وإذا وجبت الديون على رجل وطلب غرماؤه حبسه والحجر عليه لم أحجر عليه وإن كان له لم يتصرف فيه الحاكم ولكن يحبسه أبدا حتى يبيعه في دينه فإن كا له دراهم ودينه دراهم قضاها القاضي بغير أمره وإن كان دينه دراهم وله دنانير باعها القاضي في دينه
وقال أبو يوسف ومحمد: إذا طلب غرماء المفلس الحجرعليه حجر
القاضي عليه ومنعه من البيع والتصرف والإقرار حتى لا يضر بالغرماء وباع ماله إن امتنع من بيعه وقسمه بين غرمائه الحصص فإن أقر في حال الحجر بإقرار لزمه ذلك بعد قضاء الديون
وينفق على المفلس من ماله وعلى زوجته وأولاده الصغار وذوي أرحامه وإن لم يعرف للمفلس مال وطلب غرماؤه حبسه وهو يقول لا مال لي حبسه الحاكم في كل دين التزمه بدلا عن مال حصل يده كثمن مبيع وبدل القرض وفي كل دين بعقد كالمهر والكفالة ولم يحبسه فيما سوى ذلك كعوض المغضوب وأرس الجنايات إلا أن تقوم البينة أن له مالا
وإذا حبسه القاضي
شهرين أو ثلاثة يسأل عن حاله: فإن لم ينكشف له مال خلى سبيله وكذلك إذا أقام البينة أنه لا مال له ولا يحول بينه وبين غرمائه بعد خروجه من الحبس ويلازمونه ولا منعونه من التصرف والسفر ويأخذون فضل كسبه فيقسم بينهم بالحصص
وقال أبو يوسف ومحمد: إذا فلسه الحاكم حال بينه وبين غرمائه إلا أن يقيموا البينه أنه قد حصل له مال
ولا يحجر على الفاسق إذا كان مصلحا لماله والفسق الأصلي والطاريء
سواء ومن أفلس وعنده متاع لرجل بعينه ابتاعه منه فصاحب المتاع أسوة الغرماء فيه
# كتاب الإقرار
إذا أقر الحر البالغ العاقل بحق لزمه إقراره مجهولا كان ما أقر به أو معلوما ويقال له: بين المجهول فإن قال لفلان على شيء لزمه أن بين ماله قيمة والقول فيه قوله مع يمينه إن ادعى المقر له أكثر من ذلك
وإذا قال: له على مالد فالمرجع في بيانه إليه ويقبل قوله في القليل والكثير فإن قال: له علي مال عظيم لم يصدق في أقل من مائتي درهم وإن قال: دراهم كثيرة لم يصدق في أقل من عشرة دراهم وإن قال: دراهم فهي ثلاثة إلا أن يبين أكثر منها وإن قال: له علي كذا كذا درهما لم يصدق في أقل من أحد عشر درهما وإن قال: كذا كذا درهما لم يصدق في أقل من أحد وعشرين درهما وإن قال: له علي أو قلبي فقد أقر بدين
وإن قال: عندي أو: معي فهو إقرار بأمانة في يده وإن قال له رجل لي عليك ألف فقال اتزنها أو انتقدها أو أجلني بها أو قد قضيتكها فهو إقرار
ومن أقر بدين مؤجل فصدقه المقر له في الدين وكذبه في التأجيل لزمه الدين خالا ويستحلف المقر له في الأجل
ومن أقر واستثنى متصلا بإقراره صح الاستثناء ولزمه الباقي سواء استثنى الأقل أو الأكثر فإن استثنى الجميع لزمه الإقرار وبطل الاستثناء
وإن قال: له علي مائة درهم إلا دينار أو: إلا قفيز حنطة لزمه مائة درهم إلا قيمة الدينار أو القفيز
وإن قال: له علي مائة ودرهم فالمائة كلها دراهم وإن قال: له لعي مائة وثوب لزمه ثوب واحد والمرجع في تفسير المائة إليه
ومن أقر بحق وقال إن شاء الله متصلا بإقراره لم يلزمه الإقرار ومن أقر وشرط الخيار لزمه الإقرار وبطل الخيار ومن أقر بدار واستثنى بنارها لنفسه فللمقر له الدار والبناء وإن قال: بناء هذه الدار لي والعرصة لفلان فهو كما قال
ومن أقر بتمر في قوصره
لزمه التمر والقوصرة ومن أقر بدابة في إصطبل لزمه الدابة خاصة وإن قال: غصبت ثوبا في
منديل لزماه جميعا وإن قال: له علي ثوب في ثوب لزماه وإن قال: له علي ثوب في عشرة أثواب لم يلزمه عند أبي حنيفة وأبي يوسف إلا ثوب واحد
وقال محمد: يلزمه أحد عشر ثوبا ومن أقر بغضب ثوب وجاء بثوب معيب قالقول قلوه مع يمينه وكذلك لو أقر بدراهم وقال: هي زيوف
وإن قال: له علي خمسة في خمسة يريد الضرب والحساب لزمه خمسة واحدة وإن قال: أدرت خمسة مع خمسة لزمه عشرة
وإن قال: له علي من درهم إلى عشرة لزمه تسعة عند أبي حنيفة فيلزمه الإبتداء وما بعده وتسقط الغابة وقال أبو يوسف ومحمد: يلزمه العشرة كلها وإذا قال: له علي ألف درهم من ثمن عبد اشتريته منه ولم أقبضه فإن ذكر عبدا بعينه قيل للمقر له: إن شئت فسلم العبد وخذ الألف وإلا فلا شيء لك
وإن قال: له علي ألف من ثمن عبد ولم يعينه لزمه الألف في قول أبي حنيفة ولو قال: له عل ألف من ثمن هذا العبد لم يلزمه حتى يسلم العبد فإن سلم العبد لزمه الألف وإن لم يسلمه لم تلزمه ولو قال: له علي ألف من ثمن خمر أو خنزير لزمه
الألف ولم يقبل تفسيره ولو قال: له علي ألف من ثمن متاع وهي زيوف وقال المقر له: لزمه الجياد في قول أبي حنيفة
ومن أقر لغيره بخاتم فله الحلقة والفص وإن أقر له بسيف فله النصل والجفن والحمائل وإن أقر بحجلة فله العيدان والكسوة
وإن قال: لحمل فلانة علي ألف فإن قال أوصى به له فلان أو مات أبوه فورثه فلإقرار صحيح وإن أبهم الإقرار لم يصح عند أبي يوسف
وإذا أقر بحمل جارية أو حمل شاة لرجل صح الإقرار ولزمه وإذا أقر الرجل في مرض موتته بديون وعليه ديون في صحته وديون لزمته في مرضه بأسباب معلومة فدين الصحة والدين المعروف بالأسباب مقدم على غيره فإذا قضيت شيء
كان فيما أقر به في حال المرض وإن لم يكن
عليه ديون في صحته جاز إقراره وكان المقر له أولى من الورثة وإقرار المريض لوارثه باطل إلا أن يصدقه فيه بقية الورثة
ومن أقر لأجنبي في مرضه ثم قال هو ابني ثبت نسبه وبطل إقراره له ولو أقر لأجنبي&#x27; ثم تزوجها لم يبطل إقراره لها ومن طلق زوجته في مرضه ثلاثا ثم أقر لها بدين ومات فلها الأقل من الدين ومن ميراثها منه ومن أقر بغلام يولد مثله لمثله وليس له نسب معروف أنه ابنه وصدقة الغلام ثبت نسبه منه وإن كان مريضا ويشارك الورثة في الميراث
ويجوز إقرار الرجل بالوالدين والولد والزوجة والمولى ويقبل إقرار المرأة بالوالدين والزوج والمولى ولا يقبل بالولد إلا أن يصدقها الزوج أو تشهد بولادتها قابلة ومن أقر بنسب من غير الوالدين والولد والزوج والزوجة والمولى - مثل الأخ والعم - لم يقبل إقراره في النسب فإن كان له وارث معروف قريب أو بعيد فهو أولى بالميراث من المقر له وإن لم يكن له وارث استحق المقر له ميراثه ومن مات أبوه فأقر بأخ له لم يثبت نسب أخيه ويشاركه في الميراث
# كتاب الإجارة
الإجارة: عقد على المنافع بعوض
ولا تصح حتى تكون المنافع معلومة والأجرة معلومة وما جاز أن يكون ثمنا في البيع جاز أن يكون أجرة في الإجارة
والمنافع تارة تصير معلومة بالمدة كاستئجار الدور للسكنى والأرضين للزراعة فيصح العقد على مدة معلومة أي مدة كانت وتارة تصير معلومة بالعمل والتسمية كمن استأجر رجلا على صبغ ثوب أو خياطته أو استأجر دابة ليحمل عليها مقدارا معلوما أو يركبها مسافة سماها وتارة تصير معلومة بالتعيين والإشارة كمن استأجر رجلا لينقل له هذا الطعام إلى موضع معلوم
ويجوز استئجار الدور والحوانيت للسكنى وإن لم يبين ما يعمل فيها وله أن يعمل كل شيء إلا الحداد والقصار والطحان
ويجوز استئجار الأراضي للزراعة ولا يصح العقد حتى يسمي ما يزرع فيها أو يقول: على أن يزرع فيها ما شاء
ويجوز أن يستأجر الساحة ليبني فيها أو يغرس فيها نخلا أو شجرا فإذا انقضت مدة الإجارة لزمه أن يقلع البناء والغرس ويسلمها فارغة إلا أن يختار صاحب الأرض أن يغرم له قيمة ذلك مقلوعا فيملكه أو يرضى بتركه على حاله فيكون البناء لهذا والأرض لهذا
ويجوز استئجار الدواب للركوب والحمل فإن قال: على أن يركبها فلان أو يلبس الثوب فلان فأركبها غيره أو ألبسه غيره كان ضامنا إن عطبت الدابة أو تلف الثوب
وكذلك كل ما يختلف باختلاف المستعمل
وأما العقار
وما لا يختلف باختلاف المستعمل فلا ضمان عليه فإذا شرط سكنى واحد فله أن يسكن غيره وإن سمى نوعا أو قدرا يحمله على الدابة مثل أن يقول: خمسة أقفزة حنطة فله أن يحمل ما هو مثل الحنطة في الضرر أو أقل كالشعير والسمسم وليس له أن يحمل ما هو أضر من الحنطة كالملح والحديد
وإن استأجرها ليحمل عليها قطناه سماه فليس له أن يحمل مثل وزنه حديدا وإن استأجرها ليركبها فأردف معه رجلا فعطبت ضمن نصف قيمتها ولا يعتبر بالثقل
وإن استأجرها ليحمل عليها مقدرا من الحنطة فحمل أكثر منه فعطبت ضمن ما زاد الثقل
وإذا كبح الدابة بلجامها أو ضربها فعطبت ضمن عند أبي حنيفة
والأجراء على ضربين:
وأجير مشترك وأجير خاص فالمشترك: من لا يستحق الأجرة حتى يعمل كالصباغ والقصار والمتاع أمانة في يده: إن هلك لم يضمن شيئا عند أبي حنيفة وقال أبو يوسف ومحمد: يضمنه وما تلف بعمله كتخريق الثوب من دقة وزلق الحمال وانقطاع الحبل الذي يشد به المكاري الحمل وغرق السفينة من مدها مضمون إلا أنه لا يضمن به بني آدم فمن غرق في السفينة أو سقط من الدابة ثم يضمنه وإذا قصد الفصاد أو بزغ البزاغ ولم يتجاوز الموضع المعتاد فلا ضمان عليه فيما عطب من ذلك
ولأجير الخاص: الذي يستحق الأجرة بتسليم نفسه في المدة وإن لم يعمل كمن استؤجر شهرا للخدمة أو لرعي الغنم ولا ضمان على الأجير الخاص فما تلف في يده ولا ما تلف من عمله
والإجارة تفسدها الشروط كما تفسد البيع ومن استأجر عبدا للخدمة فليس له أن يسافر
به إلا أن يشترط ذلك
ومن استأجر جملا ليحمل عليه محملا وراكبين إلى مكة جاز وله المحمل المعتاد وإن شاهد
الجمال المحمل فهو أجود وإن استأجر بعيرا ليحمل عليه مقدارا من الزاد فأكل منه في الطريق جاز له أن يرد عوض ما أكل
والأجرة لا تجب بالعقد وتستحق بأحد معان ثلاثة: إما بشرط التعجيل أو بالتعجيل من غير شرط أو باستيفاء المعقود عليه
ومن استأجر دارا فللمؤجر أن يطالبه لأجره كل يوم إلا أن يبين وقت الاستحقاق بالعقد ومن استأجر بعيرا إلى مكة فللجمال أن يطالبه بأجرة
كل مرحلة وليس للقصار والخياط أن يطالب بالأجرة حتى يفرغ من العمل إلا أن يشترط التعجيل
ومن استأجر خبازا ليخبز له في بيته قفيز دقيق بدرهم لم يستحق الأجرة حتى يخرج الخبز من التنور ومن استأجر طباخا ليطبخ له طعاما للوليمة فالغرف عليه ومن استأجر رجلا ليضرب له لبنا استحق الأجرة إذا أقامه عند أبي حنيفة وقال أبو يوسف ومحمد: لا يستحقها حتى يشرجه
وإذا قال للخياط: إن خطت هذا الثوب فارسيا فبدرهم وإن خطته روميا فبدرهمين جاز وأي العلمين عمل استحق الأجرة
وإن قال: إن خطته اليوم فبدرهم وإن خطته غدا فبنصف درهم فإن خاطه اليوم فله درهم وإن خاطه غدا فله أجر مثله عند أبي حنيفة ولا يتجاوز به نصف درهم
وإن قال: إن سكت في هذا الدكان عطارا فبدرهم في الشهر وإن سكنته حدادا فبدرهمين جاز وأي الأمرين فعل استحق المسمى فيه عند أبي حنيفة وقال أبو يوسف ومحمد: الإجارة فاسدة
ومن استأجر دارا كل شهر بدرهم فالعقد صحيح في شهر واحد فاسد في بقية الشهور إلا أن يسمي جملة شهور معلومة فإن سكن ساعة من الشهر الثاني صح العقد فيه ولزمه ذلك الشهر ولم يكن للمؤجر أن يخرجه منها إلى أن ينقضي وكذلك كل شهر يسكن في أوله
وإذا استأجر دارا سنة بعشرة
دراهم جاز وإن لم يسم قسط كل شهر من الأجرة
ويجوز أخذ أجرة الحمام
والحجام ولا يجوز أخذ عسب التيس ولا يجوز الاستئجار على الأذان والإقامة والحج والغناء والنوح
ولا تجوز أجارة المشاع عند أبي حنيفة إلا من الشريك
وقال أبو يوسف ومحمد: إجازة المشاع جائزة ويجوز استئجار الظئر بأجرة معلومة ويجوز بطعامها وكسوتها وليس للمستأجر أن يمنع زوجها من وطئها فإن حبلت كان لهم أن يفسخوا الإجارة إذا خافوا على الصبي من لبنها وعليها أن تصلح طعام الصبي وإن أرضعته في المدة بلبن شاة فلا أجر لها
وكل صانع لعمله أثر في العين كالقصار والصباغ فله أن يحبس العين بعد الفراغ من عمله حتى يستوفي الأجرة
ومن ليس لعمله أثر فلي له أن يحبس العين بالأجرة كالحمال والملاح
وإذا شرط على الصانع أن يعمل بنفسه فليس له أن يستعمل غيره فإن أطلق له العمل فله أن يستأجر من يعلمه
وإذا اختلف الخياط وصاحب الثوب فقال صاحب الثوب: أمرتك أن تعمله قباء وقال الخياط: قميصا أو قال صاحب الثوب للصباغ: أمرتك أن تصبغه أحمر فصبغته أصفر فالقول قول صاحب الثوب مع يمينه فإن حلف فالخياط ضامن
وإذا قال صاحب الثوب: عملته لي بغير أجرة وقال الصانع: بأجرة فالقول قول صاحب الثوب مع يمينه عند أبي حنيفة وقال
أبو يوسف: إن كان حريفا له فله الأجرة وإن لم يكن حريفا له فلا أجرة له وقال محمد: إن كان الصانع معروفا بهذه الصنعة أن يعمل بالأجرة فالقول قوله أنه عمله بأجرة
والواجب في الأجارة الفاسدة أجر المثل لا يتجاوز به المسمى وإذا قبض المستأجر الدار
فعليه الأجرة وإن لم يسكنها فإن غصبها غاصب من يده سقطت الأجرة وإن وجد به اعيبا يضر بالسكنى فله الفسخ وإذا
خربت الدار أو انقطع شرب الضيعة أو انقطع الماء عن الرحى انفسخت الإجارة
وإذا مات أحد المتعاقدين وقد عقد الإجارة لنفسه انفسخت الإجارة وإن عقدها لغيره لم تنفسخ ويصح شرط الخيار في الإجارة وتنفسخ الإجارة بالأعذار كمن استأجر دكانا في السوق ليتجر فيه فذهب ماله وكمن آجر دارا أو دكانا ثم أفلس ولزمته ديون لا يقدر على قضائها إلا من ثمن ما آجر فسخ القاضي العقد وباعها في الدين
وكمن استأجر دابة ليسافر عليها ثم بدا له من السفر فهو عذر وإن بدا للمكاري من السفر فليس ذلك بعذر
# كتاب الشفعة
الشفعة: واجبة للخيلط في نفس المبيع ثم للخليط في حق المبيع كالشرب والطريق ثم للجار وليس للشريك في الطريق والشرب والجار شفعة مع الخليط فإن سلم فالشفعة للشريك في الطريق فإن سلم أخذها الجار
والشفعة تجب بعقد البيع وتستقر بالإشهاد وتملك بالأخذ إذا سلمها المشتري أو حكم بها حاكم وإذا علم الشفيع بالبيع أشهد في مجلسه ذلك على المطالبة ثم ينهض منه فيشهد على البائع إن كان المبيع في يده أو على المبتاع أو عند العقار
فإذا فعل ذلك استقرت شفعته ولم تسقط بالتأخير عند أبي حنيفة وقال محمد: إن تركها شهرا بعد الإشهاد بطلت شفعته
والشفعة واجبة في العقار وإن كان مما لا يقسم ولا شفعة في العروض والسفن والمسلم والذمي في الشفعة سواء
وإذا ملك العقار بعوض هو مال وجبت فيه الشفعة ولا شفعة في الدار التي يتزوج الجل عيها أو يخالع المرأة بها أو يستأجر بها دارا أو يصالح بها عن دم عمد أو يعتق عليها عبدا أو يصالح عنها بإنكار أو سكوت فإن صالح عنها بإقرار وجبت فيها الشفعة
وإذا تقدم الشفيع إلى القاضي فادعى الشراء وطلب الشفعة سأل القاضي المدعى عليه فإن اعترف بملكه الذي يشفع به وإلا كلفه إقامة البينة فإن عجز عن البينة استحلف المشتري بالله ما
يعلم أنه مالك للذي ذكره مما يشفع به فإن نكل أو قامت بينه سأله القاضي: هل ابتاع أم لا؟ فإن أنكر الابتياع قيل للشفيع أقم البينة فإن عجز عنها اتحلف المشتري بالله ما اتباع أو بالله ما يستحق علي في هذه الدار شفعة من الوجه الذي ذكره وتجوز المنازعة في الشفعة وإن لم يحضر الشفيع الثمن إلى مجلس القاضي
فإذا قضى القاضي له بالشفعة لزمه إحضار الثمن وللشفيع أن يرد الدار بخيار العيب والرؤية
فإن أحضر الشفيع البائع والمبيع في يده فله أن يخاصمه في الشفعة ولا يسمع القاضي البينة حتى يحضر المشتري فيفسخ البيع بمشهد منه ويقضي بالشفعة على البائع ويجعل العهدة عليه
وإذا ترك الشفيع الإشهاد حين علم وهو يقدر على ذلك
بطلت شفعته وكذلك إن أشهد في المجلس ولم يشهد على أحد المتبايعين ولا عند العقار وإن صالح من شفعته على عوض أخذه بطلت شفعته ويرد العوض
وإذا مات الشفيع بطلت شفعته
وإن مات المشتري لم تسقط وإن باع الشفيع ما يشفع به قبل أن يقضى له بالشفعة بطلت شفعته ووكيل البائع إذا باع وكان هو الشفيع فلا شفعة له وكذلك إن ضمن الدرك عن البائع الشفيع ووكيل المشتري إذا ابتاع فله الشفعة ومن باع بشرط الخيار فلا شفعة للشفيع فإن أسقط الخيار وجبت الشفعة ومن اشترى بشرط الخيار وجبت الشفعة
ومن ابتاع دارا شراء فاسدا فلا شفعة لها ولكل
واحد من المتعاقدين الفسخ فإن سقط الفسخ وجبت الشفعة
وإذا اشترى ذمي دارا بخمر أو خنزير وشفيعها ذمي أخذها بمثل الخمر وقيمة الخنزير وإن كان شفيعها مسلما أخذها بقمة الخمر والخنزير
ولا شفعة في الهبة إلا أن تكون بعوض مشروط وإذا اختلف الشفيع والمشتري في الثمن فالقول قول المشتري فإن أقاما البينة فالبينة بينة الشفيع عند أبي حنيفة ومحمد وإذا ادعى المشتري ثمنا أكثر وادعى البائع أقل منه ولم يقبض الثمن أخذها الشفيع بما قال البائع وكان ذلك حطا عن المشتري
وإن كان قبض الثمن بما قال المشتري ولم
يلتفت إلى قول البائع وإذا حط البائع عن المشتري بعض الثمن سقط ذلك عن الشفيع وإن حط جميع الثمن لم يسقط عن الشفيع وإذا زاد المشتري البائع في الثمن لم تلزم الزيادة الشفيع
وإذا جمع الشفعاء فالشفعة بينهم على عدد رؤوسهم ولا يعتبر اختلاف الأملاك
ومن اشترى دارا بعرض أخذها الشفيع بقيمته وإن اشتراها بمكيل أو موزون أخذها بمثله
وإذا باع عقارا بعقار أخذ الشفيع كل واحد منهما بقيمة الآخر وإذا بلغ الشفيع أنها بيعت بألف فسلم ثم علم أنها بيعت بأقل أو بحنطة أو شعير قيمتها ألف أو أكثر فتسليمه باطل وله الشفعة وإن بان أنها بيعت بدنانير قيمتها ألف فلا شفعة له
وإذا قيل له إن المشتري فلان فسلم الشفقة ثم علم أنه غيره فله الشفعة
ومن اشترى دارا لغيره فهو الخصم في الشفعة إلا أن يسلمها إلى الموكل
وإذا باع دارا إلا مقدار ذراع في طول الحد يلي الشفيع فلا شفعة له وإن اتباع منها سهما بثمن ثم ابتاع بقيتها فالشفعة للجار في السهم الأول دون الثاني
وإذا ابتاعها بثمن ثم دفع إليه ثوبا عنه فالشفعة بالثمن دون الثوب
ولا تكره الحيلة في إسقاط الشفعة عند أبي يوسف وقال محمد رحمه الله
تكره وإذا بنى المشتري أو غرس ثم قضي للشفيع بالشفعة فهو بالخيار: إن شاء أخذها بالثمن وقمتة البناء والغرس مقلوعا وإن شاء كلف المشتري قلعه وإذا أخذها الشفيع فبنى أو غرس ثم استحقت رجع بالثمن ولا يرجع بقمة البناء والغرس
وإذا انهدمت الدار أو احترق بناؤها أو جف شجر البستان بغير فعل أحد فالشفيع بالخيار: إن شاء أخذها بجميع الثمن وإن شاء ترك وإن نقض المشتري البناء قيل للشفيع: إن شئت فخذ العرصة بحصتها وإن شئت فدع وليس له أن يأخذ النقض
